name: Bootstrap ST-0703 implementation

"on":
  push:
    branches:
      - agent/st-0703-openai-responses-adapter
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  materialize:
    name: Materialize and verify ST-0703
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/st-0703-openai-responses-adapter
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - name: Reconstruct and apply reviewed patch
        run: |
          set -euo pipefail
          cat .github/st0703-bootstrap/part.* > "$RUNNER_TEMP/st0703.patch.gz.b64"
          printf '%s  %s\n' \
            'db3740475f821f055e66defd1a226a27eebceae4a51f7d7110b237619d1d29f3' \
            "$RUNNER_TEMP/st0703.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/st0703.patch.gz.b64" \
            | gzip --decompress > "$RUNNER_TEMP/st0703.patch"
          printf '%s  %s\n' \
            'ad772a3cec7d40cb96cbf0f41539fd1c8b06d6913c4fd81652a0d1955ef207ec' \
            "$RUNNER_TEMP/st0703.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/st0703.patch"
          git apply "$RUNNER_TEMP/st0703.patch"
          git diff --check
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Verify ST-0703 and affected predecessors
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python scripts/validate_ci_hydration.py
          .venv/bin/python scripts/build_st0204_config_loader.py --check
          .venv/bin/python scripts/build_st0701_ai_registry.py --check
          .venv/bin/python scripts/build_st0703_recorded_adapter.py --check-installed
          .venv/bin/python scripts/build_st0801_content_ast.py --check
          .venv/bin/python -m ruff check \
            python/raos scripts/build_st0703_recorded_adapter.py tests/st0703
          .venv/bin/python -m ruff format --check \
            python/raos scripts/build_st0703_recorded_adapter.py tests/st0703
          .venv/bin/python -m mypy
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0204
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0701
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0703
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0801
      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -rf -- .github/st0703-bootstrap .github/workflows/st0703-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name 'openai-codex[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement ST-0703 recorded OpenAI Responses adapter'
          git push origin HEAD:agent/st-0703-openai-responses-adapter
