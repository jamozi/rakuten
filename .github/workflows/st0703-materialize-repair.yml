name: Materialize ST-0703 hosted compatibility repair

on:
  push:
    branches:
      - agent/st-0703-openai-responses-adapter

permissions:
  contents: write

concurrency:
  group: st0703-materialize-hosted-repair
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    name: Verify and materialize compatibility repair
    if: github.ref == 'refs/heads/agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Verify, apply, and clean transport
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$GITHUB_REF" = 'refs/heads/agent/st-0703-openai-responses-adapter'
          test -z "$(git status --porcelain=v1)"

          payload=.github/infra-compatibility.patch.gz.b64
          test "$(git hash-object "$payload")" = \
            6e7f9b678eac136539a212d63481e9b0907b718e
          patch="$RUNNER_TEMP/infra-compatibility.patch"
          base64 --decode "$payload" | gzip --decompress > "$patch"
          printf 'decoded repair patch sha256=%s\n' \
            "$(sha256sum "$patch" | cut -d' ' -f1)"
          git apply --check "$patch"
          git apply "$patch"

          expected="$RUNNER_TEMP/applied-files"
          actual="$RUNNER_TEMP/actual-applied-files"
          cat > "$expected" <<'EOF'
          scripts/object_storage_service.sh
          scripts/run_network_denied.sh
          tests/st0106/test_hydration_validator.py
          tests/st0106/test_network_isolation.py
          tests/st0202/test_wrapper.py
          EOF
          git diff --name-only | LC_ALL=C sort > "$actual"
          diff --unified=0 "$expected" "$actual"
          git diff --check

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f -- \
            .github/infra-compatibility-repair.py \
            .github/infra-compatibility.patch.gz.b64 \
            .github/workflows/st0703-materialize-repair.yml
          bash -n scripts/run_network_denied.sh
          bash -n scripts/object_storage_service.sh
      - name: Prove hosted network-denied fallback
        run: |
          set -euo pipefail
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Regenerate and verify static scope
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m ruff format \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python scripts/build_local_compose.py
          .venv/bin/python scripts/build_local_compose.py --check
          .venv/bin/python -m ruff check \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m ruff format --check \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m mypy
      - name: Verify related suites inside denied network boundary
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0106
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0201
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0202
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0703
      - name: Verify exact object-storage runtime
        run: |
          set -euo pipefail
          object_storage_port=$(
            /usr/bin/python3 -I - <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          if not 1024 <= port <= 65535:
              raise SystemExit("kernel selected an invalid loopback port")
          print(port)
          PY
          )
          RAOS_OBJECT_STORAGE_PORT="$object_storage_port" \
            scripts/object_storage_service.sh --docker "$(command -v docker)" test
          git diff --check
      - name: Commit materialized repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            printf 'error: materialized repair produced no commit\n' >&2
            exit 1
          fi
          git commit -m 'Materialize ST-0703 hosted compatibility repair'
          git push origin HEAD:agent/st-0703-openai-responses-adapter
