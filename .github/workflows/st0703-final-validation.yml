name: ST-0703 Final Exact Validation

on:
  push:
    branches:
      - agent/st0703-source-export-20260810

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Final Python 3.14.6 recorded adapter gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/st-0703-recorded-v4
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Capture target identity and publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          printf 'TARGET_SHA=%s\n' "$target_sha" >> "$GITHUB_ENV"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            -f state=pending \
            -f context=st0703/final-exact-validation \
            -f description='Final Python 3.14.6 ST-0703 gate is running' \
            -f target_url="$STATUS_URL"

      - name: Enable isolated user namespaces on the ephemeral runner
        run: |
          set -euo pipefail
          if ! /usr/bin/unshare --user --map-current-user -- /usr/bin/true 2>/dev/null; then
            if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
              sudo /usr/sbin/sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          /usr/bin/unshare --user --map-current-user -- /usr/bin/true

      - name: Validate dependency metadata without network
        run: |
          set -euo pipefail
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/python3 -I scripts/validate_ci_hydration.py

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false

      - name: Install exact Python without repository code
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6

      - name: Hydrate source-constrained locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress

      - name: Run final exact read-only ST-0703 gate with network denied
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          before_status="$(git status --porcelain=v1 --untracked-files=no)"
          before_diff="$(git diff --binary)"
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/make "UV=$uv_path" openai-recorded-gate
          after_status="$(git status --porcelain=v1 --untracked-files=no)"
          after_diff="$(git diff --binary)"
          test "$before_status" = "$after_status"
          test "$before_diff" = "$after_diff"
          git diff --exit-code

      - name: Publish success to target commit and PR
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context=st0703/final-exact-validation \
            -f description='Final Python 3.14.6 ST-0703 gate passed' \
            -f target_url="$STATUS_URL"
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body "<!-- st0703-final-exact-validation -->
          ST-0703 final exact validation **PASSED** for \`${TARGET_SHA}\`.

          - Python: \`3.14.6\`
          - uv: \`0.12.1\`
          - Repository gate: \`make openai-recorded-gate\`
          - Network: denied during metadata validation and the repository gate
          - Gate write check: tracked status and binary diff unchanged
          - Run: ${STATUS_URL}"

      - name: Publish failure to target commit and PR
        if: failure() && env.TARGET_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context=st0703/final-exact-validation \
            -f description='Final Python 3.14.6 ST-0703 gate failed' \
            -f target_url="$STATUS_URL"
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body "<!-- st0703-final-exact-validation-failed -->
          ST-0703 final exact validation **FAILED** for \`${TARGET_SHA}\`.

          Inspect the failing step before treating this branch as merge-ready: ${STATUS_URL}"
