name: Validate Bounded Switchable Strategies for All Stories V6

on:
  push:
    branches:
      - agent/all-stories-materialize-run-20260811

permissions:
  contents: write
  pull-requests: write
  statuses: write

defaults:
  run:
    shell: bash

env:
  FOUNDATION_BRANCH: codex/raos-implementation-first-goal
  STRATEGY_BRANCH: agent/all-stories-switchable-strategies-20260811
  BOUNDED_BRANCH: codex/all-stories-switchable-strategies-bounded-20260811
  PYTHON_VERSION: 3.14.6
  UV_VERSION: 0.12.1
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: ${{ github.workspace }}/subject/python

jobs:
  validate:
    name: Exact bounded switchboard validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out transport and validation runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: overlay-transport
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out latest strategy sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.STRATEGY_BRANCH }}
          path: subject
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install managed Python
        run: |
          set -euo pipefail
          uv --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress \
            "$PYTHON_VERSION"

      - name: Run bounded V6 validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash overlay-transport/.github/scripts/run_switchable_bounded_validation_v6.sh

      - name: Upload bounded validation evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: all-stories-switchable-bounded-evidence-v6
          path: |
            ${{ runner.temp }}/v6-validated.patch
            ${{ runner.temp }}/v6-final-pr.json
            subject/changes/all-stories/generated/switchable-strategy-catalog.v1.json
            subject/changes/all-stories/generated/switchable-strategy-bounded-evidence.v1.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
