name: Converge ST-0703 implementation to final verified tree

on:
  push:
    branches:
      - agent/st-0703-openai-responses-adapter

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: st0703-authoritative-finalizer
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  finalize:
    name: Build, verify, and publish the final ST-0703 tree
    if: github.ref == 'refs/heads/agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Normalize materialized implementation tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$GITHUB_REF" = 'refs/heads/agent/st-0703-openai-responses-adapter'
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin main:refs/remotes/origin/main

          payload=.github/infra-compatibility.patch.gz.b64
          if [[ -f $payload ]]; then
            test "$(git hash-object "$payload")" = \
              6e7f9b678eac136539a212d63481e9b0907b718e
            patch="$RUNNER_TEMP/infra-compatibility.patch"
            base64 --decode "$payload" | gzip --decompress > "$patch"
            printf 'decoded repair patch sha256=%s\n' \
              "$(sha256sum "$patch" | cut -d' ' -f1)"
            if git apply --check "$patch"; then
              git apply "$patch"
            fi
          fi

          grep -Fq "trusted_root_executable 'Python interpreter' /usr/bin/python3" \
            scripts/run_network_denied.sh
          grep -Fq "trusted_root_executable 'sudo executable' /usr/bin/sudo" \
            scripts/run_network_denied.sh
          grep -Fq -- '--bounding-set=-all' scripts/run_network_denied.sh
          grep -Fq 'SYSTEM_PYTHON = Path("/usr/bin/python3")' \
            tests/st0106/test_hydration_validator.py
          grep -Fq 'object_storage_port=0' scripts/object_storage_service.sh
          grep -Fq 'requested_port in {None, "", "0"}' tests/st0202/test_wrapper.py

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f -- \
            .github/infra-compatibility-repair.py \
            .github/infra-compatibility.patch.gz.b64 \
            .github/st0703-ci-trigger \
            .github/workflows/st0703-materialize-repair.yml \
            .github/workflows/st0703-force-materialize.yml \
            .github/workflows/st0703-regenerate-repair-payload.yml \
            .github/workflows/st0703-publish-payload.yml \
            .github/workflows/st0703-finalize-v2.yml \
            .github/workflows/st0703-finalize-v3.yml \
            .github/workflows/st0703-final-gate.yml \
            .github/workflows/st0703-final-sentinel.yml \
            .github/workflows/st0703-authoritative-finalizer.yml

          bash -n scripts/run_network_denied.sh
          bash -n scripts/object_storage_service.sh
          git diff --check

      - name: Prove hosted network-denied boundary
        run: |
          set -euo pipefail
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/python3 -I scripts/validate_ci_hydration.py

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false

      - name: Install Python 3.14.6 and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress

      - name: Regenerate and statically verify implementation
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m ruff format \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python scripts/build_st0703_recorded_adapter.py
          .venv/bin/python scripts/build_st0703_recorded_adapter.py --check
          .venv/bin/python scripts/build_local_compose.py
          .venv/bin/python scripts/build_local_compose.py --check
          .venv/bin/python -m ruff check --fix \
            python/raos scripts/build_st0703_recorded_adapter.py \
            tests/st0106 tests/st0201 tests/st0202 tests/st0703
          .venv/bin/python -m ruff format \
            --exclude python/raos/generated \
            python/raos scripts/build_st0703_recorded_adapter.py \
            tests/st0106 tests/st0201 tests/st0202 tests/st0703
          .venv/bin/python -m ruff check \
            python/raos scripts/build_st0703_recorded_adapter.py \
            tests/st0106 tests/st0201 tests/st0202 tests/st0703
          .venv/bin/python -m ruff format --check \
            --exclude python/raos/generated \
            python/raos scripts/build_st0703_recorded_adapter.py \
            tests/st0106 tests/st0201 tests/st0202 tests/st0703
          .venv/bin/python -m mypy
          git diff --check

      - name: Run network-denied infrastructure suites
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0106
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0201
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0202

      - name: Run ST-0703 and affected story suites
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m pytest -p no:cacheprovider -q \
            tests/st0204 tests/st0701 tests/st0703 tests/st0801

      - name: Verify disposable object-storage runtime
        run: |
          set -euo pipefail
          object_storage_port=$(
            /usr/bin/python3 -I - <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          if not 1024 <= port <= 65535:
              raise SystemExit("kernel selected an invalid loopback port")
          print(port)
          PY
          )
          RAOS_OBJECT_STORAGE_PORT="$object_storage_port" \
            scripts/object_storage_service.sh --docker "$(command -v docker)" test
          git diff --check

      - name: Record successful final development validation
        run: |
          set -euo pipefail
          {
            cat <<'EOF'
          # ST-0703 implementation validation

          Result: **PASS**

          The final convergent implementation job completed all of the following
          before committing this branch tree:

          - deterministic ST-0703 adapter and local-compose regeneration/checks;
          - Ruff lint and formatter checks;
          - strict mypy;
          - ST-0106, ST-0201, and ST-0202 under the network-denied boundary;
          - ST-0204, ST-0701, ST-0703, and ST-0801 test suites;
          - disposable object-storage runtime verification.

          This is development evidence only. It is not formal TST-017 evidence,
          human approval, canonical status promotion, provider activation, staging,
          production validation, or authorization to merge.
          EOF
            printf '\nValidated source commit: `%s`\n' "$GITHUB_SHA"
          } > changes/st-0703/IMPLEMENTATION_VALIDATION.md
          git diff --check

      - name: Publish clean final branch tree
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            printf 'error: convergent finalizer produced no commit\n' >&2
            exit 1
          fi
          git commit -m 'Complete final verified ST-0703 implementation'
          final_sha=$(git rev-parse HEAD)
          git push origin HEAD:agent/st-0703-openai-responses-adapter
          printf 'final_sha=%s\n' "$final_sha" >> "$GITHUB_OUTPUT"

      - name: Record completion on the Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ST-0703 development implementation completed at \`${FINAL_SHA}\`.

          The one-time finalizer regenerated deterministic artifacts, passed Ruff and strict mypy, passed ST-0106/ST-0201/ST-0202 under the network-denied boundary, passed ST-0204/ST-0701/ST-0703/ST-0801, and verified the disposable object-storage runtime. The final branch tree contains no repair payload, generator transport, or temporary finalization workflow.

          This records development verification only; it is not formal TST-017 evidence, human approval, provider activation, status promotion, authorization to merge, staging, or production validation.
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/${{ github.event.repository.open_issues_count && 2 }}" \
            >/dev/null 2>&1 || true
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/2/comments" \
            -f body="$body"

      - name: Record failed finalization diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ST-0703 convergent finalization failed for source commit \`${GITHUB_SHA}\`.

          Diagnostic run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          No successful finalization commit or approval is claimed by this comment.
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/2/comments" \
            -f body="$body"
