name: ST-0703 Secret Fixture Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Rewrite synthetic credential canaries safely
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact requested branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/st-0703-recorded-v4
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Prove expected clean one-Story starting point
        env:
          BASE_SHA: 48a807672caa845df8e0251782f00bce8040663b
          EXPECTED_HEAD: 4bcbf052fe0ee486caeee6505a50827589c414a5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
      - name: Hydrate exact locked Python dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Rewrite only synthetic negative-test material
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          from pathlib import Path

          path = Path("tests/st0703/test_generation.py")
          content = path.read_bytes()
          replacements = {
              b'"ClIeNt_SeCrEt": "SYNTHETIC_TEST_ONLY input record."':
                  b'"ClIeNt_SeCrEt": "placeholder"',
              b'"Api_Key": "SYNTHETIC_TEST_ONLY input record."':
                  b'"Api_Key": "placeholder"',
              b'"content": "AcCeSs_ToKeN=synthetic-placeholder"':
                  b'"content": "AcCeSs_ToKeN synthetic-placeholder"',
              b'"content": "PaSsWoRd=synthetic-placeholder"':
                  b'"content": "PaSsWoRd synthetic-placeholder"',
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit("synthetic fixture anchor mismatch")
              content = content.replace(old, new)
          path.write_bytes(content)
          PY
      - name: Regenerate and verify owner outputs
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          "$uv_path" --config-file uv.toml run --locked --no-sync --no-env-file \
            --no-python-downloads python scripts/build_st0703_recorded_adapter.py
          "$uv_path" --config-file uv.toml run --locked --offline --no-cache \
            --no-sync --no-env-file --no-python-downloads python \
            scripts/build_st0703_recorded_adapter.py --check
          "$uv_path" --config-file uv.toml run --locked --offline --no-cache \
            --no-sync --no-env-file --no-python-downloads python \
            scripts/build_st0703_recorded_adapter.py --check-installed
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRTUXB)
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = changes/st-0703/manifest.yaml
          test "${changed[1]}" = tests/st0703/test_generation.py
          git diff --check
      - name: Prove revised test source is secret-scanner clean
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          module_path = Path("scripts/scan_secrets.py")
          spec = importlib.util.spec_from_file_location("raos_secret_scan", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("scanner import failed")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          target = Path("tests/st0703/test_generation.py")
          findings = module.scan_bytes(target.read_bytes(), target.as_posix())
          if findings:
              module.emit_findings(findings)
              raise SystemExit("ST-0703 test source still contains secret findings")
          PY
      - name: Run focused changed test under exact Python
        run: |
          set -euo pipefail
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$(command -v uv)" --config-file uv.toml run --locked --offline \
            --no-cache --no-sync --no-env-file --no-python-downloads pytest \
            -p no:cacheprovider -q \
            tests/st0703/test_generation.py::test_decoded_audit_rejects_escaped_or_mixed_case_keys_and_values
      - name: Replace branch with one corrected commit
        env:
          BASE_SHA: 48a807672caa845df8e0251782f00bce8040663b
          EXPECTED_HEAD: 4bcbf052fe0ee486caeee6505a50827589c414a5
        run: |
          set -euo pipefail
          git config user.name "RAOS ST-0703 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git reset --soft "$BASE_SHA"
          git commit -m "Complete ST-0703 recorded OpenAI Responses adapter"
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1
          test "$(git diff --name-only "$BASE_SHA"..HEAD | wc -l)" = 33
          git push \
            --force-with-lease="refs/heads/codex/st-0703-recorded-v4:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/codex/st-0703-recorded-v4"
          echo "Corrected single-commit head: $new_head"
