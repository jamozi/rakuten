name: Final Integration CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lock:
    name: Lock and Reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install --managed-python --no-bin --no-registry --no-progress 3.14.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm install --global npm@11.16.0 --no-audit --no-fund
      - run: uv sync --locked --group dev
      - run: uv lock --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: .venv/bin/python scripts/verify_dev_toolchain.py
      - run: npm ls --all

  static:
    name: Static
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make final-static
      - run: .venv/bin/python scripts/raos_build.py check --all
      - run: .venv/bin/python scripts/status_v2.py --check

  tests:
    name: Tests
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-parallel test-serial

  contracts:
    name: Contracts
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make contracts

  data:
    name: Data and Database
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make database

  storage:
    name: Storage
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make storage

  secrets:
    name: Secrets
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - run: make final-secrets

  final:
    name: Final Integration
    if: always()
    needs: [lock, static, tests, contracts, data, storage, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        env:
          LOCK_RESULT: ${{ needs.lock.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          DATA_RESULT: ${{ needs.data.result }}
          STORAGE_RESULT: ${{ needs.storage.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          for result in "$LOCK_RESULT" "$STATIC_RESULT" "$TESTS_RESULT" \
            "$CONTRACTS_RESULT" "$DATA_RESULT" "$STORAGE_RESULT" "$SECRETS_RESULT"; do
            test "$result" = success
          done
