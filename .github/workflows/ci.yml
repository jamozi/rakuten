name: Final Integration CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lock:
    name: Lock and Reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install --managed-python --no-bin --no-registry --no-progress 3.14.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm install --global npm@11.16.0 --no-audit --no-fund
      - run: uv sync --locked --group dev
      - run: uv lock --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: .venv/bin/python scripts/verify_dev_toolchain.py
      - run: npm ls --all

  static:
    name: Static
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make final-static
      - run: .venv/bin/python scripts/raos_build.py check --all
      - run: .venv/bin/python scripts/status_v2.py --check

  tests:
    name: Tests
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-parallel test-serial
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "7.4"
          coverage: none
      - name: Report PHP runtime
        run: php --version
      - name: Lint Phase 3 source and generated plugins
        run: |
          set -euo pipefail
          raos_source_plugin="packages/web-ui/src/decision-support-v2/wordpress/plugin/raos-v2-decision-support/raos-v2-decision-support.php"
          raos_generated_plugin="changes/raos-v2/phase-3/wordpress/artifact/raos-v2-decision-support/raos-v2-decision-support.php"
          php -l "$raos_source_plugin"
          php -l "$raos_generated_plugin"
          php -l tests/raos_v2/phase3-wordpress-runtime.php
      - name: Execute fail-closed WordPress stub contracts
        run: |
          set -euo pipefail
          raos_harness="tests/raos_v2/phase3-wordpress-runtime.php"
          raos_candidate="changes/raos-v2/phase-3/generated/wordpress-update-candidate.v1.json"
          raos_source_plugin="packages/web-ui/src/decision-support-v2/wordpress/plugin/raos-v2-decision-support/raos-v2-decision-support.php"
          raos_generated_plugin="changes/raos-v2/phase-3/wordpress/artifact/raos-v2-decision-support/raos-v2-decision-support.php"
          php "$raos_harness" source "$raos_source_plugin" "$raos_candidate"
          php "$raos_harness" generated "$raos_generated_plugin" "$raos_candidate"

  contracts:
    name: Contracts
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make contracts

  data:
    name: Data and Database
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make database

  storage:
    name: Storage
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make storage

  secrets:
    name: Secrets
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - run: make final-secrets

  final:
    name: Final Integration
    if: always()
    needs: [lock, static, tests, contracts, data, storage, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        env:
          LOCK_RESULT: ${{ needs.lock.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          DATA_RESULT: ${{ needs.data.result }}
          STORAGE_RESULT: ${{ needs.storage.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          for result in "$LOCK_RESULT" "$STATIC_RESULT" "$TESTS_RESULT" \
            "$CONTRACTS_RESULT" "$DATA_RESULT" "$STORAGE_RESULT" "$SECRETS_RESULT"; do
            test "$result" = success
          done
