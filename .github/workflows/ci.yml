name: Final Integration CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 18 * * *' # Daily 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-integration-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RAOS_CI_EVENT: ${{ github.event_name }}
  RAOS_CI_BASE: ${{ github.event.pull_request.base.sha }}
  RAOS_CI_DRAFT: ${{ github.event.pull_request.draft || false }}

jobs:
  plan:
    name: Select verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      static: ${{ steps.select.outputs.static }}
      tests: ${{ steps.select.outputs.tests }}
      contracts: ${{ steps.select.outputs.contracts }}
      data: ${{ steps.select.outputs.data }}
      storage: ${{ steps.select.outputs.storage }}
      secrets: ${{ steps.select.outputs.secrets }}
      required: ${{ steps.select.outputs.required }}
      draft: ${{ steps.select.outputs.draft }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - id: select
        run: .venv/bin/python scripts/raos_ci.py plan

  lock:
    name: Lock and Reproducibility
    needs: plan
    if: needs.plan.outputs.draft != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install --managed-python --no-bin --no-registry --no-progress 3.14.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm install --global npm@11.16.0 --no-audit --no-fund
      - run: uv sync --locked --group dev
      - run: uv lock --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: .venv/bin/python scripts/verify_dev_toolchain.py
      - run: npm ls --all


  static:
    name: Static
    needs: [plan, lock]
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: .venv/bin/python scripts/raos_ci.py static

  tests:
    name: Tests
    needs: [plan, lock]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          coverage: none
      - run: .venv/bin/python scripts/raos_ci.py tests

  contracts:
    name: Contracts
    needs: [plan, lock]
    if: needs.plan.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: .venv/bin/python scripts/raos_ci.py contracts

  data:
    name: Data and Database
    needs: [plan, lock]
    if: needs.plan.outputs.data == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: .venv/bin/python scripts/raos_ci.py data

  storage:
    name: Storage
    needs: [plan, lock]
    if: needs.plan.outputs.storage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: .venv/bin/python scripts/raos_ci.py storage

  secrets:
    name: Secrets
    needs: [plan, lock]
    if: needs.plan.outputs.secrets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - run: .venv/bin/python scripts/raos_ci.py secrets

  final:
    name: Final Integration
    if: always() && needs.plan.outputs.draft != 'true'
    needs: [plan, lock, static, tests, contracts, data, storage, secrets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: 'false'
      - name: Aggregate selected checks
        env:
          RAOS_REQUIRED_JOBS: ${{ needs.plan.outputs.required }}
          RAOS_JOB_RESULTS: ${{ toJSON(needs) }}
          RAOS_PLAN_RESULT: ${{ needs.plan.result }}
          RAOS_LOCK_RESULT: ${{ needs.lock.result }}
        run: .venv/bin/python scripts/raos_ci.py aggregate
