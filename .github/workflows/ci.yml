name: Base CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    base-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  classify:
    name: Classify Base CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      static: ${{ steps.scope.outputs.static }}
      static_mode: ${{ steps.scope.outputs.static_mode }}
      unit: ${{ steps.scope.outputs.unit }}
      unit_mode: ${{ steps.scope.outputs.unit_mode }}
      story_suite: ${{ steps.scope.outputs.story_suite }}
      contracts: ${{ steps.scope.outputs.contracts }}
      database: ${{ steps.scope.outputs.database }}
      storage: ${{ steps.scope.outputs.storage }}
      secrets: ${{ steps.scope.outputs.secrets }}
      full_required: ${{ steps.scope.outputs.full_required }}
      classification_json: ${{ steps.scope.outputs.classification_json }}
    steps:
      - name: Check out classification tree and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Classify affected jobs
        id: scope
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            /usr/bin/python3 -I scripts/classify_ci_scope.py \
              --event pull_request \
              --base-ref '${{ github.event.pull_request.base.sha }}' \
              --head-ref '${{ github.event.pull_request.head.sha }}' \
              --github-output "$GITHUB_OUTPUT"
          else
            /usr/bin/python3 -I scripts/classify_ci_scope.py \
              --event "$GITHUB_EVENT_NAME" \
              --github-output "$GITHUB_OUTPUT"
          fi

  static:
    name: Static
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful CI classification
        run: test '${{ needs.classify.result }}' = success
      - name: Record not applicable
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.static == 'false' }}
        run: echo 'Static is not applicable to this change.'
      - name: Check out selected tree
        if: ${{ needs.classify.outputs.static == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Run lightweight static check
        if: ${{ needs.classify.outputs.static_mode == 'light' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/classify_ci_scope.py \
            --event pull_request \
            --base-ref '${{ github.event.pull_request.base.sha }}' \
            --head-ref '${{ github.event.pull_request.head.sha }}' >/dev/null
          git diff --check --no-renames \
            '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}' --
      - name: Validate dependency metadata without network
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        run: scripts/run_network_denied.sh --home "$HOME" -- /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Node
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
          check-latest: false
      - name: Prove npm lock closure without network
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          preflight_root="$(mktemp -d "$RUNNER_TEMP/raos-npm-preflight.XXXXXX")"
          preflight_workspace="$preflight_root/workspace"
          preflight_home="$preflight_root/home"
          preflight_config="$preflight_root/config"
          preflight_cache="$preflight_root/cache"
          umask 077
          mkdir -p "$preflight_workspace/apps/web" \
            "$preflight_workspace/packages/web-contracts" \
            "$preflight_workspace/packages/web-ui" \
            "$preflight_home" "$preflight_config" "$preflight_cache"
          cp -- package.json package-lock.json "$preflight_workspace/"
          cp -- apps/web/package.json "$preflight_workspace/apps/web/"
          cp -- packages/web-contracts/package.json \
            "$preflight_workspace/packages/web-contracts/"
          cp -- packages/web-ui/package.json \
            "$preflight_workspace/packages/web-ui/"
          : >"$preflight_config/user.conf"
          : >"$preflight_config/global.conf"
          lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          scripts/run_network_denied.sh --home "$preflight_home" -- \
            /usr/bin/env -i --chdir="$preflight_workspace" \
            PATH=/usr/bin:/bin HOME="$preflight_home" LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$preflight_config/user.conf" \
            --globalconfig "$preflight_config/global.conf" \
            --cache "$preflight_cache" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false --loglevel=error ci --dry-run --offline >/dev/null
          test ! -e "$preflight_workspace/node_modules"
          test "$lock_sha" = \
            "$(sha256sum "$preflight_workspace/package-lock.json" | cut -d' ' -f1)"
      - name: Install exact Python without repository code
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
      - name: Hydrate source-constrained locked dependencies
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          npm_config_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-config.XXXXXX")"
          npm_cache_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-cache.XXXXXX")"
          umask 077
          : >"$npm_config_dir/user.conf"
          : >"$npm_config_dir/global.conf"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$npm_config_dir/user.conf" \
            --globalconfig "$npm_config_dir/global.conf" \
            --cache "$npm_cache_dir" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false ci
      - name: Reproduce static job
        if: ${{ needs.classify.outputs.static_mode == 'full' }}
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/scripts/ci_job.sh" \
            --uv "$(command -v uv)" \
            --node "$node_path" \
            --npm-cli "$node_prefix/lib/node_modules/npm/bin/npm-cli.js" \
            static

  unit:
    name: Unit
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful CI classification
        run: test '${{ needs.classify.result }}' = success
      - name: Record not applicable
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.unit == 'false' }}
        run: echo 'Unit is not applicable to this change.'
      - name: Check out selected tree
        if: ${{ needs.classify.outputs.unit == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Validate dependency metadata without network
        if: ${{ needs.classify.outputs.unit == 'true' }}
        run: scripts/run_network_denied.sh --home "$HOME" -- /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        if: ${{ needs.classify.outputs.unit == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Node
        if: ${{ needs.classify.outputs.unit == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
          check-latest: false
      - name: Prove npm lock closure without network
        if: ${{ needs.classify.outputs.unit == 'true' }}
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          preflight_root="$(mktemp -d "$RUNNER_TEMP/raos-npm-preflight.XXXXXX")"
          preflight_workspace="$preflight_root/workspace"
          preflight_home="$preflight_root/home"
          preflight_config="$preflight_root/config"
          preflight_cache="$preflight_root/cache"
          umask 077
          mkdir -p "$preflight_workspace/apps/web" \
            "$preflight_workspace/packages/web-contracts" \
            "$preflight_workspace/packages/web-ui" \
            "$preflight_home" "$preflight_config" "$preflight_cache"
          cp -- package.json package-lock.json "$preflight_workspace/"
          cp -- apps/web/package.json "$preflight_workspace/apps/web/"
          cp -- packages/web-contracts/package.json \
            "$preflight_workspace/packages/web-contracts/"
          cp -- packages/web-ui/package.json \
            "$preflight_workspace/packages/web-ui/"
          : >"$preflight_config/user.conf"
          : >"$preflight_config/global.conf"
          lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          scripts/run_network_denied.sh --home "$preflight_home" -- \
            /usr/bin/env -i --chdir="$preflight_workspace" \
            PATH=/usr/bin:/bin HOME="$preflight_home" LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$preflight_config/user.conf" \
            --globalconfig "$preflight_config/global.conf" \
            --cache "$preflight_cache" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false --loglevel=error ci --dry-run --offline >/dev/null
          test ! -e "$preflight_workspace/node_modules"
          test "$lock_sha" = \
            "$(sha256sum "$preflight_workspace/package-lock.json" | cut -d' ' -f1)"
      - name: Install exact Python without repository code
        if: ${{ needs.classify.outputs.unit == 'true' }}
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
      - name: Hydrate source-constrained locked dependencies
        if: ${{ needs.classify.outputs.unit == 'true' }}
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          umask 077
          uv_cache_dir="$RUNNER_TEMP/raos-unit-uv-cache"
          test ! -e "$uv_cache_dir"
          test ! -L "$uv_cache_dir"
          mkdir --mode=0700 -- "$uv_cache_dir"
          npm_config_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-config.XXXXXX")"
          npm_cache_dir="$GITHUB_WORKSPACE/.npm-cache"
          test ! -e "$npm_cache_dir"
          test ! -L "$npm_cache_dir"
          mkdir --mode=0700 -- "$npm_cache_dir"
          test "$(stat --format='%u:%g:%a' -- "$npm_cache_dir")" = \
            "$(id -u):$(id -g):700"
          : >"$npm_config_dir/user.conf"
          : >"$npm_config_dir/global.conf"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never --cache-dir "$uv_cache_dir" \
            sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-progress
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$npm_config_dir/user.conf" \
            --globalconfig "$npm_config_dir/global.conf" \
            --cache "$npm_cache_dir" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false ci
      - name: Reproduce unit job
        if: ${{ needs.classify.outputs.unit_mode == 'full' }}
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/scripts/ci_job.sh" \
            --uv "$(command -v uv)" \
            --node "$node_path" \
            --npm-cli "$node_prefix/lib/node_modules/npm/bin/npm-cli.js" \
            --uv-cache "$RUNNER_TEMP/raos-unit-uv-cache" \
            --runner-temp "$RUNNER_TEMP" \
            unit
      - name: Reproduce focused Story unit job
        if: ${{ needs.classify.outputs.unit_mode == 'focused' }}
        run: |
          set -euo pipefail
          suite='${{ needs.classify.outputs.story_suite }}'
          [[ "$suite" =~ ^tests/st[0-9]{4}$ ]]
          test -d "$suite"
          python_count="$(find "$suite" -type f -name '*.py' -print -quit | wc -l)"
          node_count="$(find "$suite" -type f \( -name '*.ts' -o -name '*.tsx' \) -print -quit | wc -l)"
          test "$python_count" -gt 0 || test "$node_count" -gt 0
          if test "$python_count" -gt 0; then
            scripts/run_network_denied.sh --home "$HOME" -- \
              "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
              -p no:cacheprovider -q -m 'not raos_owner_private' "$suite"
          fi
          if test "$node_count" -gt 0; then
            node_path="$(command -v node)"
            scripts/run_network_denied.sh --home "$HOME" -- \
              "$node_path" "$GITHUB_WORKSPACE/node_modules/vitest/vitest.mjs" run \
              --config "$GITHUB_WORKSPACE/vitest.config.ts" \
              --configLoader native "$suite"
          fi

  contracts:
    name: Contracts
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful CI classification
        run: test '${{ needs.classify.result }}' = success
      - name: Record not applicable
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.contracts == 'false' }}
        run: echo 'Contracts is not applicable to this change.'
      - name: Check out selected tree
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Validate dependency metadata without network
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        run: scripts/run_network_denied.sh --home "$HOME" -- /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Node
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
          check-latest: false
      - name: Prove npm lock closure without network
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          preflight_root="$(mktemp -d "$RUNNER_TEMP/raos-npm-preflight.XXXXXX")"
          preflight_workspace="$preflight_root/workspace"
          preflight_home="$preflight_root/home"
          preflight_config="$preflight_root/config"
          preflight_cache="$preflight_root/cache"
          umask 077
          mkdir -p "$preflight_workspace/apps/web" \
            "$preflight_workspace/packages/web-contracts" \
            "$preflight_workspace/packages/web-ui" \
            "$preflight_home" "$preflight_config" "$preflight_cache"
          cp -- package.json package-lock.json "$preflight_workspace/"
          cp -- apps/web/package.json "$preflight_workspace/apps/web/"
          cp -- packages/web-contracts/package.json \
            "$preflight_workspace/packages/web-contracts/"
          cp -- packages/web-ui/package.json \
            "$preflight_workspace/packages/web-ui/"
          : >"$preflight_config/user.conf"
          : >"$preflight_config/global.conf"
          lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          scripts/run_network_denied.sh --home "$preflight_home" -- \
            /usr/bin/env -i --chdir="$preflight_workspace" \
            PATH=/usr/bin:/bin HOME="$preflight_home" LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$preflight_config/user.conf" \
            --globalconfig "$preflight_config/global.conf" \
            --cache "$preflight_cache" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false --loglevel=error ci --dry-run --offline >/dev/null
          test ! -e "$preflight_workspace/node_modules"
          test "$lock_sha" = \
            "$(sha256sum "$preflight_workspace/package-lock.json" | cut -d' ' -f1)"
      - name: Install exact Python without repository code
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
      - name: Hydrate source-constrained locked dependencies
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          npm_config_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-config.XXXXXX")"
          npm_cache_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-cache.XXXXXX")"
          umask 077
          : >"$npm_config_dir/user.conf"
          : >"$npm_config_dir/global.conf"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$npm_config_dir/user.conf" \
            --globalconfig "$npm_config_dir/global.conf" \
            --cache "$npm_cache_dir" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false ci
      - name: Reproduce contracts job
        if: ${{ needs.classify.outputs.contracts == 'true' }}
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/scripts/ci_job.sh" \
            --uv "$(command -v uv)" \
            --node "$node_path" \
            --npm-cli "$node_prefix/lib/node_modules/npm/bin/npm-cli.js" \
            contracts

  database:
    name: Database
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful CI classification
        run: test '${{ needs.classify.result }}' = success
      - name: Record not applicable
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.database == 'false' }}
        run: echo 'Database is not applicable to this change.'
      - name: Check out selected tree
        if: ${{ needs.classify.outputs.database == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact PostgreSQL service
        if: ${{ needs.classify.outputs.database == 'true' }}
        run: scripts/postgres_service.sh --docker "$(command -v docker)" test

  storage:
    name: Storage
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful CI classification
        run: test '${{ needs.classify.result }}' = success
      - name: Record not applicable
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.storage == 'false' }}
        run: echo 'Storage is not applicable to this change.'
      - name: Check out selected tree
        if: ${{ needs.classify.outputs.storage == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact object-storage service
        if: ${{ needs.classify.outputs.storage == 'true' }}
        run: scripts/object_storage_service.sh --docker "$(command -v docker)" test

  secrets:
    name: Secrets
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful CI classification
        run: test '${{ needs.classify.result }}' = success
      - name: Record not applicable
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.secrets == 'false' }}
        run: echo 'Secrets is not applicable to this change.'
      - name: Check out complete selected history
        if: ${{ needs.classify.outputs.secrets == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Reproduce secret scan
        if: ${{ needs.classify.outputs.secrets == 'true' }}
        run: scripts/run_network_denied.sh --home "$HOME" -- /usr/bin/python3 -I scripts/scan_secrets.py --worktree --git-history --reviewed-findings changes/st-0106/contracts/reviewed-secret-findings.v3.yaml
