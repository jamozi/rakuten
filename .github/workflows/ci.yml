name: Hosted CI compatibility validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosted-ci-compatibility-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate hosted CI compatibility repair
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Verify and apply reviewed repair
        env:
          RAOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          assert_blob() {
            local path=$1
            local expected=$2
            local actual
            actual=$(git hash-object "$path")
            if [[ $actual != "$expected" ]]; then
              printf 'error: %s blob is %s, expected %s\n' \
                "$path" "$actual" "$expected" >&2
              exit 1
            fi
          }
          assert_blob .github/infra-compatibility.patch.gz.b64 \
            6e7f9b678eac136539a212d63481e9b0907b718e
          assert_blob .github/st0703-runtime-port-fix.py \
            a34ed0d4fd631a63b109e14aa20f9b1885366651
          assert_blob scripts/run_network_denied.sh \
            e4b53f30d281314c28ef414a1e61b06b12034980
          assert_blob tests/st0106/test_network_isolation.py \
            2331688c242669227e8258ba93588f86b4975d90
          assert_blob tests/st0106/test_hydration_validator.py \
            83591eebc41a11d2e74ab6a0a41a1ad9f2e3e2f1
          assert_blob tests/st0201/test_wrapper.py \
            3533056232f63c43daa8628389567b129aa2aa6b
          assert_blob scripts/object_storage_service.sh \
            6cdf48becd8b26f85d912b2364635437576824a1
          assert_blob tests/st0202/test_wrapper.py \
            4b78373fcb7aa0aac5b42e3bf2155295feaa2ab5
          base64 --decode .github/infra-compatibility.patch.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/infra-compatibility.patch"
          patch_sha=$(sha256sum "$RUNNER_TEMP/infra-compatibility.patch" | cut -d' ' -f1)
          printf 'decoded repair patch sha256=%s\n' "$patch_sha"
          if [[ $patch_sha != \
            b5d46c704b2b88b4e275748d08502c5119e2847f5e2da79bba1528880480c5b7 ]]; then
            printf 'error: decoded repair patch hash mismatch\n' >&2
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/infra-compatibility.patch"
          git apply "$RUNNER_TEMP/infra-compatibility.patch"
          /usr/bin/python3 -I .github/st0703-runtime-port-fix.py
          git show "$RAOS_BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -f -- \
            .github/infra-compatibility-repair.py \
            .github/infra-compatibility.patch.gz.b64 \
            .github/st0703-runtime-port-fix.py
          bash -n scripts/run_network_denied.sh
          bash -n scripts/object_storage_service.sh
      - name: Prove hosted network-denied fallback
        run: |
          set -euo pipefail
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Regenerate and verify static scope
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m ruff format \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python scripts/build_local_compose.py
          .venv/bin/python scripts/build_local_compose.py --check
          .venv/bin/python -m ruff check \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m ruff format --check \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m mypy
      - name: Verify related suites inside the denied network boundary
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0106
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0201
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0202
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0703
      - name: Verify exact object-storage runtime and final diff
        run: |
          set -euo pipefail
          object_storage_port=$(
            /usr/bin/python3 -I - <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          if not 1024 <= port <= 65535:
              raise SystemExit("kernel selected an invalid loopback port")
          print(port)
          PY
          )
          RAOS_OBJECT_STORAGE_PORT="$object_storage_port" \
            scripts/object_storage_service.sh --docker "$(command -v docker)" test
          expected="$RUNNER_TEMP/expected-files"
          actual="$RUNNER_TEMP/actual-files"
          cat > "$expected" <<'EOF'
          changes/st-0201/manifest.yaml
          changes/st-0202/manifest.yaml
          scripts/object_storage_service.sh
          scripts/run_network_denied.sh
          tests/st0106/test_hydration_validator.py
          tests/st0106/test_network_isolation.py
          tests/st0201/test_wrapper.py
          tests/st0202/test_wrapper.py
          EOF
          git diff --name-only | LC_ALL=C sort > "$actual"
          diff --unified=0 "$expected" "$actual"
          git diff --check
