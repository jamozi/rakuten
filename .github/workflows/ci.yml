name: Hosted CI compatibility repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hosted-ci-compatibility-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repair:
    name: Repair, verify, and commit hosted CI compatibility
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Verify reviewed repair inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git hash-object .github/infra-compatibility-repair.py)" = \
            '9ae01c9f67cf57ae2c37e1ec52d6e51f0c4a0aa1'
          test "$(git hash-object scripts/run_network_denied.sh)" = \
            'e4b53f30d281314c28ef414a1e61b06b12034980'
          test "$(git hash-object tests/st0106/test_network_isolation.py)" = \
            '2331688c242669227e8258ba93588f86b4975d90'
          test "$(git hash-object tests/st0106/test_hydration_validator.py)" = \
            '83591eebc41a11d2e74ab6a0a41a1ad9f2e3e2f1'
          test "$(git hash-object scripts/object_storage_service.sh)" = \
            '6cdf48becd8b26f85d912b2364635437576824a1'
          test "$(git hash-object tests/st0202/test_wrapper.py)" = \
            '4b78373fcb7aa0aac5b42e3bf2155295feaa2ab5'
      - name: Apply reviewed repair and restore trusted workflow
        env:
          RAOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I .github/infra-compatibility-repair.py
          git show "$RAOS_BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -f -- .github/infra-compatibility-repair.py
          bash -n scripts/run_network_denied.sh
          bash -n scripts/object_storage_service.sh
      - name: Prove hosted network-denied fallback
        run: |
          set -euo pipefail
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Format, regenerate, and verify static scope
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m ruff format \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python scripts/build_local_compose.py
          .venv/bin/python scripts/build_local_compose.py --check
          .venv/bin/python -m ruff check \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m ruff format --check \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m mypy
      - name: Verify related suites inside the denied network boundary
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            -p no:cacheprovider -q tests/st0106
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            -p no:cacheprovider -q tests/st0201
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            -p no:cacheprovider -q tests/st0202
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0703
      - name: Verify exact object-storage runtime
        run: |
          set -euo pipefail
          scripts/object_storage_service.sh --docker "$(command -v docker)" test
      - name: Commit verified compatibility repair
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-files"
          actual="$RUNNER_TEMP/actual-files"
          cat > "$expected" <<'EOF'
          changes/st-0202/manifest.yaml
          scripts/object_storage_service.sh
          scripts/run_network_denied.sh
          tests/st0106/test_hydration_validator.py
          tests/st0106/test_network_isolation.py
          tests/st0202/test_wrapper.py
          EOF
          git diff --name-only | LC_ALL=C sort > "$actual"
          diff --unified=0 "$expected" "$actual"
          git add -A
          git diff --cached --check
          git config user.name 'openai-codex[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix hosted CI namespace and storage compatibility'
          git push origin HEAD:agent/st-0703-openai-responses-adapter
