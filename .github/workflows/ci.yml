name: ST-0703 exception-boundary hardening CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: st0703-exception-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  harden:
    name: Harden, verify, and commit ST-0703
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Verify reviewed hardening inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git hash-object .github/st0703-exception-hardening.py)" = \
            '532971dd76bb4c61b2d97de9bba5a930d1e6bf50'
          test "$(git hash-object python/raos/adapters/openai_responses.py)" = \
            'ad3e3ea18f4f8c5fa73a19fb24806a61ea497955'
          test "$(git hash-object tests/st0703/test_adapter.py)" = \
            '72cc18960209493683b84b7f2f94913adb3c3ecd'
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Apply reviewed exception hardening
        run: |
          set -euo pipefail
          .venv/bin/python .github/st0703-exception-hardening.py
          .venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path("python/raos/adapters/openai_responses.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  (
                      "from jsonschema.exceptions import (  "
                      "# type: ignore[import-untyped]\n"
                      "    SchemaError,\n"
                      "    ValidationError,\n"
                      ")\n"
                  ),
                  (
                      "from jsonschema.exceptions import SchemaError  "
                      "# type: ignore[import-untyped]\n"
                  ),
              ),
              (
                  "        artifact_ref = cast(ArtifactRef, artifact)\n",
                  "        artifact_ref = artifact\n",
              ),
              (
                  "        pricing_result = cast(PricingResult, pricing)\n",
                  "        pricing_result = pricing\n",
              ),
              (
                  "        return cast(int, value)\n",
                  "        return value\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected hardening source state: {old!r}")
              text = text.replace(old, new, 1)
          path.write_bytes(text.encode("utf-8"))
          PY
      - name: Format, regenerate, and verify affected scope
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m ruff format \
            python/raos/adapters/openai_responses.py tests/st0703/test_adapter.py
          .venv/bin/python scripts/build_st0703_recorded_adapter.py
          .venv/bin/python scripts/build_st0801_content_ast.py
          .venv/bin/python scripts/validate_ci_hydration.py
          .venv/bin/python scripts/build_st0204_config_loader.py --check
          .venv/bin/python scripts/build_st0701_ai_registry.py --check
          .venv/bin/python scripts/build_st0703_recorded_adapter.py --check-installed
          .venv/bin/python scripts/build_st0801_content_ast.py --check
          .venv/bin/python -m ruff check \
            python/raos scripts/build_st0703_recorded_adapter.py tests/st0703
          .venv/bin/python -m ruff format --check \
            --exclude python/raos/generated \
            python/raos scripts/build_st0703_recorded_adapter.py tests/st0703
          .venv/bin/python -m mypy
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0204
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0701
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0703
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0801
      - name: Restore trusted CI and commit verified hardening
        env:
          RAOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$RAOS_BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -f -- .github/st0703-exception-hardening.py
          git add -A
          git diff --cached --check
          git config user.name 'openai-codex[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden ST-0703 exception boundaries'
          git push origin HEAD:agent/st-0703-openai-responses-adapter
