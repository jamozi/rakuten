name: ST-0703 Exact Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: st0703-exact-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Python 3.14.6 isolated validation
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out exact clean implementation commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 4bcbf052fe0ee486caeee6505a50827589c414a5
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Validate dependency metadata without network
        run: scripts/run_network_denied.sh --home "$HOME" -- /usr/bin/python3 -I scripts/validate_ci_hydration.py
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
          check-latest: false
      - name: Install exact Python without repository code
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
      - name: Hydrate source-constrained locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          npm_config_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-config.XXXXXX")"
          npm_cache_dir="$(mktemp -d "$RUNNER_TEMP/raos-npm-cache.XXXXXX")"
          umask 077
          : >"$npm_config_dir/user.conf"
          : >"$npm_config_dir/global.conf"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC CI=true \
            "$node_path" "$npm_cli" \
            --userconfig "$npm_config_dir/user.conf" \
            --globalconfig "$npm_config_dir/global.conf" \
            --cache "$npm_cache_dir" --registry https://registry.npmjs.org/ \
            --replace-registry-host=always --ignore-scripts=true --audit=false \
            --fund=false --update-notifier=false --package-lock=true --save=false \
            --install-links=true --legacy-peer-deps=false --strict-peer-deps=true \
            --prefer-dedupe=true --omit-lockfile-registry-resolved=false \
            --provenance=false ci
      - name: Run ST-0703 recorded gate without network
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          scripts/run_network_denied.sh --home "$HOME" -- \
            /usr/bin/make --no-builtin-rules --no-builtin-variables \
            --file Makefile openai-recorded-gate RAOS_CI_OFFLINE=1 \
            UV="$(command -v uv)"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Diagnose repository-wide static baseline without masking new failures
        id: static_baseline
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          clean_log="$RUNNER_TEMP/static-clean.log"
          set +e
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/scripts/ci_job.sh" \
            --uv "$uv_path" \
            --node "$node_path" \
            --npm-cli "$npm_cli" \
            static 2>&1 | tee "$clean_log"
          clean_status=${PIPESTATUS[0]}
          set -e
          if (( clean_status == 0 )); then
            echo "Repository-wide static job passed."
            exit 0
          fi
          marker='error: generated artifact drift: changes/st-0202/manifest.yaml'
          grep -Fq -- "$marker" "$clean_log"
          baseline="$RUNNER_TEMP/main-baseline"
          git worktree add --detach "$baseline" 48a807672caa845df8e0251782f00bce8040663b
          baseline_log="$RUNNER_TEMP/static-main-baseline.log"
          set +e
          "$GITHUB_WORKSPACE/scripts/run_network_denied.sh" --home "$HOME" -- \
            "$uv_path" --config-file "$GITHUB_WORKSPACE/uv.toml" \
            run --locked --offline --no-cache --no-sync --no-env-file \
            --no-python-downloads python \
            "$baseline/scripts/build_local_compose.py" --check \
            2>&1 | tee "$baseline_log"
          baseline_status=${PIPESTATUS[0]}
          set -e
          test "$baseline_status" -ne 0
          grep -Fq -- "$marker" "$baseline_log"
          echo "The clean branch and fixed main baseline stop on the same excluded ST-0202 owner-output drift."
      - name: Reproduce repository-wide unit job without network
        id: full_unit
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/scripts/ci_job.sh" \
            --uv "$(command -v uv)" \
            --node "$node_path" \
            --npm-cli "$npm_cli" \
            unit
      - name: Reproduce repository-wide contracts job without network
        id: full_contracts
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          node_prefix="$(dirname "$(dirname "$node_path")")"
          npm_cli="$node_prefix/lib/node_modules/npm/bin/npm-cli.js"
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/scripts/ci_job.sh" \
            --uv "$(command -v uv)" \
            --node "$node_path" \
            --npm-cli "$npm_cli" \
            contracts
      - name: Scan worktree and Git history without network
        id: secret_scan
        if: always()
        continue-on-error: true
        run: scripts/run_network_denied.sh --home "$HOME" -- /usr/bin/python3 -I scripts/scan_secrets.py --worktree --git-history
      - name: Prove tracked worktree remained unchanged
        id: clean_tree
        if: always()
        continue-on-error: true
        run: |
          git diff --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Assert regression-free independent checks
        if: always()
        run: |
          set -euo pipefail
          printf 'static=%s unit=%s contracts=%s secrets=%s clean_tree=%s\n' \
            '${{ steps.static_baseline.outcome }}' \
            '${{ steps.full_unit.outcome }}' \
            '${{ steps.full_contracts.outcome }}' \
            '${{ steps.secret_scan.outcome }}' \
            '${{ steps.clean_tree.outcome }}'
          test '${{ steps.static_baseline.outcome }}' = success
          test '${{ steps.full_unit.outcome }}' = success
          test '${{ steps.full_contracts.outcome }}' = success
          test '${{ steps.secret_scan.outcome }}' = success
          test '${{ steps.clean_tree.outcome }}' = success
