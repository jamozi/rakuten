name: ST-0703 publish verified compatibility payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: st0703-publish-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish verified deterministic payload
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Re-run the reviewed deterministic generator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          /usr/bin/python3 -I - <<'PY'
          import os
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/st0703-regenerate-repair-payload.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '      - name: Regenerate and print deterministic payload\n        run: |\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected regeneration workflow structure')
          block = text.split(marker, 1)[1]
          lines = block.splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected regeneration script indentation')
          script = '\n'.join(line[10:] for line in lines) + '\n'
          pattern = r'^test "\$\(git rev-parse HEAD\)" = .+$'
          replacement = 'test "$(git rev-parse HEAD)" = "$HEAD_SHA"'
          script, replacements = re.subn(
              pattern,
              replacement,
              script,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit('unexpected regeneration head guard')
          destination = Path(os.environ['RUNNER_TEMP']) / 'st0703-regenerate.sh'
          destination.write_text(script, encoding='utf-8', newline='')
          destination.chmod(0o700)
          PY
          "$RUNNER_TEMP/st0703-regenerate.sh"
      - name: Remove obsolete fixture expectation and publish payload
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/infra-compatibility.patch"
          compressed="$RUNNER_TEMP/infra-compatibility.patch.gz"
          payload="$RUNNER_TEMP/infra-compatibility.patch.gz.b64"
          test -f "$patch"
          test -f "$payload"
          git apply "$patch"
          /usr/bin/python3 -I - <<'PY'
          from pathlib import Path

          test_file = Path('tests/st0202/test_wrapper.py')
          text = test_file.read_text(encoding='utf-8')
          obsolete = (
              '    compose_port = next(\n'
              '        row for row in rows if _compose_operation(row) == "port"\n'
              '    )\n'
              '    assert compose_port["port"] == "58333"\n'
          )
          if text.count(obsolete) != 1:
              raise SystemExit('unexpected obsolete Compose port fixture expectation')
          test_file.write_text(
              text.replace(obsolete, '', 1),
              encoding='utf-8',
              newline='',
          )
          PY
          expected="$RUNNER_TEMP/expected-files"
          actual="$RUNNER_TEMP/actual-files"
          cat > "$expected" <<'EOF'
          scripts/object_storage_service.sh
          scripts/run_network_denied.sh
          tests/st0106/test_hydration_validator.py
          tests/st0106/test_network_isolation.py
          tests/st0201/test_wrapper.py
          tests/st0202/test_wrapper.py
          EOF
          git diff --name-only | LC_ALL=C sort > "$actual"
          diff --unified=0 "$expected" "$actual"
          git diff --check
          bash -n scripts/object_storage_service.sh

          git diff --binary --no-ext-diff --no-color > "$patch"
          gzip --best --no-name --stdout "$patch" > "$compressed"
          base64 --wrap=76 "$compressed" > "$payload"
          base64 --decode "$payload" | gzip --decompress \
            > "$RUNNER_TEMP/roundtrip.patch"
          cmp "$patch" "$RUNNER_TEMP/roundtrip.patch"
          git reset --hard HEAD
          git apply --check "$patch"

          patch_sha="$(sha256sum "$patch" | cut -d' ' -f1)"
          payload_blob="$(git hash-object "$payload")"
          printf 'PATCH_SHA256=%s\n' "$patch_sha"
          printf 'PAYLOAD_GIT_BLOB=%s\n' "$payload_blob"
          cp -- "$payload" .github/infra-compatibility.patch.gz.b64
          test "$(git hash-object .github/infra-compatibility.patch.gz.b64)" = \
            "$payload_blob"
          if git diff --quiet -- .github/infra-compatibility.patch.gz.b64; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/infra-compatibility.patch.gz.b64
          git commit -m 'Regenerate hosted compatibility repair payload'
          git push origin "HEAD:refs/heads/$HEAD_REF"
