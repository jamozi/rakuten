name: Export Combined All-Story Tree

on:
  push:
    branches:
      - agent/all-stories-materialize-run-20260811
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    name: Export combined implementation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out overlay transport
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: overlay-transport
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out implementation-first subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/raos-implementation-first-goal
          path: subject
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Diagnose and reconstruct exact combined tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path
          import re

          root = Path("overlay-transport/.github/all-stories-overlay")
          paths = sorted(root.glob("part-*")) + sorted(root.glob("rest-*"))
          if not paths:
              raise SystemExit("no overlay chunks")
          documents: dict[str, str] = {}
          alphabet = re.compile(r"[A-Za-z0-9+/=]*\Z")
          for path in paths:
              text = "".join(path.read_text(encoding="ascii").split())
              documents[path.name] = text
              print(
                  "CHUNK",
                  path.name,
                  "length=", len(text),
                  "mod4=", len(text) % 4,
                  "padding=", text.count("="),
                  "alphabet=", bool(alphabet.fullmatch(text)),
                  "head=", text[:12],
                  "tail=", text[-12:],
              )

          candidates = {
              "all": "".join(documents[path.name] for path in paths),
              "parts": "".join(
                  documents[path.name] for path in paths if path.name.startswith("part-")
              ),
              "rest": "".join(
                  documents[path.name] for path in paths if path.name.startswith("rest-")
              ),
          }
          for name, text in candidates.items():
              for validate in (True, False):
                  try:
                      data = base64.b64decode(text, validate=validate)
                  except Exception as error:
                      print("DECODE", name, "validate=", validate, "ERROR", repr(error))
                  else:
                      print(
                          "DECODE", name, "validate=", validate,
                          "bytes=", len(data), "head=", data[:12].hex(),
                          "tail=", data[-12:].hex(),
                      )
          for name, text in documents.items():
              try:
                  data = base64.b64decode(text, validate=True)
              except Exception as error:
                  print("INDIVIDUAL", name, "ERROR", repr(error))
              else:
                  print(
                      "INDIVIDUAL", name, "bytes=", len(data),
                      "head=", data[:8].hex(), "tail=", data[-8:].hex(),
                  )
          raise SystemExit("diagnostic complete")
          PY

      - name: Upload combined source
        if: ${{ false }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rakuten-all-stories-combined-source
          path: ${{ runner.temp }}/rakuten-all-stories-combined.tar.gz
