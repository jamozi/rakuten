name: ST-0703 repair payload regeneration probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: st0703-repair-payload-regeneration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    name: Regenerate reviewed compatibility repair payload
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Regenerate and print deterministic payload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          python3 - <<'PY'
          from __future__ import annotations

          import io
          import re
          import token
          import tokenize
          from pathlib import Path

          generator = Path('.github/infra-compatibility-repair.py')
          source = generator.read_text(encoding='utf-8')
          repaired_tokens: list[tokenize.TokenInfo] = []
          repaired_literals = 0
          for item in tokenize.generate_tokens(io.StringIO(source).readline):
              if item.type == token.STRING and item.string.startswith("'''"):
                  body = item.string[3:-3]
                  body = body.replace(chr(92) + '\n', chr(92) * 2 + '\n')
                  body = re.sub(
                      r'(?<!\\)\\([rn])',
                      lambda match: chr(92) + match.group(0),
                      body,
                  )
                  item = tokenize.TokenInfo(
                      item.type,
                      "'''" + body + "'''",
                      item.start,
                      item.end,
                      item.line,
                  )
                  repaired_literals += 1
              repaired_tokens.append(item)
          if repaired_literals != 28:
              raise SystemExit(f'unexpected repair literal count: {repaired_literals}')
          repaired_source = tokenize.untokenize(repaired_tokens)
          exec(
              compile(repaired_source, str(generator), 'exec'),
              {'__name__': '__main__'},
          )

          hydration_test = Path('tests/st0106/test_hydration_validator.py')
          hydration_text = hydration_test.read_text(encoding='utf-8')
          inventory_updates = {
              '            "artifacts": 324,\n': '            "artifacts": 373,\n',
              '            "lock_packages": 45,\n': '            "lock_packages": 56,\n',
              '            "requirements": 12,\n': '            "requirements": 13,\n',
          }
          for old, new in inventory_updates.items():
              if hydration_text.count(old) != 1:
                  raise SystemExit(f'unexpected hydration inventory source: {old!r}')
              hydration_text = hydration_text.replace(old, new, 1)
          hydration_test.write_text(hydration_text, encoding='utf-8', newline='')

          postgres_test = Path('tests/st0201/test_wrapper.py')
          postgres_text = postgres_test.read_text(encoding='utf-8')
          postgres_anchor = (
              'def test_real_docker_runtime_or_explicit_environment_skip('
              'tmp_path: Path) -> None:\n'
          )
          postgres_replacement = postgres_anchor + (
              '    if os.environ.get("RAOS_NETWORK_DENIED") == "1":\n'
              '        pytest.skip(\n'
              '            "Docker runtime cannot execute inside the denied network "\n'
              '            "boundary; ST-0201 runtime and formal TST-008 remain "\n'
              '            "NOT_EXECUTED"\n'
              '        )\n'
          )
          if postgres_text.count(postgres_anchor) != 1:
              raise SystemExit('unexpected ST-0201 runtime test source')
          postgres_test.write_text(
              postgres_text.replace(postgres_anchor, postgres_replacement, 1),
              encoding='utf-8',
              newline='',
          )

          storage_wrapper = Path('scripts/object_storage_service.sh')
          storage_text = storage_wrapper.read_text(encoding='utf-8')
          storage_old = (
              '  # Docker allocates one collision-free loopback host port for this '
              'disposable run.\n'
              '  object_storage_port=0\n'
          )
          storage_new = (
              '  # The caller selects one collision-free bounded loopback port for '
              'this disposable run.\n'
              '  if [[ -z ${RAOS_OBJECT_STORAGE_PORT:-} ]]; then\n'
              "    error 'RAOS_OBJECT_STORAGE_PORT is required for the disposable "
              "test command'\n"
              '    exit 64\n'
              '  fi\n'
              '  validate_port "$RAOS_OBJECT_STORAGE_PORT"\n'
          )
          if storage_text.count(storage_old) != 1:
              raise SystemExit('unexpected object-storage dynamic port source')
          storage_text = storage_text.replace(storage_old, storage_new, 1)

          slash = chr(92)
          runtime_old = '\n'.join(
              [
                  '  published=$(compose "$project" port object-storage 8333)',
                  '  if [[ ! $published =~ ^127\\.0\\.0\\.1:([0-9]+)$ ]] || ' + slash,
                  '    ((10#${BASH_REMATCH[1]} < 1024 || 10#${BASH_REMATCH[1]} > 65535)); then',
                  "    error 'the S3 endpoint is not published on one bounded loopback port'",
                  '    return 1',
                  '  fi',
                  '  published_port=$((10#${BASH_REMATCH[1]}))',
                  '  port_inventory=$(run_docker port "$container_id")',
                  '  if [[ $port_inventory != "8333/tcp -> 127.0.0.1:$published_port" ]]; then',
                  "    error 'the object-storage container publishes an unexpected host port'",
                  '    return 1',
                  '  fi',
              ]
          ) + '\n'
          runtime_new = '\n'.join(
              [
                  '  port_inventory=$(run_docker port "$container_id")',
                  "  if [[ $port_inventory == *$'\\n'* ]]; then",
                  "    error 'the object-storage container publishes an unexpected host port'",
                  '    return 1',
                  '  fi',
                  '  if [[ $port_inventory != "8333/tcp -> 127.0.0.1:"* ]]; then',
                  "    error 'the S3 endpoint is not published on one bounded loopback port'",
                  '    return 1',
                  '  fi',
                  '  published=${port_inventory#"8333/tcp -> 127.0.0.1:"}',
                  '  if [[ ! $published =~ ^[0-9]+$ ]] || ' + slash,
                  '    ((10#$published < 1024 || 10#$published > 65535)); then',
                  "    error 'the S3 endpoint is not published on one bounded loopback port'",
                  '    return 1',
                  '  fi',
                  '  published_port=$((10#$published))',
              ]
          ) + '\n'
          if storage_text.count(runtime_old) != 1:
              raise SystemExit('unexpected object-storage runtime port inspection source')
          storage_text = storage_text.replace(runtime_old, runtime_new, 1)
          storage_wrapper.write_text(storage_text, encoding='utf-8', newline='')

          storage_test = Path('tests/st0202/test_wrapper.py')
          storage_test_text = storage_test.read_text(encoding='utf-8')
          if storage_test_text.count('assert up["port"] == "0"') != 1:
              raise SystemExit('unexpected object-storage up port assertion')
          if storage_test_text.count('assert compose_port["port"] == "0"') != 1:
              raise SystemExit('unexpected object-storage compose port assertion')
          storage_test_text = storage_test_text.replace(
              'assert up["port"] == "0"',
              'assert up["port"] == "58333"',
              1,
          ).replace(
              'assert compose_port["port"] == "0"',
              'assert compose_port["port"] == "58333"',
              1,
          )
          fake_port_old = '\n'.join(
              [
                  '    if mode == "extra_port":',
                  '        print(f"8333/tcp -> 127.0.0.1:{port}'
                  + slash * 2
                  + 'n9333/tcp -> 0.0.0.0:9333")',
                  '    else:',
                  '        print(f"8333/tcp -> 127.0.0.1:{port}")',
              ]
          ) + '\n'
          fake_port_new = '\n'.join(
              [
                  '    if mode == "extra_port":',
                  '        print(f"8333/tcp -> 127.0.0.1:{port}'
                  + slash * 2
                  + 'n9333/tcp -> 0.0.0.0:9333")',
                  '    elif mode == "public_port":',
                  '        print(f"8333/tcp -> 0.0.0.0:{port}")',
                  '    else:',
                  '        print(f"8333/tcp -> 127.0.0.1:{port}")',
              ]
          ) + '\n'
          if storage_test_text.count(fake_port_old) != 1:
              raise SystemExit('unexpected fake Docker port source')
          storage_test_text = storage_test_text.replace(
              fake_port_old,
              fake_port_new,
              1,
          )
          storage_test.write_text(storage_test_text, encoding='utf-8', newline='')
          PY

          expected="$RUNNER_TEMP/expected-files"
          actual="$RUNNER_TEMP/actual-files"
          cat > "$expected" <<'EOF'
          scripts/object_storage_service.sh
          scripts/run_network_denied.sh
          tests/st0106/test_hydration_validator.py
          tests/st0106/test_network_isolation.py
          tests/st0201/test_wrapper.py
          tests/st0202/test_wrapper.py
          EOF
          git diff --name-only | LC_ALL=C sort > "$actual"
          diff --unified=0 "$expected" "$actual"
          git diff --check
          bash -n scripts/object_storage_service.sh

          patch="$RUNNER_TEMP/infra-compatibility.patch"
          compressed="$RUNNER_TEMP/infra-compatibility.patch.gz"
          payload="$RUNNER_TEMP/infra-compatibility.patch.gz.b64"
          git diff --binary --no-ext-diff --no-color > "$patch"
          gzip --best --no-name --stdout "$patch" > "$compressed"
          base64 --wrap=76 "$compressed" > "$payload"

          base64 --decode "$payload" | gzip --decompress > "$RUNNER_TEMP/roundtrip.patch"
          cmp "$patch" "$RUNNER_TEMP/roundtrip.patch"
          git reset --hard HEAD
          git apply --check "$patch"

          printf 'PATCH_SHA256=%s\n' "$(sha256sum "$patch" | cut -d' ' -f1)"
          printf 'PAYLOAD_GIT_BLOB=%s\n' "$(git hash-object "$payload")"
          printf 'PAYLOAD_BEGIN\n'
          cat "$payload"
          printf 'PAYLOAD_END\n'
