name: ST-0703 effective Compose port probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: st0703-compose-port-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Inspect effective object storage port model
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Inspect interpolated Compose JSON
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/compose-model.json"
          env -i \
            PATH=/usr/bin:/bin \
            HOME="$HOME" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            RAOS_OBJECT_STORAGE_PORT=58333 \
            RAOS_OBJECT_STORAGE_S3_CONFIG_FILE=/dev/null \
            /usr/bin/docker compose \
              --project-directory "$GITHUB_WORKSPACE" \
              --file "$GITHUB_WORKSPACE/docker-compose.yml" \
              --project-name st0703-compose-port-probe \
              config --format json > "$model"
          /usr/bin/python3 -I - "$model" <<'PY'
          import json
          from pathlib import Path
          import sys

          model = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          service = model["services"]["object-storage"]
          print(json.dumps({"ports": service.get("ports")}, sort_keys=True))
          PY
