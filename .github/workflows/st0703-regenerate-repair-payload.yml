name: ST-0703 repair payload verification probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: st0703-repair-payload-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify current compatibility repair payload
    if: github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Decode, hash, and apply-check payload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          payload=.github/infra-compatibility.patch.gz.b64
          patch="$RUNNER_TEMP/infra-compatibility.patch"
          base64 --decode "$payload" | gzip --decompress > "$patch"
          git apply --check "$patch"
          printf 'PATCH_SHA256=%s\n' "$(sha256sum "$patch" | cut -d' ' -f1)"
          printf 'PAYLOAD_GIT_BLOB=%s\n' "$(git hash-object "$payload")"
