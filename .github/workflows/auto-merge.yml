name: Auto Merge Final Integration

on:
  workflow_run:
    workflows: [Final Integration CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Auto Merge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Enable squash auto-merge for the integration PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          pr_number="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')"
          test -n "$pr_number"
          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --auto
