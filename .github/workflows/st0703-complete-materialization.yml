name: ST-0703 complete source materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: st0703-complete-source-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  materialize:
    name: Materialize, verify, and finalize ST-0703
    if: >-
      github.event.pull_request.head.ref == 'agent/st-0703-openai-responses-adapter' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false

      - name: Run bounded finalization
        run: |
          set -euo pipefail
          test "$(git hash-object .github/st0703-finalize.sh)" = \
            'ef95f41b9430590f66495cd665ad0bb5bdd86afd'
          bash -n .github/st0703-finalize.sh
          bash .github/st0703-finalize.sh
