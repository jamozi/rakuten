name: ST-0703 complete source materialization

on:
  push:
    branches:
      - agent/st-0703-openai-responses-adapter

permissions:
  contents: write

concurrency:
  group: st0703-complete-source-materialization
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    name: Materialize, verify, and finalize ST-0703
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_REF: agent/st-0703-openai-responses-adapter
      EXPECTED_PAYLOAD_BLOB: 6e7f9b678eac136539a212d63481e9b0907b718e
      EXPECTED_PATCH_SHA256: b5d46c704b2b88b4e275748d08502c5119e2847f5e2da79bba1528880480c5b7
      EXPECTED_RUNTIME_FIX_BLOB: a34ed0d4fd631a63b109e14aa20f9b1885366651
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply the reviewed compatibility repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          payload=.github/infra-compatibility.patch.gz.b64
          patch="$RUNNER_TEMP/infra-compatibility.patch"
          test -f "$payload"
          actual_blob=$(git hash-object "$payload")
          if [[ $actual_blob != "$EXPECTED_PAYLOAD_BLOB" ]]; then
            printf 'error: payload blob is %s, expected %s\n' \
              "$actual_blob" "$EXPECTED_PAYLOAD_BLOB" >&2
            exit 1
          fi
          runtime_fix_blob=$(git hash-object .github/st0703-runtime-port-fix.py)
          if [[ $runtime_fix_blob != "$EXPECTED_RUNTIME_FIX_BLOB" ]]; then
            printf 'error: runtime fix blob is %s, expected %s\n' \
              "$runtime_fix_blob" "$EXPECTED_RUNTIME_FIX_BLOB" >&2
            exit 1
          fi
          base64 --decode "$payload" | gzip --decompress > "$patch"
          actual_patch_sha=$(sha256sum "$patch" | cut -d' ' -f1)
          if [[ $actual_patch_sha != "$EXPECTED_PATCH_SHA256" ]]; then
            printf 'error: patch sha256 is %s, expected %s\n' \
              "$actual_patch_sha" "$EXPECTED_PATCH_SHA256" >&2
            exit 1
          fi
          git apply --check "$patch"
          git apply "$patch"
          /usr/bin/python3 -I .github/st0703-runtime-port-fix.py
          bash -n scripts/run_network_denied.sh
          bash -n scripts/object_storage_service.sh

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false

      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress

      - name: Regenerate owned artifacts and verify code
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python scripts/build_local_compose.py
          .venv/bin/python scripts/build_local_compose.py --check
          .venv/bin/python scripts/build_st0703_recorded_adapter.py
          .venv/bin/python scripts/build_st0703_recorded_adapter.py --check
          .venv/bin/python -m ruff format \
            tests/st0106/test_network_isolation.py \
            tests/st0106/test_hydration_validator.py \
            tests/st0201/test_wrapper.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m ruff check \
            python/raos scripts/build_st0703_recorded_adapter.py \
            tests/st0106 tests/st0201 tests/st0202 tests/st0703
          .venv/bin/python -m ruff format --check \
            --exclude python/raos/generated \
            python/raos scripts/build_st0703_recorded_adapter.py \
            tests/st0106 tests/st0201 tests/st0202 tests/st0703
          .venv/bin/python -m mypy

      - name: Run affected test suites
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0106
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0201
          scripts/run_network_denied.sh --home "$HOME" -- \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
            -p no:cacheprovider -q tests/st0202
          .venv/bin/python -m pytest -p no:cacheprovider -q \
            tests/st0204 tests/st0701 tests/st0703 tests/st0801

      - name: Verify disposable object-storage runtime
        run: |
          set -euo pipefail
          object_storage_port=$(
            /usr/bin/python3 -I - <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          if not 1024 <= port <= 65535:
              raise SystemExit("kernel selected an invalid loopback port")
          print(port)
          PY
          )
          RAOS_OBJECT_STORAGE_PORT="$object_storage_port" \
            scripts/object_storage_service.sh --docker "$(command -v docker)" test

      - name: Remove transport-only files and restore canonical CI
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f -- \
            .github/infra-compatibility-repair.py \
            .github/infra-compatibility.patch.gz.b64 \
            .github/st0703-ci-trigger \
            .github/st0703-runtime-port-fix.py \
            .github/workflows/st0703-authoritative-finalizer.yml \
            .github/workflows/st0703-final-gate.yml \
            .github/workflows/st0703-final-sentinel.yml \
            .github/workflows/st0703-finalize-v2.yml \
            .github/workflows/st0703-finalize-v3.yml \
            .github/workflows/st0703-materialize-repair.yml \
            .github/workflows/st0703-complete-materialization.yml
          git diff --check
          test ! -e .github/infra-compatibility-repair.py
          test ! -e .github/infra-compatibility.patch.gz.b64
          test ! -e .github/st0703-runtime-port-fix.py

      - name: Commit the final materialized tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            printf 'error: materialization produced no commit\n' >&2
            exit 1
          fi
          git commit -m 'Finalize ST-0703 materialized implementation'
          git push origin "HEAD:refs/heads/$HEAD_REF"
