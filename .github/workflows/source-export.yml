name: Verify proposed implementation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-patch:
    name: Verify implementation patch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pull-request tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Apply proposed patch without changing the branch
        run: |
          set -euo pipefail
          sed -i 's/^ diff --git /diff --git /' changes/implementation-review-20260808/fixes.patch
          git apply --check changes/implementation-review-20260808/fixes.patch
          git apply changes/implementation-review-20260808/fixes.patch
          git diff --check
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - name: Install exact Python and locked dependencies
        run: |
          set -euo pipefail
          uv_path="$(command -v uv)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never python install \
            --managed-python --no-bin --no-registry --no-cache --no-progress 3.14.6
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            "$uv_path" --no-config --color never sync --locked \
            --no-default-groups --group dev --no-install-project --no-install-local \
            --managed-python --no-python-downloads --python 3.14.6 \
            --no-build --no-sources --default-index https://pypi.org/simple \
            --index-strategy first-index --keyring-provider disabled --link-mode copy \
            --resolution highest --prerelease disallow \
            --exclude-newer 2026-08-01T16:50:16Z --no-cache --no-progress
      - name: Verify generators, shell, formatting, and targeted suites
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          bash -n scripts/run_network_denied.sh
          bash -n scripts/object_storage_service.sh
          .venv/bin/python scripts/build_st0107_pr_governance.py --check
          .venv/bin/python scripts/build_local_compose.py --check
          .venv/bin/python -m ruff check \
            tests/st0106/test_network_isolation.py \
            tests/st0202/test_fixture.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m ruff format --check \
            tests/st0106/test_network_isolation.py \
            tests/st0202/test_fixture.py \
            tests/st0202/test_wrapper.py
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0106/test_network_isolation.py
          .venv/bin/python -m pytest -p no:cacheprovider -q tests/st0107
          .venv/bin/python -m pytest \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            -p no:cacheprovider -q tests/st0202
      - name: Verify real object-storage runtime
        run: |
          set -euo pipefail
          scripts/object_storage_service.sh --docker "$(command -v docker)" test
