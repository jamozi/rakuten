name: Status registry

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  status-registry:
    name: Validate status overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard status history trust surface before Python
        env:
          RAOS_STATUS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAOS_STATUS_PR_HEAD_SHA"
          history_file="$(mktemp)"
          trust_file="$(mktemp)"
          trap 'rm -f "$history_file" "$trust_file"' EXIT
          git diff --name-only -z --diff-filter=ACMDRTUXB \
            "$RAOS_BASE_SHA" "$RAOS_STATUS_PR_HEAD_SHA" -- \
            'changes/st-0005/requests/*.yaml' \
            'changes/st-0005/evidence/**' > "$history_file"
          if [[ ! -s "$history_file" ]]; then
            echo 'RAOS_STATUS_HISTORY_CHANGED=0' >> "$GITHUB_ENV"
            exit 0
          fi
          git diff --name-only -z --diff-filter=ACMDRTUXB \
            "$RAOS_BASE_SHA" "$RAOS_STATUS_PR_HEAD_SHA" -- \
            'scripts/**' \
            '.github/workflows/status-registry.yml' \
            '.gitattributes' \
            'docs/README.md' \
            'docs/manifest.json' \
            'docs/canonical/**' \
            'docs/upstream/**' \
            'zip/**' > "$trust_file"
          if [[ -s "$trust_file" ]]; then
            while IFS= read -r -d '' path; do
              echo "Status history cannot change with a trust-surface file: $path" >&2
            done < "$trust_file"
            exit 1
          fi
          echo 'RAOS_STATUS_HISTORY_CHANGED=1' >> "$GITHUB_ENV"

      - name: Restore base-owned enforcement code before Python
        env:
          RAOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -L scripts
          git restore --source="$RAOS_BASE_SHA" --worktree -- scripts

      - name: Verify existing Python prerequisite
        run: python3 -I -c 'import yaml; print(yaml.__version__)'

      - name: Verify immutable ST-0001 import
        run: python3 -I scripts/import_raos_design.py verify

      - name: Reject generated status drift
        run: python3 -I scripts/build_st0005_status.py --check

      - name: Validate changed requests against current pull-request ancestry
        env:
          RAOS_PR_URI: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          RAOS_STATUS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAOS_STATUS_PR_HEAD_SHA"
          rejected_file="$(mktemp)"
          changed_file="$(mktemp)"
          trap 'rm -f "$rejected_file" "$changed_file"' EXIT
          git diff --name-only -z --diff-filter=CMDRTUXB \
            "$RAOS_BASE_SHA" "$RAOS_STATUS_PR_HEAD_SHA" -- \
            'changes/st-0005/requests/*.yaml' \
            'changes/st-0005/evidence/**' > "$rejected_file"
          if [[ -s "$rejected_file" ]]; then
            while IFS= read -r -d '' path; do
              echo "Status request/evidence history is append-only: $path" >&2
            done < "$rejected_file"
            exit 1
          fi
          git diff --name-only -z --diff-filter=A \
            "$RAOS_BASE_SHA" "$RAOS_STATUS_PR_HEAD_SHA" -- \
            'changes/st-0005/requests/*.yaml' > "$changed_file"
          mapfile -d '' -t changed < "$changed_file"
          if [[ "${#changed[@]}" -eq 0 ]]; then
            exit 0
          fi
          export RAOS_CHANGED_STATUS_REQUEST_COUNT="${#changed[@]}"
          for request in "${changed[@]}"; do
            RAOS_CHANGED_STATUS_REQUEST="$request" \
              python3 -I scripts/build_st0005_status.py \
                --validate-live-request "$request"
          done
