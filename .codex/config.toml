# Project-local Codex policy for the Rakuten profit-optimization system.
# This layer is loaded only when the repository is trusted.

# Keep MCP declarations available for an explicitly re-enabled development
# session, but do not start MCP transports during the hook-free autonomous run.
web_search = "live"
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false
default_tools_approval_mode = "approve"

# Browser-independent WordPress draft/editor path. The launcher reads the
# dedicated editor Application Password from an owner-private 0600 file and
# injects it only into the pinned remote proxy child. No credential is stored
# in TOML, Git, argv, or the inherited environment.
[mcp_servers.wordpressEditor]
command = "/home/minami/.nvm/versions/node/v24.18.1/bin/node"
args = ["/home/minami/rakuten/scripts/raos_wordpress_editor_mcp_launcher.mjs"]
cwd = "/home/minami/rakuten"
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "raos-codex-site-status",
  "raos-codex-content-list",
  "raos-codex-content-get",
  "raos-codex-content-create-draft",
  "raos-codex-content-update-draft",
  "raos-codex-content-propose-release",
  "raos-codex-publication-batch-register",
  "raos-codex-operation-get",
]

# Local bounded deployment bridge. It exposes typed operations backed by a
# fixed Python operator and cannot accept commands, PHP, SQL, URLs, caller ZIP
# paths, uninstall, deletion, or approval input.
[mcp_servers.wordpressDeployment]
command = "/home/minami/.nvm/versions/node/v24.18.1/bin/node"
args = [
  "--experimental-strip-types",
  "/home/minami/rakuten/packages/wordpress-mcp-bridge/src/index.ts",
]
cwd = "/home/minami/rakuten"
enabled = true
# The direct MCP fallback outlives the 4,620-second bridge child bound and the
# 4,680-second foreground client bound; it does not extend either server TTL.
tool_timeout_sec = 4800
default_tools_approval_mode = "prompt"
enabled_tools = [
  "deployment-status",
  "publication-batch-status",
  "release-wait-and-apply",
  "theme-propose-release",
  "plugin-propose-change",
  "plugin-apply-change",
  "operation-recover",
]

# Shadow the GitHub plugin's PAT-backed MCP with a complete disabled transport.
# Authentication uses the GitHub app below; no token value is stored here.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
enabled = false

[mcp_servers.playwright]
command = "/bin/bash"
args = ["/home/minami/rakuten/scripts/chatgpt_pro_mcp.sh"]
cwd = "/home/minami/rakuten"
enabled = false
default_tools_approval_mode = "prompt"
enabled_tools = [
  "browser_navigate",
  "browser_snapshot",
  "browser_click",
  "browser_type",
  "browser_wait_for",
  "browser_close",
]
disabled_tools = [
  "browser_drop",
  "browser_evaluate",
  "browser_file_upload",
  "browser_run_code_unsafe",
  "browser_storage_state",
  "browser_cookie_list",
  "browser_localstorage_list",
  "browser_sessionstorage_list",
  "browser_tabs",
]

# The repository owner preauthorized only the exact tools above for the
# ST-0101 ChatGPT Pro workflow. The direct MCP stays disabled: the RAOS-only
# orchestrator starts the wrapper as its child and injects the private prompt
# path only into that process, avoiding a Codex restart or per-run user env.
[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_snapshot]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_click]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_type]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_wait_for]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_close]
approval_mode = "approve"

# Disable generic or out-of-scope MCP servers inherited from the user config.
[mcp_servers.fetch]
command = "npx"
args = ["--yes", "@modelcontextprotocol/server-fetch"]
enabled = false

[mcp_servers.filesystem]
command = "npx"
args = ["--yes", "@modelcontextprotocol/server-filesystem", "/home/minami/automation", "/home/minami/AI_tuber", "/tmp"]
enabled = false

[mcp_servers.memory]
command = "npx"
args = ["--yes", "@modelcontextprotocol/server-memory"]
enabled = false

[mcp_servers.sequential-thinking]
command = "npx"
args = ["--yes", "@modelcontextprotocol/server-sequential-thinking"]
enabled = false

# Disable the desktop app's inherited Node REPL transport for this project.
# WordPress work must flow through the two bounded servers above.
[mcp_servers.node_repl]
enabled = false

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
enabled = false

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
enabled = false

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
enabled = false

# Keep the claude-mem search declaration disabled alongside its plugin and
# hooks so no worker, MCP transport, or port-37700 service is spawned.
[plugins."claude-mem@claude-mem-local".mcp_servers."mcp-search"]
enabled = false
default_tools_approval_mode = "approve"

# Disable the installed Playwright plugin's unpinned bundled MCP. The pinned
# child transport above is started only by the RAOS Pro orchestrator.
[plugins."playwright@claude-plugins-official".mcp_servers.playwright]
enabled = false

# Also disable the plugin-scoped declaration for clarity. The complete direct
# declaration above is required by Codex 0.146 for a valid project override.
[plugins."github@openai-curated".mcp_servers.github]
enabled = false

# Codex 0.146 keeps plugin install/on-off state user-scoped. Disable the
# out-of-scope plugins' bundled apps in this project without uninstalling or
# changing their global state.
[apps._default]
enabled = false

# GitHub is the sole enabled external app. Repository development writes are
# covered by the standing authorization in the root AGENTS.md.
[apps.connector_76869538009648d5b282a4bb21c3d157]
enabled = true
default_tools_approval_mode = "auto"

# Slack
[apps.asdk_app_69a1d78e929881919bba0dbda1f6436d]
enabled = false

# Google Drive
[apps.connector_5f3c8c41a1e54ad7a76272c89e2554fa]
enabled = false

# Canva
[apps.connector_68df33b1a2d081918778431a9cfca8ba]
enabled = false

# Hugging Face
[apps.asdk_app_6939e86417648191b7bda087d872685b]
enabled = false
