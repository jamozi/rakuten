<svg xmlns="http://www.w3.org/2000/svg" width="390" height="7260" viewBox="0 0 390 7260" role="img" aria-labelledby="title desc">
  <title id="title">暮らしのしるべ 比較記事テンプレート Editorial V2 モバイル</title>
  <desc id="desc">写真、縦組みのリズム、罫線、脚注を中心にしたモバイル編集デザイン。</desc>
  <defs>
    <clipPath id="heroCrop"><rect width="350" height="360"/></clipPath>
    <clipPath id="productCrop"><rect width="350" height="246"/></clipPath>
    <style>
      .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
      .serif{font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif}
      .ink{fill:#17243F}.muted{fill:#59635F}.indigo{fill:#24365F}.clay{fill:#8A3924}.paper{fill:#F7F2E9}.white{fill:#FFFDF8}
      .kicker{font-size:10px;font-weight:700;letter-spacing:1.8px}.body{font-size:15px}.small{font-size:13px}.tiny{font-size:10px}.label{font-size:12px;font-weight:700;letter-spacing:.4px}
      .h2{font-size:29px;font-weight:600}.h3{font-size:22px;font-weight:600}.rule{stroke:#8D9994;stroke-width:1}.hair{stroke:#CBD2CE;stroke-width:1}
    </style>
  </defs>
  <rect width="390" height="7260" fill="#F7F2E9"/>

  <g id="Header">
    <rect width="390" height="62" fill="#F7F2E9"/><line x1="20" y1="61.5" x2="370" y2="61.5" class="rule"/>
    <g transform="translate(20 15)"><rect width="30" height="30" rx="4" fill="#17243F"/><path d="M8 8h14v2.4H8zm0 6h11v2.4H8zm0 6h8v2.4H8z" fill="#F7F2E9"/><text class="serif ink" x="41" y="22" font-size="16" font-weight="600" letter-spacing="1.4">暮らしのしるべ</text><g transform="translate(320 5)" stroke="#17243F" stroke-width="1.5"><line x1="0" y1="2" x2="16" y2="2"/><line x1="0" y1="8" x2="16" y2="8"/><line x1="0" y1="14" x2="16" y2="14"/></g></g>
  </g>

  <g id="Hero" transform="translate(20 0)">
    <g transform="translate(0 92)"><text class="sans clay kicker" x="0" y="12">FIELD GUIDE　—　PORTABLE POWER</text><line x1="0" y1="34" x2="350" y2="34" class="hair"/></g>
    <g transform="translate(0 148)">
      <text class="serif ink" x="0" y="42" font-size="36" font-weight="600"><tspan x="0">ポータブル電源を、</tspan><tspan x="0" dy="50">容量より先に</tspan><tspan x="0" dy="50">暮らしから選ぶ。</tspan></text>
      <text class="sans muted body" x="0" y="204"><tspan x="0">停電への備えと、週末の持ち出し。</tspan><tspan x="0" dy="26">必要な容量も、許容できる重さも</tspan><tspan x="0" dy="26">同じではありません。</tspan></text>
    </g>
    <g transform="translate(0 448)" clip-path="url(#heroCrop)"><image href="kurashinoshirube-editorial-hero-v2.png" x="-105" y="-8" width="540" height="360" preserveAspectRatio="xMidYMid slice"/></g>
    <g transform="translate(0 824)"><text class="sans muted tiny" x="0" y="12">レイアウト検討用写真。公開時は実商品画像へ差し替え。</text><text class="sans muted tiny" x="350" y="12" text-anchor="end">2026.08.29</text></g>
  </g>

  <g id="Lead" transform="translate(20 910)">
    <text class="sans clay kicker" x="0" y="12">01　INTRODUCTION</text><text class="serif ink h2" x="0" y="58"><tspan x="0">「大きいほど安心」</tspan><tspan x="0" dy="40">とは限りません。</tspan></text>
    <text class="sans ink body" x="0" y="166"><tspan x="0">同じ売り場に並ぶ2つのモデルを、</tspan><tspan x="0" dy="27">公式仕様、保証、持ち運びやすさの順に</tspan><tspan x="0" dy="27">見ていきます。</tspan></text>
    <line x1="0" y1="270" x2="350" y2="270" class="rule"/><text class="serif indigo" x="0" y="314" font-size="20" font-weight="600"><tspan x="0">先に決めることは、使いたい家電と、</tspan><tspan x="0" dy="31">保管場所からの距離。</tspan></text><line x1="0" y1="376" x2="350" y2="376" class="rule"/>
    <g transform="translate(0 406)"><text class="sans muted tiny" x="0" y="10">執筆</text><text class="sans ink small" x="0" y="31" font-weight="700">暮らしのしるべ編集部</text><text class="sans muted tiny" x="220" y="10">読了</text><text class="sans ink small" x="220" y="31" font-weight="700">約8分</text></g>
  </g>

  <g id="Disclosure" transform="translate(20 1410)">
    <line x1="0" y1="0" x2="350" y2="0" class="hair"/><text class="sans clay label" x="0" y="32">広告について</text><text class="sans muted small" x="0" y="62"><tspan x="0">楽天市場へのアフィリエイトリンクを含みます。</tspan><tspan x="0" dy="23">掲載順は、報酬条件ではなく選定基準に基づきます。</tspan></text><line x1="0" y1="108" x2="350" y2="108" class="hair"/>
  </g>

  <g id="DecisionSummary" transform="translate(20 1594)">
    <text class="sans clay kicker" x="0" y="12">02　THE SHORT ANSWER</text><text class="serif ink h2" x="0" y="58">条件ごとの、短い結論。</text>
    <g transform="translate(0 100)"><line x1="0" y1="0" x2="350" y2="0" class="rule"/><text class="serif clay" x="0" y="58" font-size="42">01</text><text class="sans muted label" x="82" y="32">持ち運ぶ回数が多い</text><text class="serif ink h3" x="82" y="68">モデルAを先頭に。</text><text class="sans muted small" x="82" y="98"><tspan x="82">軽さと収納しやすさを優先。</tspan><tspan x="82" dy="22">容量は用途を絞って選びます。</tspan></text><line x1="0" y1="150" x2="350" y2="150" class="hair"/>
      <g transform="translate(0 180)"><text class="serif clay" x="0" y="58" font-size="42">02</text><text class="sans muted label" x="82" y="32">停電時の余裕を取りたい</text><text class="serif ink h3" x="82" y="68">モデルBを先頭に。</text><text class="sans muted small" x="82" y="98"><tspan x="82">容量と出力の余裕を優先。</tspan><tspan x="82" dy="22">据え置きを前提に選びます。</tspan></text></g><line x1="0" y1="330" x2="350" y2="330" class="rule"/>
    </g>
  </g>

  <g id="IntendedReader" transform="translate(20 2100)">
    <text class="sans clay kicker" x="0" y="12">03　WHO THIS IS FOR</text><text class="serif ink h2" x="0" y="58"><tspan x="0">役立つ人、</tspan><tspan x="0" dy="40">役立たない人。</tspan></text>
    <g transform="translate(0 150)"><text class="serif indigo h3" x="0" y="24">役立つ人</text><line x1="0" y1="48" x2="350" y2="48" class="rule"/><g class="sans ink small" transform="translate(0 78)"><text x="0" y="14">一　家庭の備えや持ち出しに使う</text><text x="0" y="52">二　容量・出力・重量を同じ基準で見る</text><text x="0" y="90">三　最安値より、用途との相性を優先する</text></g></g>
    <g transform="translate(0 334)"><text class="serif clay h3" x="0" y="24">役立たない人</text><line x1="0" y1="48" x2="350" y2="48" class="rule"/><g class="sans ink small" transform="translate(0 78)"><text x="0" y="14">一　業務用・医療用途の電源を探している</text><text x="0" y="52">二　第三者の実機試験だけで選びたい</text><text x="0" y="90">三　現在の最安値だけを知りたい</text></g></g>
  </g>

  <g id="Methodology" transform="translate(20 2684)">
    <text class="sans clay kicker" x="0" y="12">04　HOW WE COMPARED</text><text class="serif ink h2" x="0" y="58"><tspan x="0">選ぶ前に、</tspan><tspan x="0" dy="40">方法を公開する。</tspan></text>
    <text class="sans muted small" x="0" y="154"><tspan x="0">比較日は2026年8月29日。</tspan><tspan x="0" dy="23">価格と在庫は遷移先で確認します。</tspan></text>
    <g transform="translate(0 222)"><line x1="0" y1="0" x2="350" y2="0" class="rule"/>
      <g transform="translate(0 22)"><text class="serif clay" x="0" y="30" font-size="28">A</text><text class="sans ink label" x="52" y="18">候補に含めた条件</text><text class="sans muted small" x="52" y="47"><tspan x="52">国内流通 / 公式仕様 /</tspan><tspan x="52" dy="21">保証窓口を確認できる</tspan></text></g><line x1="52" y1="98" x2="350" y2="98" class="hair"/>
      <g transform="translate(0 120)"><text class="serif clay" x="0" y="30" font-size="28">B</text><text class="sans ink label" x="52" y="18">比較した軸</text><text class="sans muted small" x="52" y="47">容量 / 出力 / 重量 / 保証 / 不明値</text></g><line x1="52" y1="190" x2="350" y2="190" class="hair"/>
      <g transform="translate(0 212)"><text class="serif clay" x="0" y="30" font-size="28">C</text><text class="sans ink label" x="52" y="18">不明値の扱い</text><text class="sans muted small" x="52" y="47">推測しない / 空欄にしない</text></g><line x1="0" y1="282" x2="350" y2="282" class="rule"/>
    </g>
  </g>

  <g id="ComparisonCards" transform="translate(20 3296)">
    <text class="sans clay kicker" x="0" y="12">05　AT A GLANCE</text><text class="serif ink h2" x="0" y="58">違いを、一枚で見る。</text>
    <g transform="translate(0 104)"><line x1="0" y1="0" x2="350" y2="0" stroke="#17243F" stroke-width="2"/>
      <text class="sans ink label" x="0" y="38">MODEL A</text><text class="sans muted small" x="350" y="38" text-anchor="end">運ぶことを優先</text><line x1="0" y1="62" x2="350" y2="62" class="rule"/>
      <g class="sans small" transform="translate(0 86)"><text class="muted" x="0" y="14">容量</text><text class="ink" x="148" y="14">512Wh</text><line x1="0" y1="36" x2="350" y2="36" class="hair"/><text class="muted" x="0" y="68">定格出力</text><text class="ink" x="148" y="68">600W</text><line x1="0" y1="90" x2="350" y2="90" class="hair"/><text class="muted" x="0" y="122">重量</text><text class="ink" x="148" y="122">約6.1kg</text><line x1="0" y1="144" x2="350" y2="144" class="hair"/><text class="muted" x="0" y="176">静音性</text><text class="clay" x="148" y="176" font-weight="700">未確認</text></g>
      <g transform="translate(0 310)"><text class="sans ink label" x="0" y="38">MODEL B</text><text class="sans muted small" x="350" y="38" text-anchor="end">容量と出力を優先</text><line x1="0" y1="62" x2="350" y2="62" class="rule"/><g class="sans small" transform="translate(0 86)"><text class="muted" x="0" y="14">容量</text><text class="ink" x="148" y="14">768Wh</text><line x1="0" y1="36" x2="350" y2="36" class="hair"/><text class="muted" x="0" y="68">定格出力</text><text class="ink" x="148" y="68">1000W</text><line x1="0" y1="90" x2="350" y2="90" class="hair"/><text class="muted" x="0" y="122">重量</text><text class="ink" x="148" y="122">約8.4kg</text><line x1="0" y1="144" x2="350" y2="144" class="hair"/><text class="muted" x="0" y="176">静音性</text><text class="ink" x="148" y="176">公式値あり</text></g></g>
      <line x1="0" y1="544" x2="350" y2="544" class="rule"/><text class="sans muted tiny" x="0" y="572">不明値は推測せず、そのまま表示します。</text>
    </g>
  </g>

  <g id="ProductProfiles" transform="translate(20 4090)">
    <text class="sans clay kicker" x="0" y="12">06　TWO PORTRAITS</text><text class="serif ink h2" x="0" y="58"><tspan x="0">二つの道具を、</tspan><tspan x="0" dy="40">暮らしの目線で読む。</tspan></text>
    <g id="ProductProfile/A" transform="translate(0 144)">
      <g clip-path="url(#productCrop)"><image href="kurashinoshirube-editorial-hero-v2.png" x="-70" y="-34" width="490" height="326" preserveAspectRatio="xMidYMid slice"/></g>
      <text class="sans clay kicker" x="0" y="286">MODEL A　/　PORTABLE</text><text class="serif ink h3" x="0" y="326">運ぶことを、負担にしない。</text>
      <text class="sans muted small" x="0" y="360"><tspan x="0">強みは、数字の大きさではなく持ち出せること。</tspan><tspan x="0" dy="23">日常の延長で扱いたい人に合います。</tspan></text>
      <line x1="0" y1="426" x2="350" y2="426" class="hair"/><text class="sans muted label" x="0" y="458">向く人</text><text class="sans ink small" x="76" y="458">持ち運ぶ機会が多い</text><text class="sans muted label" x="0" y="492">向かない人</text><text class="sans ink small" x="76" y="492">高出力家電を長く使う</text>
      <text class="sans muted tiny" x="0" y="536">価格・在庫は遷移先で確認。アフィリエイトリンクを含みます。</text><rect x="0" y="554" width="300" height="46" fill="none" stroke="#8A3924" stroke-width="1.5"/><text class="sans clay" x="18" y="583" font-size="14" font-weight="700">楽天市場で価格・在庫を見る　→</text>
    </g>
    <line x1="0" y1="784" x2="350" y2="784" class="rule"/>
    <g id="ProductProfile/B" transform="translate(0 838)">
      <g clip-path="url(#productCrop)"><image href="kurashinoshirube-editorial-hero-v2.png" x="-188" y="-30" width="490" height="326" preserveAspectRatio="xMidYMid slice"/></g>
      <text class="sans clay kicker" x="0" y="286">MODEL B　/　CAPACITY</text><text class="serif ink h3" x="0" y="326">備えに、ひとつ余白を持つ。</text>
      <text class="sans muted small" x="0" y="360"><tspan x="0">容量と出力の余裕が、使える家電の幅になる。</tspan><tspan x="0" dy="23">据え置きなら、重さは弱点になりにくい。</tspan></text>
      <line x1="0" y1="426" x2="350" y2="426" class="hair"/><text class="sans muted label" x="0" y="458">向く人</text><text class="sans ink small" x="76" y="458">容量と出力を優先する</text><text class="sans muted label" x="0" y="492">向かない人</text><text class="sans ink small" x="76" y="492">階段や徒歩で運ぶ</text>
      <text class="sans muted tiny" x="0" y="536">価格・在庫は遷移先で確認。アフィリエイトリンクを含みます。</text><rect x="0" y="554" width="300" height="46" fill="none" stroke="#8A3924" stroke-width="1.5"/><text class="sans clay" x="18" y="583" font-size="14" font-weight="700">楽天市場で価格・在庫を見る　→</text>
    </g>
  </g>

  <g id="SelectionRationale" transform="translate(20 5660)">
    <line x1="0" y1="0" x2="350" y2="0" class="rule"/><text class="sans clay kicker" x="0" y="48">07　EDITOR'S NOTE</text><text class="serif ink h2" x="0" y="96"><tspan x="0">なぜ、この二つを</tspan><tspan x="0" dy="40">残したのか。</tspan></text>
    <text class="sans ink body" x="0" y="198"><tspan x="0">用途の違いを説明できない商品を並べることは、</tspan><tspan x="0" dy="27">比較ではなく陳列です。</tspan></text>
    <text class="serif indigo" x="0" y="292" font-size="22" font-weight="600"><tspan x="0">モデルAは「運べること」、</tspan><tspan x="0" dy="34">モデルBは「余裕を持てること」が、</tspan><tspan x="0" dy="34">選ぶ理由になります。</tspan></text>
    <text class="sans muted small" x="0" y="420"><tspan x="0">人気順位、報酬率、販売者の広告表現は</tspan><tspan x="0" dy="23">選定根拠に含めていません。</tspan></text>
  </g>

  <g id="Sources" transform="translate(20 6220)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#17243F" stroke-width="2"/><text class="sans clay kicker" x="0" y="48">NOTES &amp; SOURCES</text><text class="serif ink h2" x="0" y="96">出典と確認記録。</text>
    <g class="sans" transform="translate(0 138)">
      <text class="serif clay" x="0" y="26" font-size="22">1</text><text class="ink" x="42" y="18" font-size="14" font-weight="700">メーカー公式　モデルA 製品仕様</text><text class="muted tiny" x="42" y="42">容量・出力・重量・保証 / 2026.08.29</text><line x1="42" y1="68" x2="350" y2="68" class="hair"/>
      <g transform="translate(0 92)"><text class="serif clay" x="0" y="26" font-size="22">2</text><text class="ink" x="42" y="18" font-size="14" font-weight="700">メーカー公式　モデルB 製品仕様</text><text class="muted tiny" x="42" y="42">容量・出力・重量・保証 / 2026.08.29</text></g><line x1="42" y1="160" x2="350" y2="160" class="hair"/>
      <g transform="translate(0 184)"><text class="serif clay" x="0" y="26" font-size="22">3</text><text class="ink" x="42" y="18" font-size="14" font-weight="700">楽天市場　各販売ページ</text><text class="muted tiny" x="42" y="42">価格・在庫・販売者 / 購入時に再確認</text></g><line x1="42" y1="252" x2="350" y2="252" class="hair"/>
      <text class="sans muted tiny" x="42" y="292">更新履歴　2026.08.29 初回公開</text><text class="sans indigo small" x="42" y="330" font-weight="700">編集方針と情報更新の基準　→</text>
    </g>
  </g>

  <g id="Footer" transform="translate(0 6860)"><rect width="390" height="400" fill="#17243F"/><g transform="translate(20 56)"><text class="serif" x="0" y="28" fill="#F7F2E9" font-size="21" font-weight="600" letter-spacing="1.5">暮らしのしるべ</text><text class="sans" x="0" y="64" fill="#CBD2CE" font-size="12">選ぶ前に、条件と根拠を整理する。</text><line x1="0" y1="104" x2="350" y2="104" stroke="#F7F2E9" stroke-opacity=".25"/><g class="sans" fill="#F7F2E9" font-size="12" font-weight="700" transform="translate(0 140)"><text x="0" y="14">編集方針</text><text x="110" y="14">広告掲載方針</text><text x="238" y="14">出典について</text><text x="0" y="58">お問い合わせ</text></g><text class="sans" x="0" y="252" fill="#8D9994" font-size="10">© 暮らしのしるべ</text></g></g>
</svg>
