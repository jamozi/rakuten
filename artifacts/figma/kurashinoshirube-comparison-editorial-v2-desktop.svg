<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="6240" viewBox="0 0 1440 6240" role="img" aria-labelledby="title desc">
  <title id="title">暮らしのしるべ 比較記事テンプレート Editorial V2 デスクトップ</title>
  <desc id="desc">写真と組版、余白と脚注を中心にした人間的な編集デザイン。商品カード、比較表、選定根拠、向く人と向かない人、楽天CTA、出典を含む。</desc>
  <defs>
    <clipPath id="heroCrop"><rect x="0" y="0" width="1200" height="590"/></clipPath>
    <clipPath id="productCropA"><rect x="0" y="0" width="452" height="330"/></clipPath>
    <clipPath id="productCropB"><rect x="0" y="0" width="452" height="330"/></clipPath>
    <style>
      .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
      .serif{font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif}
      .ink{fill:#17243F}.muted{fill:#59635F}.indigo{fill:#24365F}.clay{fill:#8A3924}.paper{fill:#F7F2E9}.white{fill:#FFFDF8}
      .kicker{font-size:12px;font-weight:700;letter-spacing:2.6px}.body{font-size:18px}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:13px;font-weight:700;letter-spacing:.6px}
      .h2{font-size:41px;font-weight:600;letter-spacing:.4px}.h3{font-size:27px;font-weight:600}.rule{stroke:#8D9994;stroke-width:1}.hair{stroke:#CBD2CE;stroke-width:1}
    </style>
  </defs>

  <rect width="1440" height="6240" fill="#F7F2E9"/>

  <g id="Header">
    <rect width="1440" height="72" fill="#F7F2E9"/>
    <line x1="80" y1="71.5" x2="1360" y2="71.5" class="rule"/>
    <g transform="translate(80 18)">
      <rect width="34" height="34" rx="4" fill="#17243F"/>
      <path d="M9 9h16v2.7H9zm0 7h12v2.7H9zm0 7h9v2.7H9z" fill="#F7F2E9"/>
      <text class="serif ink" x="48" y="25" font-size="20" font-weight="600" letter-spacing="2.4">暮らしのしるべ</text>
    </g>
    <g class="sans ink" transform="translate(1004 28)" font-size="13" font-weight="700">
      <text x="0" y="14">選び方</text><text x="84" y="14">比較記事</text><text x="180" y="14">編集方針</text><text x="280" y="14">検索　⌕</text>
    </g>
  </g>

  <g id="Hero" transform="translate(120 0)">
    <g transform="translate(0 116)">
      <text class="sans clay kicker" x="0" y="14">FIELD GUIDE　—　PORTABLE POWER</text>
      <text class="sans muted tiny" x="1010" y="14">2026.08.29 UPDATED</text>
      <line x1="0" y1="40" x2="1200" y2="40" class="hair"/>
    </g>
    <g transform="translate(0 190)">
      <text class="serif ink" x="0" y="70" font-size="66" font-weight="600" letter-spacing="1">
        <tspan x="0">ポータブル電源を、</tspan><tspan x="0" dy="82">容量より先に</tspan><tspan x="0" dy="82">暮らしから選ぶ。</tspan>
      </text>
      <g transform="translate(852 44)">
        <line x1="0" y1="0" x2="0" y2="160" stroke="#8A3924" stroke-width="2"/>
        <text class="sans muted body" x="28" y="16">
          <tspan x="28">停電への備えと、週末の持ち出し。</tspan><tspan x="28" dy="31">必要な容量も、許容できる重さも</tspan><tspan x="28" dy="31">同じではありません。</tspan>
        </text>
      </g>
    </g>
    <g id="HeroImage" transform="translate(0 474)" clip-path="url(#heroCrop)">
      <image href="kurashinoshirube-editorial-hero-v2.png" x="0" y="-102" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <g transform="translate(0 1086)">
      <text class="sans muted tiny" x="0" y="14">写真はレイアウト検討用。公開時は比較対象の識別可能な実商品画像へ差し替えます。</text>
      <text class="sans muted tiny" x="1090" y="14">PHOTO / EDITORIAL DESK</text>
    </g>
  </g>

  <g id="Lead" transform="translate(120 1190)">
    <g>
      <text class="sans clay kicker" x="0" y="14">01　INTRODUCTION</text>
      <text class="serif ink h2" x="0" y="72"><tspan x="0">「大きいほど安心」</tspan><tspan x="0" dy="58">とは限りません。</tspan></text>
    </g>
    <g transform="translate(470 0)">
      <text class="sans ink body" x="0" y="16">
        <tspan x="0">この記事では、同じ売り場に並ぶ2つのモデルを、公式仕様、保証、</tspan><tspan x="0" dy="34">持ち運びやすさの順に見ていきます。価格の安さや人気順ではなく、</tspan><tspan x="0" dy="34">使う場所と運ぶ頻度が、最初の分かれ目になります。</tspan>
      </text>
      <g transform="translate(0 146)">
        <line x1="0" y1="0" x2="730" y2="0" class="rule"/>
        <text class="serif indigo" x="0" y="53" font-size="25" font-weight="600">先に決めることは、使いたい家電と、保管場所からの距離。</text>
        <line x1="0" y1="84" x2="730" y2="84" class="rule"/>
      </g>
      <g transform="translate(0 266)">
        <text class="sans muted tiny" x="0" y="14">執筆</text><text class="sans ink small" x="0" y="39" font-weight="700">暮らしのしるべ編集部</text>
        <text class="sans muted tiny" x="230" y="14">確認</text><text class="sans ink small" x="230" y="39" font-weight="700">公式仕様 / 保証条件 / 国内流通</text>
        <text class="sans muted tiny" x="560" y="14">読了</text><text class="sans ink small" x="560" y="39" font-weight="700">約8分</text>
      </g>
    </g>
  </g>

  <g id="Disclosure" transform="translate(590 1570)">
    <line x1="0" y1="0" x2="730" y2="0" class="hair"/>
    <text class="sans clay label" x="0" y="35">広告について</text>
    <text class="sans muted small" x="138" y="35"><tspan x="138">楽天市場へのアフィリエイトリンクを含みます。</tspan><tspan x="138" dy="25">掲載順と評価は、報酬条件ではなく公開した選定基準に基づきます。</tspan></text>
    <line x1="0" y1="86" x2="730" y2="86" class="hair"/>
  </g>

  <g id="DecisionSummary" transform="translate(120 1748)">
    <text class="sans clay kicker" x="0" y="14">02　THE SHORT ANSWER</text>
    <text class="serif ink h2" x="0" y="74">条件ごとの、短い結論。</text>
    <g transform="translate(0 130)">
      <line x1="0" y1="0" x2="1200" y2="0" class="rule"/>
      <g transform="translate(0 34)">
        <text class="serif clay" x="0" y="58" font-size="52" font-weight="600">01</text>
        <text class="sans muted label" x="126" y="24">持ち運ぶ回数が多い</text>
        <text class="serif ink h3" x="126" y="62">モデルAを候補の先頭に。</text>
        <text class="sans muted small" x="650" y="24"><tspan x="650">約6.1kg。車への積み下ろしや、</tspan><tspan x="650" dy="26">室内の移動を負担にしにくい。</tspan></text>
        <text class="sans indigo small" x="1072" y="54" font-weight="700">詳細へ　↘</text>
      </g>
      <line x1="0" y1="126" x2="1200" y2="126" class="hair"/>
      <g transform="translate(0 160)">
        <text class="serif clay" x="0" y="58" font-size="52" font-weight="600">02</text>
        <text class="sans muted label" x="126" y="24">停電時の余裕を取りたい</text>
        <text class="serif ink h3" x="126" y="62">モデルBを候補の先頭に。</text>
        <text class="sans muted small" x="650" y="24"><tspan x="650">768Wh / 1000W。重さよりも、</tspan><tspan x="650" dy="26">使える機器の幅を優先する人へ。</tspan></text>
        <text class="sans indigo small" x="1072" y="54" font-weight="700">詳細へ　↘</text>
      </g>
      <line x1="0" y1="252" x2="1200" y2="252" class="rule"/>
    </g>
  </g>

  <g id="IntendedReader" transform="translate(120 2202)">
    <text class="sans clay kicker" x="0" y="14">03　WHO THIS IS FOR</text>
    <text class="serif ink h2" x="0" y="74">この記事が役立つ人、役立たない人。</text>
    <g transform="translate(0 128)">
      <g>
        <text class="serif indigo h3" x="0" y="28">役立つ人</text>
        <line x1="0" y1="54" x2="570" y2="54" class="rule"/>
        <g class="sans ink body" transform="translate(0 92)">
          <text x="0" y="18">一　国内で購入し、家庭の備えに使う</text>
          <text x="0" y="68">二　容量・出力・重量を同じ基準で見たい</text>
          <text x="0" y="118">三　最安値より、使い方との相性を優先する</text>
        </g>
      </g>
      <g transform="translate(630 0)">
        <text class="serif clay h3" x="0" y="28">役立たない人</text>
        <line x1="0" y1="54" x2="570" y2="54" class="rule"/>
        <g class="sans ink body" transform="translate(0 92)">
          <text x="0" y="18">一　業務用・医療用途の電源を探している</text>
          <text x="0" y="68">二　第三者の実機試験だけで選びたい</text>
          <text x="0" y="118">三　いま現在の最安値だけを知りたい</text>
        </g>
      </g>
      <line x1="600" y1="0" x2="600" y2="224" class="hair"/>
    </g>
  </g>

  <g id="Methodology" transform="translate(120 2660)">
    <g>
      <text class="sans clay kicker" x="0" y="14">04　HOW WE COMPARED</text>
      <text class="serif ink h2" x="0" y="74"><tspan x="0">選ぶ前に、</tspan><tspan x="0" dy="57">方法を公開する。</tspan></text>
      <text class="sans muted small" x="0" y="210"><tspan x="0">比較日は2026年8月29日。</tspan><tspan x="0" dy="26">価格と在庫は固定値にせず、</tspan><tspan x="0" dy="26">遷移先での確認を前提にします。</tspan></text>
    </g>
    <g transform="translate(470 0)">
      <line x1="0" y1="0" x2="730" y2="0" class="rule"/>
      <g transform="translate(0 30)"><text class="serif clay" x="0" y="41" font-size="34">A</text><text class="sans ink" x="74" y="24" font-size="17" font-weight="700">候補に含めた条件</text><text class="sans muted small" x="288" y="24">国内流通 / 公式仕様 / 保証窓口を確認できる</text></g>
      <line x1="0" y1="96" x2="730" y2="96" class="hair"/>
      <g transform="translate(0 126)"><text class="serif clay" x="0" y="41" font-size="34">B</text><text class="sans ink" x="74" y="24" font-size="17" font-weight="700">比較した軸</text><text class="sans muted small" x="288" y="24">容量 / 定格出力 / 重量 / 保証 / 不明値</text></g>
      <line x1="0" y1="192" x2="730" y2="192" class="hair"/>
      <g transform="translate(0 222)"><text class="serif clay" x="0" y="41" font-size="34">C</text><text class="sans ink" x="74" y="24" font-size="17" font-weight="700">除外した条件</text><text class="sans muted small" x="288" y="24">商品同定が未解決 / 保証窓口を確認できない</text></g>
      <line x1="0" y1="288" x2="730" y2="288" class="hair"/>
      <g transform="translate(0 318)"><text class="serif clay" x="0" y="41" font-size="34">D</text><text class="sans ink" x="74" y="24" font-size="17" font-weight="700">不明値の扱い</text><text class="sans muted small" x="288" y="24">推測しない / 空欄にしない / 確認日を残す</text></g>
      <line x1="0" y1="384" x2="730" y2="384" class="rule"/>
    </g>
  </g>

  <g id="ComparisonTable" transform="translate(120 3190)">
    <text class="sans clay kicker" x="0" y="14">05　AT A GLANCE</text>
    <text class="serif ink h2" x="0" y="74">違いを、一枚で見る。</text>
    <text class="sans muted small" x="1200" y="70" text-anchor="end">差がある項目のみ、細い陶土色の罫線で示します。</text>
    <g transform="translate(0 126)">
      <line x1="0" y1="0" x2="1200" y2="0" stroke="#17243F" stroke-width="2"/>
      <g class="sans ink" font-size="16" font-weight="700">
        <text x="0" y="52">比較軸</text><text x="350" y="52">MODEL A</text><text x="780" y="52">MODEL B</text><text x="1168" y="52" text-anchor="end">判断の手がかり</text>
      </g>
      <line x1="0" y1="82" x2="1200" y2="82" class="rule"/>
      <g class="sans" font-size="16">
        <g transform="translate(0 82)"><text class="ink" x="0" y="48" font-weight="700">容量</text><text class="ink" x="350" y="48">512Wh</text><text class="ink" x="780" y="48">768Wh</text><text class="muted small" x="1168" y="48" text-anchor="end">長時間の備えはB</text><line x1="350" y1="76" x2="1158" y2="76" stroke="#8A3924" stroke-width="2"/><line x1="0" y1="82" x2="1200" y2="82" class="hair"/></g>
        <g transform="translate(0 164)"><text class="ink" x="0" y="48" font-weight="700">定格出力</text><text class="ink" x="350" y="48">600W</text><text class="ink" x="780" y="48">1000W</text><text class="muted small" x="1168" y="48" text-anchor="end">使う家電の幅はB</text><line x1="350" y1="76" x2="1158" y2="76" stroke="#8A3924" stroke-width="2"/><line x1="0" y1="82" x2="1200" y2="82" class="hair"/></g>
        <g transform="translate(0 246)"><text class="ink" x="0" y="48" font-weight="700">重量</text><text class="ink" x="350" y="48">約6.1kg</text><text class="ink" x="780" y="48">約8.4kg</text><text class="muted small" x="1168" y="48" text-anchor="end">持ち運びはA</text><line x1="350" y1="76" x2="1158" y2="76" stroke="#8A3924" stroke-width="2"/><line x1="0" y1="82" x2="1200" y2="82" class="hair"/></g>
        <g transform="translate(0 328)"><text class="ink" x="0" y="48" font-weight="700">保証</text><text class="ink" x="350" y="48">5年*</text><text class="ink" x="780" y="48">5年*</text><text class="muted small" x="1168" y="48" text-anchor="end">登録条件を確認</text><line x1="0" y1="82" x2="1200" y2="82" class="hair"/></g>
        <g transform="translate(0 410)"><text class="ink" x="0" y="48" font-weight="700">静音性</text><text class="clay" x="350" y="48" font-weight="700">未確認</text><text class="ink" x="780" y="48">公式値あり</text><text class="muted small" x="1168" y="48" text-anchor="end">不明値は推測しない</text><line x1="0" y1="82" x2="1200" y2="82" class="rule"/></g>
      </g>
      <text class="sans muted tiny" x="0" y="532">* メーカー登録などの条件があります。値の出典と確認日は記事末尾に掲載。</text>
    </g>
  </g>

  <g id="ProductProfiles" transform="translate(120 3920)">
    <text class="sans clay kicker" x="0" y="14">06　TWO PORTRAITS</text>
    <text class="serif ink h2" x="0" y="74">二つの道具を、暮らしの目線で読む。</text>

    <g id="ProductProfile/A" transform="translate(0 132)">
      <g clip-path="url(#productCropA)">
        <image href="kurashinoshirube-editorial-hero-v2.png" x="-180" y="-168" width="900" height="600" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <g transform="translate(520 0)">
        <text class="sans clay kicker" x="0" y="14">MODEL A　/　PORTABLE</text>
        <text class="serif ink" x="0" y="68" font-size="37" font-weight="600">運ぶことを、負担にしない。</text>
        <text class="sans muted body" x="0" y="112"><tspan x="0">強みは、数字の大きさではなく、持ち出せること。</tspan><tspan x="0" dy="32">容量を欲張らず、日常の延長で扱いたい人に合います。</tspan></text>
        <line x1="0" y1="190" x2="680" y2="190" class="hair"/>
        <g class="sans small" transform="translate(0 224)">
          <text class="muted" x="0" y="16">向く人</text><text class="ink" x="110" y="16">車や家の中で持ち運ぶ機会が多い</text>
          <text class="muted" x="0" y="56">向かない人</text><text class="ink" x="110" y="56">高出力家電を同時に長く使いたい</text>
        </g>
        <g transform="translate(0 314)">
          <text class="sans muted tiny" x="0" y="0">価格・在庫は遷移先で確認してください。アフィリエイトリンクを含みます。</text>
          <rect x="0" y="22" width="304" height="48" fill="none" stroke="#8A3924" stroke-width="1.5"/>
          <text class="sans clay" x="22" y="53" font-size="15" font-weight="700">楽天市場で価格・在庫を見る　→</text>
        </g>
      </g>
    </g>

    <line x1="0" y1="592" x2="1200" y2="592" class="rule"/>

    <g id="ProductProfile/B" transform="translate(0 660)">
      <g transform="translate(0 0)">
        <text class="sans clay kicker" x="0" y="14">MODEL B　/　CAPACITY</text>
        <text class="serif ink" x="0" y="68" font-size="37" font-weight="600">備えに、ひとつ余白を持つ。</text>
        <text class="sans muted body" x="0" y="112"><tspan x="0">容量と出力の余裕が、使える家電の幅につながります。</tspan><tspan x="0" dy="32">据え置きを前提にできるなら、重さは弱点になりにくい。</tspan></text>
        <line x1="0" y1="190" x2="680" y2="190" class="hair"/>
        <g class="sans small" transform="translate(0 224)">
          <text class="muted" x="0" y="16">向く人</text><text class="ink" x="110" y="16">家に据え置き、容量と出力を優先する</text>
          <text class="muted" x="0" y="56">向かない人</text><text class="ink" x="110" y="56">階段や徒歩で持ち運ぶ機会が多い</text>
        </g>
        <g transform="translate(0 314)">
          <text class="sans muted tiny" x="0" y="0">価格・在庫は遷移先で確認してください。アフィリエイトリンクを含みます。</text>
          <rect x="0" y="22" width="304" height="48" fill="none" stroke="#8A3924" stroke-width="1.5"/>
          <text class="sans clay" x="22" y="53" font-size="15" font-weight="700">楽天市場で価格・在庫を見る　→</text>
        </g>
      </g>
      <g transform="translate(748 0)" clip-path="url(#productCropB)">
        <image href="kurashinoshirube-editorial-hero-v2.png" x="-498" y="-130" width="900" height="600" preserveAspectRatio="xMidYMid slice"/>
      </g>
    </g>
  </g>

  <g id="SelectionRationale" transform="translate(120 5050)">
    <line x1="0" y1="0" x2="1200" y2="0" class="rule"/>
    <text class="sans clay kicker" x="0" y="56">07　EDITOR'S NOTE</text>
    <text class="serif ink h2" x="0" y="116">なぜ、この二つを残したのか。</text>
    <g transform="translate(470 42)">
      <text class="sans ink body" x="0" y="16"><tspan x="0">候補を増やすほど、選択肢は豊かに見えます。</tspan><tspan x="0" dy="34">しかし、用途の違いを説明できない商品を並べることは、</tspan><tspan x="0" dy="34">比較ではなく陳列です。</tspan></text>
      <text class="serif indigo" x="0" y="176" font-size="29" font-weight="600"><tspan x="0">モデルAは「運べること」、モデルBは</tspan><tspan x="0" dy="42">「余裕を持てること」が、選ぶ理由になります。</tspan></text>
      <text class="sans muted small" x="0" y="280"><tspan x="0">比較対象は、国内流通、公式仕様、保証窓口を確認できる製品から選定。</tspan><tspan x="0" dy="26">人気順位、報酬率、販売者の広告表現は選定根拠に含めていません。</tspan></text>
    </g>
  </g>

  <g id="Sources" transform="translate(120 5488)">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#17243F" stroke-width="2"/>
    <text class="sans clay kicker" x="0" y="56">NOTES &amp; SOURCES</text>
    <text class="serif ink h2" x="0" y="116">出典と確認記録。</text>
    <g class="sans" transform="translate(470 34)">
      <g><text class="serif clay" x="0" y="28" font-size="24">1</text><text class="ink" x="54" y="18" font-size="15" font-weight="700">メーカー公式　モデルA 製品仕様</text><text class="muted small" x="54" y="46">容量・出力・重量・保証条件 / 一次情報 / 2026.08.29確認</text></g>
      <line x1="54" y1="72" x2="730" y2="72" class="hair"/>
      <g transform="translate(0 96)"><text class="serif clay" x="0" y="28" font-size="24">2</text><text class="ink" x="54" y="18" font-size="15" font-weight="700">メーカー公式　モデルB 製品仕様</text><text class="muted small" x="54" y="46">容量・出力・重量・保証条件 / 一次情報 / 2026.08.29確認</text></g>
