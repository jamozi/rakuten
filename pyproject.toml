[project]
name = "raos"
version = "0.0.0"
description = "Rakuten Affiliate Operations System"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
  "alembic==1.18.5",
  "jsonschema==4.26.0",
  "openai==2.52.0",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
]

[tool.uv]
package = false
default-groups = ["dev"]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.71.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "pyyaml==6.0.3",
  "referencing==0.37.0",
  "ruff==0.16.1",
  "types-pyyaml==6.0.12.20260724",
]

[tool.ruff]
required-version = "==0.16.1"
target-version = "py314"
line-length = 88
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
docstring-code-format = false
preview = false

[tool.mypy]
python_version = "3.14"
files = ["python/raos"]
exclude = ["^python/raos/generated/"]
mypy_path = "python"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["raos.generated", "raos.generated.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
minversion = "9.1.1"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--disable-plugin-autoload",
  "--import-mode=importlib",
]
markers = [
  "external: requires a non-local service or provider",
  "live: performs a live provider or publication operation",
  "raos_owner_private: requires the physical owner repository and untracked owner-private policy inputs",
  "database: requires a database engine or database-specific process boundary",
  "serial: uses a database, storage service, or process-global filesystem state",
  "storage: requires an object-storage service or storage-specific process boundary",
]
