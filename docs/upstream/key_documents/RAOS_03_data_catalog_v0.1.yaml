validation_warnings:
- 18 polymorphic/generic identifier columns require service-level type validation.
- Retention periods marked provisional require Japanese legal/tax/privacy counsel confirmation before production deletion jobs are enabled.
- DDL was generated for PostgreSQL 18.4; execute integration tests against the exact RDS parameter group and minor version before production.
classifications:
  PUBLIC: Intended for public rendering; still must pass publication policy.
  INTERNAL: Ordinary operating data available to authorized staff/services.
  CONFIDENTIAL: Business-sensitive or pseudonymous data; limited access and logging required.
  RESTRICTED: Audit, finance, security, review, or potentially sensitive data; least privilege and export controls.
retention_classes:
  BUSINESS_CORE:
    minimum: active lifetime + 7 years (provisional)
    action: archive then reviewed delete/anonymize
    legal_review_required: true
    description: Core entity/state needed to reproduce business decisions.
  CONFIG_PERMANENT:
    minimum: indefinite
    action: retain all versions
    legal_review_required: false
    description: Versioned rules, schemas, parsers, prompts, and operating configuration.
  CONTENT_7Y_PROVISIONAL:
    minimum: 7 years after last use/publication (provisional)
    action: archive; delete only after hold check
    legal_review_required: true
    description: Editorial/evidence lineage and review records.
  AUDIT_7Y_PROVISIONAL:
    minimum: 7 years (provisional)
    action: WORM archive; no routine mutation
    legal_review_required: true
    description: Audit, approvals, policy decisions, incidents, publication events.
  PUBLICATION_PERMANENT:
    minimum: indefinite while site exists
    action: retain immutable snapshot and hash
    legal_review_required: true
    description: Published snapshot lineage needed for exact rollback and dispute response.
  OPS_2Y_PROVISIONAL:
    minimum: 25 months (provisional)
    action: aggregate then delete after incident/legal hold check
    legal_review_required: true
    description: Operational executions, freshness checks, and diagnostic records.
  ANALYTICS_RAW_90D:
    minimum: 90 days maximum by default
    action: aggregate then hard delete
    legal_review_required: true
    description: Privacy-minimized first-party anonymous event stream.
  ANALYTICS_CLICK_25M:
    minimum: 25 months (provisional)
    action: retain pseudonymous click facts; delete on approved schedule
    legal_review_required: true
    description: Affiliate click facts needed for trend analysis and estimated attribution.
  ANALYTICS_AGG_25M:
    minimum: 25 months online; longer aggregate archive optional
    action: roll up or archive
    legal_review_required: true
    description: GSC, GA4, and derived aggregate metrics.
  FINANCE_7Y_PROVISIONAL:
    minimum: 7 fiscal years or longer where required (provisional)
    action: archive; delete only after finance/legal approval
    legal_review_required: true
    description: Revenue source files, canonical commission facts, cost, and calculation evidence.
  REGENERABLE:
    minimum: none beyond recovery window
    action: truncate and rebuild from immutable source
    legal_review_required: false
    description: Read models and projections that are never a system of record.
  BY_ARTIFACT_KIND:
    minimum: policy by artifact_kind
    action: object lock/archive/delete per registered policy
    legal_review_required: true
    description: Artifact-specific retention resolved by ops.retention_policy.
  OPS_JOB_2Y:
    minimum: 25 months (provisional)
    action: retain summary; expire large payload artifacts separately
    legal_review_required: true
    description: Job and attempt execution history.
  OUTBOX_180D:
    minimum: 180 days after successful publication
    action: delete after consumer reconciliation and audit export
    legal_review_required: false
    description: Transactional outbox delivery history.
  INBOX_400D:
    minimum: 400 days
    action: delete after deduplication horizon
    legal_review_required: false
    description: Consumer idempotency receipts.
  IDEMPOTENCY_UNTIL_EXPIRY:
    minimum: record expires_at plus safety buffer
    action: delete after related workflow reaches terminal state
    legal_review_required: false
    description: Request idempotency records.
  OPS_ALERT_2Y:
    minimum: 25 months
    action: archive aggregate and delete details
    legal_review_required: false
    description: Alert lifecycle records.
  INCIDENT_7Y_PROVISIONAL:
    minimum: 7 years after closure (provisional)
    action: retain with audit/legal hold
    legal_review_required: true
    description: Incident and timeline evidence.
  CONFIG_7Y:
    minimum: 7 years after supersession
    action: archive; preserve versions used by retained decisions
    legal_review_required: true
    description: General versioned configuration.
  RELEASE_7Y:
    minimum: 7 years
    action: retain manifest, digest and rollback lineage
    legal_review_required: true
    description: Application/database release history.
  IAM_LIFECYCLE:
    minimum: account lifetime + 7 years (provisional)
    action: pseudonymize contact data when no longer needed; retain audit key
    legal_review_required: true
    description: Principals and identity mappings.
  IAM_SESSION_2Y:
    minimum: 25 months maximum
    action: delete after security horizon
    legal_review_required: true
    description: Session revocation and access security evidence.
  ANALYTICS_25M:
    minimum: 25 months
    action: roll up/archive
    legal_review_required: true
    description: Portfolio/search metric observations.
  RAW_PROVIDER_2Y:
    minimum: 25 months unless source-specific policy is longer
    action: archive or delete after normalized reconciliation
    legal_review_required: true
    description: Provider ingestion request and raw response metadata.
  CATALOG_CURRENT:
    minimum: while provider taxonomy is active + 25 months
    action: retain superseded taxonomy for lineage
    legal_review_required: false
    description: Provider category/genre reference data.
  CATALOG_HISTORY:
    minimum: site lifetime + 7 years (provisional)
    action: archive inactive entities; never break publication lineage
    legal_review_required: true
    description: Canonical product, offer, grouping and attribute history.
  OBSERVATION_3Y:
    minimum: 37 months online/nearline
    action: retain monthly rollups longer where needed
    legal_review_required: true
    description: Price, availability, rating aggregate and link observations.
  REBUILDABLE:
    minimum: recovery window only
    action: truncate/rebuild
    legal_review_required: false
    description: Internal current-state projections.
  SOURCE_SNAPSHOT_7Y_PROVISIONAL:
    minimum: 7 years after last referenced publication (provisional)
    action: WORM archive; delete only after lineage/hold check
    legal_review_required: true
    description: External source snapshots.
  EVIDENCE_7Y_PROVISIONAL:
    minimum: 7 years after last referenced publication (provisional)
    action: archive with hashes and lineage
    legal_review_required: true
    description: Facts, packet versions and evidence links.
  AI_CONFIG_7Y:
    minimum: 7 years after last use
    action: retain prompt/schema/model-route version
    legal_review_required: true
    description: AI reproducibility configuration.
  AI_RUN_3Y:
    minimum: 37 months online; longer artifact retention where publication-referenced
    action: aggregate usage; retain referenced I/O by artifact policy
    legal_review_required: true
    description: AI jobs, attempts and usage.
  AI_EVAL_3Y:
    minimum: 37 months
    action: retain aggregate evaluation and sampled evidence
    legal_review_required: true
    description: AI evaluation results.
  POLICY_7Y:
    minimum: 7 years after supersession
    action: retain all policy/rule versions used for decisions
    legal_review_required: true
    description: Policy bundles and quality rules.
