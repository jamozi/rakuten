    - FR-017
    - FR-019
    - NFR-MAINT-001
    architecture_refs: []
    implementation_slice: SLICE-013
    notes: []
    columns:
    - name: id
      type: uuid
      nullable: false
      default: uuidv7()
      description: 内部主キー。PostgreSQL 18のuuidv7()で生成する時系列順UUID。
      classification: INTERNAL
      pii: false
    - name: display_id
      type: text
      nullable: false
      default: null
      description: POL-接頭辞を持つアプリケーション生成の不変表示ID。
      classification: INTERNAL
      pii: false
    - name: bundle_code
      type: text
      nullable: false
      default: null
      description: bundle code
      classification: INTERNAL
      pii: false
    - name: version_no
      type: integer
      nullable: false
      default: null
      description: Aggregate内で1から増加する不変Version番号。
      classification: INTERNAL
      pii: false
    - name: status
      type: text
      nullable: false
      default: null
      description: 業務状態を示す安定Enum文字列。
      classification: INTERNAL
      pii: false
    - name: git_commit_sha
      type: text
      nullable: false
      default: null
      description: git commit sha
      classification: INTERNAL
      pii: false
    - name: bundle_sha256
      type: text
      nullable: false
      default: null
      description: bundle sha256
      classification: INTERNAL
      pii: false
    - name: effective_from
      type: timestamptz
      nullable: true
      default: null
      description: 設定・関係が有効になる時刻。
      classification: INTERNAL
      pii: false
    - name: effective_to
      type: timestamptz
      nullable: true
      default: null
      description: 設定・関係の有効終了時刻。NULLは終了未定。
      classification: INTERNAL
      pii: false
