    fully_qualified_name: policy.policy_bundle
    purpose: 規約・品質・鮮度・Security Rule集合をVersion、Git commit、hash、承認、有効期間で固定する。
    owner_module: policy
    write_pattern: LIFECYCLE
    classification: CONFIDENTIAL
    retention_class: POLICY_7Y
    primary_key:
