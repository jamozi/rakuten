      columns:
      - bundle_code
      - version_no
    check_constraints:
    - name: ck_policy_bundle_version
      expression: version_no >= 1
    - name: ck_policy_bundle_status
      expression: status IN ('DRAFT', 'ACTIVE', 'RETIRED', 'REJECTED')
    - name: ck_policy_bundle_git
      expression: git_commit_sha ~ '^[0-9a-f]{40,64}$'
    - name: ck_policy_bundle_hash
      expression: bundle_sha256 ~ '^[0-9a-f]{64}$'
    - name: ck_policy_bundle_window
