document:
  id: RAOS-API-001
  version: '0.1'
  status: BASELINE_CANDIDATE
  date: '2026-07-30'
  upstream:
  - RAOS-REQ-001@0.1
  - RAOS-ARCH-001@0.1
  - RAOS-DATA-001@0.1
standards:
  openapi: 3.1.1
  json_schema: 2020-12
  problem_details: RFC 9457
  trace_context: W3C Trace Context
  oauth_security: RFC 9700
conventions:
  base_path: /api/v1
  time: RFC3339 UTC
  ids: UUIDv7 internal and stable display_id where present
  pagination: opaque cursor, default 50, max 200
  idempotency_header: Idempotency-Key
  concurrency_headers:
  - ETag
  - If-Match
  request_id_header: X-Request-ID
  trace_headers:
  - traceparent
  - tracestate
  success_envelope: resource directly; list uses items/page; asynchronous command uses JobAccepted
  error_media_type: application/problem+json
adrs:
- id: API-ADR-001
  status: accepted
  decision: OpenAPI 3.1.1をHTTP契約正本とし、3.2固有機能をMVPで使用しない
  rationale: FastAPIと主要Codegenの互換性を優先しながらJSON Schema 2020-12を利用する。
- id: API-ADR-002
  status: accepted
  decision: Public、Admin、InternalのOpenAPI文書を分離する
  rationale: Trust Boundary、認証、Rate Limit、公開範囲の誤混在を防ぐ。
- id: API-ADR-003
  status: accepted
  decision: URI major versioningとして/api/v1を使用する
  rationale: 破壊的変更は/v2、新規任意Fieldはv1内で追加可能とする。
- id: API-ADR-004
  status: accepted
  decision: RFC 9457 Problem Detailsを唯一のHTTPエラー形式とする
  rationale: 独自エラーEnvelope乱立を防ぎ、機械処理可能なcodeとviolationsを拡張する。
- id: API-ADR-005
  status: accepted
  decision: 重要な状態変更CommandにIdempotency-Keyを必須化する
  rationale: 二重Publish、二重承認、二重成果取込、二重Job作成を防止する。
- id: API-ADR-006
  status: accepted
  decision: 編集可能Aggregateの更新にIf-Matchを必須化する
  rationale: last-write-winsを禁止し、lock_version由来ETagで競合を検出する。
- id: API-ADR-007
  status: accepted
  decision: 長時間処理は202 Accepted＋JobResourceを返す
  rationale: 外部API、AI、品質、公開、ImportをHTTP request lifecycleから分離する。
- id: API-ADR-008
  status: accepted
  decision: EventとJobを別メッセージ種別として定義する
  rationale: Eventは過去事実、Jobは実行要求であり、再送・失敗・責任が異なる。
- id: API-ADR-009
  status: accepted
  decision: Domain Event EnvelopeはCloudEvents互換フィールドを持つ
  rationale: event ID、source、type、subject、time、data schemaを標準化する。
- id: API-ADR-010
  status: accepted
  decision: AsyncAPI 3.0互換構文で論理Channelを記述する
  rationale: 現行3.1仕様に適合しつつ、利用ツールの3.0互換性を確保する。
- id: API-ADR-011
  status: accepted
  decision: Event/Job/AI OutputはJSON Schema 2020-12を単独ファイルで管理する
  rationale: Provider SDKやPydantic内部Schemaを外部契約正本にしない。
- id: API-ADR-012
  status: accepted
  decision: Cursor paginationを標準としoffset paginationを禁止する
  rationale: 更新中の一覧でも重複・欠落を抑え、大規模化に耐える。
- id: API-ADR-013
  status: accepted
  decision: Affiliate click endpointは204を即時返し、楽天Navigationを待たせない
  rationale: 計測失敗が購入導線を阻害しない。
- id: API-ADR-014
  status: accepted
  decision: 楽天Affiliate URLはrequest payloadに受け取らない
  rationale: Catalog projectionに保存済みの公式URLを参照し、改変経路を作らない。
- id: API-ADR-015
  status: accepted
  decision: 公開APIはreadmodelのみを返し内部ID・原本・AI情報を露出しない
  rationale: One-way public boundaryを契約で固定する。
- id: API-ADR-016
  status: accepted
  decision: 管理APIはOIDC Bearer Token＋RBAC scopeを使用する
  rationale: Cookie認証に依存せず、操作単位の最小権限を表現する。
- id: API-ADR-017
  status: accepted
  decision: Internal APIはPrivate Network＋Service Identity限定とする
  rationale: Scheduler等のControl Plane以外はQueueを一次経路とする。
- id: API-ADR-018
  status: accepted
  decision: Event/Job payloadに秘密、原本文、Affiliate URL全文を含めない
  rationale: 漏えい面積、Queue制限、ログ汚染を減らす。
- id: API-ADR-019
  status: accepted
  decision: 大きな入力・出力はObjectArtifact参照とSHA-256で渡す
  rationale: SQS等のMessage size制約と不変原本を両立する。
- id: API-ADR-020
  status: accepted
  decision: API responseに推定値とProvider Factのprovenanceを明示する
  rationale: 成果・帰属・計測を誤認させない。
- id: API-ADR-021
  status: accepted
  decision: 推薦編集APIから料率・利益Fieldを除外する
  rationale: 編集順位とAffiliate economicsを構造的に分離する。
- id: API-ADR-022
  status: accepted
  decision: CSV Uploadはpresigned upload session→scan→dry run→confirmとする
  rationale: 巨大multipart、Formula Injection、重複原本、無確認Importを防ぐ。
- id: API-ADR-023
  status: accepted
  decision: Schema registryは互換性モードBACKWARD_TRANSITIVEを基本とする
  rationale: 既存Consumerが新しいProducer Eventを処理できることを保証する。
- id: API-ADR-024
  status: accepted
  decision: DeprecationとSunset headerを廃止プロセスに使用する
  rationale: 暗黙的なEndpoint撤去を禁止する。
- id: API-ADR-025
  status: accepted
  decision: traceparent、X-Request-ID、correlation_idをHTTPからJob/Eventへ伝播する
  rationale: 1操作の監査・障害調査・費用配賦を連結する。
- id: API-ADR-026
  status: accepted
  decision: GET以外の監査対象操作はAudit Eventを同一Transactionで記録する
  rationale: 通知やログだけを監査正本としない。
- id: API-ADR-027
  status: accepted
  decision: 公開・Affiliate Kill SwitchはCommand APIとruntime projectionの双方で強制する
  rationale: 古いWeb cacheや古いJobが停止状態を上書きしない。
- id: API-ADR-028
  status: accepted
  decision: OpenAPIからTypeScript clientを生成し手書きHTTP clientを禁止する
  rationale: UIとAPIの契約driftをCIで検知する。
- id: API-ADR-029
  status: accepted
  decision: Job statusを上位アーキテクチャの10状態へDB整合させる
  rationale: retryable/terminal/expiredをAPIと運用で区別できるようにする。
- id: API-ADR-030
  status: accepted
  decision: 実装PRはOperation ID・Event type・Job type・Requirement IDをテスト名へ保持する
  rationale: Codex実装のトレーサビリティを自動検査する。
