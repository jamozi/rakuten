  data_class: PUBLIC
  allowed_roles:
  - PRODUCT_OWNER
  - MANAGING_EDITOR
  - EDITOR
  - REVIEWER
  - ANALYST
  - OPERATOR
  - SECURITY_AUDITOR
  - READ_ONLY_AUDITOR
  mfa_required: false
  step_up_required: false
  separation_of_duties: false
  implementation_status: NOT_STARTED
  runtime_verification: NOT_EXECUTED
