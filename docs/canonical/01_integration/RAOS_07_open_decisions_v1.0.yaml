document:
  id: RAOS-OPEN-DECISIONS-001
  version: '1.0'
  status: ACTIVE
rules:
- 未決事項をCodexが推測で確定しない
- default_behaviorは安全側へ倒す
- blocking=trueはProduction/Gate通過を禁止する
items:
- id: OD-001
  topic: initial_category
  status: HUMAN_DECISION_REQUIRED
  required_by: MVP vertical slice
  owner: Product Owner
  decision_needed: 低リスクで比較軸が構造化可能な最初のカテゴリを1つ選定
  default_behavior: カテゴリ固有実装を停止し合成Fixtureのみ使用
  blocking: true
- id: OD-002
  topic: site_name_and_domain
  status: HUMAN_DECISION_REQUIRED
  required_by: Staging public UI
  owner: Product Owner
  decision_needed: ブランド名、ドメイン、運営者表記を決定
  default_behavior: example.invalidと仮ブランドを使用し外部公開禁止
  blocking: true
- id: OD-003
  topic: rakuten_report_sample
  status: EXTERNAL_EVIDENCE_REQUIRED
  required_by: Finance adapter
  owner: Business Owner
  decision_needed: 実際に利用可能な成果Reportの匿名化サンプル、列、状態、粒度を確認
  default_behavior: Synthetic fixtureのみ。実成果帰属を未検証表示
  blocking: true
- id: OD-004
  topic: keyword_and_rank_provider
  status: HUMAN_DECISION_REQUIRED
  required_by: GATE-2 automation
  owner: Product Owner
  decision_needed: 規約適合した順位/Keyword Providerまたは手動Importを選定
  default_behavior: Search Consoleと手動CSVのみ
  blocking: false
- id: OD-005
  topic: human_reviewer_and_hourly_cost
  status: HUMAN_DECISION_REQUIRED
  required_by: GATE-1 and contribution profit
  owner: Business Owner
  decision_needed: Reviewer、代替Reviewer、標準人件費を決定
  default_behavior: 公開不可、利益計算の人件費はUNKNOWN
  blocking: true
- id: OD-006
  topic: category_product_identity_rules
  status: EXTERNAL_EVIDENCE_REQUIRED
  required_by: Catalog grouping
  owner: Domain Editor
  decision_needed: 型番、容量、色、セット、JAN等の統合/分離ルールをカテゴリごとに定義
  default_behavior: 自動統合せずHuman Reviewへ送る
  blocking: true
- id: OD-007
  topic: category_freshness_sla
  status: HUMAN_DECISION_REQUIRED
  required_by: Publication and refresh
  owner: Managing Editor
  decision_needed: 価格、在庫、仕様、画像、リンクの最大許容Ageを定義
  default_behavior: 保守的な暫定値を適用しStale時は非表示
  blocking: true
- id: OD-008
  topic: legal_review_boundary
  status: HUMAN_DECISION_REQUIRED
  required_by: GATE-0
  owner: Business Owner / Legal
  decision_needed: 法務確認対象、相談経路、記録方法を確定
  default_behavior: 法的判断をAI/開発者が代替せず公開をブロック
  blocking: true
- id: OD-009
  topic: budget_and_acceptable_loss
  status: HUMAN_DECISION_REQUIRED
  required_by: Cloud/LLM release
  owner: Business Owner
  decision_needed: AWS、LLM、外部Providerの月次上限と自動停止閾値を設定
  default_behavior: 低い開発用上限、Production無効
  blocking: true
- id: OD-010
  topic: oidc_provider
  status: HUMAN_DECISION_REQUIRED
  required_by: Admin authentication
  owner: Security Owner
  decision_needed: Cognitoまたは承認済みOIDC Providerを選定
  default_behavior: Local fake authはdevelopmentのみ。外部公開不可
  blocking: true
- id: OD-011
  topic: notification_channels
  status: HUMAN_DECISION_REQUIRED
  required_by: Incident operations
  owner: Operations Owner
  decision_needed: Critical/High通知先とEscalation連絡先を設定
  default_behavior: Local logのみ。Production不可
  blocking: true
- id: OD-012
  topic: privacy_and_consent_mode
  status: HUMAN_DECISION_REQUIRED
  required_by: Public analytics
  owner: Privacy Owner
  decision_needed: 同意Banner、Cookie/計測方針、Privacy文言を決定
  default_behavior: 非必須Trackingを無効化しFirst-party最小Eventのみ
  blocking: true
- id: OD-013
  topic: production_region_and_data_residency
  status: HUMAN_DECISION_REQUIRED
  required_by: Terraform production
  owner: Security/Business Owner
  decision_needed: AWS Region、Backup Region、越境移転の扱いを承認
  default_behavior: Referenceはap-northeast-1、Production apply禁止
  blocking: true
- id: OD-014
  topic: retention_periods
  status: HUMAN_DECISION_REQUIRED
  required_by: Deletion jobs
  owner: Privacy/Finance/Legal
  decision_needed: Analytics個票、Security Log、AI Artifact、成果データの保持期間を承認
  default_behavior: 自動削除Jobは無効、最小収集
  blocking: true
- id: OD-015
  topic: production_provider_credentials
  status: EXTERNAL_EVIDENCE_REQUIRED
  required_by: Live adapter test
  owner: Operations Owner
  decision_needed: 楽天、OpenAI、Google、AWSの専用Account/権限/Secretを設定
  default_behavior: Recorded fixtureのみ
  blocking: true
