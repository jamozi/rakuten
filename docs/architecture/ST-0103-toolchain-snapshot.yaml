document:
  id: RAOS-ST0103-TOOLCHAIN-SNAPSHOT-001
  schema_version: 1
  checked_at: '2026-08-01T19:32:46Z'
  purpose: Official-source version selection for the ST-0103 Node toolchain

selection_policy:
  runtime: Use the current security-patched Node LTS release, not the Current line.
  package_manager: Use the npm release bundled with the selected Node artifact.
  framework: Use the latest stable Next.js patch; exclude preview and canary tags.
  typescript: Use the latest stable compiler accepted by the selected lint stack.
  direct_dependencies: Pin every direct dependency exactly and preserve registry integrity in package-lock.json.
  security_overrides: Pin patched transitive releases exactly when the latest stable framework still declares advisory-affected versions.

