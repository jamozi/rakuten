  live_pull_request_probes: NOT_EXECUTED
  formal_tst_001: NOT_EXECUTED
  effective_canonical_status: UNCHANGED
  st0005_apply_gate: NOT_ACTIVATED
  note: >-
    The recorded GitHub pages are official documentation, not evidence about a
    particular repository. The local ruleset JSON is deliberately incomplete
    as an API payload and may not be POSTed or PUT without all live bindings,
    read-back planning, probes, and rollback evidence.
