desired_ruleset_semantics:
  target: SYMBOLIC_DEFAULT_BRANCH_ONLY
  desired_enforcement_after_approval: active
  current_enforcement_claim: NONE
  bypass_actors: NONE_DESIRED
  rules:
    - prohibit_deletion
    - prohibit_force_push
    - require_linear_history
    - require_pull_request
    - dismiss_stale_reviews_on_push
    - require_code_owner_review
    - require_last_push_approval
    - require_review_thread_resolution
    - require_status_checks_with_expected_source_binding
  owner_semantics_note: >-
    Owners on the same CODEOWNERS line are eligible alternatives. The local
    mapping does not claim that GitHub requires every listed team to approve.
  required_status_candidates:
    - context: Static
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION
    - context: Unit
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION
    - context: Contracts
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION
    - context: Database
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION
    - context: Storage
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION
    - context: Secrets
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION
    - context: Validate status overlay
      expected_source: github-actions
      integration_id: REQUIRED_AT_ACTIVATION

activation_preflight:
  enforcement: AUTOMATED_GITHUB_DEVELOPMENT_OPERATION
  items:
    - id: repository-default-branch
      requirement: Authenticate the exact repository identity and actual default branch.
    - id: visible-write-teams
      requirement: Resolve every semantic role to a real visible team with explicit repository write permission and reviewed numeric identity.
    - id: required-check-sources
      requirement: Observe every required context succeeding in the repository and bind it to the expected GitHub Actions App source ID.
    - id: authenticated-effective-snapshot
      requirement: Capture repository and parent rulesets plus active branch rules with sufficient access to expose the complete bypass state.
    - id: live-probes
      requirement: Prove owner coverage, review invalidation, last-push approval, thread resolution, missing-check blocking, direct-push denial, deletion denial, and force-push denial on real pull requests and refs.

verification_boundary:
