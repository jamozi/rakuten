official_sources:
  - id: GITHUB-ABOUT-CODE-OWNERS
    title: About code owners
    url: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners
    reviewed_facts:
      - GitHub selects CODEOWNERS from the pull request base branch.
      - The .github location takes precedence over root and docs locations.
      - A listed user or team needs explicit repository write access.
      - A listed team must be visible as well as have explicit write access.
      - A missing, inaccessible, or syntactically invalid owner does not assign a code owner.
      - One approval from any owner on a matching line satisfies the code-owner review requirement; multiple listed owners are not an all-owner quorum.
      - The CODEOWNERS file or its containing .github directory should itself be owned.
  - id: GITHUB-AVAILABLE-RULESET-RULES
    title: Available rules for rulesets
    url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
    reviewed_facts:
      - A branch ruleset can require pull requests and status checks.
      - A branch ruleset can block deletions and force pushes and require linear history.
      - Bypass actors alter effective enforcement and must be explicitly reviewed.
      - Repository and organization rulesets may layer over the same target.
  - id: GITHUB-REST-RULES
    title: REST API endpoints for rules
    url: https://docs.github.com/en/rest/repos/rules
    api_version: '2026-03-10'
    reviewed_facts:
      - GET /repos/{owner}/{repo}/rulesets lists repository rulesets and can include parent rulesets.
      - GET /repos/{owner}/{repo}/rulesets/{ruleset_id} returns ruleset details.
      - GET /repos/{owner}/{repo}/rules/branches/{branch} returns active effective rules for a branch and excludes evaluate or disabled rulesets.
      - A complete bypass_actors field is returned only when the authenticated caller has sufficient ruleset write visibility.
      - Create, update, and delete are remote mutations requiring separately approved authorization and are not generator operations.
  - id: GITHUB-TROUBLESHOOT-REQUIRED-STATUS
    title: Troubleshooting required status checks
    url: https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
    reviewed_facts:
      - A candidate required check must have completed successfully in the selected repository during the preceding seven days.
      - The required check must succeed for the latest applicable head or test-merge commit.
      - A required workflow skipped by path or branch filtering can remain pending and block merge.
      - A check context can be required from a specific GitHub App; the expected source must be verified.
      - A check run and commit status with the same name can both be required to pass.

