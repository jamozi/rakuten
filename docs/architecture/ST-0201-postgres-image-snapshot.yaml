  schema_version: 1
  story_id: ST-0201
  checked_at: '2026-08-02T11:19:33Z'
  purpose: >-
    Official-image identity and fail-closed runtime boundary for the local
    PostgreSQL 18.4 service candidate

official_sources:
  - id: DOCKER-OFFICIAL-POSTGRES
    title: Docker Official Image - postgres
    url: https://hub.docker.com/_/postgres
    reviewed_facts:
      - The official image supports POSTGRES_USER and POSTGRES_DB for initial database creation.
      - The official image supports POSTGRES_PASSWORD_FILE for a Docker secret mounted in the container.
      - PostgreSQL 18 and later use a version-specific PGDATA directory below /var/lib/postgresql, so the persistent volume is mounted at /var/lib/postgresql.
  - id: DOCKER-OFFICIAL-IMAGES-POSTGRES-LIBRARY
    title: Official Images library definition for postgres
    url: https://github.com/docker-library/official-images/blob/master/library/postgres
    reviewed_facts:
      - The postgres 18.4-bookworm tag resolves to a multi-platform OCI image index.
      - Platform-specific manifest and image configuration identities must be retained separately from the index digest.
  - id: DOCKER-COMPOSE-SECRETS
    title: Use secrets in Compose
    url: https://docs.docker.com/compose/how-tos/use-secrets/
    reviewed_facts:
      - Compose secrets are mounted as files under /run/secrets by default.
      - A _FILE environment variable avoids placing the secret value in the Compose environment block.
  - id: DOCKER-COMPOSE-PORTS
    title: Compose services ports reference
    url: https://docs.docker.com/reference/compose-file/services/#ports
    reviewed_facts:
      - Binding the published port to 127.0.0.1 prevents wildcard host publication.
      - A quoted short-syntax mapping preserves the host IP and variable interpolation as one scalar.

