runtime_acceptance:
  readiness_probe:
    paths: [/status, /healthz]
    classification: PROCESS_READINESS_ONLY
  authenticated_fixture:
    required: true
    assertions:
      - Create the private raos-raw bucket with object-lock capability enabled at creation.
      - Enable and read back bucket versioning.
      - Put two versions of one fixture and GET each immutable version by version ID.
      - Round-trip sha256, content-type, source, acquired-at, and retention-class metadata.
      - Reject a fixture whose body does not match its declared SHA-256.
      - Reject any pre-existing bucket lifecycle configuration and require the standard no-configuration response.
      - Exercise the retention hook while leaving the retention period unset.
  object_lock_regression_scope:
    required: true
    reason: >-
      The selected release contains relevant versioning and object-lock fixes;
      release notes alone cannot replace a real regression fixture.
  formal_suite: TST-014

