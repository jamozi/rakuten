  schema_version: 1
  story_id: ST-0202
  checked_at: '2026-08-02T13:06:40Z'
  purpose: >-
    Official-source identity, security semantics, and fail-closed runtime
    boundary for the local S3-compatible object-storage candidate

official_sources:
  - id: DOCKER-HUB-SEAWEEDFS
    title: SeaweedFS image repository
    url: https://hub.docker.com/r/chrislusf/seaweedfs
    reviewed_facts:
      - The reviewed 4.29 tag resolves to a multi-platform OCI image index.
      - The selected linux/amd64 manifest and image configuration identities are recorded separately from the index digest.
      - The image declares /entrypoint.sh as its entrypoint and /data as a volume.
  - id: SEAWEEDFS-RELEASE-4-29
    title: SeaweedFS 4.29 release
    url: https://github.com/seaweedfs/seaweedfs/releases/tag/4.29
    reviewed_facts:
      - Release 4.29 includes fixes for atomic versioned PUT and version-aware COPY/delete-marker behavior.
      - Release 4.29 includes fixes for object-lock writes and version-specific deletes.
      - Release notes are candidate-selection evidence, not proof that the local runtime exercises those paths correctly.
  - id: SEAWEEDFS-ENTRYPOINT-REVISION-1355C7A
    title: SeaweedFS container entrypoint at the pinned image source revision
    url: https://github.com/seaweedfs/seaweedfs/blob/1355c7a102194d6c461baf090eff50367b575afb/docker/entrypoint.sh
    reviewed_facts:
      - When started as root, the official entrypoint changes to the seaweed identity with su-exec before running the requested command.
      - The reviewed staging command can therefore prepare the root-mounted secret first and still run SeaweedFS as the image's non-root identity.
  - id: SEAWEEDFS-DOCKERFILE-REVISION-1355C7A
    title: SeaweedFS Go-build container definition at the pinned image source revision
    url: https://github.com/seaweedfs/seaweedfs/blob/1355c7a102194d6c461baf090eff50367b575afb/docker/Dockerfile.go_build
    reviewed_facts:
      - The final image creates the seaweed group and user with GID and UID 1000.
      - The final image installs curl and su-exec, supporting the bounded readiness probe and official entrypoint privilege drop.
  - id: SEAWEEDFS-MINI-4-29
    title: SeaweedFS mini command at tag 4.29
    url: https://github.com/seaweedfs/seaweedfs/blob/4.29/weed/command/mini.go
    reviewed_facts:
      - mini accepts -dir, -s3.config, -s3.port, -s3.allowDeleteBucketNotEmpty, -webdav, -admin.ui, -s3.port.iceberg, and -master.telemetry.
      - The S3 port defaults to 8333.
      - Master telemetry is enabled by default and therefore must be disabled explicitly for this local candidate.
  - id: SEAWEEDFS-STATIC-S3-USERS-4-29
    title: SeaweedFS static S3 identity configuration example at tag 4.29
    url: https://github.com/seaweedfs/seaweedfs/blob/4.29/docker/compose/s3_static_users_example.json
    reviewed_facts:
      - Static S3 identities are supplied through a JSON configuration file.
      - Access and secret keys therefore remain file-backed Compose secret material rather than Compose environment values or command arguments.
  - id: SEAWEEDFS-S3-SERVER-4-29
    title: SeaweedFS S3 server at tag 4.29
    url: https://github.com/seaweedfs/seaweedfs/blob/4.29/weed/s3api/s3api_server.go
    reviewed_facts:
      - /status and /healthz are service-readiness endpoints.
      - Readiness does not establish authenticated S3 semantics, versioning, object-lock capability, metadata integrity, or cleanup behavior.
  - id: DOCKER-COMPOSE-FILE-SECRET-SEMANTICS
    title: Docker Compose service secrets reference
    url: https://docs.docker.com/reference/compose-file/services/#secrets
    reviewed_facts:
      - An absolute secret target path is supported.
      - uid, gid, and mode remapping is not implemented for a file source and is therefore not relied on by this candidate.

