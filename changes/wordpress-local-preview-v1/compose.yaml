services:
  database:
    image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
    restart: 'no'
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_PASSWORD: ${RAOS_WORDPRESS_PREVIEW_DATABASE_PASSWORD:?database password is required}
      MARIADB_ROOT_PASSWORD: ${RAOS_WORDPRESS_PREVIEW_DATABASE_ROOT_PASSWORD:?database root password is required}
      MARIADB_USER: wordpress
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping --host=127.0.0.1 --user=root --password=$${MARIADB_ROOT_PASSWORD} --silent
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - preview_internal

  wordpress:
    image: wordpress:7.1.0-php8.3-apache@sha256:8801a1239d7ba9fb340a5fc5ba0bf7f8d3652adbd64893e3fba7992ba618108e
    restart: 'no'
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${RAOS_WORDPRESS_PREVIEW_DATABASE_PASSWORD:?database password is required}
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${RAOS_WORDPRESS_PREVIEW_ORIGIN:?preview origin is required}');
        define('WP_SITEURL', '${RAOS_WORDPRESS_PREVIEW_ORIGIN:?preview origin is required}');
        define('RAOS_WORDPRESS_PREVIEW_ORIGIN', '${RAOS_WORDPRESS_PREVIEW_ORIGIN:?preview origin is required}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('RAOS_LOCAL_PREVIEW', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        defined('WP_DEBUG') || define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
    volumes:
      - wordpress_data:/var/www/html
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/st-1704/self-hosted-editorial-pilot-v1/theme/kurashinoshirube-child
        target: /var/www/html/wp-content/themes/kurashinoshirube-child
        read_only: true
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/wordpress-local-preview-v1/mu-plugins
        target: /var/www/html/wp-content/mu-plugins
        read_only: true
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/editorial-measurement-v1/wordpress-plugin/raos-editorial-measurement
        target: /var/www/html/wp-content/plugins/raos-editorial-measurement
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_YOAST_ROOT:?verified Yoast root is required}
        target: /var/www/html/wp-content/plugins/wordpress-seo
        read_only: true
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/wordpress-local-preview-v1
        target: /var/www/raos-local-preview
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_ARTICLE_FIXTURE_ROOT:?materialized article fixture root is required}
        target: /var/www/raos-local-preview/fixtures/articles
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_POST_FIXTURE:?materialized post fixture is required}
        target: /var/www/raos-local-preview/fixtures/posts.json
        read_only: true
    networks:
      - preview_internal

  gateway:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    restart: 'no'
    depends_on:
      wordpress:
        condition: service_started
    user: '101:101'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:${RAOS_WORDPRESS_PREVIEW_PORT:?preview port is required}:8080'
    tmpfs:
      - /tmp:mode=0700,uid=101,gid=101
    volumes:
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/wordpress-local-preview-v1/gateway/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_PRODUCT_MEDIA_ROOT:?product media root is required}
        target: /srv/raos-product-media
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_BASELINE_MEDIA_ROOT:?baseline media root is required}
        target: /srv/raos-baseline-media
        read_only: true
    networks:
      - preview_internal
      - preview_loopback

  cli:
    image: wordpress:cli-2.12.0-php8.3@sha256:2b5e9d4d3e51909dca1aaa4732e9f5e5bf0377c2114dbd8ff39f060bff202586
    profiles:
      - cli
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint:
      - wp
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${RAOS_WORDPRESS_PREVIEW_DATABASE_PASSWORD:?database password is required}
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${RAOS_WORDPRESS_PREVIEW_ORIGIN:?preview origin is required}');
        define('WP_SITEURL', '${RAOS_WORDPRESS_PREVIEW_ORIGIN:?preview origin is required}');
        define('RAOS_WORDPRESS_PREVIEW_ORIGIN', '${RAOS_WORDPRESS_PREVIEW_ORIGIN:?preview origin is required}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('RAOS_LOCAL_PREVIEW', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        defined('WP_DEBUG') || define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
    user: '33:33'
    working_dir: /var/www/html
    volumes:
      - wordpress_data:/var/www/html
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/st-1704/self-hosted-editorial-pilot-v1/theme/kurashinoshirube-child
        target: /var/www/html/wp-content/themes/kurashinoshirube-child
        read_only: true
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/wordpress-local-preview-v1/mu-plugins
        target: /var/www/html/wp-content/mu-plugins
        read_only: true
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/editorial-measurement-v1/wordpress-plugin/raos-editorial-measurement
        target: /var/www/html/wp-content/plugins/raos-editorial-measurement
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_YOAST_ROOT:?verified Yoast root is required}
        target: /var/www/html/wp-content/plugins/wordpress-seo
        read_only: true
      - type: bind
        source: ${RAOS_REPOSITORY_ROOT:?repository root is required}/changes/wordpress-local-preview-v1
        target: /var/www/raos-local-preview
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_ARTICLE_FIXTURE_ROOT:?materialized article fixture root is required}
        target: /var/www/raos-local-preview/fixtures/articles
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_POST_FIXTURE:?materialized post fixture is required}
        target: /var/www/raos-local-preview/fixtures/posts.json
        read_only: true
      - type: bind
        source: ${RAOS_WORDPRESS_PREVIEW_MIXED_FIXTURE_ROOT:?materialized fixture root is required}
        target: /var/www/raos-mixed-preview
        read_only: true
    networks:
      - preview_internal

volumes:
  database_data:
  wordpress_data:

networks:
  preview_internal:
    driver: bridge
    internal: true
  preview_loopback:
    driver: bridge
