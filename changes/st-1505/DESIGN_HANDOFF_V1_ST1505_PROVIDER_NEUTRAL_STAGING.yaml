    - provider_neutral_target_adapter
rationale:
  - Staging is a release-evidence environment, so eligibility must depend on complete capabilities and evidence rather than a cloud or service name.
  - The four provider-neutral predecessor profiles define complementary foundation, data, compute-edge, and deployment-identity boundaries and none currently selects a live profile.
  - Exact dependency admission prevents an AWS label, predecessor completion claim, or local reference artifact from substituting for explicit mappings and identical evidence.
  - Keeping target bindings null and all actions disabled preserves Canonical human gates and unresolved decisions while allowing a reversible local contract implementation.
rejected_alternatives:
  - Require AWS, AWS Tokyo, an AWS account, or AWS service names merely because they remain in historical Reference Architecture metadata.
  - Treat Terraform, RDS, S3, SQS, ECS, Fargate, CloudFront, WAF, Route53, ACM, IAM, or GitHub OIDC labels as staging eligibility or evidence.
  - Select another cloud or owner-managed target without complete dependency mappings, target-adapter evidence, residency, budget, identity, security, operations, and release evidence.
  - Allow missing, unknown, duplicate, partial, implicit, defaulted, fallback, name-only, or historical-reference-only dependency or capability mappings.
  - Execute a deployment, migration, smoke request, provider call, rollback, release, or Production action from a local reference plan.
constraints:
  - Every ST-1501 through ST-1504 handoff, contract, and generated plan remains raw-hash, semantic-hash, and deterministic-byte bound.
  - A future staging profile must explicitly satisfy every predecessor provider-neutral admission and exactly one mapping for every staging capability.
  - Build admission requires an immutable digest, SBOM, vulnerability result, signed provenance, and promotion without rebuild.
  - Migration admission requires Expand-Migrate-Contract compatibility, a dry run, lock evidence, forward-fix readiness, an assigned migration owner, independent migration review, and no destructive current-release Contract step.
  - Protected environment admission requires exact repository, ref, workflow, environment, audience, subject, and independent human approval evidence.
  - Runtime admission requires liveness, readiness, dependency, migration-compatibility, Public/Admin/Internal isolation, smoke, security, and browser workflow evidence.
  - Every artifact, promotion, identity federation, deployment, migration, smoke/runtime, telemetry/alerting, rollback/restore, and target-adapter network flow requires authenticated encrypted transport, exact peer/hostname verification, and downgrade-resistant evidence.
  - Telemetry, alerts, release markers, rollback, restore, integrity, residency, isolation, budget, and automatic-stop evidence are mandatory and provider-neutral.
  - The target adapter must expose provider-neutral deployment operations and evidence without provider SDK types entering the domain contract.
  - Site/domain, identity provider, notification, region/residency, retention/deletion, budget, credentials, provider, profile, account/project/tenant, backend, identity, adapter, and resource choices remain unset while Open Decisions are unresolved.
  - No credential, provider call, network access, external write, deployment, migration, release, staging, or Production action is authorized by this record.
security_and_approval_gates:
  - Preserve security, operations, release, migration-owner, protected-environment, and independent human approval gates.
  - Preserve exact repository/ref/workflow subject binding, short-lived identity, no static cloud secret, least privilege, provenance, audit, revocation, and rollback requirements.
  - Preserve Critical/High release blocking, SBOM, vulnerability scan, signed provenance, data isolation, transport, retention, restore, and residency evidence.
  - Preserve OD-002, OD-009, OD-010, OD-011, OD-013, OD-014, and OD-015 blocking states until their owners provide valid evidence.
  - Require identical security, operations, release, supply-chain, migration, runtime, observability, rollback/restore, isolation, residency, budget, and adapter evidence for every eligible provider kind.
  - Never infer eligibility from AWS or another provider label, GitHub source status, historical metadata, predecessor completion, or local generator/test success.
acceptance_criteria:
  - The ST-1505 source and generated reference expose a closed provider-neutral dependency and capability admission inventory with no selected, default, or fallback target.
  - All four provider-neutral predecessors remain exact inputs and each future profile must satisfy its complete mapping and identical-evidence contract.
  - Unknown, missing, duplicate, partial, implicit, label-only, default, fallback, predecessor-only, or reference-only admission attempts fail closed.
  - AWS staging remains visible only as optional historical reference mappings and cannot satisfy dependency, capability, admission, or evidence requirements.
  - Build/SBOM/provenance, independent migration review, protected approval, smoke/security/runtime, cross-capability transport security, observability/alerts, rollback/restore, isolation/residency/budget, and target-adapter evidence remain required and unconfigured.
  - Existing disabled activation, zero action counts, unresolved decisions, human gates, and NOT_EXECUTED evidence remain unchanged.
required_test_evidence:
  - Isolated tests/st1505 positive contract and generated-plan assertions.
  - Hostile tests for every predecessor semantic and byte drift, missing/unknown/duplicate/partial mappings, provider shortcuts, defaults, fallbacks, and gate downgrades.
  - Owner generator regeneration and read-only --check.
  - Ruff for changed Python, git diff --check, and affected ST-1505 developer checks when available.
  - Formal TST-009 and TST-022, hosted CI, live provider, staging, rollback, release, and Production evidence remain separately unexecuted.
