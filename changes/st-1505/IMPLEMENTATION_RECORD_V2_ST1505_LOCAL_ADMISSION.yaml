    - provider SDK or API calls
    - credentials or token exchange
    - network requests, cloud plan/apply, real database migration, or browser execution
    - staging deployment, publication, release, rollback of live state, or Production writes
provisional_local_assumptions:
  - A closed synthetic artifact and recorded loopback response can exercise admission logic but can never satisfy formal supply-chain, database, browser, transport, staging, or release evidence.
  - A repository-inert pipeline fixture outside .github/workflows may describe local phases only when enabled remains false and every external action count remains zero.
  - SQLite is used only as an owner-private local journal for deterministic recovery tests and carries no credential, provider, personal, publication, or Production data.
