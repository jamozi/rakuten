  tests_to_add_or_run:
    - deterministic artifact, SBOM, vulnerability, and provenance admission
    - Expand-Migrate-Contract order, dry-run, lock, compatibility, and destructive-operation rejection
    - recorded Public/Admin/Internal loopback health and isolation
    - rollback/restore integrity simulator
    - durable idempotency, commit ambiguity, restart, tamper, path, and concurrency
    - hostile activation and journal collaborators, forged receipts, sanitized errors, and single-attempt behavior
    - exact SQLite DDL, auto-index, and foreign-key structure with weakened-constraint drift refusal
    - fixed-contract, descendant, repository-root, and repository-ancestor symlink refusal
    - ST-1504 disabled activation binding and exact zero external actions
    - owner regeneration/no-write, Ruff, mypy, Pyright, compile/import, secret scan, and git diff check
  out_of_scope:
