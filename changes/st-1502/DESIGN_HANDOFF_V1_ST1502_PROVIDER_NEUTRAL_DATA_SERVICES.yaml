rationale:
  - INT-DEC-007 makes AWS Tokyo a Reference Architecture while requiring a portable Core, so data-service admission must evaluate capabilities and evidence rather than AWS service names.
  - Provider, account, region, service, plugin, adapter, or backend defaults would silently turn the current Canonical Reference Architecture mappings into live selected infrastructure choices.
  - PostgreSQL-compatible persistence, object durability, at-least-once delivery, secret and key boundaries, recovery, observability, isolation, and residency are provider-neutral operational outcomes.
  - Keeping all bindings null and eligibility unevaluated preserves OD-013, OD-014, OD-015, TST-026, TST-029, and every external security, operations, release, and Production gate.
rejected_alternatives:
  - Require AWS, RDS, S3, SQS, Secrets Manager, KMS, an AWS account, or ap-northeast-1 merely because Canonical sources record them as reference mappings.
  - Select a different cloud or owner-managed data platform before capability mapping, residency, retention, credentials, operations, migration, and recovery evidence exist.
  - Infer a provider or service binding from names, reference metadata, defaults, ambient configuration, compatibility claims, or fallback behavior.
  - Permit partial, unknown, duplicate, implicit, provider-label-only, service-label-only, or reference-only capability mappings.
  - Lower security, operations, release, backup, restore, migration, isolation, or residency evidence for any provider kind.
constraints:
  - Exactly one explicit mapping is required for every required data-services capability before a future profile can be eligible.
  - Missing, unknown, duplicate, partial, implicit, provider-label-only, service-label-only, or reference-only mappings fail closed.
  - Relational persistence must prove PostgreSQL compatibility, private encrypted access, controlled migrations, backup and point-in-time recovery, deletion protection, and isolated restore evidence.
  - Object storage must prove private encrypted versioning, required immutability and integrity metadata, deletion-role separation, and recoverability without selecting a service now.
  - Queue capability must assume at-least-once and duplicate delivery, require idempotent consumers, DLQs, controlled redrive, separated roles, and actionable queue and DLQ telemetry.
  - Secrets and keys must be least-privilege, non-ambient, auditable, rotatable, recoverable, and absent from repository, logs, generated artifacts, and configuration dumps.
  - Development and Production must be isolated by account, project, tenant, or equivalent boundary, and every data plane must remain private unless a separately reviewed interface explicitly permits access.
  - Region, backup region, cross-border transfer, retention, automatic deletion, credentials, and physical service choices remain unset while OD-013, OD-014, and OD-015 are unresolved.
  - No credential, provider call, network access, external write, infrastructure init, plan, apply, migration, deployment, release, restore, deletion, or status transition is authorized by this record.
security_and_approval_gates:
  - Preserve private data planes, encryption in transit and at rest, least privilege, workload identity, separated duties, auditability, deletion protection, and immutable evidence requirements.
  - Preserve explicit human approval for Production change, migration, restore, redrive, destructive action, release, rollback, and every external status transition.
  - Preserve formal TST-026 security evidence and TST-029 isolated backup-restore drill evidence as release-blocking and NOT_EXECUTED.
  - Preserve OD-013 residency, OD-014 retention and deletion, and OD-015 credential blocking states until their human owners provide valid evidence.
  - Require the same security, operations, release, recovery, migration, isolation, and residency evidence for AWS, another cloud, and owner-managed infrastructure.
  - Never infer eligibility from a provider or service label, account or project name, region, plugin or adapter, Canonical Reference Architecture status, local generator success, or predecessor completion.
acceptance_criteria:
  - The ST-1502 source and generated reference expose a closed provider-neutral data-services capability inventory with no selected, default, or fallback profile, provider, service, adapter, credential, region, or physical resource.
  - Every future eligible profile must have exactly one explicit mapping for every required capability and complete equivalent evidence.
  - Unknown, missing, duplicate, partial, implicit, defaulted, fallback, provider-label-only, service-label-only, or reference-only mappings are rejected before eligibility.
  - AWS Tokyo and the RDS, S3, SQS, Secrets Manager, and KMS mappings remain the current Canonical Reference Architecture, while that status alone cannot select or satisfy any capability, admission, or evidence.
  - The Canonical AWS-specific ST-1502 objective and modules/config deliverable remain authoritative and NOT_STARTED/NOT_EXECUTED; this overlay neither erases, replaces, nor completes them.
  - Non-AWS and owner-managed profiles are additional portable implementation paths only and require the same complete capability mapping and evidence as AWS.
  - Existing private, encrypted, backup, policy, retention, deletion, disabled activation, forbidden native commands, zero action counts, and NOT_EXECUTED boundaries remain fail closed.
required_test_evidence:
  - Isolated tests/st1502 positive contract and generated-plan assertions.
  - Hostile tests for missing, unknown, duplicate, reordered, partial, defaulted, fallback, provider or service binding, and AWS-label-only admission attempts.
  - Hash-rebound hostile tests for the complete direct-owner handoff and exact ST-1501 provider-neutral predecessor semantics.
  - Existing hostile filesystem, closed-schema, exact-type, no-provider-call, no-network, and no-write tests remain passing.
  - Owner generator regeneration and read-only --check, Ruff for changed Python, and git diff --check.
  - Formal TST-026, TST-029, hosted CI, native IaC, provider, migration, restore, staging, release, deployment, and Production evidence remain separately unexecuted.
