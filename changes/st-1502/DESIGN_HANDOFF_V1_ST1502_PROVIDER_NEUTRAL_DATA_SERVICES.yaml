schema: DESIGN_HANDOFF_V1
version: 1
record_status: RECORDED_DURABLE_OWNER_DECISION
approved_story: ST-1502
approved_scope:
  - Define an additional provider-neutral data-services admission boundary for Full RAOS without making AWS or any provider a selected, default, fallback, or Production-admission binding.
  - Preserve AWS Tokyo and the RDS, S3, SQS, Secrets Manager, and KMS mappings as the current Canonical Reference Architecture inherited from INT-DEC-007 and RAOS-ARCH-001.
  - Preserve the Canonical AWS-specific ST-1502 objective and modules/config deliverable as authoritative, not erased, replaced, or completed by this portability overlay.
  - Admit non-AWS and owner-managed profiles only as additional portable implementation paths with identical complete capabilities and evidence.
  - Require every future data-services profile to map the same closed capability inventory and provide equivalent security, operations, release, recovery, migration, isolation, and residency evidence.
  - Keep every provider, account or project, region, service, plugin or adapter, credential, network, retention, and physical-resource binding unset while the relevant Open Decisions remain unresolved.
