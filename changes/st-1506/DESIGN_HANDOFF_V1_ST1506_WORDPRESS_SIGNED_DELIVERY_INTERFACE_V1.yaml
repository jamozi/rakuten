  rationale:
    - ST-1506 already owns a default-disabled Production deployment definition, artifact admission, health, rollback, approvals, and TST-032 boundary; extending that source-derived contract is narrower than creating a second deployment Story or mixing deployment into ST-1903.
    - Separating signed code delivery from article publication preserves distinct identities, trust roots, state machines, receipts, failures, approvals, and kill switches.
    - A root-signed keyring plus two routine signing purposes prevents one routine release key from independently authorizing a deployment and makes key rotation and revocation explicit.
    - Monotonic keyring and release high-water marks address replay and rollback attacks that semantic versions and expiry timestamps do not prevent.
    - A release set prevents a coupled child theme and plugin from being declared healthy in an unreviewed mixed-version state.
    - Interface-only data and hostile validation make the design reviewable without selecting credentials, endpoints, limits, filesystem behavior, or Production authority.
  rejected_alternatives:
    - alternative: COMBINE_CODE_DELIVERY_AND_ST1903_PUBLICATION_RUNTIME
      reason: The two control planes have different trust roots, credentials, canonical authority, failure modes, evidence, and kill switches.
    - alternative: IMPLEMENT_WORDPRESS_PHP_UPDATER_NOW
      reason: The current Story slice has no trust bootstrap, credential, target-filesystem, release, or Production authority.
    - alternative: SSH_OR_GIT_PULL_DEPLOYMENT
      reason: The owner selected a WordPress custom signed update path and SSH-backed Production access is excluded.
    - alternative: WORDPRESS_OR_BROWSER_CALLS_RAKUTEN
      reason: Rakuten credentials and normalization remain owned by a future RAOS backend adapter and are unrelated to ST-1506.
    - alternative: UNSIGNED_DIGEST_ONLY_OR_HTTPS_ONLY_TRUST
      reason: Neither proves exact owner release approval, intended audience, review evidence, sequence freshness, or replay safety.
    - alternative: SINGLE_LONG_LIVED_ROUTINE_SIGNING_KEY
      reason: One compromised routine key must not independently authorize deployment.
    - alternative: BOOTSTRAP_SELF_UPDATE_OR_REMOTE_ROOT_ROTATION
      reason: A compromised channel cannot safely replace its own root of trust.
    - alternative: SEMANTIC_VERSION_OR_EXPIRY_ONLY_REPLAY_CONTROL
      reason: Neither prevents equal-sequence replay, coordinated component downgrade, or restored-state rollback.
    - alternative: ASSUME_WORDPRESS_FILESYSTEM_ATOMICITY
      reason: Filesystem method, mount layout, storage, process interruption, and multi-component switching require target-specific staging proof.
    - alternative: BLIND_RETRY_OR_REMOTE_DOWNGRADE_ROLLBACK
      reason: Ambiguous writes can compound corruption and a remote downgrade can bypass monotonic admission.
    - alternative: AUTOMATIC_UNPUBLISH_ON_DEPLOYMENT_FAILURE
      reason: A code delivery failure must not mutate already-public content.
    - alternative: SELECT_ENDPOINT_CREDENTIAL_LIMIT_OR_RETENTION_VALUES_IN_THIS_SLICE
      reason: OD-009, OD-011, OD-013, and OD-015 remain unresolved and the interface can fail closed while all live values stay unset.
