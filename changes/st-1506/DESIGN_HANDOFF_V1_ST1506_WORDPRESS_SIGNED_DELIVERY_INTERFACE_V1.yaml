DESIGN_HANDOFF_V1:
  document_version: 1
  proposal_status: PENDING_EXACT_REPOSITORY_OWNER_APPROVAL
  authority: UNAPPROVED_DESIGN_HANDOFF_CANDIDATE
  approved_story: ST-1506
  approved_scope:
    - Extend the existing ST-1506 source-derived Production deployment definition with one closed, non-executable WordPress signed-delivery interface.
    - Preserve the existing ST-1506 Production-disabled, action-count-zero, no-network, no-credential, no-provider, and no-external-write boundaries.
    - Define the future manual bootstrap trust root, root-signed keyring, dual-purpose release signatures, release-set envelope, package admission, replay protection, transaction journal, health verification, one-restore containment, least-privilege authorization, receipts, and deployment kill switch as data only.
    - Keep the update-service origin, signing keys, WordPress identities, Application Passwords, filesystem method, compatibility bounds, package limits, runtime endpoint, scheduler, and every live Production binding unselected.
    - Add deterministic validation, generated projection, manifest binding, positive tests, and hostile fail-closed tests through the existing ST-1506 builder and test suite.
    - Record the exact approved handoff and detached owner approval as Story authority inputs without changing Canonical status.
    - Make no PHP plugin, theme, REST route, GitHub workflow, cryptographic runtime, package, deployment runtime, WordPress mutation, Rakuten call, publication path, release, or Production activation.
