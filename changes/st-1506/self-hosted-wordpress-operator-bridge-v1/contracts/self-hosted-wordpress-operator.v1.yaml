    UPDATE_CHILD_THEME: THEME_UPDATE_APPLIED
  malformed_or_cross_operation_post_write_effect: OUTCOME_AMBIGUOUS_AND_RETAIN_MATCHING_INTENT
proposal:
  ttl_seconds: 900
  storage_bounds:
    nonterminal_unexpired_per_proposer_maximum: 20
    creations_per_proposer_per_rolling_window_maximum: 5
    rolling_window_seconds: 600
    total_rows_maximum: 1000
    caller_selected_limits: FORBIDDEN
    automatic_deletion: FORBIDDEN
  request_token:
    pattern: ^[0-9a-f]{64}$
    purpose: one caller intent per proposal without reusing a terminal record
    generation: INTERNAL_OS_CSPRNG_32_BYTES
    caller_supplied: false
  canonicalization:
    accepted_types:
    - object
    - array
    - string
    - integer
    - boolean
    - 'null'
    floats: FORBIDDEN
    duplicate_keys: FORBIDDEN
    unknown_keys: FORBIDDEN
    object_key_order: UNICODE_CODE_POINT_ASCENDING
    separators: COMMA_AND_COLON_WITHOUT_WHITESPACE
    string_encoding: JSON_ASCII_ESCAPED
    final_newline: ABSENT
  proposal_id:
    expression: lower_hex(sha256(canonical_validated_request_bytes))
    pattern: ^[0-9a-f]{64}$
    public_proposal_hash_field: ABSENT
    etag: SAME_VALUE
  immutable_server_bindings:
  - proposal_id
  - canonical_validated_request_bytes
  - proposer_user_id
  - created_at
  - expires_at
  - before_state_hash
  - operation
  state_machine:
    initial: PROPOSED
    states:
    - PROPOSED
    - APPROVED
    - APPLYING
    - APPLIED
    - FAILED
    - NEEDS_RECOVERY
    - EXPIRED
    terminal:
    - APPLIED
    - FAILED
    - NEEDS_RECOVERY
    - EXPIRED
  replay_policy:
    proposal_create_same_nonterminal_request: IDEMPOTENT_RECEIPT
    proposal_create_same_terminal_request: HASH_BOUND_TERMINAL_RECEIPT_THEN_NEW_REQUEST_TOKEN_REQUIRED
    apply_applied_proposal: IDEMPOTENT_RECEIPT_NO_SECOND_WRITE
    terminal_record_for_new_intent: NEW_REQUEST_TOKEN_REQUIRED
    approval_reuse_for_different_id: FORBIDDEN
  canonical_golden_vector:
    fixture: changes/st-1506/self-hosted-wordpress-operator-bridge-v1/contracts/canonical-proposal-golden.v1.json
    request_token: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    canonical_byte_length: 870
    proposal_id: 699a1c5a40786449e3f0241958a594f436e03504472a592d2abc1e3eae2b7d90
    python_verification: REQUIRED
    php_runtime_self_check_before_proposal_create: REQUIRED
