    path: /wp-json/raos-operator/v1/proposals/{proposal_id}/apply
    capability: raos_operator_apply
    request_body: OPERATION_SPECIFIC_APPLY_PAYLOAD
    required_header:
      If-Match: QUOTED_PROPOSAL_ID
      Idempotency-Key: UNQUOTED_PROPOSAL_ID
    operator_state_write: true
    wordpress_target_mutation: true
    host_write_constant_required: true
