schema: DESIGN_HANDOFF_V1
version: 1
record_status: RECORDED_DURABLE_OWNER_DECISION
approved_story: ST-1506
approved_scope:
  - Define Full RAOS Production admission without assuming or requiring AWS or any other infrastructure provider.
  - Retain AWS Tokyo only as optional historical reference metadata inherited from INT-DEC-007.
  - Require every future Production profile to map the same closed capability inventory and provide equivalent security, operations, release, and residency evidence.
  - Keep every current provider/profile binding unset and Production disabled while OD-009, OD-011, OD-013, and OD-015 remain unresolved.
