rationale:
  - The RAOS Core already uses portable protocol and adapter boundaries, so Production admission should evaluate capabilities and evidence rather than a provider name.
  - The current five predecessor Stories now define complementary provider-neutral foundation, data, compute-edge, identity, and staging admission boundaries that Production must preserve as a complete chain.
  - Provider-name admission would turn Canonical Reference Architecture status into an unsafe default and would allow unequal security or operational assurance.
  - A closed dependency and capability inventory permits AWS, another cloud, or owner-managed infrastructure without selecting an unreviewed live provider now.
  - Keeping all bindings null and eligibility not evaluated preserves the documented safe defaults and external human gates.
rejected_alternatives:
  - Require AWS or ap-northeast-1 merely because INT-DEC-007 records them as reference architecture.
  - Treat AWS labels, service names, predecessor completion, or existing Terraform metadata as sufficient Production admission evidence.
  - Ignore, downgrade, or treat as historical-only the current provider-neutral ST-1501 through ST-1505 capability and evidence contracts.
  - Select another cloud or owner-managed platform before capability mapping, region, budget, credentials, and operations decisions exist.
  - Permit partial, unknown, duplicate, implicit, defaulted, or fallback capability mappings.
  - Lower security, operations, release, backup, restore, or residency evidence for any provider kind.
constraints:
  - Every ST-1501 through ST-1505 design handoff, contract, owner generator, and generated plan remains raw-hash, semantic-hash, and deterministic-byte bound.
  - Every predecessor owner validator must accept its complete closed contract and reproduce the committed plan bytes before the dependency can be admitted.
  - A future Production profile must satisfy the complete provider-neutral foundation, data-services, compute-edge, deployment-identity, and staging dependency chain before Production capability admission can be eligible.
  - Exactly one explicit mapping is required for every required capability before a future profile can be eligible.
  - Missing, unknown, duplicate, partially evidenced, or provider-label-only mappings fail closed.
  - Compute must support the required RAOS web, API, worker, and scheduler workloads without provider types entering the domain.
  - Persistence must be PostgreSQL-compatible and preserve migration compatibility and recovery evidence.
  - Object storage must be S3-compatible and support immutable or versioned artifacts wherever the owning data contract requires them.
  - Queue delivery must be at least once with DLQ behavior and idempotent consumers.
  - Public edge capability must cover DNS, TLS, WAF, and public/admin/internal isolation.
  - Workload identity and secrets must be short-lived or otherwise explicitly reviewed, least-privilege, non-ambient, and auditable.
  - Production migration admission requires an assigned migration owner, independent review and approval, compatibility evidence, and no self-approval or bypass.
  - Every artifact, promotion, identity federation, deployment, migration, canary/runtime, telemetry/alerting, rollback/restore, and infrastructure-provider network flow requires authenticated encrypted transport, exact peer/hostname verification, and downgrade-resistant evidence.
  - Telemetry, alerts, backup/restore, promotion, canary, rollback, and region/data-residency evidence are mandatory and provider-neutral.
  - Current ST-1501 through ST-1505 artifacts are mandatory provider-neutral dependency semantics but provide no provider selection, default, fallback, deployment, release, or Production authority by themselves.
  - No credential, provider call, external write, infrastructure apply, deployment, release, or status transition is authorized by this record.
security_and_approval_gates:
  - Preserve four distinct immutable human-controlled release, GATE, security, and operations approval artifacts.
  - Preserve protected-environment, exact repository/ref/workflow, least-privilege identity, artifact provenance, independent migration review, cross-capability transport security, canary, smoke, and rollback requirements.
  - Preserve OD-009 budget, OD-011 notification, OD-013 region/residency, and OD-015 credential blockers until their owners provide valid evidence.
  - Require the same security, operations, release, backup/restore, and residency evidence for AWS, another cloud, and owner-managed infrastructure.
  - Never infer eligibility from a provider name, AWS Canonical Reference Architecture status, a partial predecessor chain, predecessor completion alone, or local generator/test success.
acceptance_criteria:
  - The ST-1506 source and generated reference expose a closed five-story provider-neutral dependency inventory and ten-capability inventory with no selected, default, or fallback profile.
  - Every future eligible profile must satisfy all five exact predecessor admissions, have exactly one explicit mapping for every required Production capability, and provide complete equivalent evidence.
  - Unknown, missing, duplicate, reordered, partial, implicit, predecessor-only, or label-only dependency or capability mappings are rejected before eligibility.
  - AWS Tokyo remains the current Canonical Reference Architecture, while that status alone cannot satisfy admission or evidence.
  - The Canonical AWS-specific ST-1506 objective and disabled-by-default Production pipeline deliverable remain authoritative and NOT_STARTED/NOT_EXECUTED; this overlay neither erases, replaces, nor completes them.
  - Non-AWS and owner-managed Production profiles remain additional portable implementation paths admitted only by identical complete capabilities and evidence.
  - Independent migration review and authenticated, encrypted, peer-verified, downgrade-resistant cross-capability transport evidence remain required and unconfigured.
  - All existing disabled activation, zero action counts, unresolved decisions, human approvals, and NOT_EXECUTED evidence remain unchanged.
required_test_evidence:
  - Isolated tests/st1506 positive contract and generated-plan assertions.
  - Hostile tests for every predecessor raw, semantic, generated-byte, owner-validator, missing, unknown, duplicate, reordered, partial, defaulted, fallback, predecessor-shortcut, and AWS-label-only admission attempt.
  - Owner generator regeneration and read-only --check.
  - Ruff for changed Python, git diff --check, and affected ST-1506 developer checks.
  - Formal TST-032, hosted CI, provider, staging, release, and Production evidence remain separately unexecuted.
