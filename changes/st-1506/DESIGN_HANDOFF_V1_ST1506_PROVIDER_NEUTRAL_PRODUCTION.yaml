  - repo://docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml#OD-015
  - repo://docs/canonical/07_backlog/RAOS_13_story_backlog_v1.0.yaml#ST-1506
  - repo://docs/upstream/key_documents/RAOS_02_system_architecture_v0.1.md#ARCH-PRINCIPLE-09
