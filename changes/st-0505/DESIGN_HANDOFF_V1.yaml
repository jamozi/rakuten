schema: DESIGN_HANDOFF_V1
version: 1
approved_story: ST-0505
approved_scope:
  - fixed owner-local Rakuten Ichiba Item Search 2026-07-01 smoke interface
  - at most one explicit GET per invocation, exactly one only after all local preconditions pass, with zero retry and zero pagination
  - owner-private fixed JSON credential read only when hash-bound to a separate staging credential attestation, plus sanitized private report write
  - fake-only local verification and generated ST-0505 reference artifacts
  - separate reversible owner-local production-read integration for the reviewed Item Search 2026-07-01 and Product Search 2025-08-01 APIs
  - authenticated setup, rotate, doctor, closed API registry, explicit request-file reads, and fixed one-call smoke commands in an independently installed owner-private runtime
  - side-by-side owner-local result V3 with closed value-free response-validation stage and collection detail, with immutable V1 and V2 evidence
