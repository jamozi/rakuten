rationale:
  - isolates an owner-local non-formal diagnostic surface from the recorded production search service without treating it as Canonical live-test evidence
  - preserves the unchanged ST-0502 request policy and OD-015 default-safe behavior
  - makes the smallest provider call capable of checking auth, schema, rate classification, and affiliateUrl presence
  - prevents credential values and raw or provider-reflected response material from entering tracked repository content or reports
  - provides a separately named owner-local read surface without changing the staging-only rakuten-live-smoke entry or the recorded ST-0502 adapter
  - treats a provider-production credential as local provider access only, never as evidence of RAOS Production or formal staging acceptance
rejected_alternatives:
  - provider SDK or third-party HTTP dependency
  - ambient proxy discovery, redirect following, endpoint overrides, retry, or pagination
  - environment-variable credentials, interactive credential intake, or command-line secret values
  - review bodies, review-derived inputs, affiliate rate, EPC, RPM, or revenue fields
  - treating a local invocation as TST-016, staging, release, or Production evidence
  - accepting an arbitrary structurally valid or production credential without a separate exact-byte staging-purpose binding
  - repurposing or weakening the staging-only rakuten-live-smoke runtime
  - arbitrary provider origins, paths, headers, API registration, request parameters, redirects, retries, pagination follow-ups, or IP fallback
  - passing secret values through argv, environment, stdout, stderr, shell history, repository files, or generated artifacts
constraints:
  - fixed GET keyword=収納 hits=1 page=1 format=json formatVersion=2 sort=standard
  - applicationId and affiliateId appear only in the query; accessKey appears only in the accessKey header
  - credential file is exact-schema, current-UID, regular, non-symlink, mode 0600, bounded, byte-identical across two descriptor reads, and identity/size/mtime/ctime-stable; rotation uses atomic replacement
  - a separate exact-schema mode-0600 staging binding must classify the purpose as DEDICATED_TEST_CREDENTIAL_FOR_NON_FORMAL_DIAGNOSTIC and bind the SHA-256 of the exact credential-record bytes; the repository never creates this Operations evidence
  - every DNS candidate is parsed and public-address validated before connection; one unsafe or malformed candidate rejects the entire set, and the first validated numeric sockaddr is pinned for the only TCP attempt while TLS SNI, certificate hostname verification, and HTTP Host remain openapi.rakuten.co.jp
  - connect and read timeouts are bounded; response maximum is 2 MiB
  - response is strict UTF-8 JSON with duplicate, nonfinite, depth, node, and schema checks
  - HTTP 429 classifies rate as THROTTLED while authentication remains NOT_OBSERVED
  - reports contain only the closed sanitized field set and are atomically published mode 0600
  - report schema V2 records SHA-256 only over the complete bounded response-body byte sequence after strict Content-Length/chunked/close-delimited framing; status, headers, and framing are excluded, malformed/conflicting/truncated/oversized bodies get no digest, and the body is never persisted
  - failed report rollback attempts a fixed mode-0600 recovery-required marker when safe cleanup cannot complete
  - any recovery marker or abandoned preflight name blocks doctor, live preflight, and every subsequent report publication
  - the trusted runtime is installed outside the repository as an exact hash-bound owner-private tree
  - every install or reinstall first binds fd 4 to the named repository stage and, before hashing or parsing, the static outer gate requires a current-UID regular single-link bounded non-group-or-world-writable inode; that authenticated static-BusyBox stage verifies the exact root-owned Python binary and root-owned OS loader, native-library, and stdlib metadata closure, then verifies the exact installer through fd 6 before Python parses repository bytes
  - the runtime installer is credential-blind local maintenance: it never opens, stats, lists, reads, writes, or mutates .secrets, credential records, staging bindings, or reports, and it never starts doctor, live execution, or network access
  - exact reinstall fully validates the installed versioned bundle and returns ALREADY_INSTALLED; a distinct reviewed bundle is published side-by-side without migrating, rebinding, or deleting credentials, bindings, or reports
  - the static root-owned BusyBox stage zero replaces loader and shell environment, verifies the exact launcher SHA-256, and only then executes the launcher
  - doctor checks report metadata before reading the credential record and performs no network or filesystem mutation
  - run proves anonymous publication, identity, rollback, and directory fsync before reading credentials or attempting the GET
  - owner-local Item requests reuse the unchanged ST-0502 RakutenItemSearchLiveRequestV1, require exactly one selector and page 1, and omit review aggregates and affiliate-rate material from normalized output
  - an exact owner-local Item itemCode or shopCode request accepts returned records only when every selected identity value matches exactly; a valid but different provider identity fails as RESULT_MISMATCH before credential-reflection inspection
  - owner-local Product requests allow keyword with optional genreId, genreId alone, or one exclusive productId/productCode; page is 1 and sort is standard
  - an exact owner-local Product productId or productCode request accepts returned records only when every selected identity value matches exactly; a valid but different provider identity fails as RESULT_MISMATCH
  - page-1 response summaries bind empty collections to zero count, pageCount, first, and last; non-empty collections require count at least the returned cardinality, pageCount from 1 through 100, first 1, and last equal to returned cardinality
  - the closed owner-local result V1 key set always includes count, page, first, last, hits, and pageCount; success stores their validated integers, every failure stores all six keys as null, and canonical result files sort keys in compact UTF-8 JSON with one trailing LF
  - first and last complete the repository V1 contract while runtime install and execution evidence remain NOT_EXECUTED; no deployed-result migration or backward-compatibility status is claimed
  - every Item record requires itemCode and itemName as non-null non-empty bounded UTF-8 strings, and every Product record requires productCode and productId with the same shape; shopCode, shopName, and productName remain optional and nullable unless selected as an exact selector
  - every non-empty Item record requires itemUrl and every non-empty Product record requires productUrlPC as a non-null strict HTTPS URL; missing, null, empty, non-string, or non-HTTPS required URL values fail as RESPONSE_SCHEMA_DRIFT before success or persistence, while the existing nullable scalar affiliateUrl and Product image URL values and non-null URL-list rules remain unchanged
  - every normalized URL rejects ASCII whitespace, Unicode control characters, raw backslashes, malformed percent escapes, userinfo, fragments, and invalid IDNA DNS or bracketed-IPv6 host syntax while preserving valid international or punycode hostnames, IPv4, bracketed IPv6, ports, paths, and queries
  - after API/fingerprint/hits and exact-selector binding and before a success envelope, every normalized record string and string-list member is checked against all three non-empty known credential values in raw and single-percent-decoded form; any inspected-text match fails as fixed RESPONSE_SCHEMA_DRIFT with complete response metadata and request_count 1 but no provider_result, summary, record, or matched value
  - all six schema- and relationship-validated summary integers plus every non-text normalized value already accepted by its field schema are not converted to credential-comparison text; typed scalar coincidence alone is not credential reflection
  - every owner-local invocation uses at most one GET, one resolved public IP candidate, zero redirect, zero retry, zero pagination follow-up, and no proxy or TLS override environment
  - setup refuses an existing record; rotate atomically replaces only a fully validated record; installer is credential-blind and never opens .secrets
  - persisted owner-local results are mode 0600, no-replace, normalized UNTRUSTED_PROVIDER_DATA and contain response SHA-256 but no raw body, headers, provider errors, credentials, affiliate-rate, review bodies, EPC, RPM, or revenue material
security_and_approval_gates:
  - the complete static-BusyBox environment-cleared runtime-install command is the only reviewed repository maintenance entry and never reads credentials
  - every install and reinstall validates stage path/descriptor identity and safe metadata before authenticating the exact stage, root Python trust closure, and installer descriptor before Python parses repository bytes
  - direct repository-path execution of the installer refuses before runtime mutation; authenticated installation is credential-blind owner-local maintenance and never chains doctor or live execution
  - repository Make entrypoints are not provided; installation, doctor, and live execution use only the complete reviewed direct commands
  - the two complete fixed BusyBox digest-gate commands are the only authoritative doctor/live entries and each requires a fresh explicit invocation
  - these commands are technical entry gates only; this artifact grants no live-provider authority and every result remains a non-formal, non-attesting diagnostic
  - direct installed launcher invocation refuses before credential access without the authenticated outer-gate launcher descriptor on fd 4
  - direct Python payload invocation is refused without the inherited stage-zero launcher descriptor
  - HTTP 403 or authentication/IP mismatch fails closed with no retry; user-side provider configuration correction is required before another invocation
  - no implementation, test, generation, or commit step may invoke the live provider
  - publication, release, staging, Production, finance, and Canonical status transitions remain separately gated
  - repository drift and other-UID mutation cannot modify the owner-private installed tree; the current-UID managed Python and stdlib tree is trusted after owner/type/no-group-or-world-write checks
  - the install bootstrap trusts the exact root-owned Python binary plus a root-owned, non-group-or-world-writable OS loader, native-library, and stdlib metadata closure; root or package-manager compromise is out of scope and OS drift fails closed pending review
  - same-UID in-place mutation after final descriptor hashing or deliberate stage-zero descriptor forgery is out of scope; pathname replacement is bound or refused through inherited descriptors
  - the owner-local setup/rotate prompt and every secret-bearing command are reachable only after the exact installed launcher and payload have been authenticated before body execution
  - the generated custom-request entry authenticates the exact installed launcher through the same fd-4 SHA-256 gate before body execution, accepts exactly two positional values at fixed argv indices for a closed API name and absolute request file, and direct-executes quoted arguments without eval or shell interpolation
  - owner-local installation is side-by-side and credential-blind; no repository Make entry is authoritative for setup, rotation, credential reads, or provider requests
  - all owner-local tests use disposable secret roots, fake transports, and recorded bodies; they never inspect the real credential path or call Rakuten
acceptance_criteria:
  - fake success produces LIVE_SMOKE_PASS with request_count=1 retry_count=0 pagination_count=0 and affiliate_url_present=true
  - success and every complete bounded provider response body persist SHA-256 of the body bytes without raw or reflected body material
  - missing, malformed, stale, or non-staging credential binding refuses before a credential-bearing connection, and mixed/private/link-local/loopback DNS candidates refuse before socket creation
  - accessKey is absent from query, output, report, repr, and sanitized exceptions
  - all fixed HTTP, network, malformed-response, credential-store, and report-store failures are non-reflective and fail closed
  - generated plan exposes the explicit command while default activation and all formal/live evidence remain disabled or NOT_EXECUTED
  - setup/rotate preserve hidden TTY input and atomic owner-only storage without secret values in argv, environment, output, exceptions, repr, results, or generated artifacts
  - item-search and product-search request fixtures prove exact authentication placement, fixed origin/path/version, safe parameter sets, response allowlists, and at-most-one-call failure semantics
  - keyword, genre, smoke, and exact-selector fixtures reject null, empty, edge-whitespace, non-string, or oversized mandatory Item itemCode/itemName and Product productCode/productId values while preserving optional shopCode/shopName/productName behavior
  - normalized mandatory, optional, and list URL positions reject hostile whitespace, control, backslash, host, userinfo, fragment, port, and percent-escape syntax while retaining the documented valid international, IPv6, port, path, and query forms
  - the generated custom-request argv template rejects unrendered placeholders, unknown APIs, relative paths, extra arguments, and launcher tampering before dispatch, while hostile absolute path bytes remain one quoted positional argument
  - itemCode/shopCode and productId/productCode identity drift and contradictory empty or non-empty response summaries fail closed with complete sanitized response metadata
  - provider reflection of each known credential value through every normalized URL, ordinary string, string-list member, or percent-encoded string fails before result persistence without redaction or secret-bearing output
  - short numeric application/access/affiliate credentials coinciding with each validated count, page, first, last, hits, or pageCount value for both enabled APIs, or with any non-text normalized value accepted by its field schema, do not fail solely because of typed scalar equality
  - Item and Product success, including empty collections, persist all six validated summary scalars; every ordinary or credential-reflection failure retains the same exact result-object key set with all six summary values null
  - owner-local result envelopes remain OWNER_LOCAL_NON_FORMAL_LIVE_EVIDENCE and UNTRUSTED_PROVIDER_DATA with formal TST-016, ENV-STAGING, OD-015 resolution, and RAOS Production unchanged
required_test_evidence:
  - isolated tests/st0505 with no owner credential read and no provider network
  - affected tests/st0502
  - owner generator regeneration and --check
  - Ruff, strict type checks, shell syntax if present, workspace/canonical checks, sensitive scan, and git diff --check
  - hostile installed-runtime, installer, TTY, credential-store, request-file, result-store, DNS/TLS, response-parser, credential-reflection, and secret-leakage tests for rakuten-owner-local
