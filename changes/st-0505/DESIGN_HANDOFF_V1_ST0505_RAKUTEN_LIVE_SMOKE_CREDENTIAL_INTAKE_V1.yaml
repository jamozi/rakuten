DESIGN_HANDOFF_V1:
  document_version: 1
  proposal_status: APPROVED_FOR_LOCAL_SETUP_CHECK_IMPLEMENTATION_ONLY
  approved_story: ST-0505
  approved_scope:
    - Add one local setup command and one metadata-only check command for the fixed ST-0505 Rakuten credential store.
    - Accept exactly two hidden values from the controlling terminal and create exactly two owner-only aliases without overwrite or rotation.
    - Keep the credential intake disconnected from every runtime adapter, provider request, endpoint, account, network transport, storage system, persistence system, publication path, release path, and Production path.
    - Preserve OD-015 as unresolved and preserve RECORDED_FIXTURE_ONLY as the live-provider safe default.
  source_design_refs:
