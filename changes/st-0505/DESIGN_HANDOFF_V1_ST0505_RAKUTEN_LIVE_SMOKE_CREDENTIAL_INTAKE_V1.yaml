      sha256: 540d2775ab16fd3f456673bca25f00eb3f8d58c7bb4adb30f5625551b5529e7a
    - uri: repo://docs/canonical/01_integration/RAOS_07_canonical_decisions_v1.0.yaml
      sha256: 6330a7e8690edeb30de47ac15a1294e42534bf5d9ef617064ef7c0e0f71c7626
    - uri: repo://docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml
      sha256: a51de01ab7665c37047371cad8c9308d3d1a9428dab485599a2ce3de3ddba07e
    - uri: repo://docs/canonical/05_test/RAOS_11_test_suite_catalog_v1.0.yaml
      sha256: 7ccbb8449118e64275c8f44a876d1a49eebb8dde23847f81c76493d6cd8de98b
    - uri: repo://docs/canonical/07_backlog/RAOS_13_story_backlog_v1.0.yaml
      sha256: 4adcff3f293b82160a390e5d3e5102fd0bd0f46875d09677e0ba9b230eba680d
    - uri: repo://changes/st-0502/DESIGN_HANDOFF_V1_ST0502_RAKUTEN_PRODUCT_SEARCH_OFFLINE_V1.yaml
      bytes: 13755
      sha256: c5574b8b7e7941c7781a795ac23f323fefbfc446c4fffecd208fe473bb6bda2d
    - uri: https://webservice.rakuten.co.jp/documentation/ichiba-item-search
      retrieved_at: '2026-08-21'
      evidence_class: CURRENT_OFFICIAL_PRIMARY_DOCUMENTATION
      api_version: '2026-07-01'
      required_application_id: true
      required_access_key: true
      affiliate_id_optional: true
  decision:
    interface:
      status: LOCAL_CREDENTIAL_INTAKE_AVAILABLE
      version: V1
      setup_command: /home/minami/rakuten/scripts/rakuten_live_smoke_credentials_python.sh setup
      check_command: /home/minami/rakuten/scripts/rakuten_live_smoke_credentials_python.sh check
      fixed_physical_repository_root: /home/minami/rakuten
      python_execution:
        applies_to:
          - launcher_validation
          - credential_cli
        flags:
          - -I
          - -S
        isolated_mode: REQUIRED
        site_import: DISABLED
        executable_pth_hooks: DISABLED
        dependency_surface: PYTHON_STANDARD_LIBRARY_ONLY
      store_root: .secrets/rakuten-live-smoke
      staging_root: .secrets/.rakuten-live-smoke.preparing
      committing_marker: .secrets/.rakuten-live-smoke.committing
      ready_marker: .secrets/.rakuten-live-smoke.ready
      validating_marker: .secrets/.rakuten-live-smoke.validating
      committed_marker: .secrets/.rakuten-live-smoke.committed
      aliases:
        - logical_name: application_id
          alias: rakuten_web_service_application_id
        - logical_name: access_key
          alias: rakuten_web_service_access_key
      excluded_aliases:
        - rakuten_affiliate_id
      runtime_reader: ABSENT
      provider_adapter: ABSENT
      live_smoke_connection: NOT_CONNECTED
    input:
      source: /dev/tty
      argv: FORBIDDEN_FOR_VALUES
      environment: FORBIDDEN_FOR_VALUES
      stdin: FORBIDDEN_FOR_VALUES
      chat: FORBIDDEN_FOR_VALUES
      echo: DISABLED
      echonl: DISABLED
      prompts: ASCII_ONLY
      both_values_before_durable_write: true
      core_dumps: DISABLED_BEFORE_INPUT
      linux_dumpability: DISABLED_BEFORE_INPUT
      child_process_after_input: FORBIDDEN
      mutable_buffer_wipe: BEST_EFFORT
    filesystem:
      secret_parent_mode: '0700'
      store_mode: '0700'
      alias_mode: '0600'
      owner: CURRENT_EFFECTIVE_UID_ONLY
      regular_files_only: true
      link_count: 1
      exact_inventory_only: true
      symlink_ancestors: FORBIDDEN
      symlink_leaf: FORBIDDEN
      hardlink: FORBIDDEN
      fifo_device_socket: FORBIDDEN
      create_flags:
        - O_NOFOLLOW
        - O_EXCL
        - O_CLOEXEC
      file_fsync: REQUIRED
      parent_fsync: REQUIRED
      prepublish_file_stage_parent_fsync: REQUIRED
      publish: RENAMEAT2_RENAME_NOREPLACE
      publish_inode_binding: RETAINED_DIRECTORY_FD_BEFORE_AND_AFTER_RENAME
      postpublish_parent_fsync: REQUIRED
      readiness_intermediate: COMMITTING_TO_READY_RENAME_NOREPLACE
      validating_state: INVALID_UNTIL_FINAL_METADATA_INSPECTION_PASSES
      readiness_commit: VALIDATING_TO_COMMITTED_RENAME_NOREPLACE_LAST_OPERATION
      external_ready_shape: FINAL_STORE_PLUS_READY_PLUS_COMMITTED_WITH_NO_ACTIVE_MARKERS
      overwrite: FORBIDDEN
      rotation: OUTSIDE_V1
      normal_failure_rollback: NO_AUTOMATIC_ROLLBACK_OR_REPAIR
      failure_residue: OWNER_ONLY_FAIL_CLOSED
      crash_residue: FAIL_CLOSED_NO_AUTOMATIC_DELETE_OR_REPAIR
      same_euid_concurrent_mutator: FORBIDDEN_DURING_SETUP_OR_CHECK
    check:
      content_open: FORBIDDEN
      content_read: FORBIDDEN
      active_markers:
        - .rakuten-live-smoke.preparing
        - .rakuten-live-smoke.committing
        - .rakuten-live-smoke.validating
      any_active_marker_present: INVALID
      ready_markers_required_with_final_store:
        - .rakuten-live-smoke.ready
        - .rakuten-live-smoke.committed
      result_vocabulary:
        - ABSENT
        - READY
        - INVALID_WITH_FIXED_REASON_CODE
      ready_meaning: METADATA_STRUCTURE_ONLY_NOT_CREDENTIAL_VALIDITY_OR_LIVE_AUTHORITY
    future_transport:
      application_id_transport: QUERY_PARAMETER_PER_PROVIDER_CONTRACT
      access_key_transport: DEDICATED_HTTP_HEADER_ONLY
      access_key_query_parameter: FORBIDDEN_BY_RAOS
      implementation_in_this_slice: ABSENT
    execution:
      credential_values_received: false
      credential_store_setup: NOT_EXECUTED
      credential_store_check_against_real_store: NOT_EXECUTED
      provider_call: NOT_EXECUTED
      network: NOT_EXECUTED
      formal_tst_016: NOT_EXECUTED
      staging: NOT_EXECUTED
      publication: NOT_EXECUTED
      release: NOT_EXECUTED
      production: NOT_EXECUTED
  rationale:
    - The user needs a safe local handoff point before any future provider adapter can consume credentials.
    - The established WordPress.com pattern demonstrates fixed aliases, a pinned launcher, direct hidden terminal input, exclusive owner-only files, and sanitized receipts without making that provider-specific implementation a cross-Story dependency.
    - A separate setup/check interface allows local credential intake to exist while OD-015 continues to block live provider execution.
    - Excluding the optional affiliate ID keeps V1 to the minimum exact pair required by the current Item Search contract.
    - Header-only future access-key transport preserves the stricter existing RAOS boundary even though provider documentation also describes a query transport.
  rejected_alternatives:
    - alternative: Pass credential values through argv, environment variables, stdin, chat, or tracked configuration.
      reason: Those channels can leak through process inspection, logs, history, transcripts, or repository artifacts.
    - alternative: Add a runtime credential reader or live Rakuten adapter now.
      reason: OD-015 remains unresolved and this slice has no live-provider authority.
    - alternative: Include rakuten_affiliate_id in the initial store.
      reason: The provider marks it optional and it is outside the minimum approved V1 pair.
    - alternative: Repair, overwrite, or rotate a partial or existing store automatically.
      reason: Silent repair can destroy or substitute credential material; partial and crash-residue states must remain fail closed.
    - alternative: Add root Makefile targets.
      reason: The root Makefile is hash-bound by multiple unrelated Stories; fixed launcher commands keep this Story-local slice provenance-closed.
  constraints:
    - No secret value may enter repository bytes, argv, environment, stdin, chat, stdout, stderr, exceptions, receipts, logs, hashes, or length reports.
    - Setup and check are bound to the exact physical repository root; tests may inject one explicit temporary root without changing the CLI.
    - Launcher validation and credential CLI execution both use pinned Python with exact -I -S flags; site import and executable .pth startup hooks are disabled.
    - Setup and check require exclusive same-EUID access to this fixed store namespace and its five transaction names; an uncoordinated same-EUID concurrent mutator is outside the supported trust boundary and is forbidden.
    - Metadata READY never proves provider validity, credential validity, owner consent, or live authority.
    - Generated ST-0505 artifacts are written only by the existing owner generator.
    - No WordPress, ST-0502, Canonical, upstream, status, workflow, lock, publication, release, staging, or Production artifact may change.
  security_and_approval_gates:
    sec_data_001_tls: NOT_APPLICABLE_NO_NETWORK
    sec_data_003_secret_handling: REQUIRED
    sec_data_004_integrity: REQUIRED
    od_015:
      status: EXTERNAL_EVIDENCE_REQUIRED
      blocking: true
      safe_default: RECORDED_FIXTURE_ONLY
      resolved: false
    credential_entry_by_implementation: NOT_AUTHORIZED_AND_NOT_EXECUTED
    provider_use: NOT_AUTHORIZED_AND_NOT_EXECUTED
    live_smoke: NOT_AUTHORIZED_AND_NOT_EXECUTED
    formal_tst_016: NOT_EXECUTED
    staging: NOT_EXECUTED
    publication: NOT_EXECUTED
    release: NOT_EXECUTED
    production: NOT_EXECUTED
  acceptance_criteria:
    - The fixed launcher accepts only literal setup or check and sanitizes inherited Python, proxy, TLS, loader, and credential-like environment variables before pinned isolated no-site stdlib-only Python execution with exact -I -S flags for both validation and the final credential CLI.
    - Setup reads both nonempty bounded values only from direct hidden /dev/tty input after disabling core dumps and Linux dumpability, then writes both aliases in the fixed preparing namespace with file, stage, and parent fsync.
    - A fully fsynced pair is published by RENAME_NOREPLACE while the staging inode remains bound to an open descriptor; the final inode is verified and the parent is fsynced before the retained committing marker is promoted to READY.
    - The still-present validating marker keeps external check INVALID during READY inode verification, the final parent fsync, and an internal metadata-only inspection; validating is promoted to committed by RENAME_NOREPLACE as the last operation, after which external READY requires final store plus ready plus committed and no active marker.
    - Exact already-ready metadata returns READY without prompting or reading values; partial, unknown, linked, special, wrongly owned, or wrongly permissioned state fails closed.
    - Check distinguishes ABSENT and READY using directory entries and stat metadata only and never opens an alias file.
    - Normal write failure performs no name-based unlink or rmdir and leaves owner-only residue fail closed; partial, replaced, or crash-residue state is never deleted or repaired automatically.
    - All receipts and errors use fixed sanitized vocabulary and contain no secret-derived material.
    - The reference plan distinguishes local credential intake availability from the still disabled and non-executable live-smoke plan.
  required_test_evidence:
    - Focused hostile filesystem, TTY, disclosure, failure-residue, output-sanitization, executable-.pth startup-hook, launcher, and static no-network tests.
    - Full isolated tests/st0505 plus affected tests/st0502 and tests/st0503.
    - ST-0505 owner generation followed by no-write check.
    - bash -n, Ruff lint and format, strict mypy, Pyright, compile/import, Canonical import verify, workspace check, diff check, protected-path check, and focused secret scan.
  open_decisions: []
  approval:
    authority: CONNECTED_REPOSITORY_OWNER_DIRECTIVES_FOR_LOCAL_SETUP_CHECK_IMPLEMENTATION_ONLY
    exact_hash_owner_statement: NOT_OBSERVED_AND_NOT_CLAIMED
    directives:
      - 楽天API,Wordpressなどのキーを渡して、直接Codexから操作できるようにしてほしい。別の人が実装した事例があればそれを参考に。安全な形でキーを保存・参照できるように。
      - Implement the plan.
      - Actionsが使えるようになったはずなので、進めて
      - APIキーを渡したい
      - 進めて
    authorized:
      - reversible_repository_local_implementation
      - local_setup_interface
      - metadata_only_check_interface
      - local_tests_and_owner_generation
      - atomic_local_commit
    not_authorized:
      - credential_value_entry_or_read_by_implementation
      - live_provider_call
      - endpoint_or_account_selection
      - network_execution
      - publication
      - staging
      - release
      - production
