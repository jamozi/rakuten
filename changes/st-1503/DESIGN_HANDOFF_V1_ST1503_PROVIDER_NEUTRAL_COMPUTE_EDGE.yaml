rationale:
  - INT-DEC-007 makes AWS Tokyo a Reference Architecture while requiring a portable Core, so compute-edge admission must evaluate capabilities and evidence rather than AWS service names.
  - Provider, account, region, runtime, scheduler, registry, ingress, edge, DNS, TLS, WAF, plugin, or adapter defaults would silently turn historical reference mappings into live infrastructure choices.
  - Runtime scheduling, edge mediation, DNS and TLS across Public, Internal, Provider, and origin interactions, abuse controls, trust-boundary isolation, workload identity, observability, rollback, and residency are provider-neutral operational outcomes.
  - Keeping all bindings null and eligibility unevaluated preserves OD-002, OD-009, OD-010, OD-011, OD-013, OD-015, TST-026, TST-027, and every external security, operations, release, and Production gate.
rejected_alternatives:
  - Require AWS, ECS, Fargate, ECR, ALB, CloudFront, WAF, Route53, ACM, an AWS account, or ap-northeast-1 merely because Canonical sources record them as reference mappings.
  - Select a different cloud or owner-managed compute-edge platform before capability mapping, residency, credentials, identity, operations, performance, health, and rollback evidence exist.
  - Infer a provider or resource binding from names, reference metadata, defaults, ambient configuration, compatibility claims, or fallback behavior.
  - Permit partial, unknown, duplicate, implicit, provider-label-only, service-label-only, or reference-only capability mappings.
  - Lower security, operations, release, performance, health, rollback, isolation, or residency evidence for any provider kind.
constraints:
  - Exactly one explicit mapping is required for every required compute-edge capability before a future profile can be eligible.
  - Missing, unknown, duplicate, partial, implicit, provider-label-only, service-label-only, or reference-only mappings fail closed.
  - Runtime capability must prove isolated workload scheduling, immutable image identity, provenance, SBOM, vulnerability controls, bounded scaling, graceful shutdown, and safe rollback without selecting a runtime now.
  - Public ingress must remain edge mediated with private origins; API, worker, provider, and data-plane access must never become a public shortcut.
  - DNS and TLS must prove controlled zone ownership, certificate lifecycle, modern transport security across Public, Internal, Provider, and origin interactions, and fail-closed origin authentication without selecting a service now.
  - WAF and abuse controls must prove managed ingress, rate limiting, abuse and attack protection, telemetry, ownership, and tested response procedures.
  - Public, Admin, Internal, data-plane, control-plane, and provider boundaries require distinct policy, cache, cookie, identity, route, ingress, and controlled-egress semantics.
  - Workload identities and secrets must be least-privilege, non-ambient, auditable, rotatable, and absent from repository, logs, generated artifacts, and configuration dumps.
  - Observability must include health, SLO, alert owner and runbook evidence plus human-approved canary, promotion, rollback, and kill-switch boundaries.
  - Site name and domain, region, data residency, failure-domain topology, budget, identity provider, notification channel, credentials, and physical resource choices remain unset while OD-002, OD-009, OD-010, OD-011, OD-013, and OD-015 are unresolved.
  - No credential, provider call, network access, external write, infrastructure init, plan, apply, deployment, release, Production action, or status transition is authorized by this record.
security_and_approval_gates:
  - Preserve private data planes, edge-only public entry, controlled ingress and egress, TLS across Public, Internal, Provider, and origin interactions, least privilege, workload identity, secret absence, separated duties, auditability, and supply-chain evidence requirements.
  - Preserve explicit human approval for Production change, identity-provider selection, public exposure, canary, promotion, rollback, release, kill-switch change, and every external status transition.
  - Preserve formal TST-026 security evidence and TST-027 staging performance and load evidence as release-blocking and NOT_EXECUTED.
  - Preserve OD-002 site and domain, OD-009 budget, OD-010 identity provider, OD-011 notification channel, OD-013 residency, and OD-015 credential blocking states until their owners provide valid evidence.
  - Require the same security, operations, release, performance, health, rollback, isolation, and residency evidence for AWS, another cloud, and owner-managed infrastructure.
  - Never infer eligibility from a provider or service label, account or project name, region, plugin or adapter, historical reference, local generator success, predecessor completion, health endpoint declaration, or AWS-labelled evidence.
acceptance_criteria:
  - The ST-1503 source and generated reference expose a closed provider-neutral compute-edge capability inventory with no selected, default, or fallback profile, provider, runtime, registry, edge, DNS, TLS, WAF, credential, region, or physical resource.
  - Every future eligible profile must have exactly one explicit mapping for every required capability and complete equivalent evidence.
  - Unknown, missing, duplicate, partial, implicit, defaulted, fallback, provider-label-only, service-label-only, or reference-only mappings are rejected before eligibility.
  - ECS, Fargate, ECR, ALB, CloudFront, WAF, Route53, and ACM remain visible only as optional historical AWS reference mappings and cannot select or satisfy any capability or evidence by themselves.
  - Existing public, Admin, Internal and data-plane boundaries, health intent, disabled activation, forbidden native commands, zero action counts, unresolved Open Decisions, and NOT_EXECUTED evidence remain fail closed.
required_test_evidence:
  - Isolated tests/st1503 positive contract and generated-plan assertions.
  - Hostile tests for missing, unknown, duplicate, reordered, partial, defaulted, fallback, provider or resource binding, and AWS-label-only admission attempts.
  - Hash-rebound hostile tests for every normative direct-owner handoff section and exact ST-1501 provider-neutral predecessor semantics.
  - Existing hostile filesystem, closed-schema, exact-type, no-provider-call, no-network, and no-write tests remain passing.
  - Owner generator regeneration and read-only --check, Ruff for changed Python, and git diff --check.
  - Formal TST-026, TST-027, hosted CI, native IaC, provider, performance, staging, release, deployment, and Production evidence remain separately unexecuted.
