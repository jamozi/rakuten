schema: DESIGN_HANDOFF_V1
version: 1
record_status: RECORDED_DURABLE_OWNER_DECISION
approved_story: ST-1503
approved_scope:
  - Define Full RAOS compute and public-edge infrastructure without assuming or requiring AWS or any other provider.
  - Retain ECS, Fargate, ECR, ALB, CloudFront, WAF, Route53, and ACM only as optional historical AWS reference mappings inherited from INT-DEC-007 and RAOS-ARCH-001.
  - Require every future compute-edge profile to map the same closed capability inventory and provide equivalent security, operations, release, health, performance, rollback, isolation, and residency evidence.
  - Keep every provider, account or project, region, runtime, scheduler, registry, edge, ingress, DNS, TLS, WAF, identity, secret, credential, network, and physical-resource binding unset while the relevant Open Decisions remain unresolved.
