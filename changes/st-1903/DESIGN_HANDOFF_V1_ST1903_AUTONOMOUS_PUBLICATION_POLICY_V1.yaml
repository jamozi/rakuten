rationale:
  - Preserve the current fail-closed canonical publication and approval boundary while making the owner-proposed post-MVP policy reviewable as immutable data.
  - Require exact-SHA owner review before the proposal can inform any later canonical reconciliation.
  - Make rate, risk, evidence, commercial, provider, privacy, and code-governance limits machine-checkable without creating a runtime path.
  - Keep external, live, irreversible, security-sensitive, release, and production work outside this candidate slice.
rejected_alternatives:
  - alternative: ACTIVATE_AUTONOMOUS_PUBLICATION_NOW
    reason: Conflicts with canonical authority, unmet ST-1805, unexecuted TST-032, and missing release decision.
  - alternative: TREAT_USER_PLANNING_TEXT_AS_CANONICAL_RESOLUTION
    reason: Canonical reconciliation and exact-SHA repository-owner approval are not executed.
  - alternative: INCLUDE_SELF_APPROVAL_OR_GENERATED_APPROVAL
    reason: Approval must be detached, human-owned, exact-SHA-bound, and absent from this slice.
  - alternative: BYPASS_PRO_WHEN_UNAVAILABLE
    reason: The candidate requires queueing and fail-closed behavior.
  - alternative: LET_COMMERCIAL_ECONOMICS_OVERRIDE_ELIGIBILITY
    reason: Evidence, user fit, quality, and safety must pass first and the current canonical conflict remains unresolved.
  - alternative: BUILD_OR_REDIRECT_AFFILIATE_URLS
    reason: Only the official Rakuten API affiliateUrl direct destination is eligible.
  - alternative: RETRY_AMBIGUOUS_WORDPRESS_WRITES
    reason: Blind replay can duplicate publication and cannot prove the remote result.
  - alternative: COPY_OR_MERGE_PARALLEL_WAVE3_FILES
    reason: The parallel lineage is exact-object-bound reference-only evidence and is not an implementation input.
  - alternative: ADD_AWS_OR_LIVE_PROVIDER_RUNTIME
    reason: This slice is local policy serialization only and grants no credential, provider, staging, release, or production authority.
  - alternative: OPTIMIZE_FOR_AI_DETECTOR_EVASION
    reason: Natural evidence-grounded writing is required and detector evasion is forbidden.
