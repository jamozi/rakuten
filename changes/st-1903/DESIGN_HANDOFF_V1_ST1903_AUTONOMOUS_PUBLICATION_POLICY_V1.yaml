acceptance_criteria:
  - The handoff and policy source remain UNAPPROVED/PENDING, non-executable, non-attesting, and activation-disabled.
  - The generated projection contains no action, effect, evidence, approval, activation, release, publication, live-provider, staging, or production claim.
  - Canonical conflicts, unmet ST-1805, NOT_EXECUTED TST-032, missing release decision, REVIEW_NOT_OBTAINED, and inherited unresolved Open Decisions remain explicit blockers.
  - The policy enforces one new article per Asia/Tokyo day with no catch-up, pre-draft high-risk denial, mandatory Pro queue-on-outage, eligibility-first commercial containment, direct official affiliateUrl use, ambiguous-write stop, and duplicate prevention.
  - After a separately approved canonical revision and activation, an ordinary article that satisfies every deterministic eligibility and release gate does not require per-article owner approval; ambiguous risk and all enumerated owner-gated exceptions remain queued.
  - The policy forbids self-approval, optimizer gate mutation, fabricated first-person experience, detector evasion, economics presented as confirmed, and owner-gated code changes from auto-merge.
  - The generator verifies exact canonical source hashes and exact Git commit/tree bindings, emits deterministic JSON and manifest bytes, installs both outputs atomically with rollback, and provides a no-write --check mode.
  - Hostile authority, status, approval, action, dependency, Open Decision, Git binding, provider, privacy, optimizer, and generated-drift mutations fail closed with sanitized messages.
