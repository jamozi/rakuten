approved_scope:
  - Serialize one inert, hash-bound autonomous-publication policy revision candidate for ST-1903.
  - Keep current canonical human approval, step-up, recommendation-finance separation, publication, release, and kill-switch controls unchanged.
  - Project the candidate only as non-executable, non-attesting, pending data through one deterministic owner generator.
  - Bind the candidate to the exact origin/main implementation base and to the exact reference-only parallel lineage without merging or copying parallel files.
  - Add focused positive and hostile tests within the exact ten-path Story cut.
  - Produce no approval record, canonical revision, status update, runtime adapter, workflow, provider call, external write, publication, release, or production effect.
