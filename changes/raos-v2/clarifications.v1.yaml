schema: RAOS_V2_CLARIFICATIONS_V1
version: 1.0.0
authority: USER_PLAN_AND_REPOSITORY_POLICY_OVER_DESIGN_SOURCE
source_package_sha256: 7ea856e74d73589ae37d1248e08e685e5d022b90bfc45c9bf1d6cb414b5fc42a
clarifications:
- id: C-V2-001
  decision: successor source layer lives below changes/raos-v2
  supersedes: any source suggestion to mutate canonical/upstream/zip
- id: C-V2-002
  decision: the machine contract has seven templates
  value:
  - HOME
  - HUB
  - GUIDE
  - COMPARISON
  - DIFFERENCE
  - TOOL
  - POLICY
  supersedes: prose references to six templates
- id: C-V2-003
  decision: Phase 0 owns T-V2-001..006, T-V2-040 and T-V2-051; T-V2-007 starts Phase 1
- id: C-V2-004
  decision: effective phase planning ceilings are P0=16h, P1=40h and P2=80h
  note: backlog row sums are reconciliation information, not additive gates
- id: C-V2-005
  decision: B-V2-009 depends on every B-V2-001..008 artifact
- id: C-V2-006
  decision: ArticleDefinition requires ordered blocks and temporal source fields are mandatory
- id: C-V2-007
  decision: Phase 0-2 real content cannot be human-reviewed or sealed; only synthetic fixtures may reach
    PACKAGE_SEALED
- id: C-V2-008
  decision: B-V2-017 defines the WordPress port; its disabled adapter is Phase 2
- id: C-V2-009
  decision: T-V2-027 route collisions fail closed
- id: C-V2-010
  decision: B-V2-031 also waits B-V2-030; B-V2-033 waits B-V2-027/B-V2-029/B-V2-030; B-V2-034 waits B-V2-019..033
- id: C-V2-011
  decision: airline rules without a published effective date use a null effective_from plus observed_applicable_from
    and OBSERVED_CURRENT_AT_CAPTURE_NO_PUBLISHED_EFFECTIVE_DATE; only an official date may use OFFICIAL_EFFECTIVE_DATE
- id: C-V2-012
  decision: airline effective intervals are machine-defined as FROM_INCLUSIVE_TO_EXCLUSIVE
- id: C-V2-013
  decision: packages/web-ui/src/decision-support-v2 is the authoritative UI source; its preview subtree
    is the sole deterministic preview input and changes/raos-v2/phase-2/preview contains generated output
    only
  supersedes: the former duplicated changes/raos-v2/phase-2/ui-source input location
- id: C-V2-014
  decision: the effective Phase 3 planning ceiling is 20 hours and external spend remains JPY 0
  note: Phase 3 backlog row estimates are reconciliation information, not an additive budget gate
- id: C-V2-015
  decision: Phase 3 adds a v2 real-content local simulation-seal contract for an exact non-synthetic but
    unauthenticated owner assertion; the Phase 2 v1 synthetic-only seal remains unchanged and neither
    contract grants production approval authority
- id: C-V2-016
  decision: the one-URL WordPress projection suppresses every unpublished future route and keeps every
    product CTA blocked until a current exact offer binding exists
- id: C-V2-017
  decision: B-V2-040 remains BLOCKED_EXTERNAL until human backup, review, deployment, WordPress write,
    publication, public verification, rollback evidence and seven stable days exist
- id: C-V2-018
  decision: the safe Phase 3 default preserves /carry-on-suitcase-comparison/, its self-canonical and
    sitemap membership with an empty redirect change set
- id: C-V2-019
  decision: B-V2-036 uses a marker-bound one-route WordPress block-presentation plugin instead of switching
    the active theme
  rationale: the one-URL migration must not restyle or risk unrelated public pages and remains reversible
    by removing one local artifact
- id: C-V2-020
  decision: the existing published A05 route uses an approved-cutover update contract whose precondition
    and postcondition both require post_status=publish; no Phase 3 review payload may demote it to draft
  supersedes: draft wording that could be interpreted as applying post_status=draft to the existing public
    post
- id: C-V2-021
  decision: each Phase 3 claim type, risk class, freshness and authoritative source status is closed by
    the Phase 2 candidate phase3_claim_authority digest before human review or seal
- id: C-V2-022
  decision: Phase 3 local test execution and external acceptance are reported separately; local evidence
    never marks an external-dependent Phase 3 acceptance complete
- id: C-V2-023
  decision: Phase 3 external-state input is a closed sanitized object at every nesting level and rejects
    unknown or secret-like fields
- id: C-V2-024
  decision: the Phase 3 post-action WordPress owner export uses overlay action ID V2-P3-EXT-POSTACTION-EXPORT;
    source EXT-014 remains reserved for destructive repository deletion
  supersedes: the conflicting Phase 3 use of EXT-014
- id: C-V2-025
  decision: the route-scoped presentation plugin may be activated only with an owner-armed cutover binding;
    it passes through only the exact bound legacy post bytes, projects only the exact bound sealed post
    bytes, and fails closed for disabled, missing, malformed, intermediate or drifted target content
  rationale: the two-step cutover keeps the existing article byte-exact before the approved content write
    while preventing an unbound activation or partial content update from rendering an ambiguous public
    state
  supersedes: the v0.4 complete-pass-through wording that allowed activation without an armed owner binding
- id: C-V2-026
  decision: the 2026-08-28 bounded public read is a sanitized unpaired observation only and has no pre-action,
    review, seal or publication acceptance authority
  rationale: no owner-held WordPress export was captured within the required five-minute pairing window
- id: C-V2-027
  decision: the fixed-target public browser recorder emits owner-held raw evidence with acceptance_authority=false;
    only a separately implemented independent recalculation may create an acceptance receipt
- id: C-V2-028
  decision: source and generated Phase 3 plugins require PHP lint and a fail-closed WordPress stub in
    required CI; those results remain local CI evidence and do not prove production WordPress compatibility
- id: C-V2-029
  decision: an unsigned Phase 3 review receipt is an unauthenticated owner assertion and may create only
    a local simulation package; it has no human-approval acceptance authority and cannot satisfy B-V2-040
    or the Phase 3 exit gate
  rationale: reviewer_id plus caller-authored digests do not authenticate a human principal or an immutable
    artifact-specific decision
- id: C-V2-030
  decision: an ARMED WordPress cutover binding remains unavailable until a trusted artifact-specific approval
    verifier and fresh PRE_WRITE_EXPORT plus disabled dry-run verifier are implemented and bound; the
    repository-owned binding remains DEPLOYMENT_DISABLED
  rationale: preaction evidence and a simulation seal alone cannot enforce the final pre-write gate or
    authorize a production cutover
- id: C-V2-031
  decision: the unauthenticated simulation receipt persists only fixed non-personal reviewer_id=OWNER_ASSERTION_LOCAL
    and review_version=P3-OWNER-ASSERTION-V1; arbitrary external identity strings are rejected
  rationale: the local assertion has no approval authority, so retaining a person-identifying or caller-selected
    identity creates privacy risk without evidentiary value
