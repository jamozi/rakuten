stop_conditions:
- live instruction or ownership conflict
- branch/worktree collision
- new architecture decision required
- credential/live write/publication/deployment/spending/irreversible action required
- secret/private/PII material required
- primary fact unavailable and UNKNOWN cannot satisfy acceptance
- accepted decision contradiction or invariant weakening required
required_commands_as_live_rules_apply:
- make setup
- make generate
- make check
- make fast
- make final
