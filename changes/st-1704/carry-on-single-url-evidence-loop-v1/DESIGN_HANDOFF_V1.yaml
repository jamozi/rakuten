  rationale:
    - one clean canonical must be the only indexable article identity
    - a retained Review Draft preserves audit and rollback material without creating a second public URL
    - anonymous URL, REST, home, and sitemap checks close distinct leakage paths
    - the authenticated exact-slug read proves the retained AT-003 draft is the committed review artifact rather than an unrelated draft
    - the existing credential-gated command remains read-only and accepts no caller-selected URL
  rejected_alternatives:
    - alternative: AUTOMATED_301_REDIRECT
      reason: requires a public WordPress mutation and a durable redirect decision outside this slice
    - alternative: DELETE_REVIEW_POST
      reason: destroys review and revision evidence and is not required for containment
    - alternative: NOINDEX_PUBLIC_REVIEW_URL
      reason: still exposes duplicate public content and does not establish one public URL
    - alternative: CALLER_SELECTED_URL_AUDIT
      reason: widens the fixed-origin adapter and creates an unnecessary outbound-input boundary
  constraints:
    - no WordPress write, publish, update, delete, redirect, cache purge, plugin, or theme action
    - no credential access or live network request during implementation or local tests
    - verify-public remains bound only to one owner gate and one sole COMMITTED request artifact
    - verify-carry-on-single-url accepts only the fixed RECOVERY_ATTEMPTED-bound AT-003 artifact and never writes or locks the journal
    - the Review URL and public REST path are derived only from the validated request
    - every public read remains fixed-origin, GET-only, redirect-refusing, and bounded
    - the existing owner gate and credential header are reused; no new credential boundary exists
    - the carry-on adapter never returns its internal public_surface_verified=true PublicVerification; only the dedicated non-formal evidence type crosses the public method boundary
    - malformed, ambiguous, or double-encoded Review routes fail closed on home and sitemap surfaces
    - no live, staging, release, or Production evidence is recorded in this overlay
    - Canonical and upstream files remain unchanged
  security_and_approval_gates:
    local_repository_implementation: AUTHORIZED_REVERSIBLE
    owner_gated_live_verify_public: HUMAN_OWNER_REQUIRED
    owner_gated_live_carry_on_reconciliation: HUMAN_OWNER_REQUIRED_NON_FORMAL
    wordpress_status_change: HUMAN_OPERATOR_REQUIRED
    wordpress_redirect_change: HUMAN_OPERATOR_AND_DESIGN_DECISION_REQUIRED
    wordpress_delete: NOT_AUTHORIZED
    theme_activation: HUMAN_OPERATOR_REQUIRED
    rollback: HUMAN_OPERATOR_REQUIRED
    release: NOT_AUTHORIZED_BY_THIS_RECORD
    production_claim: FORBIDDEN
  acceptance_criteria:
    - the clean canonical appears exactly once in the post sitemap and zero times in the page sitemap
    - no post or page sitemap URL contains a raos-review slug
    - no homepage href contains a raos-review slug
    - the exact derived Review URL returns anonymous HTTP 404 with no Location header
    - the exact derived Review slug has an empty anonymous public REST projection
    - AT-003 has exactly one authenticated exact-slug Draft at fixed post ID 26 whose full post fields bind the fixed exception request
    - each promoted non-AT-003 article has zero authenticated Draft rows at its retired Review slug
    - the anonymous 404 body contains no exact, HTML-entity-encoded, or meaningful partial committed title, excerpt, content, snapshot, RAOS article marker, or affiliate content
    - snapshot JSON interior fragments and tokens including payload SHA-256, plus high-signal shortened CTA fragments, fail closed
    - percent-encoded Review routes are detected after one strict UTF-8 decode and malformed, ambiguous, or double-encoded routes fail closed
    - the reconciliation output states formal_gate_eligible false, journal_state RECOVERY_ATTEMPTED, and reconciliation_status PENDING_HUMAN_EXCEPTION
    - the adapter returns CarryOnSingleUrlReconciliationEvidence whose type invariants keep public_surface_verified false and strict_public_checks_passed true
    - all three Review-surface evidence-record SHA-256 values are members of public_surface_sha256
    - verify-public exposes the complete closed verification vocabulary and no mutation authority
  required_test_evidence:
    - focused positive adapter test for all fixed public surfaces and aggregate hash
    - negative tests for Review URL 200, redirect, and nonempty public REST projection
    - negative test for committed Review article content returned with HTTP 404
    - negative tests for meaningful partial content and HTML-entity-encoded title leakage
    - negative tests for snapshot payload SHA-256, snapshot JSON interior, and shortened CTA leakage
    - direct adapter return-type test proving non-formal evidence invariants cannot be promoted
    - negative tests for encoded, malformed, and double-encoded Review routes across home, post sitemap, and page sitemap
    - positive and negative authenticated exact Draft disposition tests for AT-003 and promoted articles
    - read-only reconciliation test proving fixed hashes, post IDs 19 and 26, unchanged journal bytes, and non-formal CLI projection
    - negative tests for home, post sitemap, and page sitemap Review URL leakage
    - negative tests for duplicate or page-owned clean canonical
    - release-contract test for this overlay and exact runtime vocabulary
    - Ruff lint and format checks for changed Python
    - deterministic runtime-manifest generation and no-write check
    - git diff --check
