  version: 2.0.0
  story_id: ST-1704
  slice_id: ST1704_PUBLICATION_OPERATOR_V2
  status: LOCAL_IMPLEMENTATION_CONTRACT
authority:
  additive_decision: INT-DEC-016
  inherited_decisions:
  - INT-DEC-009
  - INT-DEC-013
  codex_can_propose: true
  codex_can_execute_exact_independently_approved_proposal: true
  codex_can_approve: false
  production_release_authority: false
site:
