rationale:
  - INT-DEC-007 makes AWS Tokyo a Reference Architecture while requiring a portable Core, so provider admission must evaluate capabilities and evidence rather than a provider name.
  - Provider, account, region, plugin, or backend defaults would silently turn historical reference metadata into a live infrastructure choice.
  - A closed foundation capability inventory permits AWS, another cloud, or owner-managed infrastructure without selecting an unreviewed provider or topology now.
  - Keeping all bindings null and eligibility unevaluated preserves OD-013 and every external security, operations, release, and Production gate.
rejected_alternatives:
  - Require AWS, an AWS account, or ap-northeast-1 merely because Canonical sources record them as the reference architecture.
  - Select a different cloud or owner-managed platform before capability mapping, residency, budget, credentials, operations, and recovery evidence exist.
  - Infer a provider, account, region, plugin, or backend from names, reference metadata, defaults, ambient configuration, or fallback behavior.
  - Permit partial, unknown, duplicate, implicit, provider-label-only, or reference-only capability mappings.
  - Lower security, operations, release, backup, restore, rollback, or residency evidence for any provider kind.
constraints:
  - Exactly one explicit mapping is required for every required foundation capability before a future profile can be eligible.
  - Missing, unknown, duplicate, partial, implicit, or provider-label-only mappings fail closed.
  - IaC toolchain and provider plugins require exact version, integrity, provenance, and offline-verifiable evidence before native infrastructure payloads are admitted.
  - Remote state requires encryption, locking, audit logging, backup, restore, and recovery evidence without selecting a backend now.
  - Development and Production require separated accounts, projects, tenants, or equivalent isolation semantics independent of provider vocabulary.
  - Network capability must prove public, admin, internal, data-plane, ingress, egress, and control-plane boundaries without assuming AWS service names.
  - Workload identity and secrets must be least-privilege, non-ambient, auditable, and short-lived or otherwise explicitly reviewed.
  - Telemetry, audit, drift detection, backup/restore, recovery, budget/stop controls, rollback, and region/data-residency evidence are mandatory and provider-neutral.
  - No credential, provider call, network access, external write, infrastructure init, plan, apply, deployment, release, or status transition is authorized by this record.
security_and_approval_gates:
  - Preserve IaC-only Production changes, explicit human approval, manual-change prohibition, drift detection, and formal TST-026 requirements.
  - Preserve separation of Development and Production, private data-plane boundaries, controlled ingress/egress, workload identity, auditability, backup/restore, and rollback evidence.
  - Preserve OD-013 region, backup-region, cross-border transfer, and data-residency blocking state until its human owners provide valid evidence.
  - Require the same security, operations, release, recovery, and residency evidence for AWS, another cloud, and owner-managed infrastructure.
  - Never infer eligibility from a provider label, account or project name, region, plugin, backend, historical reference, local generator success, or predecessor completion.
acceptance_criteria:
  - The ST-1501 source and generated reference expose a closed provider-neutral foundation capability inventory with no selected, default, or fallback profile or binding.
  - Every future eligible profile must have exactly one explicit mapping for every required capability and complete equivalent evidence.
  - Unknown, missing, duplicate, partial, implicit, defaulted, fallback, label-only, or reference-only mappings are rejected before eligibility.
  - AWS Tokyo remains visible only as optional historical reference metadata and cannot select a provider, account, region, plugin, backend, or satisfy evidence by itself.
  - Existing disabled activation, forbidden native commands, zero action counts, unresolved OD-013, and NOT_EXECUTED evidence remain unchanged.
required_test_evidence:
  - Isolated tests/st1501 positive contract and generated-plan assertions.
  - Hostile tests for missing, unknown, duplicate, reordered, partial, defaulted, fallback, provider-binding, and AWS-label-only admission attempts.
  - Existing hostile filesystem, closed-schema, exact-type, no-provider-call, and no-write tests remain passing.
  - Owner generator regeneration and read-only --check, Ruff for changed Python, and git diff --check.
  - Formal TST-026, hosted CI, native IaC, provider, staging, release, deployment, and Production evidence remain separately unexecuted.
open_decision_state:
