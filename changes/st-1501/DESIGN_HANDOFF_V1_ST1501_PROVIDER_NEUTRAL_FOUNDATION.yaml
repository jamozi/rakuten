schema: DESIGN_HANDOFF_V1
version: 1
record_status: RECORDED_DURABLE_OWNER_DECISION
approved_story: ST-1501
approved_scope:
  - Define the Full RAOS infrastructure foundation without assuming or requiring AWS or any other provider.
  - Retain AWS Tokyo only as optional historical reference metadata inherited from INT-DEC-007 and RAOS-ARCH-001.
  - Require every future foundation profile to map the same closed capability inventory and provide equivalent security, operations, release, recovery, and residency evidence.
  - Keep every provider, account or project, region, plugin, backend, credential, network, budget, and resource binding unset while OD-013 remains unresolved.
