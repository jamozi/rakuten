rationale:
  - Canonical security design fixes GitHub Actions OIDC as the CI identity source and forbids long-lived cloud keys, while INT-DEC-007 keeps AWS Tokyo as the current Canonical Reference Architecture and requires a portable Core.
  - GitHub is the repository-approved initial external review connector, but that source-system choice must not select a target cloud, identity service, account, region, audience, role, plugin, or adapter.
  - Provider, profile, account, project, tenant, region, audience, role, plugin, or adapter defaults would silently convert the current Canonical Reference Architecture mappings into live selected infrastructure choices.
  - Exact subject binding, short-lived federation, protected-environment approval, least privilege, isolation, provenance, audit, revocation, rollback, and equivalent evidence are provider-neutral security outcomes.
  - Keeping all bindings null and eligibility unevaluated preserves OD-009, OD-011, OD-013, OD-015, TST-026, and every external security, operations, release, and Production gate.
rejected_alternatives:
  - Require AWS IAM, an AWS account, an AWS role, ap-northeast-1, or an AWS audience merely because Canonical sources record them as a reference mapping.
  - Replace the approved GitHub Actions CI source or infer that using GitHub Actions selects AWS or any other target provider.
  - Select a different cloud or owner-managed target before exact capability mapping, isolation, residency, credentials, operations, release, revocation, and rollback evidence exist.
  - Infer a target provider or identity binding from names, labels, reference metadata, defaults, ambient configuration, compatibility claims, or fallback behavior.
  - Permit partial, unknown, duplicate, implicit, provider-label-only, AWS-label-only, source-label-only, or reference-only capability mappings.
  - Lower security, operations, release, provenance, audit, revocation, rollback, isolation, or residency evidence for any target profile kind.
constraints:
  - Exactly one explicit mapping is required for every required deployment-identity capability before a future target profile can be eligible.
  - Missing, unknown, duplicate, partial, implicit, provider-label-only, AWS-label-only, source-label-only, or reference-only mappings fail closed.
  - GitHub Actions OIDC remains the fixed source system, but exact repository, ref, workflow, environment, audience, and subject values remain unset until separately reviewed.
  - Federation must use bounded short-lived sessions, prohibit static cloud secrets and human credentials, and constrain issuance to exact trusted subjects and protected environments.
  - Target environment and audience must be exact, provider-specific bindings selected only after full profile admission; broad or wildcard values are forbidden.
  - Least privilege must bind exact session scope and duration, prohibit role chaining and privilege escalation, and provide tested revocation and rollback paths.
  - Production deployment requires a distinct protected-environment human approval with no self-approval, bypass, untrusted ref, fork PR, or pull_request_target credential path.
  - Provenance, audit, revocation, rollback, alert ownership, incident response, and evidence retention must be complete and equivalent across target providers.
  - Development and Production require separated provider accounts, projects, tenants, environments, or equivalent isolation semantics independent of provider vocabulary.
  - Region, residency, failure-domain, budget, notification, credential, provider, account, project, tenant, audience, role, plugin, adapter, and physical-resource choices remain unset while OD-009, OD-011, OD-013, and OD-015 are unresolved.
  - No credential access, federation exchange, provider call, network access, external write, infrastructure plan or apply, deployment, release, Production action, or status transition is authorized by this record.
security_and_approval_gates:
  - Preserve exact repository, ref, workflow, environment, audience, and subject trust; least privilege; short-lived credentials; separated duties; account/project/tenant isolation; auditability; provenance; revocation; and rollback requirements.
  - Preserve GitHub ruleset, CODEOWNERS, required checks, protected-environment approval, and distinct human approval before Production deployment.
  - Preserve formal TST-026 security evidence as release-blocking and NOT_EXECUTED.
  - Preserve OD-009 budget, OD-011 notification, OD-013 region and residency, and OD-015 Production credential blocking states until their owners provide valid evidence.
  - Require the same security, operations, release, provenance, audit, revocation, rollback, isolation, and residency evidence for AWS, another cloud, and owner-managed infrastructure.
  - Never infer eligibility from GitHub Actions, GitHub, AWS, IAM, OIDC, account, region, audience, role, provider or service labels, reference metadata, local generator success, predecessor completion, or AWS-labelled evidence.
acceptance_criteria:
  - The ST-1504 source and generated reference expose a closed provider-neutral deployment-identity capability inventory with GitHub Actions fixed only as the source and no selected, default, or fallback target profile or binding.
  - Every future eligible target profile must have exactly one explicit mapping for every required capability and complete equivalent evidence.
  - Unknown, missing, duplicate, partial, implicit, defaulted, fallback, provider-label-only, AWS-label-only, source-label-only, or reference-only mappings are rejected before eligibility.
  - AWS Tokyo and the AWS IAM OIDC provider, AWS IAM role, AWS account, AWS region, and AWS audience mappings remain the current Canonical Reference Architecture, while that status alone cannot select or satisfy any capability, admission, or evidence.
  - The Canonical AWS-specific ST-1504 objective and workflow/IAM trust deliverable remain authoritative and NOT_STARTED/NOT_EXECUTED; this overlay neither erases, replaces, nor completes them.
  - Non-AWS and owner-managed target profiles are additional portable implementation paths only and require the same complete capability mapping and evidence as AWS.
  - Exact subject constraints, no-static-secret rules, protected human approval, disabled activation, forbidden execution surfaces, zero action counts, unresolved Open Decisions, and NOT_EXECUTED evidence remain fail closed.
required_test_evidence:
  - Isolated tests/st1504 positive contract and generated-plan assertions.
  - Hostile tests for subject widening, static secret introduction, missing, unknown, duplicate, reordered, partial, defaulted, fallback, target binding, AWS-label-only, and evidence-bypass admission attempts.
  - Hash-rebound hostile tests for every normative direct-owner handoff section and exact ST-1501 provider-neutral predecessor semantics and deterministic generated bytes.
  - Existing hostile filesystem, closed-schema, exact-type, no-provider-call, no-network, and no-write tests remain passing.
  - Owner generator regeneration and read-only --check, Ruff for changed Python, and git diff --check.
  - Formal TST-026, hosted GitHub/provider, native IaC, live federation, staging, release, deployment, and Production evidence remain separately unexecuted.
