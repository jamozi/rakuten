schema: DESIGN_HANDOFF_V1
version: 1
record_status: RECORDED_DURABLE_OWNER_DECISION
approved_story: ST-1504
approved_scope:
  - Keep GitHub Actions and GitHub as the approved CI/OIDC source and initial external review connector without treating either as a target-cloud selection.
  - Define an additional provider-neutral deployment-identity admission boundary for Full RAOS without making AWS or any target provider a selected, default, fallback, or Production-admission binding.
  - Preserve AWS Tokyo and the AWS IAM OIDC provider, AWS IAM role, AWS account, AWS region, and AWS audience mappings as the current Canonical Reference Architecture inherited from INT-DEC-007 and RAOS-ARCH-001.
  - Preserve the Canonical AWS-specific ST-1504 objective and workflow/IAM trust deliverable as authoritative, not erased, replaced, or completed by this portability overlay.
  - Admit non-AWS and owner-managed target profiles only as additional portable implementation paths with identical complete capabilities and evidence.
  - Require every future target profile to map the same closed deployment-identity capability inventory and provide equivalent security, operations, release, provenance, audit, revocation, rollback, isolation, and residency evidence.
  - Keep every repository, ref, workflow, environment, provider, profile, account, project, tenant, region, audience, role, session, policy, credential, plugin, adapter, and physical-resource binding unset while the relevant Open Decisions remain unresolved.
