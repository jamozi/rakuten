composition_rules:
- every non-direct Protocol type resolves to one exact wrapper or repository catalog below
- aggregate wrapper state and member order are constructor order and deterministic mapper assembly order
- MANY members are ordered by the listed physical primary-key tuple; ZERO_OR_ONE rejects duplicates
- only wrappers marked pending_events expose the immutable pending-event lifecycle
- repository catalogs are capability groupings and are never persisted as synthetic rows
- no adapter may infer, alias, add, omit, or reorder aggregate members
