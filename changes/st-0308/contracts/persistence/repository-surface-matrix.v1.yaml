shared:
  audit:
    relation: ops.audit_event
    methods:
    - append_many(intents)->None
    caller_fields:
    - action
    - target_type
    - target_id
    - outcome
    - reason
    - sanitized_details
    adapter_defaults:
      severity: INFO
  outbox:
    relation: ops.outbox_event
    methods:
    - append_many(validated_events)->None
    adapter_defaults:
      status: PENDING
      publish_attempts: 0
      published_at: null
      last_error: null
  idempotency:
    relation: ops.idempotency_record
    methods:
    - claim(claim)->IdempotencyClaimDecision
    - lookup(identity,request_hash)->IdempotencyLookupDecision
    - complete_success(handle,outcome)->None
    - complete_failure(handle,outcome)->None
excluded:
  ops.inbox_receipt: GENERATED_METADATA_ONLY_NO_RUNTIME_MAPPER_OR_WRITE_PORT
two_way_gate:
- every UoW property resolves to exactly one repository row here
- every relation except shared/excluded/view belongs to exactly one module repository row
- generated Protocol methods and concrete adapter methods equal the string signatures exactly
- generated adapters expose no additional public method
aggregate_compositions:
  ops:
    Job:
      kind: AGGREGATE_WRAPPER
      state:
        field: state
        relation: ops.job
        domain_type: JobState
      members:
      - field: job_attempt_rows
        relation: ops.job_attempt
        domain_type: JobAttempt
        cardinality: MANY
        order_by:
        - id
      pending_events: true
    ObjectArtifact:
      kind: DIRECT_ENTITY
      domain_type: ObjectArtifact
      relation: ops.object_artifact
    RuntimeSettingVersion:
      kind: AGGREGATE_WRAPPER
      state:
        field: state
        relation: ops.runtime_setting_version
        domain_type: RuntimeSettingVersionState
      members: []
      pending_events: false
  iam:
    BreakGlassRecord:
      kind: DIRECT_ENTITY
      domain_type: BreakGlassRecord
      relation: iam.break_glass_record
    Permission:
      kind: DIRECT_ENTITY
      domain_type: Permission
      relation: iam.permission
    Principal:
      kind: AGGREGATE_WRAPPER
      state:
        field: state
        relation: iam.principal
        domain_type: PrincipalState
      members:
      - field: user_account
        relation: iam.user_account
        domain_type: UserAccount
        cardinality: ZERO_OR_ONE
        order_by:
        - principal_id
      - field: service_principal
        relation: iam.service_principal
        domain_type: ServicePrincipal
        cardinality: ZERO_OR_ONE
        order_by:
        - principal_id
      pending_events: false
    PrincipalRoleAssignment:
      kind: AGGREGATE_WRAPPER
      state:
        field: state
        relation: iam.principal_role_assignment
        domain_type: PrincipalRoleAssignmentRecord
      members: []
      pending_events: false
    Role:
      kind: DIRECT_ENTITY
      domain_type: Role
      relation: iam.role
    RoleCatalog:
      kind: REPOSITORY_CATALOG
      members:
      - field: role_rows
        relation: iam.role
        domain_type: Role
        cardinality: MANY
        order_by:
        - id
      - field: permission_rows
        relation: iam.permission
        domain_type: Permission
        cardinality: MANY
        order_by:
        - id
      - field: role_permission_rows
        relation: iam.role_permission
        domain_type: RolePermissionBinding
        cardinality: MANY
        order_by:
        - role_id
        - permission_id
      pending_events: false
    SessionRevocation:
      kind: DIRECT_ENTITY
      domain_type: SessionRevocation
      relation: iam.session_revocation
  portfolio:
    ActionCandidate:
      kind: AGGREGATE_WRAPPER
      state:
        field: state
