document:
  id: ST0308-REPOSITORY-SURFACE-MATRIX-001
  version: 1.0.0
  story_id: ST-0308
canonical_serialization: UTF8_LF_YAML_CANONICALIZED_TO_SORTED_COMPACT_JSON_FOR_HASH
rules:
- protocols are inward aggregate-specific and expose no table name, raw Mapping, raw SQL, filter dictionary, Session, Connection, or Engine
- every writable relation has one module/property owner; shared audit/outbox/idempotency are adapter-owned OPS infrastructure capabilities
- child and association rows are reachable only through their named owner below
- no repository commits, rolls back, retries, opens a Session, performs external I/O, updates append-only rows, or deletes rows
modules:
  ops:
    jobs:
      protocol: JobRepository
      aggregate: Job
      relations:
      - ops.job
      - ops.job_attempt
      methods:
      - get(job_id)->Job|None
      - add(job)->PersistedVersion
      note: job_attempt is mapper metadata only here; orchestration mutation is not exposed
      aggregate_composition: Job
    object_artifacts:
      protocol: ObjectArtifactRepository
      aggregate: ObjectArtifact
      relations:
      - ops.object_artifact
      methods:
      - get(artifact_id)->ObjectArtifact|None
      - add(artifact)->None
      aggregate_composition: ObjectArtifact
    runtime_settings:
      protocol: RuntimeSettingRepository
      aggregate: RuntimeSettingVersion
      relations:
      - ops.runtime_setting_version
      methods:
      - get_current(setting_key,scope)->RuntimeSettingVersion|None
      - append_version(version,expected_latest_version)->PersistedVersion
      - transition(version_id,transition,expected_status)->RuntimeSettingVersion
      aggregate_composition: RuntimeSettingVersion
