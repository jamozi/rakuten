specialization:
  offer_precedence: [jp.raos.catalog.affiliate_link_invalid.v1, jp.raos.catalog.offer_unavailable.v1, jp.raos.catalog.offer_observed.v1]
  ai_job: {policy_assist_success: jp.raos.ai.policy_assist_completed.v1, ordinary_success: jp.raos.ai.job_succeeded.v1, terminal_failure: jp.raos.ai.job_failed.v1}
  max_events_per_root_version: 1
lifecycle:
  aggregate_api: [pending_events(), acknowledge_events(event_ids)]
  stage: snapshot exact pending IDs, bind persisted version, validate registry/schema, append Outbox, then acknowledge once
  known_rollback: restore acknowledged snapshot in original order
  unknown_commit: discard UoW and aggregate objects; fresh idempotency lookup and reload
  unlisted_event: REJECT
version_prohibitions: [synthetic_constant, state_ordinal, timestamp_epoch, event_count, in_memory_counter, transaction_id, outbox_order, unpersisted_revision]
two_way_gate:
  - event registry class/type/schema/version/root/source/method exactly equals every allowlist row
  - schema bytes hash to the listed digest
  - every event class has one allowlist row and every row has one exact class
  - excluded roots expose no event recording API
