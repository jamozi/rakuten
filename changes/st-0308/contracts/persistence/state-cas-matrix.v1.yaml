document:
  id: ST0308-STATE-CAS-MATRIX-001
  version: 1.1.0
  story_id: ST-0308
canonical_serialization: UTF8_LF_YAML_CANONICALIZED_TO_SORTED_COMPACT_JSON_FOR_HASH
rules:
- every UPDATE is schema-qualified and uses one exact edge row below
- every caller expected_status or expected_state is bound in WHERE and constrained to the edge from-state
- SET contains only the literal assignment list for that edge; no placeholder, conditional column name, or generic transition SQL is allowed
- every unlisted physical column is preserved byte-for-byte
- zero rows use the concurrency-matrix classification and never trigger a retry
- actor, time, reason, and outcome bindings are prevalidated values from immutable PersistenceContext or the named closed Domain variant
- INSERT_ONLY_CHILDREN means one root-state existence predicate followed by immutable child INSERTs in the same transaction and no root UPDATE
edge_shape:
  required:
  - method
  - from
  - to
  - where
  - set
  method_argument_bindings:
    expected_status: exact from literal
    transition_target: exact to literal
  set_empty_marker: INSERT_ONLY_CHILDREN
relations:
  ops.runtime_setting_version:
    edges:
    - method: RuntimeSettingRepository.transition
      from: DRAFT
      to: ACTIVE
      where: id=:version_id AND status=:expected_status AND :expected_status='DRAFT' AND approved_by_principal_id IS NULL AND approval_reason
        IS NULL AND effective_to IS NULL
      set:
      - status='ACTIVE'
      - approved_by_principal_id=:context_actor_id
      - approval_reason=:nonempty_reason
      - effective_from=:activation_at
      - effective_to=NULL
    - method: RuntimeSettingRepository.transition
      from: DRAFT
      to: REJECTED
      where: id=:version_id AND status=:expected_status AND :expected_status='DRAFT' AND approved_by_principal_id IS NULL AND approval_reason
        IS NULL
      set:
      - status='REJECTED'
    - method: RuntimeSettingRepository.transition
      from: DRAFT
      to: RETIRED
      where: id=:version_id AND status=:expected_status AND :expected_status='DRAFT' AND approved_by_principal_id IS NULL AND approval_reason
        IS NULL
      set:
      - status='RETIRED'
    - method: RuntimeSettingRepository.transition
      from: ACTIVE
      to: RETIRED
      where: id=:version_id AND status=:expected_status AND :expected_status='ACTIVE' AND approved_by_principal_id IS NOT NULL AND length(btrim(approval_reason))>0
        AND effective_from IS NOT NULL AND effective_to IS NULL
      set:
      - status='RETIRED'
      - effective_to=:retired_at
    preserved_columns:
    - setting_key
    - scope_type
    - scope_id
    - version_no
    - setting_class
    - value
    - value_sha256
    - created_by_principal_id
    - created_at
    forbidden_columns:
    - approved_at
  iam.principal_role_assignment:
    edges:
    - method: PrincipalRoleAssignmentRepository.revoke
      from: ACTIVE
      to: REVOKED
      where: id=:assignment_id AND :expected_state='ACTIVE' AND revoked_at IS NULL AND revoked_by_principal_id IS NULL AND revocation_reason IS
        NULL AND valid_from<=:revoked_at AND (valid_to IS NULL OR valid_to>:revoked_at)
      set:
      - revoked_at=:revoked_at
      - revoked_by_principal_id=:context_actor_id
      - revocation_reason=:nonempty_reason
  catalog.provider_endpoint:
    edges:
    - method: ProviderEndpointRepository.transition
      from: DRAFT
      to: ACTIVE
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='DRAFT'
      set:
      - status='ACTIVE'
      - effective_from=COALESCE(effective_from,:at)
      - effective_to=NULL
    - method: ProviderEndpointRepository.transition
      from: DRAFT
      to: BLOCKED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='DRAFT'
      set:
      - status='BLOCKED'
    - method: ProviderEndpointRepository.transition
      from: DRAFT
      to: RETIRED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='DRAFT'
      set:
      - status='RETIRED'
    - method: ProviderEndpointRepository.transition
      from: ACTIVE
      to: DEPRECATED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='ACTIVE' AND effective_to IS NULL
      set:
      - status='DEPRECATED'
      - effective_to=:at
    - method: ProviderEndpointRepository.transition
      from: ACTIVE
      to: BLOCKED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='ACTIVE'
      set:
      - status='BLOCKED'
    - method: ProviderEndpointRepository.transition
      from: ACTIVE
      to: RETIRED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='ACTIVE' AND effective_to IS NULL
      set:
      - status='RETIRED'
      - effective_to=:at
    - method: ProviderEndpointRepository.transition
      from: DEPRECATED
      to: ACTIVE
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='DEPRECATED'
      set:
      - status='ACTIVE'
      - effective_from=COALESCE(effective_from,:at)
      - effective_to=NULL
    - method: ProviderEndpointRepository.transition
      from: DEPRECATED
      to: BLOCKED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='DEPRECATED'
      set:
      - status='BLOCKED'
    - method: ProviderEndpointRepository.transition
      from: DEPRECATED
      to: RETIRED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='DEPRECATED'
      set:
      - status='RETIRED'
    - method: ProviderEndpointRepository.transition
      from: BLOCKED
      to: DRAFT
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='BLOCKED'
      set:
      - status='DRAFT'
    - method: ProviderEndpointRepository.transition
      from: BLOCKED
      to: DEPRECATED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='BLOCKED'
      set:
      - status='DEPRECATED'
    - method: ProviderEndpointRepository.transition
      from: BLOCKED
      to: RETIRED
      where: id=:endpoint_id AND status=:expected_status AND :expected_status='BLOCKED'
      set:
      - status='RETIRED'
    guards:
    - base_host and contract_sha256 remain unchanged
    - non_secret_config remains secret-free
  catalog.ingestion_request:
    edges:
    - method: IngestionRequestRepository.complete
      from: REQUESTED
      to: SUCCEEDED
      where: id=:request_id AND status=:expected_status AND :expected_status='REQUESTED' AND responded_at IS NULL AND http_status IS NULL AND
        raw_response_artifact_id IS NULL AND item_count IS NULL AND error_class IS NULL AND error_code IS NULL AND error_message IS NULL
      set:
      - status='SUCCEEDED'
      - responded_at=:outcome_responded_at
      - http_status=:outcome_http_status
      - raw_response_artifact_id=:outcome_raw_response_artifact_id
      - item_count=:outcome_item_count
      - rate_limit_observation=:outcome_rate_limit_observation
      - error_class=NULL
      - error_code=NULL
      - error_message=NULL
    - method: IngestionRequestRepository.complete
      from: REQUESTED
      to: FAILED
      where: id=:request_id AND status=:expected_status AND :expected_status='REQUESTED' AND responded_at IS NULL AND http_status IS NULL AND
        raw_response_artifact_id IS NULL AND item_count IS NULL AND error_class IS NULL AND error_code IS NULL AND error_message IS NULL
      set:
      - status='FAILED'
      - responded_at=:outcome_responded_at
      - http_status=:outcome_http_status
      - raw_response_artifact_id=:outcome_raw_response_artifact_id
      - item_count=:outcome_item_count
      - rate_limit_observation=:outcome_rate_limit_observation
      - error_class=:outcome_error_class
      - error_code=:outcome_error_code
      - error_message=:outcome_error_message
    - method: IngestionRequestRepository.complete
      from: REQUESTED
      to: QUARANTINED
      where: id=:request_id AND status=:expected_status AND :expected_status='REQUESTED' AND responded_at IS NULL AND http_status IS NULL AND
        raw_response_artifact_id IS NULL AND item_count IS NULL AND error_class IS NULL AND error_code IS NULL AND error_message IS NULL
      set:
      - status='QUARANTINED'
      - responded_at=:outcome_responded_at
      - http_status=:outcome_http_status
      - raw_response_artifact_id=:outcome_raw_response_artifact_id
      - item_count=:outcome_item_count
      - rate_limit_observation=:outcome_rate_limit_observation
      - error_class=:outcome_error_class
      - error_code=:outcome_error_code
      - error_message=:outcome_error_message
    variant_guards:
      SUCCEEDED:
      - responded_at non-null
      - raw_response_artifact_id non-null
      - error fields null
      FAILED:
      - closed failure variant
      QUARANTINED:
      - closed quarantine variant
  evidence.source_packet_version:
