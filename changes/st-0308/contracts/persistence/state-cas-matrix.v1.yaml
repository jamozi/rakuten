      from: APPROVED
      to: REVOKED
      where: id=:waiver_id AND status=:expected_status AND :expected_status='APPROVED' AND decided_by_principal_id IS NOT NULL AND decided_at
        IS NOT NULL AND decision_reason IS NOT NULL AND expires_at IS NOT NULL AND expires_at>:revocation_revoked_at AND revoked_at IS NULL
      set:
      - status='REVOKED'
      - revoked_at=:revocation_revoked_at
    - method: WaiverRepository.mark_expired
      from: APPROVED
      to: EXPIRED
      where: id=:waiver_id AND status=:expected_status AND :expected_status='APPROVED' AND decided_by_principal_id IS NOT NULL AND decided_at
        IS NOT NULL AND decision_reason IS NOT NULL AND expires_at IS NOT NULL AND expires_at<=:evaluated_at AND revoked_at IS NULL
      set:
      - status='EXPIRED'
    guards:
    - APPROVED expiry is later than requested_at and decision_decided_at
    - REJECTED expiry is null
    - revoker and revocation reason are Audit-only
matrix_cardinality:
  relations: 24
  edges: 118
two_way_gate:
- relation keys exactly equal concurrency-matrix state_cas_without_lock_version
- every repository state mutation resolves to one or more exact edge rows and every edge resolves to one repository method
- every WHERE and SET column exists in the hash-pinned physical relation
- generated PostgreSQL statements equal the predicates and assignments byte-for-byte after schema qualification
- each caller expected_status or expected_state appears in the corresponding WHERE predicate
- every from/to pair is unique per method and no unlisted edge is constructible
