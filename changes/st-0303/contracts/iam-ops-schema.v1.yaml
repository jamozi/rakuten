functions:
- fully_qualified_name: ops.touch_mutable_row
  signature: ops.touch_mutable_row()
  returns: trigger
  language: plpgsql
  security: INVOKER
  volatility: VOLATILE
  set_search_path: pg_catalog
  public_execute: REVOKED
  comment: Mutable rows receive a statement timestamp and monotonic lock version only when row values change.
  behavior:
    predicate: NEW IS DISTINCT FROM OLD
    updated_at: pg_catalog.statement_timestamp()
    lock_version: OLD.lock_version + 1
    return: NEW
- fully_qualified_name: ops.reject_immutable_mutation
  signature: ops.reject_immutable_mutation()
  returns: trigger
  language: plpgsql
  security: INVOKER
  volatility: VOLATILE
  set_search_path: pg_catalog
  public_execute: REVOKED
  comment: Reject normal UPDATE and DELETE on hard-immutable tables; permit only an explicit migrator maintenance session.
  behavior:
    maintenance_guc: raos.allow_immutable_maintenance
    maintenance_value: 'on'
    maintenance_role: raos_migrator
    maintenance_role_check: pg_catalog.pg_has_role(current_user, 'raos_migrator', 'MEMBER')
    maintenance_update_return: NEW
    maintenance_delete_return: OLD
    rejected_operations:
    - UPDATE
    - DELETE
    rejection_sqlstate: '55000'
triggers:
- name: trg_ops_job_touch
  table: ops.job
  timing: BEFORE
  events:
  - UPDATE
  level: ROW
  function: ops.touch_mutable_row()
  comment: Maintain ops.job updated_at and lock_version for changed rows.
- name: trg_iam_principal_touch
