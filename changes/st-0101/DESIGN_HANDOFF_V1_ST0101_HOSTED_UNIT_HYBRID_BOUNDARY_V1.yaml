DESIGN_HANDOFF_V1:
  approved_story: ST-0101
  approved_scope:
    - >-
      Reconcile the ST-0101 hosted Unit job with the intentionally owner-private
      ChatGPT Pro runtime boundary without weakening the production physical-root,
      wrapper, runtime, browser, origin, credential, or approval guards.
    - >-
      Keep sixteen behavior and security cases executable in a clean hosted clone
      through test-only dependency substitution and in-process CLI invocation.
    - >-
      Move only seven irreducible physical-root or owner-private Skill checks into
      one closed, machine-validated pytest marker inventory and provide a dedicated
      local physical-root target for them.
    - >-
      Keep the existing nine network-sandbox skips separate and unchanged; their
      real network-denial boundary remains owned by ci-network-assert.
  source_design_refs:
    - RAOS-INTEGRATION-001 sections 3, 6, 8, and 9
    - INT-DEC-012 Security verification baseline
    - INT-DEC-013 Codex authority boundary
    - RAOS-SEC-001 sections 3, 7, 9, 10, 12, and 13
    - RAOS-CODEX-001 sections 4, 10, 11, 12, and 14
    - RAOS-TEST-SUITES-001 TST-001
    - ST-0101 Create monorepo layout
    - changes/st-0101/design-handoff.raos-ask-pro.v1.yaml
    - changes/st-0101/design-handoff.pro-browser.v1.yaml
    - changes/st-0101/design-handoff.resilient-pro-review.v1.yaml
  decision: >-
    Adopt the owner-approved hybrid boundary. Hosted CI must execute all ST-0101
    behavior and security tests that can be made portable without changing a
    production guard. Tests may replace exact repository, wrapper, runtime, and
    process dependencies only inside the test process, and must restore them after
    each case. Production constants and entry points remain exact and fail closed.
    Only tests whose acceptance inherently reads the owner-private raos-ask-pro
    Skill or executes the physical /home/minami/rakuten launcher may carry the
    closed raos_owner_private marker. Hosted ci-unit excludes that marker only for
    tests/st0101, while a repository test proves that the collected marked node IDs
    equal the approved seven-node inventory. A dedicated local target executes the
    exact marked inventory at the physical repository root. Missing, extra,
    renamed, silently skipped, xfailed, or dynamically marked owner-private cases
    fail the boundary validator.
  rationale: >-
    The current hosted failure mixes two different facts. Sixteen failures are
    test-harness coupling: behavior is exercised only after an exact physical-root
    guard or wrapper check, so a GitHub runner observes NOT_RAOS_REPOSITORY or
    MCP_WRAPPER_INVALID before the intended fake behavior. Seven failures really do
    depend on owner-private policy bytes or the exact physical launcher. Treating
    all twenty-three as private would discard valuable hosted security coverage;
    copying the private Skill/runtime into CI would duplicate authority and weaken
    the trust boundary. The hybrid keeps production bytes and private material out
    of hosted CI while making the maximum safe behavior set continuously verifiable.
  rejected_alternatives:
    - >-
      Mark or skip all twenty-three hosted failures as owner-private. This is
      faster but removes hosted coverage for fail-closed tool, prompt, runtime,
      response, cleanup, and WSLg behavior.
    - >-
      Copy, generate, upload, or snapshot /home/minami/.codex/skills/raos-ask-pro,
      the installed private MCP runtime, browser profile, secrets, or credentials
      into the repository or GitHub Actions.
    - >-
      Relax EXACT_REPOSITORY_ROOT, DEFAULT_WRAPPER, private-root, WSLg, browser,
      exact-origin, runtime-integrity, or production CLI validation to accommodate
      a hosted checkout.
    - >-
      Add a production environment variable, command-line flag, alternate wrapper,
      symlink, or fallback repository root that bypasses the physical-root guard.
    - >-
      Hide new failures with broad file-level skips, xfail, retry, continue-on-error,
      allow-failure, or a count-only assertion.
  constraints:
    - The implementation base is exactly 3c637fe7fca2905f9036c52371a4c1b2b142f3d0.
    - The implementation base tree is exactly d82b37121326dae67f0172cb174e14156a5a8126.
    - >-
      scripts/chatgpt_pro_orchestrator.py, scripts/chatgpt_pro_mcp.sh,
      scripts/chatgpt_pro_python.sh, scripts/chatgpt_pro_mcp_runtime/**,
      .codex/config.toml, AGENTS.md, .github/**, and the owner-private Skill tree
      are immutable in this slice.
    - >-
      Test-only substitution must be scoped by monkeypatch or an equivalent
      automatically restored in-process fixture; it must never become a production
      argument, environment variable, configuration field, or fallback path.
    - >-
      Subprocess tests that intentionally prove the production physical launcher
      remain owner-private. Other fake behavior tests must use an in-process entry
      point or an inert test-owned dependency without changing production code.
    - >-
      The raos_owner_private marker has exactly seven approved node IDs. File-level,
      module-level, dynamically inferred, wildcard, prefix, substring, and count-only
      classification are prohibited.
    - >-
      The boundary contract is a tracked repository policy artifact. It contains
      node IDs and requirement metadata only; it contains no private Skill bytes,
      prompt, response, cookie, credential, browser profile, session, or secret.
    - >-
      The hosted selector applies only to tests/st0101. It must not exclude any
      other Story suite or alter the existing nine network-sandbox skips.
    - >-
      Local physical-root execution must fail if the Skill, its agents metadata,
      the wrapper, or other owner-private prerequisites are absent or drifted; it
      must not silently skip them.
    - >-
      No status, evidence, canonical, upstream, release, publication, provider,
      browser, account, credential, external API, or Production action is allowed.
  security_and_approval_gates:
    - >-
      Exact handoff bytes require a separate repository-owner SHA-256 approval
      before any implementation file is changed.
    - >-
      After exact approval, create one detached approval record that binds the
      handoff bytes, handoff SHA-256, exact owner statement, base commit, and base
      tree. The handoff and approval records are immutable implementation inputs.
    - >-
      Hosted CI receives no owner-private Skill/runtime/browser/profile/secret
      material and no production Pro action authority.
    - >-
      Production root, wrapper, runtime, origin, allowlisted tools, raw-prompt,
      credential, browser, WSLg, and private-file refusals must remain byte- and
      behavior-equivalent outside the tests and Make selection boundary.
    - >-
      A new or renamed owner-private node, missing inventory node, marker drift,
      hidden skip/xfail, production-source edit, or path outside the closed cut is
      a hard stop requiring a new owner-approved handoff.
    - >-
      The existing nine RAOS_NETWORK_DENIED pathname-socket skips retain their
      current reasons and are not evidence for this owner-private boundary.
    - >-
      ChatGPT Pro run 20260814T071215Z-482f82a588a0 is advisory-only and returned
      RESPONSE_NOT_IDENTIFIABLE; its response-only resume returned
      ADVANCED_RESPONSE_BOUNDED_CONTENT_INVALID. It grants no design authority and
      must not be retried for the same gap.
    - >-
      The repository owner selected alternative A in the controlling conversation.
      That selection authorizes this proposal direction but not implementation
      until the exact completed handoff SHA-256 is separately approved.
  acceptance_criteria:
    - >-
      The hosted Unit command collects and executes every non-owner-private
      ST-0101 case and no owner-private case.
    - >-
      The exact seven marked node IDs match the tracked boundary contract in both
      hosted collection and a full physical-root collection.
    - >-
      The sixteen previously failing portable node IDs pass in an isolated clean
      checkout without /home/minami/rakuten, without the owner-private Skill, and
      without the installed private MCP runtime.
    - >-
      The seven owner-private node IDs pass through the dedicated target only at the
      physical owner repository with the current private Skill and runtime policy.
    - >-
      Existing ST-0101 fake, negative, policy, cleanup, response, browser, runtime,
      WSLg, workspace, and network-boundary tests retain their intended assertions.
    - >-
      Production scripts, wrapper/runtime package bytes, AGENTS.md, .codex config,
      workflow bytes, canonical files, and every path outside the approved cut are
      unchanged.
    - >-
      PR 43 is not imported, cherry-picked, merged, amended, or silently reconciled
      in this slice. The hybrid-boundary PR is intended to merge first; PR 43 must
      then rebase onto the resulting main and undergo a fresh exact-head audit.
    - >-
      Local test success remains local evidence. TST-001, formal status, release,
      staging, provider, browser, publication, and Production remain NOT_EXECUTED
      unless independently produced by their required environments and approvals.
  required_test_evidence:
    - >-
      Isolated tests/st0101 hosted selection with -m 'not raos_owner_private',
      proving the sixteen reconciled nodes pass and the seven private nodes are
      deselected rather than skipped or xfailed.
    - >-
      Isolated tests/st0101 owner-private selection with -m raos_owner_private at
      the physical repository root, proving all seven nodes pass.
    - >-
      Boundary-contract tests for exact schema, exact node IDs, marker registration,
      collection equality, no hidden skip/xfail, and rejection of missing, extra,
      renamed, wildcard, file-level, or dynamically marked nodes.
    - >-
      Focused tests for the sixteen previously failing portable node IDs in a
      sanitized hosted-like environment with no private Skill/runtime assets.
    - >-
      Full isolated tests/st0101 at the physical root, plus the existing nine
      network-sandbox cases under their current separate boundary.
    - >-
      Pinned Ruff lint and format checks for changed Python tests; py_compile for
      changed Python tests; bash -n for no changed shell files is not applicable.
    - >-
      make check-workspace, canonical import verification, git diff --check, exact
      cut verification, protected-byte verification, and exact-path sensitive scan.
    - >-
      A clean hosted Unit rerun at the exact pushed head before any merge decision.
