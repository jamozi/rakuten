request_contract:
  endpoint_family: RESPONSES_ONLY
  required_fields:
    store: false
    tools: []
    text.format.type: json_schema
    text.format.strict: true
    text.format.name: REQUIRED_BOUNDED
    text.format.schema: EXACT_REQUEST_SCHEMA
    max_output_tokens: POSITIVE_BOUNDED_INTEGER
    reasoning.effort: CLOSED_ALLOWED_VALUE
  sdk_options:
    max_retries: 0
    timeout: POSITIVE_BOUNDED_SECONDS
  call_limit_per_execute: 1

provider_error_contract:
  public_fields:
    - stable_code
    - retryable
  raise_from_none: true
  class_status_conflict: UNKNOWN
  malformed_or_raising_status: UNKNOWN
  rows:
    RATE_LIMIT:
      signals: [HTTP_429, RateLimitError]
      retryable: true
    TIMEOUT:
      signals: [HTTP_408, APITimeoutError, TimeoutError]
      retryable: true
    AUTHENTICATION:
      signals: [HTTP_401, AuthenticationError]
      retryable: false
    PERMISSION:
      signals: [HTTP_403, PermissionDeniedError]
      retryable: false
    INVALID_REQUEST:
      signals: [HTTP_400, HTTP_404, HTTP_409, HTTP_422, BadRequestError, ConflictError, NotFoundError, UnprocessableEntityError]
      retryable: false
    UNAVAILABLE:
      signals: [HTTP_502, HTTP_503, HTTP_504, APIConnectionError]
      retryable: true
    SERVER_ERROR:
      signals: [OTHER_HTTP_STATUS_AT_LEAST_500, InternalServerError]
      retryable: true
    UNKNOWN:
      signals: [EVERY_UNLISTED_SIGNAL]
      retryable: false
  non_provider_codes:
    malformed_response: MALFORMED_RESPONSE
    route_mismatch: ROUTE_MISMATCH
    invalid_schema: INVALID_SCHEMA
    recorder_failure: RECORDER_FAILURE
    pricing_missing: PRICING_MISSING
    pricing_mismatch: PRICING_MISMATCH
    clock_failure: UNKNOWN
  forbidden_public_material:
    - message
    - args
    - status object
    - response
    - request
    - headers
    - URL
    - body
    - credential
    - prompt
    - source
    - output
    - provider identifier

recorded_exchange_contract:
  root_fields: [provider, request, response]
  provider: openai
  request_fields: [request_sha256, task_code, model_route_version, prompt_version, input_artifact_sha256, output_schema_sha256]
  response_fields: [response_id, requested_model_id, resolved_model_id, status, created_at, received_at, latency_ms, usage, outcome]
  usage_fields: [input_tokens, cached_input_tokens, output_tokens]
  outcomes:
    success: {kind: success}
    refusal: {kind: refusal, refusal: true}
    incomplete_max_output_tokens: {kind: incomplete, reason: max_output_tokens}
    incomplete_content_filter: {kind: incomplete, reason: content_filter}
  canonical_json:
    encoding: UTF-8
    sorted_keys: true
    compact_separators: true
    ensure_ascii: false
    allow_nan: false
    maximum_bytes: 4194304
    digest: SHA-256
    parse_reserialize_exact_match: true
  ordering_before_record: [response_normalization, route_matching, usage_validation, outcome_classification, structured_output_validation, complete_pricing_validation, independent_pricing_recomputation]
  recorder_calls:
    success_refusal_incomplete: 1
    every_failed_path: 0
  artifact_ref:
    exact_type: true
    matching_sha256: true
    matching_byte_size: true
    content_type: application/json
  forbidden_content:
    - successful output
    - refusal text
    - partial output
    - reasoning
    - prompt or message
    - source material
    - provider request ID
    - header or URL
    - credential
    - exception or error body
    - pricing value
    - unlisted provider field

synthetic_pricing_contract:
  classification: SYNTHETIC_TEST_ONLY
  validity_interval: observed_at <= evaluated_at < expires_at
  evaluated_at: injected UTC clock captured at adapter entry
  quote_hash_fields: [quote_id, provider, model_id, native_currency, input_per_million, cached_input_per_million, output_per_million, jpy_per_native_unit, observed_at, expires_at]
  quote_hash_kind: SYNTHETIC_TEST_ONLY
  calculator_inputs: [usage, provider, model_id, quote, evaluated_at]
  result_fields: [estimated_cost_jpy, provider_cost_native, native_currency, quote_id, quote_sha256, provider, model_id, usage_sha256, evaluated_at, calculation_sha256]
  decimal_context:
    precision: 50
    intermediate_rounding: ROUND_HALF_EVEN
    final_jpy_rounding: ROUND_CEILING
    ambient_context: FORBIDDEN
  formula:
    regular_input_tokens: input_tokens - cached_input_tokens
    provider_cost_native: (regular_input_tokens * input_per_million + cached_input_tokens * cached_input_per_million + output_tokens * output_per_million) / 1000000
    estimated_cost_jpy: ceil(provider_cost_native * jpy_per_native_unit)
  exact_reference_recomputation: REQUIRED
  compare_every_result_field: true

provenance_regeneration_contract:
  owner_generators_only: true
  permitted_mechanical_outputs: [ST-0204 manifest, ST-0701 manifest, ST-0801 manifest]
  semantic_payload_change: FORBIDDEN
  protected_or_append_only_change: FORBIDDEN
  post_generation_no_write_check: REQUIRED
  st1203_st1204_partial_st0204_pins: REVERT_TO_PRE_ST0703
  st1203_st1204_st0305_debt: SEPARATE_UNWAIVED_BLOCKER

gate_contract:
  hydration: EXPLICIT_SEPARATE_PREREQUISITE
  generate: openai-recorded-generate
  read_only_targets: [openai-recorded-check, openai-recorded-static, openai-recorded-test, openai-recorded-gate]
  config_check_owner_target:
    exact_header: 'config-check: | python-sync'
    final_delta_from_base: NONE
  openai_recorded_gate:
    prerequisites: [ai-registry-check, openai-recorded-check, openai-recorded-static, openai-recorded-test]
    config_check_prerequisite: FORBIDDEN
    direct_predecessor_command: PYTHONDONTWRITEBYTECODE=1 $(UV_READONLY_RUN) python scripts/build_st0204_config_loader.py --check
    direct_predecessor_command_count: 1
    recursive_make: FORBIDDEN
    python_sync_uv_run_sync_install_hydrate: FORBIDDEN
    network_cache_sync_environment_credential_external_service: FORBIDDEN
  repository_policy: openai-recorded-check
  unit_suite: tests/st0703
  new_workflow_or_job: false
  credential_secret_or_network: FORBIDDEN

fixture_inventory:
  root: changes/st-0703/fixtures/recorded
  format: STRICT_UTF8_LF_JSON
  synthetic_marker: SYNTHETIC_TEST_ONLY
  files:
    - path: success-structured.json
      scenario: structured_success
      expected: ProviderSuccess
    - path: refusal-completed.json
      scenario: completed_refusal
      expected: ProviderRefusal
    - path: incomplete-max-output-tokens.json
      scenario: incomplete_max_output_tokens
      expected: ProviderIncomplete.MAX_OUTPUT_TOKENS
    - path: incomplete-content-filter.json
      scenario: incomplete_content_filter
      expected: ProviderIncomplete.CONTENT_FILTER
    - path: error-rate-limit-429.json
      scenario: rate_limit_429
      expected: ProviderError.RATE_LIMIT
  integrity:
    regular_files_only: true
    symlinks: REJECT
    extra_or_missing_files: REJECT
    duplicate_json_keys: REJECT
    non_finite_numbers: REJECT
    raw_byte_sha256_inventory: REQUIRED_IN_GENERATED_MANIFEST

required_assertions:
  - Exact outbound Responses JSON sets store false and tools empty.
  - Refusal is classified before any JSON parse and is never retried.
  - Incomplete is classified before partial output parse and is never retried here.
  - Usage integers include cached input tokens and fail closed when malformed.
  - Provider errors expose stable codes only and retain no raw exception or exchange.
  - Provider SDK types never cross the inward port.
  - Fixture tests make no network call and read no credential, Secret reference, or environment variable.
  - Class and HTTP-status conflicts, malformed status values, hostile attributes, and unlisted signals map to UNKNOWN without retry.
  - Public provider failures retain no message, arguments, raw cause, context, provider object, or untrusted identifier.
  - Recorded exchanges use the exact closed content-free schema and are canonical, bounded, hash-bound, and recorded exactly once only after every validation succeeds.
  - Synthetic pricing uses an expiring quote, a fresh precision-50 Decimal context, cached-token separation, ceiling JPY rounding, complete binding digests, and independent reference recomputation.
  - Missing or malformed pricing and every substituted result field fail before recording.
  - ST-0204, ST-0701, and ST-0801 owner manifests retain their approved semantic projection after mechanical regeneration.
  - Base CI runs the no-write generator checks and the isolated ST-0703 suite with no provider network or credential path.

