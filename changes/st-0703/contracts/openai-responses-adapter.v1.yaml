request_contract:
  endpoint_family: RESPONSES_ONLY
  required_fields:
    store: false
    tools: []
    text.format.type: json_schema
    text.format.strict: true
    text.format.name: REQUIRED_BOUNDED
    text.format.schema: EXACT_REQUEST_SCHEMA
    max_output_tokens: POSITIVE_BOUNDED_INTEGER
    reasoning.effort: CLOSED_ALLOWED_VALUE
  sdk_options:
    max_retries: 0
    timeout: POSITIVE_BOUNDED_SECONDS
  call_limit_per_execute: 1

fixture_inventory:
  root: changes/st-0703/fixtures/recorded
  format: STRICT_UTF8_LF_JSON
  synthetic_marker: SYNTHETIC_TEST_ONLY
  files:
    - path: success-structured.json
      scenario: structured_success
      expected: ProviderSuccess
    - path: refusal-completed.json
      scenario: completed_refusal
      expected: ProviderRefusal
    - path: incomplete-max-output-tokens.json
      scenario: incomplete_max_output_tokens
      expected: ProviderIncomplete.MAX_OUTPUT_TOKENS
    - path: incomplete-content-filter.json
      scenario: incomplete_content_filter
      expected: ProviderIncomplete.CONTENT_FILTER
    - path: error-rate-limit-429.json
      scenario: rate_limit_429
      expected: ProviderError.RATE_LIMIT
  integrity:
    regular_files_only: true
    symlinks: REJECT
    extra_or_missing_files: REJECT
    duplicate_json_keys: REJECT
    non_finite_numbers: REJECT
    raw_byte_sha256_inventory: REQUIRED_IN_GENERATED_MANIFEST

required_assertions:
  - Exact outbound Responses JSON sets store false and tools empty.
  - Refusal is classified before any JSON parse and is never retried.
  - Incomplete is classified before partial output parse and is never retried here.
  - Usage integers include cached input tokens and fail closed when malformed.
  - Provider errors expose stable codes only and retain no raw exception or exchange.
  - Provider SDK types never cross the inward port.
  - Fixture tests make no network call and read no credential, Secret reference, or environment variable.

