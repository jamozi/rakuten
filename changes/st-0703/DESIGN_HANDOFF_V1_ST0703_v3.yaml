      ST0703-V3-D2: '2026-08-09T10:04:49Z'
      ST0703-V3-D3_D4_D5: '2026-08-09T10:20:03Z'
    exact_handoff_status: PENDING_REPOSITORY_OWNER_SHA256_APPROVAL
