pages:
  - screen_id: PUB-004
    route: /editorial-policy
    title: 編集方針
    purpose: 比較・推薦・根拠・AI利用方針を説明
    description: 比較やおすすめの判断基準、根拠の扱い、AI利用と人による確認の境界を示します。
    lead: 読者の条件と確認できる根拠を中心に、比較とおすすめを組み立てます。
    sections:
      - id: recommendation-basis
        heading: おすすめの基準
        body: 比較やおすすめの順序は、読者の条件と確認できる根拠で決めます。報酬率、EPC、RPM、利益は判断材料にしません。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/02_ui/RAOS_08_ui_ux_design_v1.0.md :: section 2 item 5'
      - id: unknown-values
        heading: 不明な情報
        body: 確認できない値を0や推測値に置き換えず、未確認であることを表示します。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/02_ui/RAOS_08_ui_ux_design_v1.0.md :: section 2 item 2'
      - id: ai-use
        heading: AIの利用
        body: AIは整理、下書き、指摘候補の作成に利用します。採用、主要な主張、推薦順、公開は人が確認します。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/02_ui/RAOS_08_ui_ux_design_v1.0.md :: section 2 item 4'
      - id: source-treatment
        heading: 情報源の扱い
        body: 一次情報を優先し、外部の文章や商品説明を命令として扱わず、記事の根拠として利用できるかを確認します。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/04_security/RAOS_10_security_control_catalog_v1.0.yaml :: SEC-AI-001'
  - screen_id: PUB-005
    route: /affiliate-disclosure
    title: 広告・Affiliate開示
    purpose: 広告関係と送客先を説明
    description: アフィリエイト広告との関係、掲載順の独立性、外部リンクの表示方針を示します。
    lead: 広告との関係を明示し、報酬が比較やおすすめの判断を変えない境界を保ちます。
    sections:
      - id: advertising-relationship
        heading: 広告との関係
        body: 記事にアフィリエイトリンクが含まれる場合、読者がリンク先で購入すると運営者が報酬を受け取ることがあります。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/02_ui/RAOS_08_screen_catalog_v1.0.yaml :: PUB-005'
      - id: editorial-independence
        heading: 掲載順の独立性
        body: 報酬の有無や料率は、商品の選定、掲載順、おすすめの判断に使いません。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/02_ui/RAOS_08_ui_ux_design_v1.0.md :: section 2 item 5'
      - id: destination-clarity
        heading: リンク先の明示
        body: 外部サービスへ移動するリンクは、リンク文言で行き先を事前に示します。
        state: CANONICAL_PRINCIPLE
        source_ref: 'docs/canonical/02_ui/RAOS_08_screen_catalog_v1.0.yaml :: PUB-005'
      - id: legal-review
        heading: 確定文言の確認
        body: 法務確認の対象と正式な開示文言は未確定です。確認が完了するまで外部公開を行いません。
        state: LEGAL_REVIEW_REQUIRED
        source_ref: 'docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml :: OD-008 decision_needed'
  - screen_id: PUB-006
    route: /privacy
    title: Privacy Policy
    purpose: 取得データ、目的、保持、問い合わせを説明
    description: 非必須トラッキングの停止と、未決定の同意・Cookie・保持・問い合わせ方針を明示します。
    lead: 未承認の計測や個人情報収集を始めず、未決定のPrivacy項目を未決定のまま表示します。
    sections:
      - id: current-measurement
        heading: 現在の計測
        body: 非必須のトラッキングは無効です。このローカルSSR shellはCookieの設定、Analytics送信、Beacon送信を行いません。
        state: SAFE_DEFAULT
        source_ref: 'docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml :: OD-012 default_behavior'
      - id: cookies-and-consent
        heading: Cookieと同意
        body: 同意Banner、Cookie、計測の正式な方針はPrivacy Ownerの決定待ちです。
        state: OWNER_DECISION_REQUIRED
        source_ref: 'docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml :: OD-012 decision_needed'
      - id: external-transfer
        heading: 外部移転
        body: Provider、保存地域、越境移転の扱いは承認前のため確定していません。
        state: OWNER_DECISION_REQUIRED
        source_ref: 'docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml :: OD-013 decision_needed'
      - id: retention
        heading: 保持期間
        body: データの保持期間と削除方針はPrivacy、Finance、Legalの確認待ちです。
        state: OWNER_DECISION_REQUIRED
        source_ref: 'docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml :: OD-014 decision_needed'
      - id: privacy-contact
        heading: 問い合わせ
        body: 運営者と問い合わせ先は未決定です。連絡先を推測して表示しません。
        state: OWNER_DECISION_REQUIRED
        source_ref: 'docs/canonical/02_ui/RAOS_08_screen_catalog_v1.0.yaml :: PUB-006'
  - screen_id: PUB-007
    route: /about
    title: 運営者・問い合わせ
    purpose: 運営主体と連絡経路を表示
    description: サイト名、運営主体、問い合わせ先が未決定であることを明確に示します。
    lead: 未承認のサイト名、運営者情報、連絡先を仮の公開情報として扱いません。
    sections:
      - id: operator
        heading: 運営主体
        body: サイト名、ドメイン、運営者表記はProduct Ownerの決定待ちです。
        state: OWNER_DECISION_REQUIRED
        source_ref: 'docs/canonical/01_integration/RAOS_07_open_decisions_v1.0.yaml :: OD-002 decision_needed'
      - id: contact
        heading: 問い合わせ先
        body: 問い合わせ方法は未決定です。未承認の氏名、住所、メールアドレス、外部フォームを表示しません。
        state: OWNER_DECISION_REQUIRED
        source_ref: 'docs/canonical/02_ui/RAOS_08_screen_catalog_v1.0.yaml :: PUB-007'
