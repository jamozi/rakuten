      canonical_revision_required_after_package_approval: true
    record_status_model:
      closed_values:
        - OWNER_APPROVED
        - PARTIAL
        - EVIDENCE_PENDING
        - EXECUTION_PENDING
      meanings:
        OWNER_APPROVED: The owner selected a complete business value, but canonical status and downstream gates remain unchanged.
        PARTIAL: At least one decision element or required professional confirmation remains absent.
        EVIDENCE_PENDING: The proposed value requires external or domain evidence before it can be proposed as canonically resolved.
        EXECUTION_PENDING: The business choice is selected, but a separately approved external action or setup remains unexecuted.
      forbidden_values:
        - RESOLVED
        - VALIDATED
        - ACTIVE
        - RELEASED
        - PRODUCTION_READY
      status_is_not_canonical_resolution: true
