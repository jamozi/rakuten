      external_execution_is_not_resolution_evidence: true
  rationale:
    - ST-0006 deliberately defines blocking semantics but not a decision-resolution record, so a new exact owner-approved contract is required.
    - A separate non-authoritative package records owner intent without mutating imported canonical sources or lying about current gate status.
    - Closed per-row statuses distinguish an owner selection from missing evidence, missing fields, and unexecuted external setup.
    - Keeping the current unresolved registry active preserves canonical truth while the package and later canonical revision are reviewed independently.
    - Restricting suitcase material to decision and evidence planning preserves the ST-1702 dependency and one-Story ownership boundary.
    - A generated canonical-revision request makes the eventual authority transition explicit and reviewable instead of silently changing status.
  rejected_alternatives:
    - Edit docs/canonical open decisions directly, because imported canonical artifacts are checksum-pinned and immutable in this implementation pass.
    - Mark all owner-selected rows RESOLVED locally, because OD-006 lacks external Gold Evidence, OD-005 is partial, and ST-0006 has no approved resolution-record contract.
    - Treat domain availability, account setup, or local tests as business-decision approval, because execution and evidence are separate authority classes.
    - Implement the ST-1702 runtime category configuration or golden products inside ST-1701, because that bypasses the canonical dependency and broadens the Story.
    - Put all fifteen Open Decisions under ST-1701 implementation authority, because only seven are ST-1701 acceptance inputs.
    - Use free-form Markdown as the only source, because deterministic validation, status separation, hostile tests, and hash-bound review would be lost.
    - Activate automatic SKU merge before zero-false-merge Gold Evidence, because that can silently combine distinct products.
    - Reuse Pro browser output as implementation authority, because Pro review is advisory and the attempted gated review did not yield a valid proposal.
  constraints:
    - Implement exactly one semantic Story, ST-1701.
    - Preserve all existing canonical, upstream, ZIP, and docs/manifest.json bytes.
    - Preserve the existing ST-0006 owner check and unresolved blocker report.
    - Preserve the current unresolved ST-1701 registry and its global counts until a later approved canonical revision changes the authoritative source.
    - Reject unknown, duplicate, missing, reordered, aliased, or unsafe-tagged package structures.
    - Reject any status, value, evidence, or generated text that claims canonical RESOLVED, gate pass, VALIDATED, staging, release, or production readiness.
    - Do not read or write credentials, .secrets content, provider accounts, domain registrar state, browser state, or external services.
    - Do not purchase a domain, create an account, configure a provider, publish, deploy, release, or perform production actions.
    - Do not include personal data beyond stable role identifiers such as REPOSITORY_OWNER.
    - Do not place raw external evidence or untrusted page content in generated artifacts.
    - Keep local fixture tests, formal TST-032, live evidence, staging, and production as separate claims.
  security_and_approval_gates:
    - Exact SHA-256 approval of this handoff by the repository owner is required before any implementation edit.
    - After approval, implementation must be delegated to the repository implementation_worker in STRICT_STORY mode.
    - The implementation worker must verify this exact handoff hash, source hashes, approved Story, and open_decisions before editing.
    - The completed source decision package requires a second exact SHA-256 owner approval before any canonical-revision proposal can be treated as owner-approved evidence.
    - OD-006 remains EVIDENCE_PENDING until the closed Gold dataset and Domain Editor review satisfy zero false automatic merges.
    - OD-005 remains PARTIAL while alternate_reviewer is null unless a separately approved policy explicitly permits single-reviewer operation.
    - OD-002 domain purchase and control, and OD-015 account and credential setup, remain separately approved external actions.
    - OD-008 never authorizes AI or developer legal judgment; an identified issue blocks the affected scope pending professional review.
    - OD-009 hard stop may only reduce external spending capability and cannot be bypassed by soft allocation or local fixture success.
    - Formal TST-032, CI, live account evidence, staging, publication, release, and production remain NOT_EXECUTED.
  acceptance_criteria:
    - One strict source package contains exactly the seven scoped decision rows in canonical order and the informational cross-story inventory in exact closed order.
    - Each scoped row exactly matches this handoff and uses only the four approved record-status values.
    - The generated read model is canonical, deterministic, hash-bound, and explicitly non-authoritative.
    - The generated canonical-revision request names every still-partial, evidence-pending, and execution-pending condition and never claims canonical resolution.
    - The existing unresolved registry continues to report seven unresolved scoped rows, fourteen global blockers, six blocked targets, and BLOCKED_UNRESOLVED_INPUTS.
    - No ST-1702 runtime category config, golden-product dataset, provider adapter, credential path, public route, or deployment path is added.
    - The owner generator accepts only the existing no-argument generation mode and exact --check mode.
    - Check mode is deterministic and no-write; output paths and ancestors fail closed on unsafe filesystem shapes.
    - The manifest binds this approved handoff, source package, generator, tests, generated outputs, and exact canonical/predecessor sources.
    - README documentation reports selected owner inputs, all pending boundaries, exact commands, and local-versus-formal evidence accurately.
  required_test_evidence:
    - Isolated pytest process for tests/st1701 with positive parity, generation, no-write, and hostile mutation cases.
    - Exact status-enum, exact row-order, exact field, and exact numeric-threshold tests for every scoped decision.
    - OD-006 matrix tests for exact duplicates, variants, missing required fields, optional JAN behavior, bundles, conflicts, and zero false automatic merges using synthetic data only.
    - Negative tests proving PARTIAL, EVIDENCE_PENDING, and EXECUTION_PENDING cannot be promoted to RESOLVED or gate-pass states.
    - Tests proving informational cross-story rows cannot affect ST-1701 activation, canonical status, generated revision readiness, or downstream readiness.
    - Tests proving the existing unresolved registry, ST-0006 blocker report, and canonical source bytes remain unchanged.
    - Static prohibited-surface tests for network, browser, environment credential, subprocess, provider SDK, publication, deployment, and external-action calls.
    - Strict YAML duplicate-key, alias, unsafe-tag, unknown-key, missing-key, reordered-key, path traversal, symlink, and generated-drift refusals.
    - Pinned Ruff format/lint, strict mypy or the existing ST-1701 type gate, in-memory compile/import, owner generator --check, isolated tests/st1701, canonical import verify, make check-workspace, sensitive-data scan, and git diff --check.
    - Explicit report that formal TST-032, live evidence collection, external account setup, staging, publication, release, and production were not executed.
