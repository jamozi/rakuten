  event_name: article_view
  source: public_web
  purpose: 承認済み記事閲覧
  ga4_mapping: page_view
  mvp: true
  parameters:
  - event_id
  - occurred_at
  - anonymous_session_id
  - article_id
  - snapshot_id
  - category_id
  - referrer_class
  - consent_state
  prohibited_parameters:
  - email
  - phone
  - raw_ip
  - full_user_agent
  - raw_search_query
  - article_body
  - source_packet_text
  - affiliate_url_query_secret
  implementation_status: NOT_STARTED
  runtime_verification: NOT_EXECUTED
