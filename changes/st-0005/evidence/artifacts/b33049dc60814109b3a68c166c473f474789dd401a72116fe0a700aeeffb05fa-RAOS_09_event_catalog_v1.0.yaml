document:
  id: RAOS-ANALYTICS-EVENTS-001
  version: '1.0'
event_envelope:
  required:
  - event_id
  - event_name
  - schema_version
  - occurred_at
  - received_at
  - source
  - site_id
  - correlation_id
  rules:
  - at-least-onceを前提にevent_idで重複排除
  - client時刻とserver受領時刻を分離
  - PIIをEventへ含めない
  - 未知Parameterは契約違反
events:
