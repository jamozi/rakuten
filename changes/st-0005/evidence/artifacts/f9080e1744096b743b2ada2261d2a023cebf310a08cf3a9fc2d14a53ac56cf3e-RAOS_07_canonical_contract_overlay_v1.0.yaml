conflict_resolution_rules:
- 同一項目でBaselineとOverlayが競合する場合は本Overlayの順序で後勝ちとする。
- Proposal PatchをProductionへ直接適用しない。
- Codexは正式MigrationまたはVersioned Contractとして実装し、生成ArtifactとTestを更新する。
- 破壊的変更はExpand–Migrate–Contractとする。
- 実装後も元Patchと採用Decisionを監査用に保持する。
