  deliverables:
  - contracts/content/**
  - schema validation
  - catalog cross-reference
  - deterministic generated artifact check
  one_pr_preferred: true
- id: CONT-SLICE-002
  name: Content AST domain types and loader
  objective: Content AST v1をPython/PydanticとTypeScript型へ生成し、安全なLoaderを実装する
  depends_on:
  - CONT-SLICE-001
  deliverables:
  - unknown field rejection
  - schema version fail closed
  - round-trip tests
  one_pr_preferred: true
- id: CONT-SLICE-003
  name: Article type and template validator
  objective: 5記事型のRequired Block、順序、商品数、Unique Value Gateを検証する
  depends_on:
  - CONT-SLICE-002
  deliverables:
  - template registry
  - article type validator
  - invalid fixture tests
  one_pr_preferred: true
- id: CONT-SLICE-004
  name: Claim–Evidence validator
  objective: Claim分類、Coverage、Source Tier、Conflict、Temporal Scopeを検査する
  depends_on:
  - CONT-SLICE-002
  deliverables:
  - coverage calculator
  - claim fact compatibility
  - blocker findings
  one_pr_preferred: true
- id: CONT-SLICE-005
  name: Product identity and comparison validator
  objective: Product/Variant/Offer同定と同一軸比較を検証する
  depends_on:
