- id: CONT-SLICE-006
  name: Recommendation methodology engine
  objective: Hard Constraint、正規化、Coverage、Penalty、Tie、Overrideを決定論的に計算する
  depends_on:
  - CONT-SLICE-004
  - CONT-SLICE-005
  deliverables:
  - editorial suitability engine
  - finance input denylist
  - explanation artifacts
  one_pr_preferred: true
- id: CONT-SLICE-007
  name: Disclosure and affiliate CTA renderer
  objective: Disclosure、楽天遷移ラベル、rel=sponsored、直接Link、API CreditをRendererで強制する
  depends_on:
