schema_version: 1.0.0
rich_text_nodes_allowed:
- text
- strong
- emphasis
- inline_code
- internal_link
- approved_external_citation
- line_break
globally_prohibited_nodes_or_fields:
- raw_html
- script
- iframe
- style
- event_handler
- data_uri
- manual_affiliate_url
- external_image_url
- commission_rate
- epc
- rpm
- revenue
- contribution_profit
blocks:
