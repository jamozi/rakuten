owner_bindings:
  organization: raos
  status: UNVERIFIED_PLACEHOLDERS
  teams:
    accessibility: '@raos/accessibility'
    ai: '@raos/ai'
    architecture: '@raos/architecture'
    data: '@raos/data'
    editorial: '@raos/editorial'
    engineering: '@raos/engineering'
    finance: '@raos/finance'
    operations: '@raos/operations'
    security: '@raos/security'
codeowners:
  entries:
    - pattern: '*'
      roles: [engineering]
    - pattern: /contracts/
      roles: [architecture, engineering]
    - pattern: /migrations/
      roles: [data, security]
    - pattern: /infra/
      roles: [operations, security]
    - pattern: /docker-compose.yml
      roles: [operations, security]
    - pattern: /scripts/postgres_service.sh
      roles: [operations, security]
    - pattern: /apps/admin/
      roles: [editorial, security]
    - pattern: /apps/public/
      roles: [editorial, accessibility]
    - pattern: /apps/web/
      roles: [editorial, security, accessibility]
    - pattern: /packages/ai/
      roles: [ai, security, editorial]
    - pattern: /packages/finance/
      roles: [finance, security]
    - pattern: /python/raos/domain/ai/
      roles: [ai, security, editorial]
    - pattern: /python/raos/domain/finance/
      roles: [finance, security]
    - pattern: /python/raos/generated/
      roles: [architecture, engineering]
    - pattern: /packages/web-contracts/src/generated/
      roles: [architecture, engineering]
    - pattern: /docs/canonical/
      roles: [architecture]
    - pattern: /changes/*/contracts/
      roles: [architecture, engineering]
    - pattern: /changes/*/database/
      roles: [data, security]
    - pattern: /docs/canonical/04_security/
      roles: [security, architecture]
    - pattern: /tests/security/
      roles: [security, engineering]
    - pattern: /scripts/scan_secrets.py
      roles: [security, engineering]
    - pattern: /scripts/run_network_denied.sh
      roles: [security, engineering]
    - pattern: /scripts/assert_network_denied.py
      roles: [security, engineering]
    - pattern: /.github/
      roles: [security, operations]
pull_request_template:
  canonical_source: repo://docs/canonical/08_codex/github/PULL_REQUEST_TEMPLATE.md
  required_owner_categories: [contract, migration, security, deployment]
  require_not_applicable_rationale: true
  require_generated_or_ai_assisted_review: true
ruleset_policy:
  name: RAOS protected default branch
  target: branch
  include: ['~DEFAULT_BRANCH']
  exclude: []
  desired_enforcement: active
  local_application_status: NOT_EXECUTED
  bypass_actors: []
  prohibit_deletion: true
  prohibit_force_push: true
  require_linear_history: true
  pull_request:
    allowed_merge_methods: [squash]
    dismiss_stale_reviews_on_push: true
    require_code_owner_review: true
    require_last_push_approval: true
    required_approving_review_count: 1
    required_review_thread_resolution: true
  required_status_checks:
    - context: Static
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Unit
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Contracts
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Database
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Secrets
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Validate status overlay
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
  strict_required_status_checks_policy: true
  do_not_enforce_on_create: false
  required_owner_categories:
    contract:
      patterns: [/contracts/, /changes/*/contracts/]
      roles: [architecture, engineering]
    migration:
      patterns: [/migrations/, /changes/*/database/]
      roles: [data, security]
    security:
      patterns:
        - /docs/canonical/04_security/
        - /tests/security/
        - /scripts/scan_secrets.py
        - /scripts/run_network_denied.sh
        - /scripts/assert_network_denied.py
        - /.github/
      roles: [security]
    deployment:
      patterns: [/infra/, /docker-compose.yml, /scripts/postgres_service.sh]
      roles: [operations, security]
activation:
  generator_remote_mutation: FORBIDDEN
  live_status: NOT_EXECUTED
  formal_tst_001: NOT_EXECUTED
  prerequisites:
    - real repository and default branch identified
    - every team binding resolves to a visible GitHub team with write permission
    - every required check has run in the repository and is bound to the expected GitHub Actions app
    - ruleset API request is assembled from the reviewed policy and live numeric bindings, and authenticated read-back matches the desired active policy with no bypass actor
    - contract, migration, security, deployment, direct-push, stale-review, last-push, missing-check, deletion, and force-push PR probes pass
    - a distinct human reviewer approves the governance change
