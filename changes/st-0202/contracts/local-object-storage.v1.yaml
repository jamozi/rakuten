security_controls:
  - id: SEC-DATA-003
    implementation: Access and secret keys move only from a host 0600 file through a bootstrap Compose secret into a non-persistent UID 1000 mode 0400 tmpfs copy; before privilege drop the source directory becomes root-only, and values never enter Compose values, arguments, logs, or tracked files.
    verification: LOCAL_CONTRACT_AND_SECRET_SCAN
  - id: SEC-DATA-004
    implementation: The raos-raw contract requires SHA-256 metadata, versioning, version-specific retrieval, and rejection of a declared hash mismatch.
    verification: LOCAL_CONTRACT_TEST_RUNTIME_NOT_EXECUTED
  - id: SEC-DATA-008
    implementation: A retention hook is required while OD-014 leaves every period unset and keeps automatic deletion and lifecycle delete disabled.
    verification: HUMAN_DECISION_AND_RUNTIME_TEST_REQUIRED
  - id: SEC-INFRA-001
    implementation: The host publish is loopback-only, the service uses an internal bridge, and unneeded network interfaces are disabled.
    verification: LOCAL_CONFIG_TEST_RUNTIME_NOT_EXECUTED
  - id: SEC-INFRA-006
    implementation: The raos-raw bucket is private and anonymous access is forbidden.
    verification: AUTHENTICATED_RUNTIME_FIXTURE_NOT_EXECUTED
  - id: SEC-SDLC-003
    implementation: The image tag, OCI index, linux/amd64 manifest, configuration digest, and reviewed source revision are pinned.
    verification: LOCAL_CONTRACT_TEST
  - id: SEC-SDLC-004
    implementation: A container vulnerability scan is required before validation and remains NOT_EXECUTED.
    verification: NOT_EXECUTED
