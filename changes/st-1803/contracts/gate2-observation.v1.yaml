metric_contract:
  article_metrics:
    - search_impressions
    - search_clicks
    - qualified_organic_sessions
    - article_views
    - affiliate_clicks
    - pending_outcomes
    - confirmed_outcomes
    - rejected_outcomes
    - direct_confirmed_reward_jpy
    - work_minutes
    - incremental_cost_jpy
    - broken_links
    - affiliate_link_checks
    - published_eligible
    - indexed_valid
    - eligible_major_query
    - top20_major_query
    - critical_user_complaints
    - stale_exposure_views
  program_metrics:
    - unattributed_confirmed_reward_jpy
    - provider_confirmed_reward_jpy
  learning_metrics:
    search_ctr: sum(search_clicks)/sum(search_impressions)
    affiliate_click_rate: sum(affiliate_clicks)/sum(article_views)
    confirmed_reward_per_click: sum(direct_confirmed_reward_jpy)/sum(affiliate_clicks)
    confirmation_rate: sum(confirmed_outcomes)/sum(confirmed_outcomes+rejected_outcomes)
    confirmed_reward_per_content_hour: sum(direct_confirmed_reward_jpy)*60/sum(work_minutes)
  allocation_policy: DIRECT_PLUS_UNATTRIBUTED_MUST_EQUAL_PROVIDER_TOTAL_WITHOUT_ARTICLE_ALLOCATION

