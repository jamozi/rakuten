  proposal_status: PENDING_EXACT_REPOSITORY_OWNER_APPROVAL
  approved_story: ST-0502
  approved_scope:
    - Add one separate recorded-only Rakuten Product Search 2025-08-01 boundary without changing the existing Rakuten Item Search 2026-07-01 boundary.
    - Accept exactly one pre-resolved product selector, PRODUCT_ID or PRODUCT_CODE, and return one strict hash-bound product result from an exact synthetic fixture.
    - Preserve exact validated UTF-8 response bytes in memory and expose only a validation receipt with uri null and storage and persistence NOT_EXECUTED.
    - Record the future ST-0505 credential aliases and header-only access-key rule as non-executable boundary metadata without reading credentials or making a provider call.
    - Keep ST-1703, WordPress, live provider access, storage, persistence, publication, release, and Production outside this change.
