        - response_sha256
      caller_supplied_time_only: true
      filesystem_access: FORBIDDEN
      repository_or_unit_of_work: FORBIDDEN
      retention_selection: NOT_MADE_OD_014_UNRESOLVED
    error_classification:
      mappings:
        '400': PERMANENT
        '404': PERMANENT
        '429': THROTTLED_RETRYABLE_DECLARATION_ONLY
