  decision:
    base:
      commit: 542877827e1d42216e7610107af2d9cffcb8e88a
      tree: 453a687cd9c944011455390f0927ec19b8dcbcd9
      branch: codex/st-0502-product-search-offline
    operation:
      provider: RAKUTEN_ICHIBA
      api_name: PRODUCT_SEARCH
      api_version: '2025-08-01'
      endpoint_path: /ichibaproduct/api/Product/Search/20250801
      mode: RECORDED_TEST_ONLY
      environment_allowlist:
        - ENV_DEV
        - CI
      live_eligible: false
      calls_per_application_execution: 1
      retries_executed: 0
      pagination_followups_executed: 0
    request:
      response_format: json
      format_version: 2
      hits: 1
      page: 1
      selector_union:
        tag_values:
          - PRODUCT_ID
          - PRODUCT_CODE
        exactly_one_required: true
        mixed_selector_rejected: true
        keyword_rejected: true
        genre_id_rejected: true
        price_filter_rejected: true
        review_or_rank_selector_rejected: true
      output_elements:
        - affiliateUrl
        - brandName
        - count
        - first
        - hits
        - last
        - makerName
        - mediumImageUrl
        - page
        - pageCount
        - productCode
        - productId
        - productName
        - productNo
        - productUrlPC
      element_order: LEXICOGRAPHIC_ASCENDING_EXACT
      forbidden_fields:
        - averagePrice
        - detail
        - genreId
        - genreName
        - itemCount
        - maxPrice
        - minPrice
        - productCaption
        - rank
        - reviewAverage
        - reviewCount
        - salesItemCount
        - salesMaxPrice
        - salesMinPrice
      recommendation_input_from_affiliate_or_finance: FORBIDDEN
    response:
      content_type: application/json
      exact_top_level_keys:
        - count
        - first
        - hits
        - items
        - last
        - page
        - pageCount
      exact_item_keys:
        - affiliateUrl
        - brandName
        - makerName
        - mediumImageUrl
        - productCode
        - productId
        - productName
        - productNo
        - productUrlPC
      required_cardinality:
        count: 1
        first: 1
        hits: 1
        items: 1
        last: 1
        page: 1
        pageCount: 1
      selector_binding:
        PRODUCT_ID: returned productId exactly equals the requested selector value
        PRODUCT_CODE: returned productCode exactly equals the requested selector value
      always_required_nonempty:
        - productId
        - productCode
        - productUrlPC
        - affiliateUrl
      nullable_display_fields:
        - brandName
        - makerName
        - mediumImageUrl
        - productName
        - productNo
      url_validation:
        absolute_https_required: true
        userinfo_forbidden: true
        fragment_forbidden: true
        control_characters_forbidden: true
        future_navigation_authority: NONE
      raw_validation:
        exact_utf8_json_bytes_preserved_in_memory: true
        duplicate_keys_rejected: true
        nonfinite_numbers_rejected: true
        maximum_bytes: 2097152
        maximum_depth: 32
        maximum_nodes: 50000
        unknown_keys_rejected: true
        partial_result_rejected: true
    recording:
