  rationale:
    - ST-0502 explicitly owns a recorded Rakuten search adapter and raw hash boundary, while ST-0505 owns bounded live credential evidence.
    - Product ID or JAN lookup supplies a deterministic identity-oriented input without making keyword, price, review, rank, affiliate-rate, or finance signals editorial selection inputs.
    - A separate Product Search module preserves the already reviewed Item Search behavior and prevents an incompatible API or schema change from silently altering existing fixtures.
    - In-memory raw-byte validation with a null-URI receipt preserves the current maximum-safe evidence boundary because ST-0202 runtime and ST-0308 persistence authority are unavailable.
    - Header-only future access-key transport narrows accidental secret exposure even though the official API also permits a query parameter.
  rejected_alternatives:
    - Extending or replacing the existing Item Search types with Product Search fields, because the provider APIs, versions, selectors, and response contracts are distinct.
    - Keyword, genre, price, review, popularity, rank, affiliate-rate, EPC, RPM, or profit-driven product selection, because those either weaken exact identity or violate the editorial and finance boundary.
    - Reading application ID, access key, or affiliate ID from environment variables or a secret store in ST-0502, because live credential wiring belongs to ST-0505 and OD-015 remains unresolved.
    - Writing raw bytes to ST-0202 or a Repository, because object-storage runtime and ST-0308 persistence implementation authority are not available.
    - Constructing affiliate URLs locally, because the selected boundary accepts only the official API output and grants no navigation or publication authority.
    - Adding ST-1703 or WordPress binding, because it is a separate Story and concurrently owned workstream.
  constraints:
    - Exactly one Story, ST-0502, is changed.
    - The implementation follows domain to application to inward port to outward recorded adapter boundaries.
    - The recorded adapter imports no HTTP client, socket, provider SDK, filesystem, environment, secret, persistence, storage, clock, randomness, browser, or WordPress runtime.
    - Domain and application expose no secret values, SDK types, raw provider error text, or mutable history.
    - Existing Item Search source and tests remain behaviorally compatible.
    - Canonical, upstream, generated, lock, workflow, status, ST-0505, and ST-1703 files are not modified.
    - Formal, live, hosted, staging, release, publication, and Production results are not inferred from local tests.
  security_and_approval_gates:
    - Exact repository-owner approval of this handoff SHA-256 is required before implementation.
    - The gated Pro run 20260813T093656Z-7833f62584e7 ended RESPONSE_NOT_IDENTIFIABLE and strict recovery refused ADVANCED_RESPONSE_BOUNDED_CONTENT_INVALID; no response content was captured or used.
    - OD-014 remains unresolved; no retention period, lifecycle rule, or automatic deletion is added.
    - OD-015 remains unresolved; no provider credential is read, accepted, logged, or exercised.
    - HTTPS validation does not authorize navigation, redirect following, publication, or link activation.
    - Any later live adapter, provider call, object write, persistence write, or ST-1703 connection requires its own approved Story boundary and evidence.
  acceptance_criteria:
    - Exact PRODUCT_ID and PRODUCT_CODE recorded fixtures each produce one deterministic detached result bound to the exact request and raw SHA-256.
    - Mixed, empty, keyword, genre, price, review, and rank selectors fail before provider execution.
    - Response envelope, exact item keys, count and page cardinality, selector equality, types, nullable fields, and HTTPS URL shapes are checked before any result is returned.
    - Malformed UTF-8, duplicate keys, non-finite numbers, oversize, over-depth, over-node, unknown-key, hash-drift, selector-drift, and partial-result fixtures fail closed with stable non-echoing errors.
    - Recorded 400, 404, 429, 500, and 503 failure classes are deterministic; retryability is descriptive only and the application performs zero retries.
    - Raw bytes are not publicly exposed or pickleable, and the validation receipt has uri null with storage and persistence NOT_EXECUTED.
    - Static tests prove no forbidden runtime import, environment or secret lookup, filesystem or network call, clock or randomness, external action, WordPress import, or ST-1703 path change.
    - Existing tests/st0502 regression, affected ST-0503 tests, and the ST-0505 owner generator check remain passing.
  required_test_evidence:
    - Isolated local ST-0502 pytest for exact success and hostile failure fixtures.
    - Strict mypy, Pyright, Ruff lint, Ruff format, and Python compile and import checks on the owned Python paths.
    - Existing ST-0502 and affected ST-0503 isolated pytest, plus ST-0505 deterministic owner generator check.
    - make check-workspace, canonical import verification, exact-owned-path sensitive-data scan, and git diff check.
    - Frozen read-only review of the exact implementation diff with concrete findings fixed and re-reviewed before commit.
    - Formal TST-014, TST-015, TST-016, live provider, storage, persistence, staging, release, and Production remain NOT_EXECUTED.
