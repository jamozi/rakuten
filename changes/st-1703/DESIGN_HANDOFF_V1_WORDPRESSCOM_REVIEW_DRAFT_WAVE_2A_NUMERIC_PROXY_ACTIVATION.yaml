  rationale:
    - >-
      The approved direct free-subdomain route returned a closed setup refusal
      even after OAuth succeeded, and the durable state remained absent, so no
      create attempt needs reconciliation.
    - >-
      Current official WordPress.com documentation describes the standardized
      site-specific route as /wp/v2/sites/{site_id}/{endpoint} and recommends a
      numeric site ID as the reliable form across site types.
    - >-
      The public site-identity endpoint returned positive ID 256699520 bound to
      the exact target site. Pinning it removes dynamic route discovery and
      domain-alias ambiguity from the mutating request.
    - >-
      Changing only the remote API authority and path preserves all reviewed
      content, OAuth, durable one-create, no-retry, and no-publication controls.

  rejected_alternatives:
    - alternative: Retry the unavailable direct /wp-json/wp/v2/posts route
      reason: The authenticated preflight already failed closed and another identical attempt has no new evidence.
    - alternative: Use the WordPress query-route form
      reason: It is not the standardized current WordPress.com site-specific API and was not approved.
    - alternative: Use a domain-name site identifier in the public API proxy
      reason: Current official documentation recommends the numeric site ID as more reliable.
    - alternative: Discover or accept the site ID dynamically for every run
      reason: A mutating operation should be bound to one reviewed immutable identifier.
    - alternative: Use REST v1 posts/new or browser automation
      reason: The current official wp/v2 numeric-site route is available and keeps the existing response contract.
    - alternative: Publish or privately publish the review copy
      reason: Only status=draft is authorized.

  constraints:
    - Preserve domain <- application <- adapters/framework.
    - Keep this amendment within ST-1703 and the existing Wave 2 review-draft command.
    - Do not edit canonical, upstream, imported, generated, or owner ZIP artifacts.
    - Do not read, print, persist in evidence, or commit any credential value.
    - Do not add dependencies, hydrate toolchains, or add another command or CLI option.
    - Preserve committed replay without preflight or network.
    - Preserve fail-closed ambiguous intent without retry.
    - Keep every API request on exact HTTPS public-api.wordpress.com:443.

  security_and_approval_gates:
    - This exact amendment SHA-256 requires explicit repository-owner approval before implementation.
    - The existing owner-only access-token file must pass exact mode, owner, type, size, and symlink checks before use.
    - Preflight and POST must reject ambient TLS overrides, proxy use, redirects, wrong host, wrong port, and wrong path.
    - Preflight must complete before any new state or POST and must persist no response content.
    - The sole POST must occur only after a durable fsynced INTENT.
    - Only HTTP 201, positive integer id, exact status=draft, exact canonical target links, and exact echoed title/content are accepted.
    - Any post-attempt uncertainty retains ambiguous state and forbids automatic retry.
    - Publication continues to require a separate later explicit human approval.

  acceptance_criteria:
    - The provider API adapter can address only public-api.wordpress.com:443 and numeric site ID 256699520.
    - The application-facing port is implemented only by the durable adapter; the one-attempt HTTPS adapter cannot bypass the journal.
    - A committed replay performs no preflight, secret read, DNS, socket, or POST.
    - A preflight refusal leaves no state file and performs no POST.
    - A new successful path performs exactly GET, fsynced INTENT, one POST, validated COMMITTED in that order.
    - The POST body contains exactly title, rendered content, and status=draft.
    - Arbitrary or modified candidates fail before secret read or network.
    - The sanitized receipt reports a positive draft ID, exact draft status, hashes, and explicit no-publication authority.
    - No code path or CLI option can publish, schedule, update, delete, upload media, or insert affiliate URLs.

  required_test_evidence:
    - Focused numeric-site preflight, create, response, ordering, replay, ambiguity, and hostile-environment tests pass.
    - Isolated tests/st1703 passes in one pytest process.
    - Existing tests/st0502 and tests/st0805 pass in separate pytest processes.
    - Pinned Ruff format/lint and mypy pass for all changed hand-maintained Python.
    - py_compile and bash -n pass for changed Python and shell launchers.
    - make check-workspace and python3 scripts/import_raos_design.py verify pass.
    - Exact approved-input hashes and bounded sensitive-data scan pass without reading .secrets or the owner ZIP.
    - Git staged-name and diff checks prove only amendment-owned paths are committed.
    - Live OAuth, preflight, draft creation, and formal evidence are reported separately.

  open_decisions: []
