  objective: >-
    Replace only the unavailable direct WordPress.com post route in the
    approved Wave 2 review-draft integration with the current official,
    numeric-site-ID WordPress.com API route, then use the already stored
    single-blog posts-scope OAuth token to create at most one non-public draft
    review copy on kurashierabinote.wordpress.com.

  approved_scope:
    - >-
      Replace the direct API host/path only with exact HTTPS origin
      public-api.wordpress.com and exact numeric-site path
      /wp/v2/sites/256699520/posts.
    - >-
      Replace the direct preflight only with one authenticated read-only GET to
      /wp/v2/sites/256699520/posts?context=edit&per_page=1&_fields=id before a
      new durable INTENT. Accept only HTTP 200 and an empty array or one object
      containing only a positive integer id.
    - >-
      Preserve the exact immutable title, rendered body, content hash,
      operation binding, status=draft, one-create durable journal, committed
      replay, OAuth secret aliases, sanitized receipt, and no-publication
      boundary from approved Wave 2.
    - >-
      Execute the existing create-review-draft command at most once after all
      amended offline gates pass. A successful result is only a non-public
      editorial review copy.

  excluded_scope:
    - Direct-site, query-route, domain-name proxy, legacy REST v1, or browser fallback
    - Dynamic endpoint discovery or accepting a site identifier from CLI, environment, or provider output
    - Publication, scheduling, private publication, update, delete, media, taxonomy, comments, sharing, or publicize
    - Automatic retry or resubmission after a persisted or ambiguous POST intent
    - Any change to OAuth scope, token alias, redirect URI, article, Source Packet, renderer, title, or publication authority
    - Formal TST, hosted CI, staging, release, production, revenue, or canonical ST-1703 completion claims

