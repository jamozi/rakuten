      automatic_resubmission: FORBIDDEN
  rationale:
    - >-
      The user asked to reach observable iteration sooner, and approved both the
      captured Pro review and the existing market-learning pilot plan.
    - >-
      A local draft seam delivers executable feedback without claiming that
      unresolved canonical dependencies, publication approval, or provider
      credentials already exist.
    - >-
      WordPress documents POST create/update endpoints and multiple status
      values; forcing the sole value draft makes publish and schedule impossible
      through this slice.
    - >-
      WordPress recommends revocable per-application credentials over HTTPS;
      accepting only secret aliases prevents credential material from entering
      domain values, logs, fixtures, or repository artifacts.
    - >-
      Reusing the existing recorded Rakuten and ST-0805 boundaries avoids a new
      provider path and preserves all existing policy and review-body controls.
  rejected_alternatives:
    - alternative: Implement automatic WordPress publication now
      reason: Human publication approval is a canonical and repository safety gate.
    - alternative: Call WordPress or Rakuten live during this implementation
      reason: No endpoint ownership or credential authority is present, and live execution is outside the approved slice.
    - alternative: Mark ST-1703 complete when the local slice passes
      reason: Canonical dependencies and formal TST suites remain unexecuted.
    - alternative: Create a second policy engine for the pilot
      reason: ST-0805 is the approved local editorial policy boundary and must be reused.
    - alternative: Use browser automation or MCP as the production adapter
      reason: Production integrations must use official APIs and MCP is development-only.
  constraints:
    - Preserve domain <- application <- adapters/framework dependency direction.
    - Do not edit canonical, upstream, imported, or generated artifacts by hand.
    - Do not inspect or expose .secrets contents.
    - Do not touch tmp/docs/RAOS_PRO_EXECUTION_HANDOFF_V1.zip.
    - Do not add a network dependency or execute network I/O from tests.
    - Keep values exact, immutable, bounded, deterministic, and safe to represent.
    - Keep request and receipt serialization free of credential values and raw provider bodies.
    - Use the existing Python toolchain and isolated tests/st1703 process.
  security_and_approval_gates:
    - Invalid environment, policy result, Rakuten result, URL, status, operation, secret alias, or response shape fails closed with a closed sanitized code.
    - Any publish, schedule, delete, media, or published-post mutation request is structurally unrepresentable.
    - Only an exact HTTPS origin and exact /wp-json/wp/v2/posts path family may be represented.
    - Credential values never appear in dataclass repr, exception text, JSON evidence, fixtures, docs, or commits.
    - Real draft creation requires a separately authorized external action plus endpoint ownership and secret-reference configuration.
    - Publication remains a separate explicit human approval after a real draft exists.
    - Spend remains disabled until a separately approved external-cost action.
  acceptance_criteria:
    - A locally eligible exact ST-0805 result can create one deterministic recorded WordPress draft receipt from one valid recorded Rakuten result.
    - Repeating the exact create returns the same receipt with a replay disposition and no second logical draft.
    - Changed content requires an explicit update operation bound to the existing draft id.
    - The official request builder emits only POST create/update paths, JSON content type, status=draft, and a secret alias reference.
    - Non-HTTPS, foreign paths/origins, query/fragment/userinfo, publish-like status, delete-like operations, credentials, malformed responses, or unapproved policy/Rakuten inputs fail closed.
    - Evidence records explicitly keep formal, live, staging, publication, revenue, release, and production states unexecuted or unauthorized.
    - Tests prove no file, environment, clock, socket, browser, database, or external side effect is attempted by the domain/application/recorded path.
    - Documentation includes exact local commands and the still-required external human gates.
  required_test_evidence:
    - Isolated tests/st1703 pytest pass
    - Affected ST-0502 and ST-0805 pytest suites pass in separate processes
    - Pinned Ruff lint and format checks pass for changed Python files
    - Pinned mypy passes for the hand-maintained Python package
    - bash -n passes for any changed shell file
    - make check-workspace passes
    - python3 scripts/import_raos_design.py verify passes
    - Sensitive-data and forbidden-path diff scan passes
    - Git diff and status confirm the user ZIP remains untouched and unstaged
  open_decisions: []
