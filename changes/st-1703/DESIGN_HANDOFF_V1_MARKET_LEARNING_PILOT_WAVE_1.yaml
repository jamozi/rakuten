  approved_story: ST-1703
  slice_id: MARKET_LEARNING_PILOT_WAVE_1
  approved_scope:
    - >-
      Implement one narrow local market-learning pilot slice that composes an
      already evaluated ST-0805 PolicyEvaluationResult, one recorded ST-0502
      Rakuten item-search result, and a WordPress draft-only port.
    - >-
      Add deterministic, immutable domain values for the 90-day pilot economics,
      one draft candidate, one draft receipt, and one evidence record.
    - >-
      Add an application service that fails closed unless the ST-0805 result is
      locally eligible and still explicitly not publication-authorized or
      production-eligible.
    - >-
      Add a WordPress inward port and an immutable recorded adapter for local
      ENV-DEV and ENV-CI execution. The adapter may only create or update an
      exact draft and must expose no publish or delete capability.
    - >-
      Add a transport-neutral official WordPress REST request builder for
      POST /wp/v2/posts and POST /wp/v2/posts/<id>. It must force status=draft,
      require HTTPS, refer to credentials only by secret aliases, and perform no
      network I/O itself.
    - >-
      Bind Rakuten inputs to the existing recorded-only ST-0502 result and the
      official 2026-07-01 item-search semantics. No new live Rakuten provider is
      included.
    - >-
      Make repeat execution idempotent by binding the draft operation to stable
      content, policy-result, Rakuten-result, and pilot hashes.
    - >-
      Add isolated ST-1703 tests and local documentation that distinguish local
      evidence from formal TST, staging, live, publication, release, revenue, and
      production evidence.
  excluded_scope:
    - WordPress navigation, authentication, network calls, or creating a real draft
    - Publishing, scheduling, changing a published post, deleting a post, or media upload
    - Reading, printing, persisting, or committing credential values
    - Live Rakuten API calls, affiliate account setup, or external data collection
    - External spend, domain purchase, paid services, or revenue claims
    - Canonical resolution of any Open Decision
    - Formal completion of ST-1703 or any predecessor Story
    - Formal TST-021, TST-022, TST-032, CI, staging, release, or production claims
