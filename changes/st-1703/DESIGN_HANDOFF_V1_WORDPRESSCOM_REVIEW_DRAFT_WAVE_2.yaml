  approved_story: ST-1703
  slice_id: WORDPRESSCOM_REVIEW_DRAFT_WAVE_2
  objective: >-
    Add one isolated official-API WordPress.com review-draft path and use it at
    most once to create one non-public review copy of the exact first-article
    proposal on kurashierabinote.wordpress.com, without changing the existing
    local market-learning pilot semantics or granting publication authority.

  approved_scope:
    - >-
      Add separate immutable review-draft domain values and a separate inward
      create-only port. Do not widen WordPressDraftPort, WordPressDraftReceipt,
      MarketLearningPilotService, or PilotEvidenceRecord from their exact
      local-recorded-only Wave 1 semantics.
    - >-
      Add a deterministic renderer for the exact article region in
      first-article-review-draft.v1.md. It must escape all input and emit only a
      closed HTML tag/attribute vocabulary; raw HTML input is never accepted.
    - >-
      Add a WordPress.com OAuth2 Authorization Code setup command bound to one
      exact blog, one exact posts scope, one exact loopback callback, and owner-
      only secret files. The user alone performs WordPress.com login and grants
      consent in the visible browser. No password is requested or handled.
    - >-
      Add an official HTTPS adapter that makes one authenticated POST to the
      exact target /wp-json/wp/v2/posts endpoint with exactly title, rendered
      content, and status=draft. It performs no retry and follows no redirect.
    - >-
      Add a durable owner-only intent/receipt journal so an exact committed
      repeat returns the existing receipt without a second POST, while an
      interrupted or ambiguous prior intent fails closed without resubmission.
    - >-
      Add one explicit maintenance command for OAuth setup and one explicit
      create-review-draft command. Neither command exposes publish, schedule,
      update, delete, media, taxonomy, comments, sharing, or publicize controls.
    - >-
      After offline gates pass and the owner completes the one-time OAuth
      interaction, execute create-review-draft exactly once and return only a
      sanitized review receipt. This live action is not formal ST-1703, staging,
      publication, release, production, or revenue evidence.

  excluded_scope:
    - Publishing, scheduling, private publication, pending review, or auto-draft
    - Updating any draft or changing any published post
    - Delete, trash, media upload, sideload, category, tag, comment, sharing, or publicize
    - Rakuten affiliate link generation or insertion
    - Price, inventory, points, reviews, or live Rakuten API acquisition
    - Approving the Source Packet or article for publication
    - Treating the review copy as an ST-0805 policy pass or ST-1703 completion
    - WordPress.com password grant, implicit grant, application password, or normal password
    - Browser automation as a production dependency
    - Proxy inheritance, redirects, automatic retry, or automatic ambiguous-run recovery
    - Formal TST, hosted CI, staging, publication, release, revenue, or production claims

