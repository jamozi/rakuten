  approved_scope:
    - Amend only the ST-1703 Wave 3 full-object response decoder for the nested discussion object.
    - Require discussion to be a JSON object containing comments_open and pings_open.
    - Continue to require both approved members to be actual JSON booleans and to equal false for exact remote-state proof.
    - Permit additional discussion members only as opaque, non-authoritative response extensions after the existing whole-response bounds, UTF-8, duplicate-key, finite-number, depth, and node-count checks pass.
    - Discard every additional discussion member before constructing the domain MvpRemoteObject; do not interpret, retain, persist, compare, hash, print, log, project, or use its name or value.
    - Keep unknown or missing top-level full-object members rejected and keep every non-discussion response predicate unchanged.
    - Keep the existing preview diagnostic vocabulary stable and reserve FULL_GET_DISCUSSION_EXTRA_KEYS for predecessor evidence and invalid-artifact compatibility rather than emitting it for an otherwise valid opaque extension.
    - Update the existing isolated Wave 3 tests, runtime manifest, changes/st-1703/README.md, and append-only ST-1703 worklog in one atomic Story slice.

