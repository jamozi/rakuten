    - Integer/string ID, duplicate-key, wrong shape, wrong author/name/site/type/slug/status/settings/URL, non-UTF-8, depth, size, and redirect matrices pass.
    - Article exact baseline/no-op/desired/mismatch, modified drift, second-GET race, POST ambiguity, full-readback, and no-resend matrices pass.
    - Page zero/one/duplicate/>100/pagination/malformed/mismatch/reuse/suffix/readback and no-resend matrices pass.
    - Every crash point around lock, exclusive record creation, fsync, first/second GET, socket, POST, response parse, readback, and terminal append is exercised.
