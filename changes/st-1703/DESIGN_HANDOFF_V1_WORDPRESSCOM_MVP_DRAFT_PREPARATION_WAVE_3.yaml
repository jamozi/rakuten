  rationale:
    - The owner selected the smallest revenue-learning path: one article, five trust/legal drafts, manual affiliate insertion, manual publication, and a seven-day review.
    - The existing article was created exactly once, but its predecessor journal remains INTENT; a separate Wave 3 journal avoids reinterpreting or resubmitting that create.
    - Exact per-operation INTENT and read-only reconciliation allow partial progress without automatic retries or duplicate pages.
    - Two exact baseline GETs narrow the article-update race while making the residual lack of server-side compare-and-set explicit to the owner.
    - Exact page scans plus full-object proof provide a bounded slug collision rule without overwrite, rename, delete, or pagination assumptions.
    - Manual affiliate paste preserves the official Rakuten generator boundary; a narrow in-memory grammar can flag obvious unsafe structure but cannot replace human visual or destination review.
    - Draft-only API preparation produces earlier real feedback while retaining publication, legal, identity, affiliate, formal test, and production gates.

  rejected_alternatives:
    - alternative: Retry, reconcile, migrate, delete, or reinterpret the old Wave 2 INTENT journal
      reason: Its sole create POST opportunity was already consumed and its approved contract forbids replay.
    - alternative: Update article ID 7 without an exact baseline and immediate second baseline GET
      reason: It could overwrite an unobserved human or integration edit.
    - alternative: Claim an atomic compare-and-set using ETag, If-Match, revision, or metadata previous_value
      reason: No applicable documented post-wide v1.1 conditional update primitive was established.
    - alternative: Automatically retry after any persisted INTENT or uncertain POST result
      reason: It can duplicate a page or repeat the article mutation.
    - alternative: Use a slug-only single-object lookup as uniqueness proof
      reason: It cannot prove that no duplicate exact slug exists in the bounded collection.
    - alternative: Automatically ingest or rewrite Rakuten affiliate HTML
      reason: Actual generated hosts and tracking form are not yet known, and automation would broaden credential, HTML, and destination authority.
    - alternative: Invent Rakuten image or tracking host allowlists before the official blocks exist
      reason: It would be brittle or falsely authoritative; actual links require human review.
    - alternative: Use browser automation, wp-admin, generic HTTP, dynamic routes, arbitrary IDs, or runtime parameters
      reason: They broaden authority beyond the fixed official API slice.
    - alternative: Change the WordPress.com author profile, title, tagline, form configuration, navigation, theme, or settings by API
      reason: Those are manual human gates and are outside the approved post/page draft capability.
    - alternative: Publish, privately publish, schedule, unpublish, delete, trash, upload media, or change taxonomy
      reason: Publication and destructive or broader CMS operations remain unauthorized.

  constraints:
    - Preserve domain <- application <- adapters/framework with a narrow inward prepare/preview port and separate outward fixed read/one-attempt mutation port.
    - Reuse the reviewed OAuth token store, system TLS, fixed launcher, and fixed WordPress.com connection abstractions without widening their credential or endpoint surfaces.
    - Keep all provider access on exact HTTPS authority public-api.wordpress.com:443 with no proxy, redirect, TLS override, fallback, retry, or alternate site identifier.
    - Verify exact handoff, content packet, predecessor inputs, base commit, physical repository, and fixed executable paths before token access, journal access, or network.
    - Never expose or persist bearer tokens, authorization headers, provider bodies, remote content, raw affiliate HTML, affiliate URLs, raw errors, personal contact values, or stack traces.
    - Never open, read, stat, hash, copy, migrate, rename, delete, or write the old Wave 2 journal path from Wave 3 production code or tests outside disposable fixtures.
    - Bind each mutation to one operation generation and one POST budget; INTENT consumes that budget even if the process crashes before the request.
    - Keep article/page content, author, site, routes, fields, form order, status, publicize, discussion, likes, sharing, operation order, and output vocabulary exact.
    - Treat edit-context content as exact after JSON decoding and line-ending normalization only; do not apply Unicode, entity, DOM, or whitespace equivalence.
    - Keep source packet approval, editorial/legal review, affiliate approval, formal TST, CI, staging, publication, release, revenue, production, and canonical Story completion separate.

  security_and_approval_gates:
    - Repository-owner implementation approval must cite the exact SHA-256 of this handoff and explicitly accept the documented no-CAS residual race.
    - Handoff approval authorizes implementation only; it does not itself authorize the live prepare command, publication, credentials, or production.
    - Immediately before any live prepare, the owner must affirm that dashboard/mobile editing, integrations, scheduled automation, and every other remote writer are quiesced until final readback.
    - Live prepare must refuse before mutation while author ID 283672805 does not display exactly 暮らし選びノート編集部.
    - All local implementation gates and the exact committed owned-path manifest must pass before any live prepare.
    - A preflight mismatch or unsafe shape writes no INTENT and performs no POST unless the exact state machine explicitly records terminal REFUSED_MISMATCH.
    - Once INTENT is durable, no process may send that operation again; only bounded read-only reconciliation is allowed.
    - A POST response alone never commits. Exact authenticated full-object readback is required.
    - Affiliate slot validation grants only readiness for manual publication review and never publication authority or destination legitimacy.
    - Contact-form rendering, recipient, notification, storage/retention, anti-spam, privacy, and policy correctness require human review.
    - Publication requires a later separate explicit human approval and manual WordPress.com action.

  acceptance_criteria:
    - The exact handoff and content packet bytes/hashes are verified before candidate construction.
    - The implementation exposes exactly the two argument-free Make targets and no generic target, site, ID, slug, field, method, route, retry, or mutation options.
    - Wave 3 production paths cannot access the old Wave 2 journal and use only the separate owner-private record directory and lock.
    - Each immutable record is sequence-checked, hash-chain-checked, owner/mode/symlink-checked, exclusive-created, file-fsynced, and directory-fsynced.
    - Fixed-order partial progress, terminal replay, INTENT reconciliation, and stop conditions cannot produce a second POST for one operation generation.
    - Article mutation requires two exact matching baseline GETs around fsynced INTENT, one POST, and one exact full desired GET.
    - Page mutation requires two exact zero-candidate collection scans around fsynced INTENT, one POST, and one exact full desired GET.
    - Exact unique pre-existing desired pages and an exact desired article are reused without mutation; mismatch, duplicate, suffix, drift, and malformed data stop.
    - Every full proof validates exact site, object, author, author name, type, slug, status, title, content, target URL, discussion, likes, sharing, and empty publicize URLs.
    - Preview performs only bounded GETs, writes no journal, returns only the closed sanitized schema, and distinguishes pending versus three validated affiliate slots.
    - Filled affiliate slots preserve the exact outside hash and pass the narrow grammar; all other HTML or marker variations fail without printing content or URLs.
    - The contact draft contains literal [contact-form], no raw personal contact value, and no form submission or configuration capability.
    - No path can publish, schedule, unpublish, delete, trash, upload media, change taxonomy/settings/profile/theme/plugin, or ingest affiliate HTML.
    - README and append-only worklog report local, live, formal, publication, release, revenue, and production evidence separately.

