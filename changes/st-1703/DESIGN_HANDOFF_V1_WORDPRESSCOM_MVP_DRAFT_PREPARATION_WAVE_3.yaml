    - Reconcile a persisted INTENT or mutation ambiguity using bounded authenticated GET only and never resend that operation.
    - Validate three manually filled affiliate slots in memory during preview without ingesting, persisting, printing, or authorizing their HTML or URLs.
    - Expose only argument-free make targets wordpresscom-prepare-mvp-drafts and wordpresscom-preview-mvp.
    - Update isolated tests, changes/st-1703/README.md, and the append-only ST-1703 worklog in one atomic Story slice.

