  pages:
    - operation_id: page-about-create
      slug: about
      title: 運営者情報
      type: page
      status: draft
      content: |-
        <p>「暮らし選びノート」は、暮らしの道具を条件別に比較し、自分に合う選択を考えるための情報サイトです。</p>
        <h2>運営者</h2>
        <p>暮らし選びノート編集部</p>
        <h2>運営方針</h2>
        <p>メーカー、販売元、制度運営者などが公開する一次情報を優先し、確認日と比較条件を明示します。実際に使用していない商品について、使用経験があるような表現は行いません。</p>
        <p>広告やアフィリエイトによる報酬の有無・料率を、商品の評価や掲載順の判断材料にはしません。内容に誤りや更新が必要な箇所を確認した場合は、根拠を再確認したうえで修正します。</p>
        <p>ご連絡は「お問い合わせ」ページのフォームからお願いします。</p>
      content_sha256: 147bfe03a538872597a014c41742d57f410355988c10fe246b92b5adcc1387d5
      content_bytes: 842
    - operation_id: page-editorial-policy-create
      slug: editorial-policy
      title: 編集方針
      type: page
      status: draft
      content: |-
        <h2>一次情報を優先します</h2>
        <p>商品の仕様、制度、利用条件などは、メーカー、販売元、航空会社、制度運営者などが公開する一次情報を優先して確認します。確認日を記載し、価格、在庫、ポイントなど変動しやすい情報は購入前にリンク先で再確認するよう案内します。</p>
        <h2>比較条件を明示します</h2>
        <p>誰にとっても一つの商品が最良であるとは決めず、用途や優先条件ごとに候補を整理します。使用していない商品について使用感を断定せず、確認できた事実と編集部の判断を区別します。</p>
        <h2>広告と編集を分けます</h2>
        <p>広告やアフィリエイトによる報酬の有無・料率を、商品の評価や掲載順に反映しません。広告を含む記事では、読者が分かる位置にその旨を表示します。</p>
        <h2>公開と修正</h2>
        <p>記事は人が内容を確認した後に公開します。根拠の更新、誤り、リンク切れなどを確認した場合は再確認し、必要に応じて修正または公開停止を判断します。</p>
      content_sha256: 6a824c6cbda474db4921db134e9cb8adf6678221d3913b863f3ec81e729eb159
      content_bytes: 1178
    - operation_id: page-privacy-policy-create
      slug: privacy-policy
      title: プライバシーポリシー
      type: page
      status: draft
      content: |-
        <h2>取得する情報</h2>
        <p>当サイトでは、WordPress.comの機能により、閲覧時の端末・ブラウザー情報、IPアドレス、参照元、Cookie等の技術情報が取り扱われる場合があります。また、お問い合わせフォームから送信された内容、送信者が入力した連絡先、送信日時等が、通知メールやWordPress.com／Jetpack Formsの機能に保存される場合があります。</p>
        <h2>利用目的</h2>
        <p>取得した情報は、お問い合わせへの対応、迷惑送信の防止、サイトの利用状況の把握、記事やサイト運営の改善、法令上必要な対応のために利用します。</p>
        <h2>アクセス解析とCookie</h2>
        <p>当サイトはWordPress.comの統計機能等を利用する場合があります。これらの機能はCookie等を使って閲覧状況を集計することがあります。ブラウザーの設定によりCookieを制限できますが、一部機能が利用できなくなる場合があります。</p>
        <h2>広告・アフィリエイト</h2>
        <p>当サイトは楽天アフィリエイト等の広告リンクを掲載する場合があります。リンク先の事業者が、成果測定のためCookieその他の識別技術を利用することがあります。リンク先での情報の取扱いは、各事業者の方針をご確認ください。</p>
        <h2>第三者提供と安全管理</h2>
        <p>法令に基づく場合を除き、取得した個人情報を利用目的の範囲を超えて第三者に提供しません。利用するサービス事業者における取扱いを含め、必要な範囲で情報を管理します。</p>
        <h2>お問い合わせと改定</h2>
        <p>個人情報の取扱いに関するご連絡は「お問い合わせ」ページのフォームからお願いします。本方針は、サービスや法令等の変更に応じて改定することがあります。</p>
        <p>制定日: 2026年8月13日</p>
      content_sha256: 09c1442ab4479b582c2974e0f32512ff03e118e1a78848c6bf0bf57f5a4e8868
      content_bytes: 1993
    - operation_id: page-advertising-policy-create
      slug: advertising-policy
      title: 広告・アフィリエイトについて
      type: page
      status: draft
      content: |-
        <p>当サイトは、記事内に広告やアフィリエイトリンクを掲載する場合があります。読者がリンク経由で商品を購入またはサービスを利用した場合、運営者が成果報酬を受け取ることがあります。読者の購入価格に追加料金が発生することを意味するものではありません。</p>
        <h2>編集上の独立性</h2>
        <p>報酬の有無・料率、広告主との取引条件を、商品の評価や掲載順の判断材料にはしません。比較は、記事に明示した条件と確認できた一次情報に基づいて行います。</p>
        <h2>表示と確認</h2>
        <p>広告やアフィリエイトリンクを含む記事では、記事内の分かりやすい位置にその旨を表示します。価格、在庫、ポイント、配送条件、返品条件等は変動するため、購入前にリンク先で最新情報をご確認ください。</p>
        <h2>リンクについて</h2>
        <p>アフィリエイトリンクは制度運営者が提供する公式手段で生成したものを使用します。リンク先の商品・サービスの提供、契約、支払い、配送、返品等はリンク先の事業者が行います。</p>
      content_sha256: 6731018bb1dfadcd83a82b3fc36dd288e5b3a2c946530a0ab36a88718337737f
      content_bytes: 1234
    - operation_id: page-contact-create
      slug: contact
      title: お問い合わせ
      type: page
      status: draft
      content: |-
        <p>暮らし選びノート編集部へのご連絡は、以下のフォームをご利用ください。記事の誤りや更新情報をお知らせいただく場合は、対象ページと確認できる一次情報を添えてください。</p>
        <p>営業・勧誘など内容によっては返信できない場合があります。送信前にプライバシーポリシーをご確認ください。</p>
