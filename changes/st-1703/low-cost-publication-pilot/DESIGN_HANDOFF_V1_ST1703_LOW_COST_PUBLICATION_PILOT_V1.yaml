  title: ST1703_LOW_COST_PUBLICATION_PILOT_V1
  approved_scope:
    - Record the repository-owner-approved 30-day low-cost publication pilot as a deterministic, source-derived, non-executable governance plan.
    - Select WordPress.com Personal as the sole candidate public platform while keeping subscription, custom-domain, draft, publication, and every external action unexecuted and unauthorized.
    - Limit Codex plus Git to interactive, human-controlled article drafting and local validation; exclude production runtime, unattended operation, provider API use, publication, and approval authority.
    - Keep OpenAI API, AWS, Cloudflare Pages, and custom Admin, API, and Worker components deferred and disabled.
    - Enforce an exact incremental external-spend ceiling of JPY 2000 per month, excluding an already-paid ChatGPT subscription, without resolving canonical OD-009 or replacing the historical Wave 1 90-day JPY 30000 business cap.
    - Record requirements-only quality, accessibility, affiliate, freshness, SEO, and Core Web Vitals gates without claiming that any check or external step ran.
    - Generate only a non-attesting JSON projection and its manifest through a hardened, deterministic local generator with a read-only check mode.
