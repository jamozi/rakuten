  rationale:
    - The approved proposal deliberately minimizes incremental spend and operational surface for a reversible 30-day learning period.
    - One candidate public platform avoids dual-run, migration, synchronization, and cutover complexity.
    - Human-controlled Codex plus Git preserves local reviewability while keeping AI outside publication, approval, and production runtime authority.
    - Deferring custom infrastructure and provider APIs preserves canonical provider, credential, finance, security, and release gates.
    - The JPY 2000 monthly pilot ceiling is a narrower incremental-spend constraint and therefore cannot resolve the broader canonical OD-009 decision or supersede a differently scoped historical cap.
  rejected_alternatives:
    - alternative: OpenAI API during the 30-day pilot
      reason: The owner explicitly deferred it; it would add provider, credential, data-control, and spend authority.
    - alternative: AWS hosting or services during the 30-day pilot
      reason: The owner explicitly deferred AWS; canonical region, credential, finance, staging, and release gates remain unresolved.
    - alternative: Cloudflare Pages as a second or replacement public platform
      reason: The owner selected WordPress.com Personal as the sole candidate and did not authorize dual-run or cutover.
    - alternative: Custom Admin, API, or Worker implementation
      reason: The owner explicitly deferred these components and the current slice is governance-only.
    - alternative: WordPress.com API automation or Codex publication
      reason: The owner limited Codex to draft creation and validation and reserved publication for a human under separate approval.
    - alternative: Treat the pilot cap as OD-009 resolution or as replacement of the historical Wave 1 cap
      reason: The scopes and time horizons differ and canonical truth cannot be revised by this Story-local plan.
  constraints:
    - Create exactly the delegated eleven all-new files; do not modify existing Wave 1, Wave 2, Wave 3, canonical, status, configuration, lock, or shared Main files.
    - The contract, projection, manifest, and generator are non-executable and non-attesting; they contain no action runner, provider client, browser control, network request, credential reference, environment-driven activation, or runtime integration.
    - Subscription, custom domain, WordPress.com draft creation, publication, purchase, account setup, credential use, and every external write remain NOT_EXECUTED and NOT_AUTHORIZED.
    - Every planned 30-day checkpoint is descriptive only; an external, draft, or publication step requires separate explicit approval.
    - Preserve unresolved OD-002, OD-005, OD-007, OD-008, OD-009, OD-012, OD-013, and OD-015 exactly and preserve their canonical safe defaults.
    - Preserve ST-1703 dependency status, Story acceptance false, TST-021, TST-022, and TST-032 formal status NOT_EXECUTED, and all live, browser, provider, staging, release, and production evidence as absent.
    - Requirements-only UX and quality gates remain NOT_EXECUTED and NOT_VERIFIED until separately performed with authorized artifacts.
  security_and_approval_gates:
    - This approval authorizes repository-local architecture and governance implementation only.
    - It does not authorize purchase, credentials, WordPress.com API calls, WordPress.com drafts, publication, custom domain, external writes, AWS activation, OpenAI API activation, Cloudflare activation, release, staging, or production.
    - Codex cannot approve or publish, and no unattended or production-runtime Codex path may be introduced.
    - Every external, draft, domain, subscription, credential, provider, browser, publication, staging, release, and production step requires its own explicit approval and prerequisite gates.
    - No action, effect, or evidence list may become nonempty in the source or generated projection.
    - Generated content must be derived only from the exact source contract after strict validation and exact authority-hash verification.
  acceptance_criteria:
    - The exact approved proposal, owner response, handoff bytes, and detached approval are hash-bound without circular self-approval.
    - WordPress.com Personal is the only candidate public platform; dual-run and cutover remain forbidden or unauthorized.
    - Codex plus Git is limited to interactive human-controlled draft creation and local validation, with no API, unattended, runtime, publisher, or approver authority.
    - OpenAI API, AWS, Cloudflare Pages, custom Admin, custom API, and custom Worker remain DEFERRED_DISABLED.
    - The incremental external-spend cap is exactly JPY 2000 per month excluding an already-paid ChatGPT subscription, while OD-009 and the historical Wave 1 cap remain separate and unchanged.
    - Subscription, domain, draft, publication, external actions, live evidence, formal evidence, Story acceptance, and dependency promotion remain blocked or unexecuted.
    - All specified quality, accessibility, affiliate, freshness, SEO, and Core Web Vitals items are represented as requirements only with NOT_EXECUTED and NOT_VERIFIED status.
    - The generator strictly parses and validates YAML, verifies exact source and helper hashes, deterministically emits only the JSON projection and manifest, supports read-only --check, and fails closed with sanitized errors.
    - Negative tests reject semantic, authority, status, path, serialization, source, helper, output, and evidence drift.
  required_test_evidence:
    - Build and --check produce deterministic byte-identical JSON and manifest output.
    - The isolated tests/st1703_low_cost suite passes, including critical negative-path and hostile-input cases.
    - Exact Ruff check and format, strict mypy, py_compile, and import checks pass with the hydrated pinned repository toolchain.
    - The affected existing tests/st1703 suite passes without invoking a live or external target.
    - make check-workspace and python3 scripts/import_raos_design.py verify pass read-only.
    - A sensitive-data scan covers the exact eleven-file inventory or records a linked-worktree-safe equivalent.
    - git diff --check, exact path inventory, frozen self-review, and atomic commit checks pass.
    - Formal TST-021, TST-022, TST-032, browser, provider, staging, release, publication, and production evidence remain explicitly unexecuted.
  open_decisions: []
