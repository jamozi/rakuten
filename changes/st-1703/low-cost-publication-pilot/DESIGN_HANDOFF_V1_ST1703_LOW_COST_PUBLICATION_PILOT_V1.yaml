  decision:
    approved_proposal:
      text: 30日パイロットでは、WordPress.com Personalを唯一の公開基盤、Codex＋Gitを記事作成・品質管理基盤とする。OpenAI API、AWS、Cloudflare Pages、独自Admin/API/Workerは保留。既存ChatGPT契約を除く外部費上限は月2,000円。CodexはDraft作成と検証のみで、公開は人手に限定する。
      utf8_bytes: 342
      sha256: 131534a5c035096a3e18abbc1e82f9937b50cd7d3c84e4a3fc413d52e57b6a5b
