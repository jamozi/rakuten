  approved_scope:
    - Reconcile the previously approved, non-executable ST-1703 low-cost publication pilot with the exact current committed Wave 3 runtime-manifest bytes without changing the approved pilot semantics.
    - Preserve the V1 handoff, detached approval, source contract, and generated projection byte-for-byte as historical authority and source-derived data artifacts.
    - Preserve the V1 proposal, WordPress.com Personal candidate, interactive Codex plus Git boundary, deferred components, JPY 2000 monthly incremental-spend ceiling, inherited blockers, empty action/effect/evidence lists, and all external and publication denials with semantic delta NONE.
    - Bind the reconciliation proposal to the exact current target commit and tree, the exact divergent V1 source commit and tree, the exact eleven-path V1 source inventory, and the complete observed Wave 3 runtime-manifest lineage.
    - Classify the current Wave 3 runtime as committed metadata only for this non-executable pilot reconciliation; do not infer or grant Wave 3 design, live, draft, publication, release, or production authority.
    - Record the two immutable Wave 3A commit-reference defects and the absence of a separate exact hash-bound OBJECT_DRIFT approval artifact as unresolved provenance and authority gaps that this reconciliation cannot repair or approve retroactively.
    - Define one closed post-approval repository-local integration file cut and require a new detached approval bound to this handoff's exact SHA-256 before any V1 import, cherry-pick, reconciliation implementation, or integration.

