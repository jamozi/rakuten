  rationale:
    - The approved V1 pilot is already deliberately inert and fail closed; the only integration incompatibility is that its exact authority chain also binds an earlier Wave 3 runtime-manifest byte identity.
    - The current target and V1 source diverged from one exact common ancestor, so a conflict-free Git import would not prove authority compatibility or make the old current-filesystem hash assertion true.
    - Separating the immutable historical binding from the exact current filesystem binding preserves the approved V1 record without silently rewriting it or using a historical Git object as a substitute for current repository bytes.
    - Exact target and source identities plus a closed path inventory make the later integration review reproducible while granting no authority before the owner's exact-SHA approval.
    - The discovered Wave 3 provenance gaps are recorded rather than normalized, corrected, accepted, or hidden because this pilot reconciliation has no authority to amend approved Wave 3A bytes or retroactively approve a runtime slice.
    - Keeping the generated projection byte-identical proves the V2 change is provenance reconciliation only and does not modify platform, spend, automation, quality, or publication semantics.

  rejected_alternatives:
    - alternative: Cherry-pick the V1 commit before a new exact-SHA owner approval
      reason: The V1 generator would fail closed against the current runtime manifest, and Git conflict absence is not implementation authority.
    - alternative: Edit or silently repin the V1 handoff, detached approval, source contract, or generated projection to the current manifest SHA-256
      reason: Those bytes are the approved historical authority and data chain; changing them would destroy the exact approval binding or introduce an unapproved semantic record.
    - alternative: Read the historical ac5f8015 runtime-manifest Git blob when the current filesystem contains 8cf00ace
      reason: A historical object is provenance metadata, not a valid current runtime input, and would bypass fail-closed filesystem drift detection.
    - alternative: Treat the current runtime manifest, commit history, author identity, README, or worklog as independent design approval
      reason: Those artifacts prove bytes or record statements but do not replace a required exact hash-bound handoff and detached approval.
    - alternative: Correct the two invalid Wave 3A commit IDs in place or substitute the same-subject commits as authority
      reason: The Wave 3A handoff and approval are immutable; this V2 scope cannot repair or reinterpret their approved bytes.
    - alternative: Treat this V2 approval as retroactive authority for OBJECT_DRIFT or any Wave 3 live operation
      reason: The owner approval target is only the low-cost reconciliation handoff and expressly grants no Wave 3, live, draft, publication, release, or production authority.
    - alternative: Add a second public platform, provider integration, unattended runtime, browser automation, or external action while reconciling the metadata
      reason: Each would change approved V1 semantics and require separate canonical, security, credential, finance, and human authority.

  constraints:
    - Before exact owner approval, create or modify no file other than this all-new proposal and its non-authoritative one-way handshake explanation.
    - This handoff is a proposal and grants no implementation, import, cherry-pick, integration, external, live, draft, publication, release, staging, or production authority.
    - The repository owner must approve this exact handoff SHA-256; approval of prose, a summary, a branch, a commit, a tree, the V1 handoff, or the explanatory Markdown is insufficient.
    - The future detached approval must be a new immutable file and must not mutate either V1 approval or this V2 handoff.
