    - The exact source range contains the complete ST-1703 implementation lineage while the preceding three commits are ST-0101-only and outside the integration scope.
    - A range patch is deterministic and applies cleanly because the only target overlap is a Makefile byte-identical to the source range parent.
    - The source Wave 3 base commit is not an ancestor of the target, so leaving it active would correctly fail runtime identity; a one-literal target-parent rebind plus owner-generator regeneration is the minimal mechanical repair.
    - V2 explicitly stops on later target or runtime-manifest drift, making a new exact-SHA V3 handoff necessary.
    - Historical authority/data artifacts remain byte-frozen; V3 records new target metadata separately and grants no retroactive Wave 3 or OBJECT_DRIFT authority.
    - The source-packet whitespace warning is a known immutable byte property, not an apply conflict or permission to normalize the packet.

