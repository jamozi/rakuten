  approved_scope:
    - Replace only the unavailable WordPress.com wp/v2 numeric-site transport in the existing ST-1703 review-draft adapter.
    - Keep the fixed remote authority public-api.wordpress.com:443 and fixed numeric site ID 256699520.
    - Use one authenticated read-only GET to /rest/v1.1/sites/256699520/posts?context=edit&number=1&fields=ID before any new durable INTENT.
    - Use one POST to /rest/v1.1/sites/256699520/posts/new only after the preflight succeeds and exact INTENT is fsynced.
    - Encode exactly title, content, status=draft, and publicize=false as application/x-www-form-urlencoded with one reviewed deterministic UTF-8 encoding.
    - Preserve the immutable article, source packet, target origin, OAuth token alias, durable one-create journal, ambiguity stop, committed replay, and no-publication controls.
    - Validate one bounded provider response as an exact draft receipt without retaining its body.
    - Update the existing Wave 2/Wave 2A implementation, isolated tests, README, and append-only ST-1703 worklog in one atomic Story slice.

