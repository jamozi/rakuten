  decision:
    id: ST0106-HOSTED-SECRETS-HIGH-CONFIDENCE-V2
    selected_strategy: MINIMUM_CORPUS_PROVEN_KIND_FIRST_FIXTURE_EXTENSION
    inherited_v1_policy: >-
      Every V1 classifier stage, threshold, ordering rule, provider-specific
      rule, output restriction, test obligation, and protected boundary remains
      authoritative except where this V2 explicitly replaces the exact fixture
      grammar below.
    retained_declaration_first_fixture_family:
      status: unchanged_from_v1
      declaration:
        - not-a-real followed by one V1-listed hyphenated credential kind
        - not_real followed by one V1-listed underscored credential kind
      suffixes: retain the exact V1 optional decimal or ST-prefixed decimal identifier and lower-case x padding rules
      decoding: retain V1 single complete ASCII/Python string-literal-only decoding
    added_kind_first_fixture_family:
      applicability: complete generic-assignment candidate only
      exact_hyphenated_kinds:
        - client-secret
        - access-token
      exact_component_order:
        - one exact listed kind
        - exact lower-case not-real declaration
        - one mandatory nonempty ASCII decimal fixture identifier
        - one mandatory lower-case x padding component of at least four characters
      separator: hyphen only
      grammar: >-
        (?:client-secret|access-token)-not-real-[0-9]+-x{4,}
      case_sensitive: true
      full_match_required: true
      wrapper_policy: >-
        The candidate may instead be one complete ASCII/Python string literal
        whose decoded str or bytes payload matches the exact grammar. Decoding
        is allowed solely for this fixture decision and contributes no general
        source-expression, placeholder, reference, or credential exemption.
    explicit_non_matches:
      - Any credential kind other than client-secret or access-token.
      - Any underscore, mixed, repeated, missing, or alternate separator.
      - Any declaration other than exact lower-case not-real in the kind-first family.
      - Missing, signed, prefixed, hexadecimal, ST-prefixed, empty, or non-decimal fixture identifiers.
      - Missing padding, fewer than four x characters, upper-case X, or mixed padding.
      - Prefix, suffix, residual byte, additional component, interpolation, concatenation, or multiple literal.
      - Invalid, non-ASCII, incomplete, formatted, or composite literal wrapper.
      - A strong credential that merely contains a permitted fixture string as a substring.
    classifier_order:
      - Existing provider-specific rules and overlap precedence remain first and unchanged.
      - Existing exact placeholder and sentinel stages remain unchanged.
      - Test the complete retained declaration-first and added kind-first fixture families.
      - Existing exact external-reference, bare closed-AST, and bare symbolic-reference stages remain unchanged.
      - Existing distinct-byte gate and digit-bearing, digit-free opaque, and lower-case passphrase evidence families remain unchanged.
    output_contract:
      rule: GENERIC_CREDENTIAL
      allowed: sanitized source identifier, line number, and closed rule identifier only
      forbidden: candidate, assignment, source line, entropy, AST, exception text, prompt, response, environment value, or credential
  rationale:
    - >-
      Three protected observations require exactly two kind names, one separator
      family, one order, one declaration, and mandatory decimal/padding
      components. Restricting the extension to those proven dimensions creates
      the smallest content-based correction and no source-specific bypass.
    - >-
      Mandatory decimal and x-padding components distinguish the new family
      from ordinary credentials named with a kind and not-real substring. V1's
      broader declaration-first family remains separately owner-approved and is
      not expanded by symmetry.
    - >-
      access-token is admitted only in this complete kind-first family because
      one protected observation category requires it; it is not silently added
      to V1's declaration-first vocabulary or symbolic credential vocabulary.
    - >-
      The same complete classifier runs for worktree, archive, nested archive,
      and Git blobs, so no path, line, object, or historical exception is needed.
  rejected_alternatives:
    - alternative: admit kind-first forms for every V1 credential kind
      reason: symmetry is not required by current evidence and would create unnecessary safe surface
    - alternative: make ID or x padding optional, or admit ST-prefixed IDs
      reason: none is required by the three observations and each broadens the bypass grammar
    - alternative: add access-token to every fixture or generic vocabulary
      reason: the evidence authorizes only the exact complete kind-first family
    - alternative: accept any value containing not-real, fake, fixture, sample, or example
      reason: substring exemptions allow a real credential to self-label as safe
    - alternative: use source path, line, assignment key, blob hash, exact value, or test-file context
      reason: source-context exemptions are allowlists and do not apply uniformly to archives and history
    - alternative: edit the three fixtures or rewrite Git history
      reason: V1 protects those bytes and historical equivalence is part of the scanner contract
    - alternative: continue under an interpretation of the exact V1 prefix grammar
      reason: kind-first and declaration-first are structurally distinct; implementation authority must be explicit
