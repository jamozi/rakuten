  decision:
    id: ST0106-HOSTED-SECRETS-HIGH-CONFIDENCE-V3
    selected_strategy:
      - BOUNDED_SAME_PHYSICAL_LINE_RHS_RECONSTRUCTION_THEN_EXISTING_CLOSED_AST
      - EXACT_INTEGER_RATIONAL_ENTROPY_COMPARISON
    inherited_v1_v2_policy: >-
      Every V1/V2 classifier stage, safe-shape grammar, fixture grammar,
      provider rule and precedence, family conjunction, threshold, length and
      distinct-byte gate, output restriction, traversal, CLI, and protected
      boundary remains authoritative except for the two exact implementation
      rules below.
    rhs_reconstruction:
      placement: >-
        Provider-specific and private-key detections remain first. Existing V2
        candidate-only fixture, placeholder, sentinel, external-reference,
        bare closed-AST, symbolic-reference, and high-confidence decisions run
        unchanged. V3 is attempted only for an otherwise live digit-bearing
        GENERIC_CREDENTIAL bare finding before that finding is emitted.
      inputs:
        - complete raw byte sequence already being scanned
        - original bare value span [s,e)
        - exact original candidate bytes B[s:e]
        - immutable closed scanner configuration
      forbidden_inputs:
        - source path, filename, extension, line number, assignment key, archive name, or source category
        - Git commit, ref, blob ID, maintained/history status, candidate digest, exact-value table, or allowlist
      eligibility:
        - The original candidate is nonempty ASCII and belongs to the unchanged bare capture.
        - The unchanged candidate-only classifier selects a digit-bearing generic finding.
        - Parsing exactly the original candidate as Python 3.10 eval syntax raises SyntaxError.
        - A candidate that parses but fails the closed AST validator is ineligible and remains a finding.
        - Non-ASCII, residual, unexpected-exception, and non-SyntaxError cases are ineligible and remain findings.
      physical_line_boundary:
        - The line starts after the nearest preceding LF byte or at byte zero.
        - The line ends before the next LF byte or at end of input.
        - Exactly one CR immediately before LF is the excluded CRLF terminator; every other CR rejects reconstruction.
        - The complete physical line is at most 4096 bytes.
        - Physical-line content contains only HTAB or printable ASCII bytes 0x20 through 0x7e.
        - The original value start s is the only permitted expression start; never search for another start.
        - S is the exact byte sequence from s to the physical-line content end.
        - B[s:e] must be the exact initial prefix of S, e must precede the end of S, and S is at most 2048 bytes.
      exact_coverage:
        - Do not strip, trim, normalize, decode with replacement, or invent bytes.
        - Reject initial or trailing SP or HTAB in S.
        - Reject every Python COMMENT token and every semicolon outside a string literal.
        - Reject explicit or implicit continuation to another physical line.
        - A hash byte inside one complete string or bytes literal is ordinary literal material, not a comment.
        - Reject tokenization error, NUL, residual token, trailing comma, second expression, assignment, named expression, outer-container residue, or unmatched delimiter.
      complete_parse:
        - Decode S as strict ASCII and tokenize it with system-Python-3.10-compatible tokenize rules.
        - Parse exactly S in ast eval mode with feature_version set unconditionally to (3, 10).
        - Never evaluate, import, resolve a name, access an attribute, call code, or inspect runtime state.
        - Parsing and validation must consume the entire S as exactly one expression.
      structural_acceptance:
        - Apply exactly the existing V1/V2 structural closed AST inventory to the full parsed expression.
        - Do not add or remove an AST node type, operator, literal form, callable-name rule, attribute-name rule, or source-operation marker.
        - Preserve the existing name-agnostic structural treatment of Name, Attribute, Call, Subscript, keyword, Slice, and their existing context restrictions.
        - Every string or bytes constant must pass the existing single-token source-segment extraction and suspicious-literal rejection.
        - Implicit adjacent literal concatenation, f-string nodes, unsupported nodes, unsupported literal context, ambiguous decoding, or residual lexical material remains a finding.
      limits:
        substantive_tokens: 256
        ast_nodes_including_expression_root: 128
        ast_parent_child_depth: 24
        source_string_or_bytes_literal_tokens: 16
        decoded_bytes_per_bytes_literal: 1024
        decoded_code_points_per_str_literal: 1024
        decoded_utf8_bytes_per_str_literal: 1024
        aggregate_decoded_literal_bytes: 2048
        rule: >-
          Any lower existing bound remains effective; V3 never raises an
          existing scanner, candidate, archive, or traversal limit. Count AST
          nodes and depth iteratively.
      result:
        success: suppress only the original generic finding
        expected_refusal: emit the original finding with its original rule, span, line, redaction, and exit effect
        unexpected_failure: use the existing sanitized nonzero internal-error boundary without browser/source/candidate material
        independent_findings: provider-specific, private-key, and other generic findings remain unaffected
    exact_entropy:
      production_float_policy: >-
        Delete the floating Shannon-entropy helper, its float thresholds, and
        every production or fallback logarithmic, Decimal, approximate,
        tolerance, epsilon, isclose, fsum, or sorted-float comparison path.
      approved_thresholds:
        digit_bearing:
          numerator: 7
          denominator: 2
          unchanged_decimal_description: 3.5
        digit_free_opaque:
          numerator: 15
          denominator: 4
          unchanged_decimal_description: 3.75
        lower_case_passphrase:
          numerator: 33
          denominator: 10
          unchanged_decimal_description: 3.3
      algebra: >-
        For nonempty candidate length n, positive byte counts c_i summing to n,
        and approved reduced positive rational threshold a/b, Shannon entropy
        H is at least a/b exactly when n**(b*n) is at least
        2**(a*n) multiplied by the product of c_i**(b*c_i).
      algorithm:
        - Select the family through one closed internal map containing exactly the three approved reduced integer pairs.
        - Require numerator and denominator exact type int and not bool, positive, denominator nonzero, and gcd equal to one.
        - Build one fixed 256-slot integer histogram from the unchanged candidate bytes.
        - Traverse byte slots in ascending numeric order and omit zero-count bins.
        - For empty input return false before exponentiation.
        - Compute L as pow(n, b*n).
        - Initialize R as 1 shifted left by a*n bits.
        - Multiply R by pow(c, b*c) for each positive count c.
        - Return true exactly when L is greater than or equal to R; equality is included.
      invariants:
        - Existing family minimum and maximum lengths run before entropy comparison.
        - Existing maximum candidate length remains 512 bytes and is never raised.
        - More than 256 positive bins, nonpositive counts, or counts not summing to n is an internal invariant failure.
        - Unknown family or an altered/invalid threshold map is a fatal sanitized internal configuration failure, never a non-match.
        - Python integer power, multiplication, shift, and comparison are exact and do not invoke libm.
      complexity:
        time: O(n) histogram plus at most 256 bounded integer power/multiplication operations
        alphabet: 256 byte values
        maximum_denominator: 10
        maximum_numerator: 33
        maximum_candidate_length: 512
      failure_behavior: >-
        MemoryError, arithmetic failure, threshold validation failure, or an
        impossible histogram invariant uses the existing fail-closed sanitized
        nonzero internal-error boundary. Never return clean, retry another
        numerical method, or expose candidate, histogram, source, assignment,
        exception representation, traceback, entropy value, AST, or RHS bytes.
    output_contract:
      allowed: sanitized source identifier, line number, closed rule identifier, and existing sanitized operational error fields only
      forbidden: candidate, assignment, reconstructed RHS, source line, histogram, entropy, AST, exception text, prompt, response, environment value, or credential
  rationale:
    - >-
      Same-line reconstruction does not declare an incomplete prefix safe. It
      examines the exact omitted bytes, requires one complete expression with
      no residual data, and passes that expression through the already-approved
      closed AST and suspicious-literal rules. The observed contradiction is
      therefore removed without an operation-name, path, value, or blob bypass.
    - >-
      Restricting reconstruction to one printable-ASCII physical line and the
      original value start preserves stable finding boundaries and avoids file
      type, indentation, multiline, encoding, or language inference.
    - >-
      The integer entropy inequality follows algebraically from Shannon
      entropy and monotonicity of log2. It is exact at inclusive rational
      boundaries, depends only on the histogram, and cannot vary with Counter
      insertion order, Python hash seed, summation order, or libm rounding.
    - >-
      Both corrections operate on identical raw bytes for worktree, archive,
      nested archive, and Git blobs and require no source or history edit.
  rejected_alternatives:
    - alternative: candidate-only truncated-prefix grammar
      reason: >-
        The prefix omits arguments, closing delimiters, literals, and residual
        material; accepting it creates a direct false-negative class and an
        operation/value allowlist.
    - alternative: expected-finding ledger, fixed count, source path, line, value, hash, or Git-object exception
      reason: >-
        It weakens the clean-scan assertion, fails uniform archive/history
        parity, and creates identity-based security exemptions.
    - alternative: edit maintained sources or rewrite history
      reason: >-
        V1/V2 protect those bytes, five findings exist in historical blobs, and
        history rewriting is prohibited.
    - alternative: whole-file, multiline, balanced-delimiter-regex, or handwritten Python-expression reconstruction
      reason: >-
        These introduce encoding, language, indentation, escape, comment,
        nesting, parser-differential, complexity, and finding-boundary risk.
    - alternative: floating sum in sorted order or math.fsum
      reason: >-
        Reordering or improving a floating sum still rounds irrational
        logarithmic terms and cannot prove exact inclusive-boundary behavior.
    - alternative: Decimal, higher precision, epsilon, tolerance, nextafter, or dual-path cross-check
      reason: >-
        Each retains a rounding policy or fallback disagreement at an exact
        rational boundary and is unnecessary when an exact integer inequality
        exists.
    - alternative: change thresholds or family gates to avoid equality
      reason: >-
        It changes approved detection semantics instead of fixing the
        nondeterministic implementation.
  constraints:
