    - All nine sanitized maintained/history occurrences produce zero findings through the same content-structural V3 decision without identity comparisons or source/history edits.
    - An incomplete candidate alone, code-shaped quoted credential, disallowed AST, suspicious literal, comment, residual byte, whitespace suffix, multiline continuation, or any limit failure retains the original finding.
    - The original finding span, line, rule, redaction, and exit behavior remain byte-for-byte stable on every V3 refusal.
    - Worktree, supported archives, nested archives, and every Git blob apply identical reconstruction and entropy decisions from identical bytes and spans.
    - Every permutation of the same byte-frequency histogram receives the same exact result at 7/2, 15/4, and 33/10 under Python 3.10 and every tested PYTHONHASHSEED.
    - Exact equality is accepted and exact below/above relationships are distinguished using integer operands only.
