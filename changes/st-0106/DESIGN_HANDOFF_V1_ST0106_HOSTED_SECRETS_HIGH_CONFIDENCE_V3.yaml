    - Every V1/V2 fixture, provider, placeholder, sentinel, reference, AST, symbolic-reference, family conjunction, threshold, length, distinct-byte, archive, history, and redaction behavior not explicitly corrected remains unchanged.
    - Scanner and test failures never reveal raw candidates, assignments, reconstructed RHS, source lines, histograms, entropy, prompts, responses, environment values, ASTs, parser exceptions, or credentials.
    - The exact complete scanner exits zero in a disposable clean non-shallow clone of the frozen commit under the existing denied-network wrapper.
    - The hosted-like ST-0101 selector remains unchanged and passes with exactly seven owner-private deselections on this base.
    - Documentation describes V1/V2 supersession, V3 algorithms, local evidence, and all hosted/formal non-claims.
