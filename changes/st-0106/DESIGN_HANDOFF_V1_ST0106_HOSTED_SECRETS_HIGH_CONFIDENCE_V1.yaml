DESIGN_HANDOFF_V1:
  document_version: 1
  proposal_status: PENDING_OWNER_SHA256_APPROVAL
  approved_story: ST-0106
  approved_scope:
    - >-
      Repair the existing ST-0106 generic credential classifier so the exact
      full worktree-and-Git-history Secrets job passes on the current main tree
      without suppressing provider-specific credentials or weakening redaction.
    - >-
      Replace broad generic-value heuristics with complete safe-shape parsing
      followed by a deterministic high-confidence generic-credential policy.
    - >-
      Preserve all maintained source, fixture, handoff, archive, and Git object
      bytes that the current generic rule reports as false positives; fix the
      scanner and its hostile tests instead of the scanned material.
    - >-
      Document and verify only the Secrets-job classifier boundary. The already
      merged ST-0101 hosted Unit hybrid boundary is an immutable prerequisite,
      not part of this implementation slice.
  exact_target:
    base_commit: 6f8dafb511ed9492a51d7c831a3c212f8f52deae
    base_tree: 9f263246f5aca387d30f6050b508c209eb148f1c
    remote_ref: refs/remotes/origin/main
    branch: codex/st-0106-hosted-ci-recovery-v2
    runner: ubuntu-24.04
    job: Secrets
    local_equivalent: >-
      /usr/bin/python3 -I scripts/scan_secrets.py --worktree --git-history
  source_design_refs:
    - RAOS-INTEGRATION-001 sections 3, 6, 8, and 9
    - INT-DEC-012 Security verification baseline
    - INT-DEC-013 Codex authority boundary
    - RAOS-SEC-001 sections 3, 7, 9, 10, 12, and 13
    - RAOS-TEST-SUITES-001 TST-001 and TST-002
    - ST-0106 Base pull-request CI
    - changes/st-0106/DESIGN_HANDOFF_V1_ST0106_HOSTED_NETWORK_ISOLATION_COMPATIBILITY_V1.yaml
    - changes/st-0101/DESIGN_HANDOFF_V1_ST0101_HOSTED_UNIT_HYBRID_BOUNDARY_V1.yaml
    - changes/st-0101/hosted-unit-hybrid-boundary.v1.yaml
  decision:
    id: ST0106-HOSTED-SECRETS-HIGH-CONFIDENCE-V1
    selected_strategy: STRUCTURED_SAFE_SHAPES_THEN_HIGH_CONFIDENCE_GENERIC
    classification_order:
      - >-
        Run the existing AWS, GitHub, OpenAI, and private-key rules exactly as
        today and retain their spans before generic assignment classification.
      - >-
        Extract the existing quoted or bare generic assignment value without
        including its raw bytes in a finding, exception, diagnostic, or log.
      - >-
        Reject only complete, closed safe shapes: exact placeholders, the new
        exact not-real fixture shape, exact external-reference wrappers, exact
        bare source expressions, or exact lower-case symbolic references.
      - >-
        Classify every remaining candidate with the deterministic
        high-confidence evidence rules below; emit GENERIC_CREDENTIAL only when
        at least one complete rule matches.
    provider_specific_policy:
      rules:
        - AWS_ACCESS_KEY_ID
        - GITHUB_TOKEN
        - OPENAI_API_KEY
        - PRIVATE_KEY
      requirement: >-
        Existing patterns, overlap precedence, line attribution, worktree,
        archive, Git-history, and redacted output behavior remain unchanged.
        Generic safe-shape logic never suppresses a provider-specific match.
    normalization:
      - Candidate length remains bounded by the existing assignment grammar.
      - Strip only ASCII surrounding whitespace already outside the captured value.
      - Do not case-fold, normalize Unicode, decode escapes, or concatenate source expressions for credential evidence.
      - >-
        A complete ASCII/Python string-literal wrapper may be decoded only to
        test the exact explicit not-real fixture grammar. It may not make source
        expressions, symbolic references, placeholders, or high-confidence
        values safe.
    exact_placeholder_policy:
      - Preserve the current anchored full-value placeholder vocabulary and suffix grammar.
      - Preserve none, null, undefined, and required only as complete case-insensitive values.
      - Replace prefix or substring exemptions with complete closed reference forms.
      - A value that merely contains fake, sample, fixture, example, or another placeholder word remains eligible for detection.
    explicit_not_real_fixture_policy:
      purpose: >-
        Admit tracked negative-test material that names its credential kind and
        declares the entire value not real, without creating a general fake-word
        bypass.
      complete_shape:
        prefix: exact not-a-real or not_real declaration
        required_kind:
          - access-key
          - api-key
          - auth-token
          - client-secret
          - credential
          - key
          - password
          - secret
          - token
        optional_suffix:
          - one decimal or ST-prefixed decimal fixture identifier
          - one lower-case x padding component of at least four characters
        separators: only the approved hyphen or underscore positions
      refusals:
        - A substring match, prefix match, suffix match, concatenation, interpolation, mixed wrapper, or trailing material is not safe.
        - Wrong case, an unknown credential kind, a high-confidence extra component, or an invalid literal wrapper is not safe.
    bare_source_expression_policy:
      applicability: bare generic-assignment values only
      parser: >-
        Parse the complete candidate with the Python standard-library AST in
        eval mode. Syntax failure or residual bytes makes it not safe.
      allowed_roots:
        - Name
        - Attribute
        - Call
        - Subscript
      closed_descendants:
        - Expression
        - Name
        - Load
        - Attribute
        - Call
        - Subscript
        - Constant
        - keyword
        - Slice
      constraints:
        - >-
          Operators, lambdas, comprehensions, formatted strings, containers,
          comparisons, boolean expressions, and all nodes outside the closed
          inventory make the candidate not safe.
        - >-
          Constants are allowed only as inert call/subscript labels or indices.
          Any string or bytes constant independently satisfying the
          high-confidence credential policy makes the whole expression not safe.
        - >-
          The two existing SAFE_BARE_SOURCE_EXPRESSIONS remain accepted as exact
          whole candidates, but no substring source marker is an exemption.
        - Quoted source-expression text is never treated as a source expression.
    exact_external_reference_policy:
      applicability: complete generic-assignment values only
      allowed_shapes:
        - POSIX-style dollar-name or braced dollar-name reference with an ASCII identifier
        - Windows-style percent-delimited ASCII identifier
        - double-braced template reference containing one ASCII identifier
        - angle-bracket placeholder containing one approved placeholder identifier
      constraints:
        - Prefix-only, suffix-only, nested, interpolated, or residual material is not safe.
        - URLs are not made safe merely by an http or https prefix.
    symbolic_reference_policy:
      applicability: bare generic-assignment values only
      complete_shape: >-
        Lower-case ASCII words joined only by hyphen or underscore, with no
        uppercase byte or digit, and containing at least one whole credential
        vocabulary word.
      credential_vocabulary:
        - access
        - api
        - auth
        - client
        - credential
        - credentials
        - key
        - password
        - secret
        - token
      constraints:
        - Substring vocabulary matches do not qualify.
        - Quoted symbolic-looking values are not safe under this rule.
        - Mixed-case, digit-bearing, dotted, slashed, padded, or residual candidates proceed to high-confidence classification.
    high_confidence_generic_policy:
      shared_requirement:
        minimum_distinct_bytes: 6
        entropy_definition: deterministic Shannon entropy in bits per byte over the exact candidate bytes
      digit_bearing:
        required:
          - at least one ASCII digit
          - at least one ASCII letter
          - >-
            at least one of: both lower and upper ASCII letters; a non-alphanumeric
            byte; or length at least 20 with entropy at least 3.5
      digit_free_opaque:
        required:
          - length at least 24
          - at least one lower and one upper ASCII letter
          - only ASCII letters plus base64-style plus, slash, underscore, hyphen, or equals bytes
          - entropy at least 3.75
      lower_case_passphrase:
        required:
          - length at least 20
          - at least three nonempty lower-case ASCII words separated by hyphens
          - no whole word from the credential vocabulary
          - entropy at least 3.3
      non_matches:
        - >-
          A candidate outside all three evidence families is not reported by the
          generic rule; provider-specific rules remain independently decisive.
    output_contract:
      finding_rule: GENERIC_CREDENTIAL
      exposed_fields:
        - sanitized source identifier
        - line number
        - closed rule identifier
      forbidden_fields:
        - candidate bytes
        - assignment bytes
        - surrounding source line
        - entropy value
        - AST dump
        - environment value
      exit_behavior: findings remain exit 1; unsafe or unreadable inputs remain exit 2
  rationale:
    - >-
      The current generic rule treats any twelve-byte value with six distinct
      bytes as a credential after broad exclusions. That makes ordinary source
      expressions, symbolic references, and explicit negative fixtures
      indistinguishable from opaque credentials.
    - >-
      The current exact clean-clone scan reports only GENERIC_CREDENTIAL, while
      no provider-specific rule fires. A generic-only repair is therefore the
      narrowest evidence-backed slice.
    - >-
      Closed safe shapes prevent an attacker from hiding a strong credential by
      inserting fake, sample, a source marker, or a reference prefix. The later
      high-confidence stage keeps representative opaque secrets detectable.
    - >-
      No path or blob exception is required. Identical bytes are classified the
      same way in the worktree, archives, and every fetched Git blob.
    - >-
      A local in-memory prototype produced a clean complete scan while retaining
      all named canary classes. This proves feasibility only; it is not
      implementation or validation evidence.
  rejected_alternatives:
    - alternative: allowlist the ten maintained source paths or their current line numbers
      reason: path and line exceptions hide later real credentials and diverge between worktree, archives, and Git history
    - alternative: allowlist current Git blob IDs or exact current false-positive values
      reason: blob/value exceptions create permanent blind spots and turn scanned content into policy authority
    - alternative: rewrite tracked fixtures, handoffs, or application source until the current scanner passes
      reason: changes unrelated artifacts to accommodate a classifier defect and leaves equivalent historical blobs failing
    - alternative: remove or disable GENERIC_CREDENTIAL
      reason: discards the canonical generic-secret safety objective and loses non-provider canaries
    - alternative: treat any value containing fake, sample, fixture, example, or a source marker as safe
      reason: enables trivial substring bypasses for real credentials
    - alternative: use entropy alone
      reason: entropy without structural constraints over-matches source identifiers while missing common structured credentials and passphrases
    - alternative: change the workflow, denied-network wrapper, or ci-secrets command
      reason: the job reaches the scanner correctly; the observed failure is classifier precision, not job orchestration
    - alternative: reopen the ST-0101 Unit boundary in this slice
      reason: current main already contains its independently approved hybrid contract and passes the hosted selection locally
  constraints:
    - The implementation base commit and tree must remain exact.
    - Use only the Python standard library; add no package, lockfile, toolchain, cache, or network dependency.
    - Keep scanner CLI arguments, exit codes, archive limits, worktree enumeration, Git-object enumeration, and shallow-history refusal unchanged.
    - Keep all provider-specific patterns and behavior unchanged.
    - Keep findings value-free and deterministic; tests must prove raw canaries and assignments are absent from stdout and stderr.
    - No path, filename, extension, line, archive-member, blob-ID, commit-ID, or exact-value allowlist may be added.
    - No currently reported maintained source or historical blob may be edited, deleted, rewritten, or hidden.
    - No workflow, Make target, pytest marker, Unit selector, network boundary, hydration behavior, provider, credential, deployment, publication, release, or Production behavior may change.
    - The proposal YAML and explanatory Markdown become immutable immediately after exact owner approval.
    - Formal TST-001 and TST-002 remain NOT_EXECUTED until a real reviewed GitHub-hosted run and append-only status transition exist.
