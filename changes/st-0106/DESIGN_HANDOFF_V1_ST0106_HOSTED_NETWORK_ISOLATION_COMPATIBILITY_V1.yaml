DESIGN_HANDOFF_V1:
  document_version: 1
  proposal_status: PENDING_OWNER_SHA256_APPROVAL
  approved_story: ST-0106
  approved_scope:
    - Restore the existing ST-0106 denied-network boundary on GitHub-hosted Ubuntu 24.04 when unprivileged user namespaces are unavailable.
    - Preserve the current non-root user-namespace launcher unchanged when its trusted probe succeeds.
    - Add one fixed privileged namespace-creation fallback that drops every privilege before any repository-controlled Python, shell, test, or requested command executes.
    - Extend runtime assertions and hostile tests without changing hydration, provider, credential, deployment, publication, or Production behavior.
    - Regenerate only the ST-0107 manifest as a mechanical downstream provenance closure; grant no ST-0107 semantic or activation authority.
  exact_target:
