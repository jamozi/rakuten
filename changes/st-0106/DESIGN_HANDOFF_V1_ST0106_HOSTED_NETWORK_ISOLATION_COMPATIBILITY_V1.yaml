  decision:
    id: ST0106-HOSTED-NETWORK-ISOLATION-V1
    selected_strategy: PRIVILEGED_NAMESPACE_CREATION_THEN_COMPLETE_DROP
    normal_path:
      probe:
        executable: /usr/bin/unshare
        arguments: [--user, --map-current-user, --, /bin/true]
        environment: fixed_minimal
        repository_code_executed: false
      launcher:
        executable: /usr/bin/unshare
        arguments: [--user, --map-current-user, --net, --pid, --fork, --kill-child]
        identity: current_non_root_uid_gid
        launch_mode: UNPRIVILEGED_USER_NAMESPACE
    fallback_activation:
      condition: trusted normal-path probe returns nonzero
      automatic_retry_count: 0
      password_prompt: forbidden
      persistent_host_mutation: forbidden
      sysctl_mutation: forbidden
      apparmor_policy_mutation: forbidden
    fallback_trusted_chain:
      - validate fixed /usr/bin/sudo as root-owned, executable, non-group/world-writable, and set-user-ID root
      - validate fixed /usr/bin/unshare and /usr/bin/setpriv as root-owned, executable, and non-group/world-writable
      - require fixed /usr/bin/sudo -n to execute a fixed /bin/true without repository code or input
      - close every inherited descriptor above standard error before entering sudo
      - execute fixed /usr/bin/env -i and fixed /usr/bin/unshare as root with fresh network, PID, and mount namespaces plus a private proc mount
      - execute fixed /usr/bin/setpriv before the repository assertion or requested command
      - set the original non-root UID and GID, clear supplementary groups, drop the complete capability bounding, inheritable, and ambient sets, and set no_new_privs
      - execute /usr/bin/python3 -I scripts/assert_network_denied.py only after the complete drop
      - execute the requested absolute command only after the assertion installs the existing socket-denying seccomp filter
    fallback_launcher:
      sudo: [/usr/bin/sudo, -n, --]
      environment: /usr/bin/env -i with the existing fixed PATH, HOME, locale, timezone, namespace attestations, and closed launch-mode value only
      unshare: [/usr/bin/unshare, --net, --pid, --mount, --fork, --kill-child, --mount-proc]
      privilege_drop:
        executable: /usr/bin/setpriv
        required_arguments:
          - original non-root --reuid and --regid
          - --clear-groups
          - --bounding-set=-all
          - --inh-caps=-all
          - --ambient-caps=-all
          - --no-new-privs
      launch_mode: PRIVILEGED_NAMESPACE_THEN_DROP
    runtime_attestation:
      existing:
        - child network namespace differs from parent
        - child PID namespace differs from parent and entry process is PID 1
        - only loopback is visible and IPv4/IPv6 external routes are unusable
        - real and effective UID/GID are equal and non-root
        - no_new_privs and seccomp filter are active before requested command
        - network-capable sockets and io_uring setup are denied while socketpair remains available
      added:
        - launch mode is one exact closed value
        - fallback mount namespace differs from parent
        - fallback supplementary group list is empty
        - fallback effective, permitted, inheritable, ambient, and bounding capabilities are all zero
        - report identifies the exact launch mode without dynamic host material
  rationale:
    - Ubuntu documents the global sysctl disable as losing the kernel-attack-surface mitigation; this proposal does not change it.
    - A broad AppArmor profile for the general-purpose unshare executable would create a reusable bypass surface and requires additional host policy lifecycle not owned by ST-0106.
    - Root is used only by fixed system binaries to create namespaces. The first repository-controlled executable runs after UID, GID, groups, capabilities, and privilege gain are closed.
    - This exact architecture previously existed in repository history and was later removed by a broad refactor, so it is a bounded restoration with additional capability assertions rather than a new provider or CI platform.
  rejected_alternatives:
    - alternative: disable kernel.apparmor_restrict_unprivileged_userns for the whole runner
      reason: broadens kernel attack surface for every later process and is unnecessary when a fixed root-created namespace can retain isolation
    - alternative: install an AppArmor profile granting userns to /usr/bin/unshare
      reason: the executable is general purpose, the policy would be broader than the one RAOS invocation, and profile installation/validation creates a new root policy lifecycle
    - alternative: omit fresh user/network/PID namespaces and rely on seccomp only
      reason: violates the approved multi-layer isolation contract and loses route/interface/PID-boundary evidence
    - alternative: run repository checks as root inside the new namespace
      reason: violates the non-root identity invariant and exposes repository-controlled code to root authority
    - alternative: mutate .github/workflows/ci.yml with duplicated sudo or sysctl steps
      reason: duplicates privileged policy across four jobs and moves it outside the single hardened wrapper
  constraints:
    - .github/workflows/ci.yml remains byte-identical.
    - scripts/ci_job.sh and Makefile remain byte-identical.
    - Database and Storage job behavior remains unchanged.
    - No repository-controlled path, argument, environment value, or executable is interpreted by root before setpriv completes.
    - Requested command remains an absolute canonical executable and is never evaluated by a shell.
    - Failure of the normal probe, helper validation, passwordless sudo, namespace creation, privilege drop, or any assertion exits closed before requested-command execution.
    - No credentials, secrets, OIDC token, network exception, deployment, publication, or Production authority is added.
    - Formal TST-001 and TST-002 remain NOT_EXECUTED until a real reviewed GitHub-hosted run.
    - ST-0202 Storage remains a separate Story and is not modified.
  exact_file_cut:
    proposed_new:
      - changes/st-0106/DESIGN_HANDOFF_V1_ST0106_HOSTED_NETWORK_ISOLATION_COMPATIBILITY_V1.yaml
      - changes/st-0106/DESIGN-HANDOFF-APPROVAL-HOSTED-NETWORK-ISOLATION-COMPATIBILITY-v1.yaml
