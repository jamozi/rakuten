    independent_read_only_review: required before commit
    local_commit: requires exact frozen patch approval unless already covered by an explicit owner authorization
    push_pr_merge: separate repository workflow authority; no publication or Production implication
  acceptance_criteria:
    - The normal unprivileged user-namespace path remains byte-for-byte behavior-compatible where available.
    - On GitHub-hosted Ubuntu 24.04, the fallback reaches the requested command as a capability-free non-root identity inside fresh network/PID/mount namespaces.
    - Static, Unit, Contracts, and Secrets all retain the same denied-network assertions and no repository check runs as root.
    - A missing or unsafe helper, non-passwordless sudo, failed drop, nonempty fallback groups/capabilities, reused namespace, route, interface, or socket bypass fails closed.
    - No sysctl or AppArmor configuration is changed.
    - ST-0107 semantic generated outputs remain byte-identical and its manifest is regenerated only from current reviewed sources.
  required_test_evidence:
    local:
      - bash -n scripts/run_network_denied.sh
      - isolated pytest tests/st0106 with the pinned root environment
      - exact Ruff format/lint and strict mypy for modified Python/test files
      - scripts/build_st0107_pr_governance.py generation followed by --check
      - isolated pytest tests/st0107
      - make check-workspace
      - python3 scripts/import_raos_design.py verify
      - exact owned-path sensitive scan and git diff --check
    hostile:
      - reject root caller and root-mapped child
      - reject unsafe helper ownership, mode, symlink, unavailable sudo, and unexpected launch-mode values
      - prove fallback source order places setpriv before assertion and requested command
      - prove fallback clears groups and all capability sets before requested command
      - preserve inherited descriptor, Unix socket, external route, and descendant cleanup tests
    hosted:
      - a real pull-request run on ubuntu-24.04 records PRIVILEGED_NAMESPACE_THEN_DROP for Static, Unit, Contracts, and Secrets
      - all four jobs reach and pass their existing repository checks
      - no job log contains a credential, dynamic environment dump, or untrusted command under sudo
      - formal status remains unchanged until reviewed append-only evidence is separately applied
  explicit_non_claims:
