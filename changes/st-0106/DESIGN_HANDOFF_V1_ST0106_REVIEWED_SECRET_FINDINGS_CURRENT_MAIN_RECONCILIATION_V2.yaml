    selected_strategy: REMOTE_ORIGIN_REFS_PLUS_TAGS_EXACT_LEDGER_RECONCILIATION
    rationale:
      - The scanner intentionally enumerates every physically present Git blob. A shared local object database therefore contains unrelated and unpublished worktree objects that a GitHub fetch-depth-zero pull-request checkout does not receive.
      - The preflight superset is retained as input evidence but is too broad for workflow activation because 38 of its Git-history bindings are local-only objects not reachable from current remote origin refs or tags.
      - The final V2 ledger includes the current worktree bindings and only Git-history bindings whose exact object IDs are present in the current remote origin-ref-plus-tag universe. Final-branch blobs must be added only if a fresh remote clone plus the exact local head reproduces a new sanitized generic finding.
      - The final ledger introduces no new line hash beyond the immutable V1 review set. New object/source bindings therefore reuse only exact previously reviewed line bytes while retaining exact source-size, source-hash, object-ID, line-number, and line-hash checks.
    rejected_alternatives:
      - alternative: activate_the_153_entry_shared_object_superset
        reason: it would authorize 38 local-only blob locations outside the pull-request object universe
      - alternative: scan_only_main_single_branch
        reason: it would omit findings reachable from other current remote refs and tags fetched by the reviewed full-history workflow boundary
      - alternative: weaken_generic_or_specific_scanner_rules
        reason: reconciliation changes only exact reviewed bindings and must not alter detection semantics
      - alternative: mutate_the_v1_ledger_or_its_detached_approval
        reason: those bytes are immutable historical evidence for a different exact ledger and workflow reference
      - alternative: fabricate_a_new_detached_owner_approval
        reason: root standing development authorization already covers reversible repository work and is not an exact-ledger audit statement
