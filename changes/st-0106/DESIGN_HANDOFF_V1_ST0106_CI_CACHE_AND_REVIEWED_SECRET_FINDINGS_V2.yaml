    later_provenance_closure:
      status: NOT_YET_MAPPED_OR_AUTHORIZED
      reason: final_workflow_and_ledger_bytes_do_not_yet_exist
      required_before_any_provenance_mutation:
        - fixed_point_current_live_consumer_map
        - exact_path_cut
        - semantic_byte_guards
        - separate_exact_sha256_owner_approval_if_any_path_is_outside_ST_0106
  security_and_approval_gates:
    this_handoff:
      approval_target: exact_SHA256_of_this_YAML_only
      revisions_require_new_sha256: true
      implementation_authority_before_approval: NONE
      detached_approval_record: required_after_owner_approval
    implementation_delegate:
      role: implementation_worker
      start_condition: exact_owner_approval_of_this_handoff
    ledger_activation:
      current: NOT_AUTHORIZED
      required_artifacts:
        - final_candidate_ledger_bytes_and_sha256
        - sanitized_per_location_review_record
        - exact_owner_approval_of_candidate_ledger_sha256
      before_activation_workflow_behavior: existing_fail_closed_scan_without_ledger
    provenance:
      current: NOT_AUTHORIZED
      start_condition: final_direct_bytes_plus_closed_fixed_point_map_plus_applicable_exact_owner_approval
    independent_read_only_review: required_after_each_frozen_implementation_slice
    local_commit: requires exact frozen patch approval
    push_pull_request_merge: separate repository authority after exact head scope and terminal CI
  acceptance_criteria:
    - The Unit job uses one explicit mode-0700 runner-temp uv cache for online locked hydration and denied-network verification.
    - Every cache-dependent ST-0102 test either consumes the exact validated cache or fails closed; the incomplete-cache state is never misclassified as hydrated.
    - The Secrets command without a ledger preserves the current exit behavior and sanitized output.
    - With an owner-approved exact ledger, only exact matching GENERIC_CREDENTIAL findings are removed; every unreviewed or changed finding still fails.
    - High-confidence AWS, GitHub, OpenAI, and private-key findings cannot be suppressed by any ledger entry.
    - Ledger parsing and source reads reject unsafe files, symlinks, aliases, merges, duplicates, unknown fields, wildcard scopes, stale worktree entries, and byte/hash drift.
    - No matched value is written to stdout, stderr, the ledger, tests, docs, manifests, commits, or CI artifacts.
    - The existing hosted network-isolation behavior and all unrelated jobs remain semantically unchanged.
    - A later integration branch demonstrates Static, Unit, Contracts, Secrets, Database, and Storage terminal green before any merge claim.
  required_test_evidence:
    direct_local:
      - bash -n scripts/ci_job.sh
      - isolated pytest tests/st0102 with the pinned root environment
      - isolated pytest tests/st0106 with the pinned root environment
      - exact Ruff lint and format checks for changed Python files
      - strict applicable mypy scopes
      - make check-workspace
      - python3 scripts/import_raos_design.py verify
      - exact changed-path sensitive scan and git diff --check
    unit_hostile:
      - reject relative, symlinked, non-directory, unsafe-mode, wrong-owner, outside-runner-temp, missing, and incomplete explicit cache paths
      - prove the online command binds only the job-scoped cache and the denied-network command receives the same canonical path
      - prove no ambient UV_CACHE_DIR, home cache, config, index, keyring, or package source can override the explicit binding
    secret_hostile:
      - reject wildcard, prefix, traversal, duplicate, alias, merge, tag, unknown-key, unknown-rule, stale, missing, symlink, size, source-hash, line-hash, and line-number mutations
      - prove specific rules remain findings even beside a matching generic entry
      - prove a newly added generic credential remains a finding
      - prove output and persisted artifacts never include matched bytes
      - prove exact git-history object handling and absent-object policy
    post_ledger_approval:
      - reproduce the complete worktree and git-history scan with the exact approved ledger
      - independently confirm every removed finding is one reviewed exact GENERIC_CREDENTIAL entry
    hosted:
      - one exact-head pull-request run reaches terminal success for Unit and Secrets under denied-network execution
      - logs contain no secret value, raw environment dump, cache contents, or unexpected network access
      - full Base CI reaches terminal conclusions before merge
