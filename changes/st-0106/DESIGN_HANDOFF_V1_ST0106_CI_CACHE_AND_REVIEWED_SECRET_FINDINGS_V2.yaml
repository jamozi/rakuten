  decision:
    id: ST0106-CI-CACHE-AND-REVIEWED-SECRET-FINDINGS-V2
    selected_strategy:
      unit_cache: JOB_SCOPED_EXPLICIT_UV_CACHE
      secrets: EXACT_REVIEWED_GENERIC_FINDINGS_LEDGER
      implementation_phases:
        - DIRECT_CODE_AND_TEST_CANDIDATE
        - EXACT_LEDGER_OWNER_APPROVAL
        - MECHANICAL_PROVENANCE_CLOSURE
        - HOSTED_CI_VERIFICATION
    unit_cache_contract:
      creation:
        root: GITHUB_RUNNER_TEMP_ONLY
        type: regular_directory
        mode: '0700'
        symlink: forbidden
        lifetime: one_hosted_job
        persistent_actions_cache: forbidden
      hydration:
        online_phase_only: true
        uv_version: 0.12.1
        cache_argument: explicit
        no_ambient_cache_fallback: true
        no_cache_flag_for_locked_sync: removed_only_when_the_explicit_job_cache_is_bound
        index: https://pypi.org/simple
        index_strategy: first-index
        keyring_provider: disabled
        source_constraints_unchanged: true
      denied_network_phase:
        transport: exact_absolute_path_argument_through_ci_job_wrapper
        make_binding: RAOS_CI_UV_CACHE_DIR
        environment_inheritance: forbidden
        cache_must_be_regular_owned_safe_and_complete: true
        incomplete_or_drifted_cache: fail_closed
        network_access: denied
      local_behavior:
        explicit_cache: same_strict_validation_as_ci
        no_explicit_cache: existing_local_skip_boundary_may_remain
        test_probe: must_prove_locked_offline_sync_not_only_lock_resolution
    reviewed_findings_contract:
      command_line:
        option: --reviewed-findings
        value: exact_repository_relative_or_absolute_regular_file
        optional_without_activation: true
        absent_behavior: existing_findings_fail_unchanged
      ledger:
        planned_path: changes/st-0106/contracts/reviewed-secret-findings.v1.yaml
        proposal_author: implementation_worker
        activation_authority: NONE_UNTIL_SEPARATE_EXACT_SHA256_OWNER_APPROVAL
        source_values_forbidden: true
        allowed_rule_ids: [GENERIC_CREDENTIAL]
        entry_binding:
          required:
            - scope
            - exact_source_identifier
            - exact_line_number
            - exact_source_bytes
            - exact_source_sha256
            - exact_line_sha256
            - classification
            - rationale
          worktree_scope:
            source_identifier: exact_repository_relative_path
            entry_must_be_present: true
            source_bytes_must_match: true
            stale_entry: operational_error
          git_history_scope:
            source_identifier: exact_git_blob_object_id
            object_may_be_absent_from_a_later_checkout: true
            object_if_present_must_match: true
        rejected_shapes:
          - wildcard_or_prefix_path
          - path_traversal
          - symlink_or_non_regular_ledger
          - duplicate_entry
          - unknown_key_or_rule
          - missing_hash_size_line_or_rationale
          - source_or_line_hash_drift
          - attempted_specific_rule_suppression
      suppression:
        happens_after_scanning: true
        exact_set_subtraction_only: true
        unreviewed_finding: fail
        newly_introduced_generic_finding: fail
        AWS_ACCESS_KEY_ID: never_suppressible
        GITHUB_TOKEN: never_suppressible
        OPENAI_API_KEY: never_suppressible
        PRIVATE_KEY: never_suppressible
        matched_bytes_in_output_or_ledger: forbidden
      review_boundary:
        all_89_current_sanitized_locations_must_be_individually_reviewed: true
        plausible_real_credential_action: stop_and_escalate_incident_without_ledger_entry
        scanner_cannot_create_or_approve_ledger: true
        workflow_cannot_reference_ledger_before_exact_owner_approval: true
  rationale:
    - The Unit failures come from treating an incomplete default uv cache as hydrated; the fix must prove a complete explicit cache rather than weaken the offline assertions or convert hosted failures into unconditional skips.
    - A runner-temp cache is bounded to one disposable GitHub-hosted job and avoids persistent cache keys, cross-branch trust, or credential-bearing cache state.
    - All current Secrets findings use the broad generic heuristic, while the four high-confidence rules report zero findings; an exact reviewed ledger can preserve new-secret detection without a wildcard allowlist.
    - Exact source, line, byte, and hash bindings prevent a reviewed false positive from authorizing changed content at the same path.
    - The CI workflow is a pinned input to ST-0107 and downstream generators; direct ST-0106 implementation and mechanical provenance closure must therefore be separately frozen and reviewed instead of silently broadening this Story.
  rejected_alternatives:
    - alternative: skip every cache-dependent ST-0102 test on GitHub-hosted runners
      reason: hides the missing cache instead of verifying the intended offline contract
    - alternative: use the default home uv cache without an explicit path
      reason: ambient cache ownership and completeness are not bound through the denied-network wrapper
    - alternative: enable a persistent GitHub Actions cache
      reason: introduces cache-key, cross-run, restore, and eviction semantics unnecessary for one job
    - alternative: delete or weaken the generic secret rule
      reason: would stop detecting newly introduced generic credentials
    - alternative: allow path globs, prefixes, regexes, or line-only suppressions
      reason: a changed value or another file could inherit approval without exact review
    - alternative: permit high-confidence rule entries in the ledger
      reason: specific credential formats require incident handling, not suppression
    - alternative: edit ST-0107 or downstream generated artifacts inside the direct ST-0106 slice
      reason: the workflow hash creates a separate cross-Story provenance closure that must be mapped after final direct bytes exist
  constraints:
    - The approved ST-0106 network-isolation handoff, approval, wrapper, assertion, and their current runtime semantics remain unchanged.
    - The denied-network phase never downloads, hydrates, or repairs the uv cache.
    - No cache, ledger, test, or diagnostic may contain a credential value, package-index credential, environment dump, or matched scanner bytes.
    - No GitHub secret, OIDC token, deployment, provider, browser, publication, release, or Production authority is added.
    - OD-014 and all unrelated Open Decisions remain unchanged.
    - Canonical, upstream, imported, historical evidence, status, and formal test records are immutable.
    - TST-001 and TST-002 remain NOT_EXECUTED until reviewed hosted evidence is separately applied.
    - The direct implementation may not stage, commit, push, open or update a pull request, merge, or regenerate downstream provenance without the later exact gates below.
  exact_file_cut:
    proposal_only_now:
      - changes/st-0106/DESIGN_HANDOFF_V1_ST0106_CI_CACHE_AND_REVIEWED_SECRET_FINDINGS_V2.yaml
      - changes/st-0106/CI-CACHE-AND-REVIEWED-SECRET-FINDINGS-V2-PROPOSAL.md
