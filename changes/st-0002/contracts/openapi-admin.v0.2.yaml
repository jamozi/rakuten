components:
  schemas:
    AIEvaluationRequest:
      type: object
      additionalProperties: false
      properties:
        suite_code:
          type: string
        suite_version:
          type:
          - string
          - 'null'
        task_code:
          type: string
        prompt_version_ids:
          type: array
