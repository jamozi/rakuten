            type: string
            format: uuid
      required:
      - suite_code
      - task_code
    AIJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 内部主キー。PostgreSQL 18のuuidv7()で生成する時系列順UUID。
        display_id:
          type: string
          description: AIJ-接頭辞を持つアプリケーション生成の不変表示ID。
        ops_job_id:
          type: string
          format: uuid
          description: ops job id
        task_definition_id:
          type: string
          format: uuid
          description: task definition id
        article_plan_id:
          anyOf:
          - type: string
            format: uuid
            description: article plan id
          - type: 'null'
        article_version_id:
          anyOf:
          - type: string
            format: uuid
            description: 記事の特定Version。
          - type: 'null'
        source_packet_version_id:
          type: string
          format: uuid
          description: source packet version id
        prompt_version_id:
          type: string
          format: uuid
          description: prompt version id
        output_schema_version_id:
          type: string
          format: uuid
          description: output schema version id
        model_route_version_id:
          type: string
          format: uuid
          description: model route version id
        status:
          type: string
          description: 業務状態を示す安定Enum文字列。
        max_cost_jpy:
          type: integer
          description: max cost jpy
        completed_at:
          anyOf:
          - type: string
            format: date-time
            description: completed at
          - type: 'null'
        created_at:
          type: string
          format: date-time
          description: レコード作成時刻。UTCのtimestamptz。
      required:
      - id
      - display_id
      - created_at
