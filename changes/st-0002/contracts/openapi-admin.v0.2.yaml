x-raos-contract-conventions:
  timestamps: RFC 3339/UTC; persistence is timestamptz.
  identifiers: UUIDv7 internal IDs; stable display_id for human references.
  errors: RFC 9457 application/problem+json with stable extensions.code.
  pagination: opaque cursor; limit 1..200; deterministic tie-breaker by id.
  unknown_fields: request objects reject unknown fields unless explicitly open.
  idempotency: all business Commands marked x-raos-idempotency-required require Idempotency-Key.
  concurrency: mutable resource updates marked x-raos-concurrency-required require If-Match.
