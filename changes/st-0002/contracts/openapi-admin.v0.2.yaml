    UploadSessionRequest:
      type: object
      additionalProperties: false
      properties:
        artifact_kind:
          type: string
          enum:
          - revenue_original
          - rank_import
          - primary_source
          - other
        file_name:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 120
        byte_size:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - artifact_kind
      - file_name
      - content_type
      - byte_size
      - sha256
    Waiver:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 内部主キー。PostgreSQL 18のuuidv7()で生成する時系列順UUID。
        display_id:
          type: string
          description: WVR-接頭辞を持つアプリケーション生成の不変表示ID。
        finding_id:
          type: string
          format: uuid
          description: finding id
        scope_type:
          type: string
          description: scope type
        scope_id:
          type: string
          format: uuid
          description: scope id
        justification:
          type: string
          description: justification
        status:
          type: string
          description: 業務状態を示す安定Enum文字列。
        requested_at:
          type: string
          format: date-time
          description: requested at
        decided_at:
          anyOf:
          - type: string
            format: date-time
            description: decided at
          - type: 'null'
        decision_reason:
          anyOf:
          - type: string
            description: decision reason
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
            description: expires at
          - type: 'null'
        revoked_at:
          anyOf:
          - type: string
            format: date-time
            description: revoked at
          - type: 'null'
        created_at:
          type: string
          format: date-time
          description: レコード作成時刻。UTCのtimestamptz。
      required:
      - id
      - display_id
      - created_at
    WaiverRequest:
      type: object
      additionalProperties: false
      properties:
        finding_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
        justification:
          type: string
          minLength: 20
          maxLength: 8000
        expires_at:
          type: string
          format: date-time
      required:
      - finding_id
      - scope_type
      - scope_id
      - justification
      - expires_at
