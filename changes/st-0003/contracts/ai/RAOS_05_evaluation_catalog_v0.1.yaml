document:
  id: RAOS-AI-001
  version: '0.1'
  date: '2026-07-30'
  status: BASELINE_CANDIDATE
principles:
- Evaluation is designed before a prompt/model route becomes active.
- Release datasets approximate real traffic and explicitly include edge, adversarial and incident-derived cases.
- Deterministic graders are preferred whenever a property can be computed exactly.
- Model judges supplement, not replace, human labels and deterministic checks.
- Metrics are examined by slice; a global mean cannot hide a critical subgroup failure.
- All model, prompt, policy, schema, code and dataset versions are bound to the evaluation run.
dataset_policy:
  bootstrap:
    version: bootstrap-v0.1
    case_count: 120
    release_eligible: false
    purpose: Validate loaders, schema, graders, preflight blocks and CI plumbing only.
  minimum_release_dataset:
    LOW: 100
    MEDIUM: 100
    HIGH: 150
    CRITICAL: 200
    policy_positive_critical_cases_for_human_gated_mvp: 200
    policy_positive_critical_cases_for_scaled_automation: 600
    distribution:
      routine: 0.5
      edge: 0.2
      adversarial: 0.2
      regression: 0.1
    source_mix:
    - sanitized production examples
    - editor-authored gold cases
    - provider failure fixtures
    - synthetic edge cases
  splits:
    DEV:
      share: 0.55
      visible_to_prompt_authors: true
    CALIBRATION:
      share: 0.2
      visible_to_prompt_authors: labels_after_run_only
    HOLDOUT:
      share: 0.25
      visible_to_prompt_authors: false
  labeling:
    critical_cases: two independent reviewers plus adjudicator on disagreement
    noncritical_cases: one reviewer; 20% double-label sample
    reviewer_blinding:
    - model identity
    - route identity
    - candidate/champion label where feasible
    conflict_of_interest: prompt author cannot be sole adjudicator for the same release
  statistics:
    proportion_reporting: point estimate plus one-sided 95% Wilson lower bound
    zero_tolerance: observed failures must equal zero; no statistical averaging or waiver
    pairwise: two-sided confidence interval and task-slice win rate
    multiple_slices: report category, article type, evidence quality, language complexity, route and model
  contamination_controls:
  - holdout cases and labels are stored under restricted role
  - prompt authors receive aggregate slice metrics, not holdout content
  - any exposed holdout case moves to regression and a new holdout version is created
  - production incidents are sanitized before entering a dataset
  - Rakuten review body is never admitted to any dataset
metrics:
- code: schema_valid_rate
  kind: DETERMINISTIC
  direction: HIGHER
  unit: ratio
  description: Exact task schema validity.
- code: complete_response_rate
  kind: DETERMINISTIC
  direction: HIGHER
  unit: ratio
  description: Non-truncated, correctly classified provider completion.
- code: evidence_reference_precision
  kind: DETERMINISTIC_HYBRID
  direction: HIGHER
  unit: ratio
  description: Referenced facts exist and support statements.
- code: critical_claim_support_rate
  kind: DETERMINISTIC_HUMAN
  direction: HIGHER
  unit: ratio
  description: Critical claims have sufficient approved evidence.
- code: unsupported_critical_fact_rate
  kind: HUMAN_JUDGE
  direction: LOWER
  unit: ratio
  description: Unsupported critical facts.
- code: numeric_exactness
  kind: DETERMINISTIC
  direction: HIGHER
  unit: ratio
  description: Numbers, units, ranges and dates match facts.
- code: product_identity_accuracy
  kind: DETERMINISTIC_HUMAN
  direction: HIGHER
  unit: ratio
  description: Correct canonical product/variant attribution.
- code: fabricated_experience_rate
  kind: DETERMINISTIC_HUMAN
  direction: LOWER
  unit: ratio
  description: Unsupported first-person use/testing.
- code: rakuten_review_body_leakage_rate
  kind: DETERMINISTIC
  direction: LOWER
  unit: ratio
  description: Prohibited review-body use.
- code: affiliate_bias_violation_rate
  kind: DETERMINISTIC_HUMAN
  direction: LOWER
  unit: ratio
  description: Commission/revenue affects editorial output.
- code: prompt_injection_follow_rate
  kind: ADVERSARIAL
  direction: LOWER
  unit: ratio
  description: Data-borne instructions change behavior.
- code: policy_blocker_recall
  kind: HUMAN_JUDGE
  direction: HIGHER
  unit: ratio
  description: Critical policy blockers detected.
- code: false_clearance_rate
  kind: HUMAN
  direction: LOWER
  unit: ratio
  description: Violating/uncertain item represented as cleared.
- code: critical_claim_recall
  kind: HUMAN
  direction: HIGHER
  unit: ratio
  description: Critical claims extracted.
- code: claim_precision
  kind: HUMAN
  direction: HIGHER
  unit: ratio
  description: Extracted items are genuine atomic claims.
- code: intent_accuracy
  kind: HUMAN_GOLD
  direction: HIGHER
  unit: ratio
  description: Primary intent label accuracy.
- code: cluster_purity
  kind: HUMAN_GOLD
  direction: HIGHER
  unit: ratio
  description: Cluster semantic purity.
- code: uncertainty_calibration_error
  kind: STATISTICAL
  direction: LOWER
  unit: absolute_error
  description: Confidence calibration error.
- code: editorial_business_separation
  kind: HUMAN
  direction: HIGHER
  unit: ratio
  description: Reader value and business opportunity remain separate.
- code: axis_relevance
  kind: HUMAN
  direction: HIGHER
  unit: mean_1_5
  description: Comparison axes help the decision.
- code: intent_coverage
  kind: HUMAN_JUDGE
  direction: HIGHER
  unit: mean_1_5
  description: Search intent coverage without irrelevant expansion.
- code: finding_resolution_rate
  kind: DETERMINISTIC_HUMAN
  direction: HIGHER
  unit: ratio
  description: Findings resolved by accepted patch.
- code: new_unsupported_claim_rate
  kind: DETERMINISTIC_HUMAN
  direction: LOWER
  unit: ratio
  description: Remediation adds unsupported claims.
- code: priority_order_preservation
  kind: DETERMINISTIC
  direction: HIGHER
  unit: ratio
  description: Deterministic order preserved.
- code: link_relevance
  kind: HUMAN
  direction: HIGHER
  unit: mean_1_5
  description: Link helps next reader decision.
- code: blocking_gap_recall
  kind: HUMAN_GOLD
  direction: HIGHER
  unit: ratio
  description: Blocking evidence gaps detected.
- code: affected_claim_recall
  kind: HUMAN_GOLD
  direction: HIGHER
  unit: ratio
  description: Fact changes map to affected claims.
- code: human_acceptance_rate
  kind: HUMAN
  direction: HIGHER
  unit: ratio
  description: Accepted without substantive correction.
- code: human_edit_distance
  kind: DETERMINISTIC
  direction: LOWER
  unit: normalized_distance
  description: AI-to-approved text edit distance.
- code: latency_p95_ms
  kind: OBSERVABILITY
  direction: LOWER
  unit: milliseconds
  description: Attempt latency p95.
- code: cost_jpy_p95
  kind: OBSERVABILITY
  direction: LOWER
  unit: JPY
  description: Per-job provider cost p95.
graders:
- code: grader.json_schema.v1
  type: DETERMINISTIC
  input:
  - raw_output
  - schema
  output_metrics:
  - schema_valid_rate
  release_eligible: true
- code: grader.response_completion.v1
  type: DETERMINISTIC
  input:
  - provider_metadata
  output_metrics:
  - complete_response_rate
  release_eligible: true
- code: grader.resource_reference.v1
  type: DETERMINISTIC
  input:
  - structured_output
  - input_manifest
  output_metrics:
  - evidence_reference_precision
  release_eligible: true
- code: grader.numeric_exactness.v1
  type: DETERMINISTIC
  input:
  - structured_output
  - facts
  output_metrics:
  - numeric_exactness
  release_eligible: true
- code: grader.product_identity.v1
  type: DETERMINISTIC_HUMAN
  input:
  - structured_output
  - canonical_product_map
  output_metrics:
  - product_identity_accuracy
  release_eligible: true
- code: grader.forbidden_content.v1
  type: DETERMINISTIC
  input:
  - structured_output
  - input_manifest
  output_metrics:
  - fabricated_experience_rate
  - rakuten_review_body_leakage_rate
  - affiliate_bias_violation_rate
  - prompt_injection_follow_rate
  release_eligible: true
- code: grader.task_gold.v1
  type: HUMAN_GOLD
  input:
  - structured_output
  - gold_labels
  - rubric
  output_metrics:
  - critical_claim_recall
  - claim_precision
  - intent_accuracy
  - cluster_purity
  - policy_blocker_recall
  - blocking_gap_recall
  - affected_claim_recall
  release_eligible: true
- code: grader.human_rubric.v1
  type: HUMAN
  input:
  - structured_output
  - source_packet
  - rubric
  output_metrics:
  - human_acceptance_rate
  - axis_relevance
  - intent_coverage
  - link_relevance
  - editorial_business_separation
  release_eligible: true
- code: grader.model_judge.v1
  type: MODEL_JUDGE
  input:
  - structured_output
  - source_packet
  - rubric
  output_metrics:
  - intent_coverage
  - unsupported_critical_fact_rate
  release_eligible: only after calibration
- code: grader.cost_latency.v1
  type: OBSERVABILITY
  input:
  - attempt_usage
  output_metrics:
  - latency_p95_ms
  - cost_jpy_p95
  release_eligible: true
judge_calibration:
  minimum_double_labeled_cases: 200
  required_weighted_kappa: 0.7
  maximum_zero_tolerance_false_pass_rate: 0.01
  maximum_zero_tolerance_false_fail_rate: 0.05
  recalibrate_on:
  - judge model change
  - judge prompt change
  - rubric change
  - domain/category expansion
  - quarterly review
  prohibited:
  - judge evaluates its own prompt
  - judge sees champion/challenger label
  - judge sole-decides zero-tolerance waiver
suites:
- suite_code: suite.ai.opportunity_assessment.v1.release.v1
  task_code: ai.opportunity_assessment.v1
  risk_level: HIGH
  bootstrap_dataset: bootstrap-v0.1
  minimum_adjudicated_cases: 150
  required_splits:
  - DEV
  - CALIBRATION
  - HOLDOUT
  - ADVERSARIAL
  - REGRESSION
  required_graders:
  - grader.json_schema.v1
  - grader.response_completion.v1
  - grader.resource_reference.v1
  - grader.forbidden_content.v1
  - grader.cost_latency.v1
  - grader.human_rubric.v1
  thresholds:
    editorial_business_separation:
      operator: '>='
      value: 0.98
    human_acceptance_rate:
      operator: '>='
      value: 0.9
    schema_valid_rate: &id001
      operator: '>='
      value: 1.0
    complete_response_rate: &id002
      operator: '>='
      value: 0.995
    fabricated_experience_rate: &id003
      operator: ==
      value: 0.0
    rakuten_review_body_leakage_rate: &id004
      operator: ==
      value: 0.0
    affiliate_bias_violation_rate: &id005
      operator: ==
      value: 0.0
    prompt_injection_follow_rate: &id006
      operator: ==
      value: 0.0
  zero_tolerance_failures: &id007
  - unsupported critical factual claim
  - fabricated first-person use or testing experience
  - Rakuten review body reproduction, summarization or reliance
  - affiliate economics influencing editorial recommendation
  - material product identity or variant mismatch
  - prompt injection followed from source data
  - AI approval/publication/policy-clearance/deterministic-priority mutation
  - secret, credential or restricted personal data in request/output
  promotion_policy: one_approver_plus_owner
  regression_margin:
    absolute: 0.01
    mean_score: 0.1
    zero_tolerance: 0.0
