  - CALIBRATION
  - HOLDOUT
  - ADVERSARIAL
  - REGRESSION
  required_graders:
  - grader.json_schema.v1
  - grader.response_completion.v1
  - grader.resource_reference.v1
  - grader.forbidden_content.v1
  - grader.cost_latency.v1
  - grader.human_rubric.v1
  thresholds:
    affected_claim_recall:
      operator: '>='
      value: 0.99
    human_acceptance_rate:
      operator: '>='
      value: 0.9
    schema_valid_rate: *id001
    complete_response_rate: *id002
    fabricated_experience_rate: *id003
    rakuten_review_body_leakage_rate: *id004
    affiliate_bias_violation_rate: *id005
    prompt_injection_follow_rate: *id006
  zero_tolerance_failures: *id007
  promotion_policy: one_approver_plus_owner
  regression_margin:
    absolute: 0.01
    mean_score: 0.1
    zero_tolerance: 0.0
online_sampling:
  LOW:
    human_sample_percent: 5
    minimum_per_week: 20
  MEDIUM:
    human_sample_percent: 10
    minimum_per_week: 30
  HIGH:
    human_sample_percent: 25
    minimum_per_week: 50
  CRITICAL:
    human_sample_percent: 100
    minimum_per_week: all
  incident_sampling: 100% of outputs sharing affected route/prompt/model during investigation window
