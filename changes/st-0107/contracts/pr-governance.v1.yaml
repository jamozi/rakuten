tracked_sources:
  - uri: repo://.github/workflows/ci.yml
    semantic_id: final-integration-ci
    version: 2
  - uri: repo://.github/workflows/auto-merge.yml
    semantic_id: final-integration-auto-merge
    version: 1
owner_bindings:
  organization: raos
  status: UNVERIFIED_PLACEHOLDERS
  teams:
    accessibility: '@raos/accessibility'
    ai: '@raos/ai'
    architecture: '@raos/architecture'
    data: '@raos/data'
    editorial: '@raos/editorial'
    engineering: '@raos/engineering'
    finance: '@raos/finance'
    operations: '@raos/operations'
    security: '@raos/security'
codeowners:
  entries:
    - pattern: '*'
      roles: [engineering]
    - pattern: /contracts/
      roles: [architecture, engineering]
    - pattern: /migrations/
      roles: [data, security]
    - pattern: /infra/
      roles: [operations, security]
    - pattern: /docker-compose.yml
      roles: [operations, security]
    - pattern: /scripts/build_local_compose.py
      roles: [operations, security]
    - pattern: /scripts/postgres_service.sh
      roles: [operations, security]
    - pattern: /scripts/object_storage_service.sh
      roles: [operations, security]
    - pattern: /scripts/object_storage_fixture.py
      roles: [operations, security]
    - pattern: /apps/admin/
      roles: [editorial, security]
    - pattern: /apps/public/
      roles: [editorial, accessibility]
    - pattern: /apps/web/
      roles: [editorial, security, accessibility]
    - pattern: /packages/ai/
      roles: [ai, security, editorial]
    - pattern: /packages/finance/
      roles: [finance, security]
    - pattern: /python/raos/domain/ai/
      roles: [ai, security, editorial]
    - pattern: /python/raos/domain/finance/
      roles: [finance, security]
    - pattern: /python/raos/generated/
      roles: [architecture, engineering]
    - pattern: /packages/web-contracts/src/generated/
      roles: [architecture, engineering]
    - pattern: /docs/canonical/
      roles: [architecture]
    - pattern: /changes/*/contracts/
      roles: [architecture, engineering]
    - pattern: /changes/*/database/
      roles: [data, security]
    - pattern: /docs/canonical/04_security/
      roles: [security, architecture]
    - pattern: /tests/security/
      roles: [security, engineering]
    - pattern: /scripts/scan_secrets.py
      roles: [security, engineering]
    - pattern: /scripts/run_network_denied.sh
      roles: [security, engineering]
    - pattern: /scripts/assert_network_denied.py
      roles: [security, engineering]
    - pattern: /.github/
      roles: [security, operations]
pull_request_template:
  story_ids_are_tracking_only: true
  repeated_owner_routing: false
  require_generated_or_ai_assisted_review: false
  record_once: [story_ids, summary, verification, external_not_run]
ruleset_policy:
  name: RAOS protected default branch
  target: branch
  include: ['~DEFAULT_BRANCH']
  exclude: []
  desired_enforcement: active
  local_application_status: NOT_EXECUTED
  bypass_actors: []
  prohibit_deletion: true
  prohibit_force_push: true
  require_linear_history: true
  pull_request:
    allowed_merge_methods: [squash]
    dismiss_stale_reviews_on_push: false
    require_code_owner_review: false
    require_last_push_approval: false
    required_approving_review_count: 0
    required_review_thread_resolution: false
    auto_merge_after_required_checks: true
  required_status_checks:
    - context: Final Integration
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
  strict_required_status_checks_policy: true
  do_not_enforce_on_create: false
  required_owner_categories: {}
activation:
  generator_remote_mutation: FORBIDDEN
  live_status: NOT_EXECUTED
  formal_tst_001: NOT_EXECUTED
  prerequisites:
    - real repository and default branch identified
    - Final Integration has run and is bound to GitHub Actions
    - deletion and force-push protections are confirmed by authenticated read-back
