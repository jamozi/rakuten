story_scope_ownership:
  scope_contract: repo://changes/st-0106/contracts/developer-loop-scope.v1.json
  canonical_story_source: repo://docs/canonical/07_backlog/RAOS_13_story_backlog_v1.0.yaml
  default_roles: [engineering, security]
  ordinary_roles: [engineering]
  ordering: global_default_then_ordinary_exact_then_story_defaults_then_semantic_rows
pull_request_template:
  canonical_source: repo://docs/canonical/08_codex/github/PULL_REQUEST_TEMPLATE.md
  required_owner_categories:
    - contract_codegen
    - migration_database
    - authentication_authorization_credentials
    - security_controls
    - publication_finance_kill_switch
    - infrastructure_deployment
    - provider_runtime
    - governance_ci_status
    - protected_sources
  require_not_applicable_rationale: true
  require_dev_check: true
  require_hosted_ci: true
  independent_automated_review: NOT_AVAILABLE_HUMAN_REVIEW_FALLBACK
  require_exact_head_human_review: true
  require_deferred_formal_live_items: true
ruleset_policy:
  name: RAOS protected default branch
  target: branch
  include: ['~DEFAULT_BRANCH']
  exclude: []
  desired_enforcement: active
  local_application_status: NOT_EXECUTED
  bypass_actors: []
  prohibit_deletion: true
  prohibit_force_push: true
  require_linear_history: true
  pull_request:
    allowed_merge_methods: [squash]
    dismiss_stale_reviews_on_push: true
    require_code_owner_review: true
    require_last_push_approval: false
    required_approving_review_count: 1
    required_review_thread_resolution: true
  required_status_checks:
    - context: Static
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Unit
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Contracts
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Database
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Storage
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Secrets
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
    - context: Validate status overlay
      expected_source: github-actions
      integration_id_binding: REQUIRED_AT_ACTIVATION
  strict_required_status_checks_policy: true
  do_not_enforce_on_create: false
  required_owner_categories:
    contract_codegen:
      patterns:
        - /contracts/
        - /changes/*/contracts/
        - /changes/**/generated/
        - /python/raos/generated/
        - /packages/web-contracts/src/generated/
        - /scripts/contract_validation_resources/
        - /scripts/*contract*
        - /scripts/*codegen*
        - /tests/st0104/
        - /tests/st0105/
      roles: [architecture, engineering]
    migration_database:
      patterns:
        - /migrations/
        - /changes/*/database/
        - /changes/st-0301/
        - /python/raos/migrations/
        - /scripts/*migration*
        - /tests/st0301/
      roles: [data, security]
    authentication_authorization_credentials:
      patterns:
        - /python/raos/domain/iam/
        - /python/raos/application/iam/
        - /python/raos/ports/*authorization*
        - /python/raos/ports/*credential*
        - /python/raos/adapters/*credential*
        - /python/raos/adapters/*oauth*
        - /scripts/*auth*
        - /scripts/*credential*
        - /scripts/*secret*
        - /scripts/run_network_denied.sh
        - /scripts/assert_network_denied.py
        - /tests/security/
      roles: [security]
    security_controls:
      patterns:
        - /changes/st-04*/
        - /changes/st-1603/
        - /python/raos/domain/http/
        - /python/raos/application/http/
        - /python/raos/**/rakuten_live_smoke.py
        - /scripts/*rakuten_live_smoke*
        - /scripts/*security*
        - /tests/security/
        - /tests/st04*/
        - /tests/st1603/
      roles: [security]
    publication_finance_kill_switch:
      patterns:
        - /python/raos/domain/finance/
        - /python/raos/application/finance/
        - /python/raos/domain/publishing/
        - /python/raos/application/publishing/
        - /scripts/*finance*
        - /scripts/*publication*
        - /scripts/*kill_switch*
        - /packages/**/*finance*
        - /packages/**/*publication*
        - /tests/st09*/
      roles: [security]
    infrastructure_deployment:
      patterns:
        - /infra/
        - /docker-compose.yml
        - /scripts/build_local_compose.py
        - /scripts/*deploy*
        - /scripts/*storage*
        - /scripts/*postgres*
      roles: [operations, security]
    provider_runtime:
      patterns:
        - /python/raos/adapters/
        - /python/raos/ports/*provider*
        - /python/raos/domain/ai/provider.py
        - /python/raos/**/rakuten_live_smoke.py
        - /scripts/*rakuten_live_smoke*
        - /scripts/*provider*
      roles: [operations, security]
    governance_ci_status:
      patterns:
        - /.codex/
        - /.github/
        - /AGENTS.md
        - /Makefile
        - /package.json
        - /package-lock.json
        - /pyproject.toml
        - /uv.lock
        - /uv.toml
        - /workspace-layout.json
        - /changes/st-0005/
        - /changes/st-0106/
        - /changes/st-0107/
        - /docs/architecture/ST-0107-github-governance-snapshot.yaml
        - /docs/execplans/ST-0107.md
        - /docs/worklogs/ST-0107.md
        - /scripts/build_st0005_status.py
        - /scripts/build_st0107_pr_governance.py
        - /scripts/classify_ci_scope.py
        - /scripts/ci_job.sh
        - /scripts/dev_check.py
        - /scripts/github_ruleset_operator.py
        - /scripts/node_toolchain.sh
        - /scripts/python_toolchain.sh
        - /tests/st0005/
        - /tests/st0106/
        - /tests/st0107/
      roles: [security, operations]
    protected_sources:
      patterns:
        - /docs/canonical/
        - /docs/upstream/
      roles: [architecture]
activation:
  generator_remote_mutation: FORBIDDEN
  live_status: NOT_EXECUTED
  formal_tst_001: NOT_EXECUTED
  prerequisites:
    - real repository and default branch identified
    - every team binding resolves to a visible GitHub team with write permission
    - every required check has run in the repository and is bound to the expected GitHub Actions app
    - ruleset API request is assembled from the reviewed policy and live numeric bindings, and authenticated read-back matches the desired active policy with no bypass actor
    - ordinary-path exact-head approval, high-risk CODEOWNER, direct-push, stale-review, missing-check, unresolved-thread, deletion, and force-push PR probes pass
    - a matching governance CODEOWNER approves the high-risk activation change and read-back confirms one general approval, code-owner review enabled, stale-review dismissal enabled, and last-push approval disabled
