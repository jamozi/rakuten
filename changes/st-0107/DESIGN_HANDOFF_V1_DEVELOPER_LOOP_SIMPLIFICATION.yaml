  version: 1.0.0
  recorded_at: '2026-08-21T00:00:00+09:00'
  authority: REPOSITORY_LOCAL_DESIGN_RECORD
approved_story: ST-0107
approved_scope:
  name: Developer Loop Simplification V1
  mode: IMPLEMENTATION_FIRST_WAVE
  integration_owner: parent Codex agent
  candidate_stories: [ST-0106, ST-0107]
  waves:
    - instructions-and-handoff
    - affected-ci-and-dev-check
    - pr-governance-and-bounded-ruleset-operator
  completion_boundary: >-
    Reversible repository implementation, generated artifacts, focused local
    checks, and commits only; no push, PR, live ruleset apply, release, staging,
    publication, provider mutation, or Production write.
source_design_refs:
  - repo://docs/canonical/01_integration/RAOS_07_integration_design_v1.0.md
  - repo://docs/canonical/04_security/RAOS_10_security_privacy_design_v1.0.md
  - repo://docs/canonical/05_test/RAOS_11_test_suite_catalog_v1.0.yaml
  - repo://docs/canonical/07_backlog/RAOS_13_story_backlog_v1.0.yaml
  - repo://docs/canonical/08_codex/AGENTS.md
decision:
  development_loop:
    implementation: focused checks
    pull_request: affected Base CI jobs
    high_risk_unknown_or_multi_story: full Base CI
    main_nightly_or_manual: full Base CI
    formal_or_live: only at the governed external transition
  repository_approval: >-
    Reversible local development and the normal exact-head GitHub development
    workflow do not require repeated human approval.
  pull_request_review: >-
    A trusted independent automated reviewer is not available inside this
    no-network local slice. Every pull request therefore retains one approving
    human review, and stale approvals are dismissed on push so the review binds
    the current diff. Contract/codegen, migration/database, authentication,
    security-control, publication/finance, deployment, provider-runtime, and governance paths
    additionally retain CODEOWNERS routing and code-owner approval. Last-push
    approval is not a separate repository-local prerequisite.
  ruleset_operation: >-
    A fixed-repository operator may prepare status and hash-bound plans. Its
    apply and rollback interfaces are hard-disabled pending a separately
    reviewed live-activation contract; live mutation is not authorized here.
rationale:
  - Short feedback loops improve implementation throughput and early learning.
  - Full validation remains available at high-risk and integration boundaries.
  - External human gates remain attached to the real-world action they govern.
rejected_alternatives:
  - Run every local and hosted suite after every edit.
  - Require a new owner or exact-hash approval before reversible local work.
  - Use workflow-level path filters that can leave required checks pending.
  - Permit an unbounded GitHub administration client or automatic live apply.
constraints:
  - Preserve Canonical precedence and unresolved Open Decisions.
  - Keep Static, Unit, Contracts, Database, Storage, and Secrets check names.
  - Secrets always runs; classifier failure must fail required jobs.
  - Unknown, multi-Story, and high-risk changes fail safe to full Base CI.
  - A Story path is affected-CI eligible only when both its Story ID and path
    surface appear in the versioned ordinary proof. New, unproven, or
    unidentifiable Story-local paths and Story-bearing build scripts otherwise
    fail safe to full Base CI.
  - Imported docs/canonical and docs/upstream sources remain prohibited edit
    targets and also fail safe to full Base CI if changed.
  - Mandatory high-risk categories and their CODEOWNERS patterns come from the
    ST-0106 versioned developer-loop scope contract and are cross-checked by the
    ST-0107 generator, including effective GitHub last-match owner resolution
    for category representatives and every tracked high-risk path.
  - Preserve strict checks, linear history, deletion/force-push protection, and
    an empty bypass actor list.
  - The classifier and dev-check orchestrator fail before child checks when a
    changed `.secrets/**` path is detected, and expose only its count. Child
    pytest and generator commands remain trusted local processes, not a sandbox.
security_and_approval_gates:
  preserved:
    - credential entry or exposure
    - terms acceptance and spending
    - publication and live-provider mutation
    - irreversible data operations
    - kill-switch disablement
    - release, staging, and Production writes
  ruleset_live_apply: HUMAN_EXTERNAL_ACTION_NOT_AUTHORIZED
  credential_values: FORBIDDEN_IN_ARGUMENTS_LOGS_AND_TRACKED_FILES
acceptance_criteria:
  - Root AGENTS.md is at most 180 lines and points ST-0101 detail to Story-local sources.
  - '`make dev-check STORY=ST-XXXX [STORIES=ST-XXXX,ST-YYYY] [BASE_REF=<ref>]` emits a machine-readable summary.'
  - PR CI selects affected jobs while required contexts remain terminal.
  - High-risk, unknown, multi-Story, main, nightly, and manual runs select full Base CI.
  - A new or unmapped Story, an unclassified Story-local path, a Story-bearing
    unmapped build script, and a protected Canonical/upstream path select full
    Base CI; only the closed ordinary proof retains affected CI.
  - Explicit multi-Story developer checks execute every declared and detected isolated Story suite exactly once.
  - Generated governance requires one exact-head human approval as the fail-closed independent-review fallback, retains effective high-risk CODEOWNER coverage for every tracked path, has no bypass actor, and preserves branch protections.
  - The bounded ruleset operator is fixed to `jamozi/rakuten` and `https://api.github.com`.
required_test_evidence:
  minimum_checks:
    - isolated tests/st0106
    - isolated tests/st0107
    - changed-source Ruff and mypy
    - changed shell bash syntax
    - ST-0107 regeneration and no-write check
    - sensitive-value redaction and unsafe credential-file negative tests
    - git diff --check
  deferred_checks:
    - hosted Base CI
    - formal TST-001 and TST-002
    - live GitHub ruleset read-back and PR probes
    - release, staging, publication, provider, and Production evidence
deferred_verification_ledger:
  owner: integration owner
  closure_wave: downstream owner maintenance after integration
  entries:
    - id: DLS-DEBT-001
      introduced_by_story: ST-0106/ST-0107 integration slice
      failing_command: >-
        PYTHONDONTWRITEBYTECODE=1 .venv/bin/python
        scripts/build_local_compose.py --check
      observed_result: 'exit 1: generated artifact drift: changes/st-0202/manifest.yaml'
      affected_owner_artifact: changes/st-0202/manifest.yaml
      closure_wave: ST-0202 owner provenance regeneration
      safe_impact: >-
        The generated Compose runtime bytes did not drift; only the downstream
        source/hash inventory is stale and this slice does not claim ST-0202 validation.
    - id: DLS-DEBT-002
      introduced_by_story: ST-0107 governance policy simplification
      failing_command: >-
        PYTHONDONTWRITEBYTECODE=1 .venv/bin/python
        scripts/build_st1504_github_oidc.py --check
      observed_result: 'exit 1: ERROR code=SOURCE_DIGEST_MISMATCH field=pinned_source'
      affected_owner_artifact: >-
        scripts/build_st1504_github_oidc.py PREDECESSOR_SOURCES and the
        changes/st-1504 generated bundle
      closure_wave: ST-1504 owner semantic reconciliation and regeneration
      safe_impact: >-
        The live ruleset operator remains disabled by unverified owner bindings;
        no OIDC, deployment, provider, staging, or Production action was executed.
    - id: DLS-DEBT-003
      introduced_by_story: ST-0107 bounded ruleset operator
      failing_command: read-only independent operator audit
      observed_result: >-
        Live apply lacks hash-bound owner-resolution evidence, durable
        single-attempt serialization, and complete ruleset pagination.
      affected_owner_artifact: >-
        changes/st-0107/contracts/github-ruleset-operator.v1.json and
        scripts/github_ruleset_operator.py
      closure_wave: separately reviewed ST-0107 live-activation contract
      safe_impact: >-
        The versioned contract hard-disables apply and rollback before
        credential intake, API reads, or mutation; status and plan remain read-only.
    - id: DLS-DEBT-004
      introduced_by_story: ST-0106 developer-check orchestration
      failing_command: make dev-check STORY=ST-XXXX BASE_REF=main
      observed_result: >-
        The orchestrator excludes and fail-closes changed `.secrets/**` paths,
        but isolated pytest and allowlisted generator children inherit the
        trusted caller environment and are not filesystem/network sandboxed.
      affected_owner_artifact: scripts/dev_check.py and changes/st-0106/README.md
      closure_wave: dedicated local child-process sandbox design
      safe_impact: >-
        The command no longer claims sandbox isolation; run it only in a trusted
        local environment. Hosted denied-network CI boundaries remain separate.
open_decision_state:
