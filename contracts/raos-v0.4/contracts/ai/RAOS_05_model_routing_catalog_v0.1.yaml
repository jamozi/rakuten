prompt_cache_policy:
  enabled_by_default: false
  enable_after:
  - cost telemetry
  - no correctness dependency
  - retention review
  layout: static instructions first; dynamic source packet last
  cache_key_components:
  - prompt_code
  - prompt_version
  - schema_sha256
  - policy_sha256
  - locale
  - route_code
  record_usage_fields:
  - cached_input_tokens
  - cache_write_tokens
  - cache_key_hash
batch_policy:
  enabled_by_default: false
  allowed_use_cases:
  - offline evaluation
  - shadow challenger
  - non-urgent explanations
  prohibited_use_cases:
  - publication-critical generation
  - interactive review
  - retention-restricted data
  requirements:
  - data/retention approval
  - deadline >=24h
  - idempotent result import
