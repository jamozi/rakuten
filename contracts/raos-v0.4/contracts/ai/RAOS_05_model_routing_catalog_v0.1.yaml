document:
  id: RAOS-AI-001
  version: '0.1'
  date: '2026-07-30'
  status: BASELINE_CANDIDATE
selection_principle: accuracy_first_then_cost_latency
hard_eligibility_gates:
- task and route are enabled
- provider/model supports Responses API and strict output
- input classification is allowed
- context/output fit with safety margin
- prompt/schema/policy/route are approved
- required eval suite passed with zero critical failures
- provider circuit is closed
- job/article/daily/monthly/provider budgets permit execution
utility_after_hard_gates:
  quality: 0.55
  reliability: 0.15
  latency: 0.1
  cost: 0.1
  capacity: 0.05
  data_governance: 0.05
  critical_task_override:
    quality: 0.7
    reliability: 0.15
    data_governance: 0.1
    latency: 0.03
    cost: 0.02
routing_invariants:
- Finance signals never affect editorial routes or recommendations.
- A cheaper model is eligible only after meeting the same certified task quality floor.
- Configuration aliases are permitted only when resolved model ID and response metadata are stored.
- Fallback is for availability/capacity, not truth, policy or evidence repair.
- Every route change is evaluated and staged as a production behavior change.
