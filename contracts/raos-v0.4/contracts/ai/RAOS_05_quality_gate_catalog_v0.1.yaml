release_logic:
- all blocking pre-request, transport, schema, factual and policy gates pass
- every zero-tolerance test count equals zero failures
- all task metric thresholds pass on holdout and required adversarial slices
- no material regression versus champion beyond the declared margin
- judge calibration is current when a model judge contributes to a blocking decision
- required human approvers sign a hash-bound release decision
