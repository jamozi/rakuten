components:
  schemas:
    DependencyHealth:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - status
      - dependencies
    JobAccepted:
      type: object
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        display_id:
          type: string
        status:
          type: string
          enum:
          - REQUESTED
          - QUEUED
        status_url:
          type: string
          format: uri-reference
        correlation_id:
          type: string
          format: uuid
        idempotency_replayed:
          type: boolean
          default: false
      required:
      - job_id
      - display_id
      - status
      - status_url
      - correlation_id
    ProblemDetails:
      title: RAOS Problem Details
      description: RFC 9457準拠のエラー表現。
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
          format: uri-reference
        code:
          type: string
          pattern: ^RAOS-[A-Z]+-[0-9]{3}$
        request_id:
          type: string
          format: uuid
        correlation_id:
          type:
          - string
          - 'null'
          format: uuid
        retryable:
          type: boolean
          default: false
        retry_after_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - location
            - message
            properties:
              location:
                type: string
              rule:
                type:
                - string
                - 'null'
              message:
                type: string
              rejected_value: {}
        links:
          type: object
          additionalProperties:
            type: string
            format: uri-reference
    ProjectionRebuildRequest:
      type: object
      additionalProperties: false
      properties:
        projection:
          type: string
          enum:
          - PUBLIC_READMODEL
          - DAILY_METRICS
          - OFFER_CURRENT
          - RUNTIME_CONTROL
        scope_type:
          type: string
          enum:
          - ALL
          - SITE
          - ARTICLE
          - OFFER
        scope_id:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type: string
          minLength: 1
      required:
      - projection
      - scope_type
    ScheduledJobRequest:
      type: object
      additionalProperties: false
      properties:
        schedule_code:
          type: string
        scheduled_for:
          type: string
          format: date-time
        job_type:
          type: string
        site_id:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          additionalProperties: true
      required:
      - schedule_code
      - scheduled_for
      - job_type
      - payload
    ContentSchemaVersionV1:
      $ref: ./schemas/content-revision/content-schema-version.v1.schema.json
    ArticleTypeVersionV1:
