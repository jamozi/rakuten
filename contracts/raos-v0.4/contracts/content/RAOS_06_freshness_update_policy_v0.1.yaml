change_triggers:
- code: price_changed
  automatic: update_public_projection_only_if_fresh
  review_when:
  - price_tier_crossed
  - relative_change_threshold_configured
  - ranking_or_rationale_depends_on_price
- code: availability_changed
  automatic: update_public_projection
  review_when:
  - primary_recommendation_unavailable
  - all_offers_unavailable
  - successor_detected
- code: spec_changed
  automatic: none
  review_when:
  - any_recommendation_dimension_changed
  - product_identity_changed
- code: link_failed
  automatic: hide_cta_after_retry_policy
  review_when:
  - identity_mismatch
  - redirect_host_mismatch
  - persistent_failure
- code: source_corrected_or_removed
  automatic: none
  review_when:
  - affected_claims_exist
- code: policy_bundle_changed
  automatic: impact_analysis_and_renderer_policy_fields
  review_when:
  - blocking_or_major_policy_affects_snapshot
- code: methodology_changed
  automatic: none
  review_when:
  - published_article_bound_to_old_version
- code: user_complaint_or_correction
  automatic: incident_or_review_candidate
  review_when:
  - factual
  - identity
  - compliance
  - accessibility
safe_degradation_priority:
- remove_or_hide_invalid_dynamic_field
- disable_unsafe_cta
- show_last_checked_or_uncertainty
- retain useful static article
- pause_article_if_decision_basis_invalid
- never_auto_reorder_recommendations
merge_update_retire_rules:
  update: 同じPrimary IntentとDecisionを維持し、Fact/Methodology/商品集合の更新で価値を回復できる
  merge: 複数記事が同じIntent・Decision・Candidate Universeを競合し、独自差分が公開基準未満。人間承認後、正本へ301
  retire_301: 後継の同等意思決定ページが存在し、利用者意図を実質的に満たす
  retire_410: 有効な代替ページがなく、商品・根拠・需要の消滅により再公開価値がない
  noindex_hold: 価値はあるがEvidence・鮮度・商品集合が公開基準を一時的に満たさない
  automatic_delete: false
lastmod_policy: 価格・在庫等のDynamic Projectionだけの変動では記事lastmodを変更しない。本文・推薦・比較方法・主要Factの実質変更時だけ変更
