template_id: TPL-AT-002
article_type: use_case_recommendation
version: 1.0.0
status: ACTIVE
required_sequence:
- disclosure_slot
- lead
- decision_summary
- intended_reader
- methodology
- selection_criteria
- recommendation_group
- product_card
- tradeoff
- caution
- source_summary
optional_blocks:
- comparison_table
- pros_cons
- faq
- media
- internal_links
- update_notice
