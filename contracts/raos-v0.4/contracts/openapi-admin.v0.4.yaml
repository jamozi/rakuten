  headers:
    XRequestID:
      description: RAOSが採番または受理したRequest UUID。
      schema:
        type: string
        format: uuid
    Traceparent:
      description: W3C Trace Context traceparent。
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
    ETag:
      description: Resource lock_versionまたはProjection hash由来のstrong ETag。
      schema:
        type: string
    RetryAfter:
      description: 安全に再試行するまでの秒数。
      schema:
        type: integer
        minimum: 1
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Client生成UUID。欠落時はServerが採番する。
      schema:
        type: string
        format: uuid
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一業務Commandに対する安定Key。payload hashと組で保存する。
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 直前GETで受領したstrong ETag。
      schema:
        type: string
        minLength: 3
